<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF-CE Serie 35 – MLI</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;padding:1rem}
#app{max-width:860px;margin:0 auto}

.header{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.header img{height:48px;display:block}
.header-right{text-align:right}
.header-title{font-size:16px;font-weight:700;color:#1a1a1a}
.header-sub{font-size:12px;color:#888;margin-top:2px}

.prog-wrap{margin-bottom:.85rem}
.prog-bar{height:5px;background:#e0ddd5;border-radius:3px}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width .35s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:4px}

.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.85rem}
.nav-btn{border:1px solid #d0cdc5;background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;color:#333;transition:background .15s}
.nav-btn:hover:not(:disabled){background:#f0ede7}
.nav-btn:disabled{opacity:.4;cursor:default}
.nav-btn.results-btn{margin-left:auto;border-color:#0F6E56;color:#0F6E56;font-weight:600}
.nav-btn.results-btn:hover{background:#e8f7f2}

.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.5rem 1.5rem 1.25rem}

.textbox{background:#f8f7f3;border-left:3px solid #1D9E75;border-radius:0 8px 8px 0;padding:1rem 1.25rem;margin-bottom:1.1rem;font-size:15px;line-height:1.85;color:#1a1a1a;width:100%;box-sizing:border-box}
.textbox mark{background:#FAC775;color:#412402;border-radius:3px;padding:1px 3px;font-style:normal}

.key-label{display:inline-block;background:#FEF3DC;color:#7A4F00;border:1px solid #FAC775;border-radius:6px;font-size:12px;padding:3px 9px;margin-bottom:.85rem}

.question{font-size:16px;font-weight:600;margin-bottom:.9rem;line-height:1.5}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.choice{padding:11px 15px;border:1px solid #d0cdc5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;background:#fff;width:100%;box-sizing:border-box;font-family:inherit;text-align:left;transition:background .12s,border-color .12s}
.choice:hover:not([disabled]){background:#f8f7f3;border-color:#b0ada5}
.choice .badge{font-weight:600;min-width:22px;flex-shrink:0}
.choice.correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.choice.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.choice.show-correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}

.feedback{border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.6;margin-top:.5rem}
.feedback.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.feedback.ko{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}

/* Results */
#results{display:none}
.score-section{text-align:center;padding:1.5rem 0 1rem}
.score-correct{font-size:42px;font-weight:800;color:#1D9E75;line-height:1}
.score-tcf{font-size:28px;font-weight:700;color:#1a1a1a;margin-top:.4rem}
.score-nclc{font-size:36px;font-weight:800;color:#BA7517;margin-top:.3rem}
.score-msg{font-size:15px;color:#555;margin-top:.5rem}
.score-note{font-size:11px;color:#999;margin-top:.8rem}
.grid{display:flex;flex-wrap:wrap;gap:7px;margin:1rem 0;justify-content:center}
.dot{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
.dot:hover{opacity:.75}
.dot.ok{background:#1D9E75;color:#fff}
.dot.ko{background:#D9503A;color:#fff}
.dot.na{background:#e0ddd5;color:#888}
.results-btns{display:flex;gap:10px;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.results-btns button{border:none;border-radius:9px;padding:11px 24px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;transition:background .15s}
.btn-report{background:#F5A623;color:#fff}
.btn-report:hover{background:#d48c1a}
.btn-restart{background:#1D9E75;color:#fff}
.btn-restart:hover{background:#168a63}

/* Error report */
#report{display:none}
.report-back{border:1px solid #d0cdc5;background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;color:#333;margin-bottom:1rem;display:inline-block}
.report-back:hover{background:#f0ede7}
.error-item{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.error-q{font-size:15px;font-weight:600;margin:0 0 .85rem;color:#1a1a1a;line-height:1.5}
.error-choices{display:flex;flex-direction:column;gap:6px}
.ec{padding:9px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:9px;border:1px solid #e0ddd5;background:#f8f7f3;color:#666}
.ec .badge{font-weight:700;min-width:20px;flex-shrink:0}
.ec.ec-correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.ec.ec-wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
</style>
</head>

  if (score >= 499) return { level: "NCLC 8",   msg: "Très bien ! Niveau NCLC 8." };
  if (score >= 453) return { level: "NCLC 7",   msg: "Objectif immigration atteint ! Niveau NCLC 7." };
  if (score >= 406) return { level: "NCLC 6",   msg: "Encore un peu d'effort pour atteindre le NCLC 7 !" };
  if (score >= 375) return { level: "NCLC 5",   msg: "Continuez à pratiquer, niveau NCLC 5." };
  if (score >= 342) return { level: "NCLC 4",   msg: "Continuez à pratiquer, niveau NCLC 4." };
  return { level: "En dessous de NCLC 4", msg: "Continuez à pratiquer !" };
}

function esc(s) {
  var t = String(s);
  t = t.replace(/&/g, "&amp;");
  t = t.replace(/</g, "&lt;");
  t = t.replace(/>/g, "&gt;");
  return t;
}

function hl(text, key) {
  var h = esc(text).split("\n").join("<br>");
  try {
    var ek = esc(key);
    var lo = h.toLowerCase();
    var lk = ek.toLowerCase();
    var idx = lo.indexOf(lk);
    if (idx >= 0) {
      h = h.substring(0, idx) + "<mark>" + h.substring(idx, idx + ek.length) + "</mark>" + h.substring(idx + ek.length);
    }
  } catch(e) {}
  return h;
}

function updateProgress() {
  var answered = Object.keys(ans).length;
  var pct = Math.round(answered / QQ.length * 100);
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-q").textContent = "Question " + (cur + 1) + " / " + QQ.length;
  document.getElementById("prog-pct").textContent = pct + "% complété";
  document.getElementById("btn-prev").disabled = (cur === 0);
  document.getElementById("btn-next").disabled = (cur === QQ.length - 1);
}

function render(i) {
  cur = i;
  var q = QQ[i], ua = ans[i], done = ua !== undefined;
  var badges = ["A", "B", "C", "D"];

  var textHtml = done ? hl(q.t, q.k) : esc(q.t).split("\n").join("<br>");
  var keyLabel = done ? "<div class=\"key-label\">&#128273; Phrase-clé surlignée</div>" : "";

  var choicesHtml = "";
  for (var ci = 0; ci < q.c.length; ci++) {
    var cls = "choice";
    var dis = "";
    if (done) {
      dis = " disabled";
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    choicesHtml += "<button class=\"" + cls + "\" onclick=\"pick(" + i + "," + ci + ")\"" + dis + ">" +
      "<span class=\"badge\">" + badges[ci] + "</span>" +
      esc(q.c[ci]) + "</button>";
  }

  var feedbackHtml = "";
  if (done) {
    if (ua.ok) {
      feedbackHtml = "<div class=\"feedback ok\">&#10003; Bonne réponse !</div>";
    } else {
      feedbackHtml = "<div class=\"feedback ko\">&#10007; Incorrect. La bonne réponse est <strong>" + badges[q.a] + "</strong>.</div>";
    }
  }

  document.getElementById("view").innerHTML =
    "<div class=\"textbox\">" + textHtml + "</div>" +
    keyLabel +
    "<div class=\"question\">Q" + (i + 1) + ". " + esc(q.q) + "</div>" +
    "<div class=\"choices\">" + choicesHtml + "</div>" +
    feedbackHtml;

  updateProgress();

  document.getElementById("quiz-panel").style.display = "block";
  document.getElementById("results").style.display = "none";
  document.getElementById("report").style.display = "none";
}

function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  render(qi);
}

function go(dir) {
  var n = cur + dir;
  if (n >= 0 && n < QQ.length) render(n);
}

function summary() {
  var ok = 0, score = 0;
  for (var k in ans) {
    if (ans[k].ok) { ok++; score += getPoints(parseInt(k)); }
  }
  var nclc = getNclc(score);
  var badges = ["A","B","C","D"];

  document.getElementById("r-correct").textContent = ok + " / " + QQ.length + " correct";
  document.getElementById("r-tcf").textContent = "Score TCF : " + score + " / 699";
  document.getElementById("r-nclc").textContent = nclc.level;
  document.getElementById("r-msg").textContent = nclc.msg;

  var gridHtml = "";
  for (var i = 0; i < QQ.length; i++) {
    var cls = "dot na", label = i + 1;
    if (ans[i] !== undefined) cls = ans[i].ok ? "dot ok" : "dot ko";
    gridHtml += "<div class=\"" + cls + "\" onclick=\"jumpTo(" + i + ")\" title=\"Q" + label + "\">" + label + "</div>";
  }
  document.getElementById("grid").innerHTML = gridHtml;

  document.getElementById("quiz-panel").style.display = "none";
  document.getElementById("results").style.display = "block";
  document.getElementById("report").style.display = "none";
}

function jumpTo(i) {
  render(i);
}

function showReport() {
  var badges = ["A","B","C","D"];
  var html = "";
  var errors = [];
  for (var i = 0; i < QQ.length; i++) {
    if (ans[i] !== undefined && !ans[i].ok) errors.push(i);
  }
  if (errors.length === 0) {
    html = "<div class=\"card\" style=\"text-align:center;padding:2rem;color:#1D9E75;font-weight:600;font-size:18px;\">&#127881; Aucune erreur ! Score parfait !</div>";
  } else {
    for (var j = 0; j < errors.length; j++) {
      var i = errors[j];
      var q = QQ[i], ua = ans[i];
      var choicesHtml = "";
      for (var ci = 0; ci < q.c.length; ci++) {
        var ecCls = "ec";
        var icon = "";
        if (ci === q.a) { ecCls += " ec-correct"; icon = "&#10003; "; }
        else if (ua.choice === ci) { ecCls += " ec-wrong"; icon = "&#10007; "; }
        choicesHtml += "<div class=\"" + ecCls + "\"><span class=\"badge\">" + badges[ci] + "</span>" + icon + esc(q.c[ci]) + "</div>";
      }
      html += "<div class=\"error-item\">" +
        "<div class=\"textbox\">" + hl(q.t, q.k) + "</div>" +
        "<div class=\"key-label\">&#128273; Phrase-clé surlignée</div>" +
        "<div class=\"error-q\">Q" + (i+1) + ". " + esc(q.q) + "</div>" +
        "<div class=\"error-choices\">" + choicesHtml + "</div>" +
        "</div>";
    }
  }
  document.getElementById("report-content").innerHTML = html;
  document.getElementById("quiz-panel").style.display = "none";
  document.getElementById("results").style.display = "none";
  document.getElementById("report").style.display = "block";
}

function reset() {
  ans = {};
  cur = 0;
  render(0);
}

window.onload = function() { render(0); };
</script>
</body>
</html>
