<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF CE · NCLC 6 (21–30) · 9 thèmes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;padding:1rem}
#app{max-width:860px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.header img{height:52px;object-fit:contain}
.header-right{text-align:right}
.header-title{font-size:16px;font-weight:700;color:#1a1a1a}
.header-sub{font-size:12px;color:#888;margin-top:2px}
.prog-bar{height:5px;background:#e0ddd5;border-radius:3px;margin-bottom:4px}
.prog-fill{height:100%;background:#4DB88A;border-radius:3px;transition:width .35s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:1rem}
.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.85rem}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#444}
.btn:hover{background:#f5f4f0}
.btn-results{margin-left:auto;border-color:#2E8B62;color:#2E8B62;font-weight:600;background:#fff}
.btn-results:hover{background:#e8f6ef}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.q-type-label{display:inline-block;background:#E8F6EF;color:#0F5C3E;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.75rem;font-weight:500}
.src-label{display:inline-block;background:#f0f0f0;color:#666;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px}
.passage-box{background:#f5faf7;border:1px solid #BFE6D3;border-radius:8px;padding:.9rem 1.1rem;font-size:14px;line-height:1.75;color:#1a1a1a;margin-bottom:1rem;white-space:normal}
.passage-box mark{background:#FAC775;color:#412402;border-radius:3px;padding:1px 3px}
.key-label{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.5rem}
.question{font-size:16px;font-weight:600;margin-bottom:.9rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:11px 15px;border:1px solid #d0cdc5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;background:#fff;width:100%;box-sizing:border-box;text-align:left;transition:background .15s,border-color .15s}
.choice:hover:not(.correct):not(.wrong):not(.disabled){background:#f5f4f0}
.choice.disabled{cursor:default}
.choice .badge{font-weight:700;min-width:22px;flex-shrink:0;color:#2E8B62;font-size:15px}
.choice.correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.choice.correct .badge{color:#085041}
.choice.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.choice.wrong .badge{color:#4A1B0C}
.feedback{border-radius:8px;padding:10px 14px;margin-top:.85rem;font-size:14px}
.feedback.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.feedback.ko{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}
.summary{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.5rem}
.summary h2{font-size:20px;font-weight:700;margin-bottom:1.25rem;text-align:center}
.score-block{text-align:center;margin-bottom:1.5rem}
.score-correct{font-size:32px;font-weight:700;color:#2E8B62}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:1.25rem 0}
.grid-btn{width:36px;height:36px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;color:#fff}
.grid-btn.ok{background:#1D9E75}
.grid-btn.ko{background:#993C1D}
.grid-btn.na{background:#bbb}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem}
.sum-btn{padding:8px 18px;border-radius:8px;border:1px solid #BFE6D3;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#2E8B62}
.sum-btn:hover{background:#e8f6ef}
.sum-btn.red{border-color:#F0997B;color:#993C1D}
.sum-btn.red:hover{background:#FAECE7}
.sum-btn.pdf{border-color:#639922;color:#3B6D11;background:#EAF3DE}
.sum-btn.pdf:hover{background:#c0dd97}
.sum-note{font-size:11px;color:#aaa;margin-top:.75rem}
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.report-item{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.1rem;margin-bottom:.85rem}
.qnum{font-size:13px;font-weight:700;color:#2E8B62;margin-bottom:.6rem}
.report-choice{padding:8px 12px;border-radius:7px;font-size:13px;margin-bottom:5px}
.report-choice.neutral{background:#f5f4f0}
.report-choice.correct{background:#E1F5EE;color:#085041;font-weight:600}
.report-choice.wrong{background:#FAECE7;color:#4A1B0C}
.level-select{display:flex;flex-direction:column;gap:10px}
.level-card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .15s,background .15s}
.level-card:hover{border-color:#2E8B62;background:#f5faf7}
.level-name{font-size:20px;font-weight:700;color:#2E8B62;min-width:70px}
.level-desc{flex:1;font-size:13px;color:#555;padding:0 10px}
.level-count{font-size:12px;color:#888;white-space:nowrap}
@media print {
  body{background:#fff;padding:0}
  #app{max-width:100%}
  .nav,.sum-actions,.prog-bar,.prog-labels{display:none!important}
  .card{border:1px solid #ccc;border-radius:0;page-break-inside:avoid;margin-bottom:.5rem;padding:.75rem}
  .summary{border:none}
  .grid-btn{width:28px;height:28px;font-size:10px}
  .print-section{display:block!important}
  .no-print{display:none!important}
}
.print-section{display:none}
.fs-btn{position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:9px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;color:#444;box-shadow:0 1px 4px rgba(0,0,0,.10);transition:background .15s,border-color .15s}
.fs-btn:hover{background:#f5f4f0;border-color:#2E8B62}
@media print{.fs-btn{display:none!important}}

/* ── ZOOM BAR (added) ── */
.zoombar{display:flex;align-items:center;justify-content:center;gap:.55rem;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:.55rem 1rem;margin-bottom:1rem;flex-wrap:wrap}
.zoombar .zlabel{font-size:12px;font-weight:600;color:#2E8B62}
.zoombar input[type=range]{-webkit-appearance:none;appearance:none;width:180px;max-width:55vw;height:4px;border-radius:2px;background:#dfe6ec;outline:none;cursor:pointer;accent-color:#4DB88A}
.zoombar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#4DB88A;cursor:pointer}
.zoombar input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#4DB88A;border:none;cursor:pointer}
.zoombar .zval{font-size:12px;font-weight:700;color:#2E8B62;min-width:42px;text-align:center}
.zoombar .zbtn{width:26px;height:26px;border-radius:6px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:14px;font-weight:700;color:#2E8B62;line-height:1;display:flex;align-items:center;justify-content:center}
.zoombar .zbtn:hover{background:#f5f4f0}
#zoomStage{transform-origin:top center;transition:transform .12s ease}
/* ── QUESTION JUMP BUTTONS (added) ── */
.qjump{display:flex;flex-wrap:wrap;gap:5px;background:#fff;border:1px solid #e0ddd5;border-radius:10px;padding:.55rem .7rem;margin-bottom:.85rem}
.qjump .qjlabel{width:100%;font-size:11px;color:#888;margin-bottom:2px}
.qjump .qj{min-width:30px;height:30px;padding:0 4px;border-radius:6px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555}
.qjump .qj:hover{background:#f5f4f0}
.qjump .qj.current{background:#2E8B62;border-color:#2E8B62;color:#fff}
.qjump .qj.answered{border-color:#4DB88A;color:#2E8B62}
.qjump .qj.answered.current{color:#fff}
@media print{.zoombar,.qjump{display:none!important}}

.theme-select{display:flex;flex-direction:column;gap:12px}
.theme-card{background:#fff;border:1px solid #e0ddd5;border-left:5px solid var(--tc,#2E8B62);border-radius:12px;padding:1rem 1.1rem}
.theme-head{display:flex;align-items:center;gap:12px;margin-bottom:.7rem}
.theme-emo{font-size:26px;line-height:1}
.theme-name{font-size:18px;font-weight:700;color:var(--tc,#2E8B62)}
.theme-desc{font-size:12.5px;color:#666;margin-top:2px}
.theme-actions{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{flex:1;min-width:130px;padding:9px 12px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#444}
.tbtn:hover{background:#f5f4f0;border-color:var(--tc,#2E8B62)}
.tbtn-cours{border-color:#BFE6D3;color:#0F5C3E;background:#F0FAF5}
.tbtn-cours:hover{background:#dcf3e8}
.tbtn-voc{border-color:#FCD34D;color:#92400E;background:#FEF9EC}
.tbtn-voc:hover{background:#fdf0cf}
.lvl-banner{background:linear-gradient(90deg,#0F5C3E,#2E8B62);color:#fff;border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;font-size:13.5px;font-weight:600;letter-spacing:.3px}
.voc-intro{background:#fff;border:1px solid #e0ddd5;border-left:5px solid var(--tc,#2E8B62);border-radius:10px;padding:.8rem 1rem;font-size:13.5px;color:#333;margin-bottom:1rem;line-height:1.6}
.voc-list{display:flex;flex-direction:column;gap:9px}
.voc-item{background:#fff;border:1px solid #e0ddd5;border-left:4px solid var(--tc,#2E8B62);border-radius:10px;padding:.75rem .95rem}
.voc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.voc-term{font-size:15.5px;font-weight:700;color:#1a1a1a}
.voc-en{font-size:13px;color:#777;margin:3px 0 6px;font-style:italic}
.voc-ex{font-size:14px;color:#0F5C3E;background:#F5FAF7;border-radius:7px;padding:7px 10px;line-height:1.55}
.voc-tag{font-size:11px;font-weight:600;border-radius:20px;padding:3px 9px;white-space:nowrap}
.voc-tag.ee{background:#E8EEFF;color:#274690}
.voc-tag.eo{background:#FDE8EF;color:#9B1B47}
.voc-tag.both{background:#E1F5EE;color:#0F6E56}
@media print{.voc-ex,.voc-tag,.lvl-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<button class="fs-btn" id="fsBtn" title="Plein écran" aria-label="Plein écran">⛶</button>
<script>
(function(){
  var b=document.getElementById('fsBtn');
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
  b.addEventListener('click',function(){
    if(!fsEl()){
      var el=document.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }
  });
  function upd(){
    var on=!!fsEl();
    b.textContent=on?'✕':'⛶';
    b.title=on?'Quitter le plein écran':'Plein écran';
  }
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
})();
</script>

<script id="qdata" type="application/json">{"Culture": {"cours": [{"t": "Non, Maupassant n'est pas qu'un écrivain pour cours de français. Comme tout bon auteur culte, ses thématiques sont percutantes, grinçantes, toujours d'actualité et tellement vraies dans le fond : hypocrisie de la bourgeoisie, monde paysan décrit sans artifice, rapports humains aliénés par le contexte social et culturel… Du pain bénit pour les auteurs de « Chez Maupassant », une collection de huit téléfilms titrés des contes et nouvelles du grand Guy.", "q": "Que présente l'auteur de l'article ?", "c": ["Des adaptations télévisées de Maupassant", "Des programmes d'études littéraires", "Une exposition consacrée à Maupassant", "Un ouvrage critique récemment paru"], "a": 0, "k": "une collection de huit téléfilms titrés des contes et nouvelles du grand Guy.", "_sources": ["test1#22"]}, {"t": "Ces dernières années, les nouvelles versions de films à succès se sont multipliées et ce mouvement ne semble pas près de s'arrêter, comme si l'industrie cinématographique ne parvenait plus à inventer de nouvelles histoires, de nouveaux concepts qui pourraient éveiller la curiosité d'un large public. Pourtant, de nouvelles idées, de nouvelles sensibilités, il y en aura toujours, encore faut-il qu'elles trouvent un relais financier pour voir le jour. Et l'industrie cinématographique hésite à investir dans du « neuf », alors elle se tourne vers les valeurs sûres des succès passés.", "q": "Quelle constatation ce journaliste fait-il sur le cinéma contemporain ?", "c": ["Les producteurs évitent de prendre des risques", "Les réalisateurs sont à la recherche d'idées neuves", "Les scénaristes font preuve d'une imagination limitée", "Les spectateurs privilégient les créations classiques"], "a": 0, "k": "l'industrie cinématographique hésite à investir dans du « neuf »", "_sources": ["test1#25", "test28#26"]}, {"t": "Le château de la Bussière est une demeure du 17e siècle, située dans le Loiret. Surnommé le « Château des Pêcheurs », il possède des collections d'objets rares sur la pêche. Sans oublier un superbe parc. Aujourd'hui, ce monument est confronté à un fléau : un champignon ronge ses édifices. Les propriétaires ont déjà lancé une campagne de restauration mais le champignon s'attaque aussi à d'autres parties du domaine. Les maîtres des lieux souhaitent que le bâtiment retrouve son éclat en sollicitant les internautes. À partir de 15€, les contributeurs pourront recevoir des entrées gratuites, l'inscription de leur nom sur une plaque dans le château ou bien encore un dîner avec les propriétaires.", "q": "D'après l'article, à quoi les internautes sont-ils encouragés ?", "c": ["À aider à la rénovation en travaillant au château", "À entrer en contact avec les occupants du château", "À financer les travaux au château par un don", "À visiter le château, ses jardins et expositions"], "a": 2, "k": "Les maîtres des lieux souhaitent que le bâtiment retrouve son éclat en sollicitant les internautes.", "_sources": ["test2#24"]}, {"t": "Sandrine Mercier Et Michel Fonovich ont le voyage dans la peau. Les deux journalistes ont longtemps exploré le monde avant d'écrire un livre ensemble. Ils sont partis vivre ailleurs et constitué des histoires d'une trentaine d'expatriés et d'autant de destins et de trajectoires. Les auteurs sont allés chercher des personnages tous très différents mais toujours touchants et sincères en racontant leurs parcours lointains - l'appel du large, les premiers pas, les déceptions, le rapport à la France, la découverte des autres… C'est certainement ce qui unit tous ces Français du bout du monde, par-delà leurs différences et leurs expériences : une ouverture d'esprit, une volonté de partager et, au final, une richesse et une joie de vivre communicative.", "q": "D'après l'auteur de cet article, quelle est la particularité de cet ouvrage ?", "c": ["L'originalité des pays visités", "La description des habitudes quotidiennes", "La diversité des portraits présentés", "Les qualités littéraires des écrivains"], "a": 2, "k": "Les auteurs sont allés chercher des personnages tous très différents", "_sources": ["test2#25"]}, {"t": "Durant les investigations journalistiques, le recours à la caméra cachée est de plus en plus fréquent. Mais souvent, une utilisation n'est aussi qu'un cache-misère, un moyen de compenser l'absence d'informations dans les reportages, de remplir le vide par des scènes un peu spectaculaires. C'est une manière pour certains aussi de faire des économies. Par ailleurs, cette pratique pose une autre question : celle du statut de la personne filmée à son insu. La filmer en caméra cachée, n'est-ce pas supposer qu'elle a quelque chose à se reprocher avant d'avoir commencé à parler ?", "q": "D'après ce texte, pourquoi les journalistes utilisent-ils des caméras cachées ?", "c": ["Pour améliorer la qualité des documentaires", "Pour dissimuler la pauvreté des contenus", "Pour moderniser leurs méthodes de travail", "Pour piéger les gens visés par les enquêtes"], "a": 1, "k": "un moyen de compenser l'absence d'informations dans les reportages", "_sources": ["test2#29"]}, {"t": "Difficile d'affirmer qu'on attendait beaucoup de ce film. En effet, avec le réalisateur du très moyen Maison bleue aux commandes, Franck Christian et Articus dans les rôles principaux. Cette comédie partait avec plusieurs handicaps du côté du capital sympathie. Des handicaps qui allaient demander un bon paquet de qualités pour nous convaincre qu'Imperturbable n'était pas juste en énième bouche-trou pour Prime Time télévisuel tel qu'on continue à en voir toutes les semaines. Résultats : ô miracle, les qualités d'un bon film sont là ! Et même plus encore !", "q": "Que pense cette personne de ce film ?", "c": ["Elle trouve juste bon pour la télévision", "Elle trouve certaines scènes très amusantes", "Elle trouve l'ensemble très réussi", "Elle trouve les acteurs très peu crédibles"], "a": 2, "k": "les qualités d'un bon film sont là ! Et même plus encore !", "_sources": ["test3#23"]}, {"t": "Je photographiais parce qu'il le fallait, mais avec toujours le sentiment que cela représentait une perte de temps, une perte d'attention. Pourtant, j'ai beaucoup aimé et pas mal pratiqué la photographie dans mon adolescence. Mon père était artiste peintre et bricolait beaucoup la photo. Mais la photographie constitue un métier à part, si je puis dire. Ce que j'ai fait est un travail de photographe au degré zéro. J'ai publié un livre de photos (Saudades do Brasil, que l'on peut traduire par « nostalgie du Brésil ») parce que, autour de moi, on a beaucoup insisté. L'éditeur a choisi un peu moins de 200 clichés parmi tant d'autres.", "q": "Quelle relation Claude Lévi-Strauss a-t-il entretenu avec la photographie ?", "c": ["Il a hérité de son père cette fascination qui ne l'a jamais quitté", "Il a longtemps souhaité la publication de ses photographies", "Il n'a jamais aimé la photographie qu'il considérait comme une perte de temps", "Il a déclaré que la photographie était une part nécessaire mais non essentielle de son travail"], "a": 3, "k": "la photographie constitue un métier à part, si je puis dire.", "_sources": ["test3#29"]}, {"t": "Les Arts Premiers Au Musée\nSi cette reconnaissance sonne comme un cri de victoire, c'est qu'elle marque l'issue d'un combat idéaliste qui n'a fait d'autres victimes que l'arrogance et les préjugés. Le signal en fut donné par Guillaume Apollinaire en 1909 : « Le Louvre devrait recueillir certains chefs d'œuvre exotiques dont l'aspect n'est pas moins émouvant que celui des beaux spécimens de la statuaire occidentale. Près d'un siècle plus tard, le vœu du poète est enfin comblé, plus d'une centaine de sculptures primitives d'Afrique, d'Asie, d'Océanie et des Amériques, jusqu'alors confinées dans les réserves ethnographiques, prennent place dans le temple de l'Art, jusqu'alors réservé à l'Europe et à ses sources.", "q": "Cet événement est présenté comme…", "c": ["Le résultat d'une lutte menée par des gens orgueilleux et intolérants", "Le triomphe d'une opinion émise par Apollinaire mais autrefois combattue", "Un miracle dû à la persévérance des archéologues sur plusieurs continents.", "La consécration des œuvres européennes jusqu'alors remisées dans les musées"], "a": 1, "k": "Près d'un siècle plus tard, le vœu du poète est enfin comblé", "_sources": ["test4#23"]}, {"t": "D'abord surpris par la naïveté du film, puis sceptique face aux clichés habituels et gentillets de ce genre de longs métrages potaches. on se laisse progressivement porter par la réalisation décalée du cinéaste et par l'interprétation savoureuse de la distribution. S'il manque parfois de rythme et s'il a un peu vieilli, ce film n'en demeure pas moins réussi dans sa capacité à savoir capter l'esprit bohème et bon enfant des échanges Erasmus ! Après, ça n'est bien sûr pas le chef-d'œuvre de l'année, mais il est tellement rare aujourd'hui de voir un film français proposer quelque chose d'assez original et drôle sans se départir d'une certaine simplicité et d'une réelle justesse qu'on ne peut que saluer le travail du réalisateur et de sa sympathique équipe", "q": "Quelle critique négative ce spectateur émet-il sur ce film ?", "c": ["La réalisation de l'œuvre manque de maîtrise", "Le film tombe dans les stéréotypes du genre", "Le jeu des comédiens lui semble plutôt médiocre", "Le scenario du film est maladroitement construit"], "a": 1, "k": "sceptique face aux clichés habituels et gentillets de ce genre de longs métrages potaches", "_sources": ["test5#27"]}, {"t": "Près du Nil,\nle futur musée égyptien.\nEn 2002, l'Égypte lance un appel d'offres pour la construction du Grand Musée. Des architectes de renommée mondiale proposent leurs projets. C'est celui de Shih-Fu Peng un jeune architecte inconnu, qui est choisi sur une idée simple : construire un énorme bâtiment face aux pyramides détruirait l'harmonie du plateau de Gizeh. Il faut donc bâtir cinquante mètres en contrebas. Ainsi ne verra-t-on jamais le musée au même niveau que les pyramides. En revanche, il sera toujours possible de voir celles-ci depuis des galeries et ses salles, dans un Panorama inviolé.", "q": "Pourquoi Shi-Fu Peng a-t-il été choisi pour construire le musée ?", "c": ["Il a associé un architecte célèbre à son projet", "Il a cherché à préserver la beauté du site", "Il a conçu un bâtiment qui ressemble aux pyramides", "Il a imaginé un projet qui modifie le paysage"], "a": 1, "k": "construire un énorme bâtiment face aux pyramides détruirait l'harmonie du plateau de Gizeh", "_sources": ["test6#25"]}, {"t": "L'émotion des aborigènes. Lorsque les aborigènes ngarinyin, venus pour la première fois en Europe en 1997 pour une série d'expositions et de conférences sur l'histoire de l'Océanie, entrèrent à Lascaux, ils fondirent en larmes en tombant en arrêt devant les dessins préhistoriques. L'espace d'un instant, ils avaient cru que leur territoire sacré, peint en Australie, les avait suivis jusqu'en France... C'est l'une des anecdotes que raconte l'archéologue Jean-Pierre Mohen dans son livre Art et préhistoire", "q": "Pourquoi les aborigènes ont-ils pleuré en voyant les peintures de Lascaux ?", "c": ["Ils étaient étonnés devant tant de splendeur", "Elles représentaient un lien avec le sacré", "Elles leur rappelaient leur propre histoire", "Ils croyaient voir là leurs propres peintures"], "a": 3, "k": "avaient cru que leur territoire sacré, peint en Australie, les avait suivis jusqu'en France", "_sources": ["test6#29"]}, {"t": "Le temps des cerises\nPièce de théâtre de Niels Arestrup\nUn vieil homme, dérangé dans sa vieille maison par une jeune femme : disputes, goût de la vie retrouvé, moments de tendresse... La comédienne Cécile de France joue avec autant de talent qu'au cinéma. Le comédien Eddy Mitchell, dans le rôle du vieux peintre, manque de noirceur. Dommage que le metteur en scène n'interprète pas lui-même le personnage principal. On passe un bon moment mais pas un grand moment.", "q": "Sur quel aspect de la pièce porte la critique ?", "c": ["La mise en scène.", "La qualité des décors.", "Le jeu des interprètes.", "L'intérêt de l'intrigue."], "a": 2, "k": "La comédienne Cécile de France joue avec autant de talent qu'au cinéma", "_sources": ["test7#25"]}, {"t": "Les auteurs européens ont persuadé la maison d'édition Livresque d'aller plus loin que la simple numérisation des livres universitaires : au lieu de ne scanner des livres qu'à des fins de recherche, les écrivains ont demandé à ce qu'ils soient remis dans le circuit commercial. Grâce à cet accord, ces millions de livres épuisés vont reprendre vie. Les bénéfices générés par la publicité et les droits de licence iront en partie à Livresque, mais la grande majorité de l'argent gagné par cette mise à disposition des ouvrages sera directement remise aux auteurs puisqu'ils toucheront leurs droits.", "q": "D'après le texte, quel avantage les auteurs tireront-ils de la numérisation des livres ?", "c": ["Elle augmentera le nombre de lecteurs.", "Elle développera la visibilité des œuvres.", "Elle diminuera le coût des ouvrages.", "Elle entraînera un gain financier."], "a": 3, "k": "la grande majorité de l'argent gagné par cette mise à disposition des ouvrages sera directement remise aux auteurs", "_sources": ["test7#26"]}, {"t": "Renaissance, un mot porteur de sens à de nombreux égards.\n\nHistoriquement, elle symbolise le passage vers une ère nouvelle, créatrice, effervescente.\nUn retour aux sources et des artistes humanistes nourris par l'idée de temps nouveaux faits d'espoir et de confiance en l'homme. Ces multiples lectures ont été source d'inspiration pour la nouvelle collection.\nC'est aussi l'énergie nouvelle, un regain de vitalité. Avec une ligne plus urbaine, hommes et femmes trouveront dans des coupes près du corps aux couleurs toniques des tenues à leurs mesures pour affronter l'hiver avec sourire et imagination.", "q": "D'où est tiré ce texte ?", "c": ["D'un catalogue de styliste.", "D'un dictionnaire philosophique.", "D'un manuel d'histoire de l'art.", "D'une présentation de musée."], "a": 0, "k": "source d'inspiration pour la nouvelle collection", "_sources": ["test8#27"]}, {"t": "D'après l'article, à quoi servira le label du patrimoine européen ?\n\nL'Europe s'est dotée de son propre Label du patrimoine décerné à de hauts lieux de l'histoire et de la culture du Vieux Continent, en complément de la célèbre liste mondiale établie par l'UNESCO. Un accord est intervenu lors d'une réunion des ministres de la Culture de l'Union européenne. Ce label incitera un plus grand nombre de personnes à réfléchir à la dimension européenne de notre histoire commune. Le tourisme et l'économie devraient également en tirer parti. Le label sera accordé en fonction non de qualités architecturales ou esthétiques, mais de la valeur symbolique européenne des lieux et de leur dimension pédagogique.", "q": "D'après l'article, à quoi servira le label du patrimoine européen ?", "c": ["A concurrencer la liste des hauts lieux dressée par l'UNESCO.", "À définir les critères esthétiques de l'architecture européenne.", "À favoriser l'émergence de valeurs culturelles collectives.", "À réfléchir sur la place du tourisme et de l'économie en Europe."], "a": 2, "k": "Ce label incitera un plus grand nombre de personnes à réfléchir à la dimension européenne de notre histoire commune", "_sources": ["test9#29"]}, {"t": "Durant les investigations journalistiques, le recours à la caméra cachée est de plus en plus fréquent. Mais souvent, son utilisation n'est aussi qu'un cache-misère, un moyen de compenser l'absence d'informations dans les reportages, de remplir le vide par des scènes un peu spectaculaires. C'est une manière pour certains aussi de faire des économies. Par ailleurs, cette pratique pose une autre question : celle du statut de la personne filmée à son insu. La filmer en caméra cachée, n'est-ce pas supposer qu'elle a quelque chose à se reprocher avant d'avoir commencé à parler ?", "q": "D'après ce texte, pourquoi les journalistes utilisent-ils des caméras cachées ?", "c": ["Pour améliorer la qualité des documentaires.", "Pour dissimuler la pauvreté des contenus.", "Pour moderniser leurs méthodes de travail.", "Pour piéger les gens visés par les enquêtes."], "a": 1, "k": "son utilisation n'est aussi qu'un cache-misère, un moyen de compenser l'absence d'informations", "_sources": ["test10#29"]}, {"t": "Rendez-vous majeur de la scène numérique française, Les Rencontres de la Pyramide vous présentent une création révolutionnaire ! Cette année, vous êtes invités à vivre une expérience unique en extérieur et en intérieur : exposition dans notre salle métamorphosée pour l'occasion, lancement d'un jeu multimédia grandeur nature dans la ville, spectacle de cirque 3D, rencontres avec les artistes, ateliers innovants…", "q": "Qu'annonce cette publicité ?", "c": ["L'organisation d'un événement culturel.", "L'ouverture d'une salle de cinéma.", "La construction d'un musée futuriste.", "La sortie d'un nouveau jeu vidéo."], "a": 0, "k": "exposition dans notre salle métamorphosée pour l'occasion, lancement d'un jeu multimédia", "_sources": ["test11#21"]}, {"t": "Ce n'est pas tout de se prétendre festival vert et responsable. Encore faut-il le prouver. C'était le rôle, tout le week-end, du festival de musique des Eurockéennes, de quatre enquêteurs missionnés par L'ONG Prioriterre et le bureau de conseil Atemia. « Il s'agit de savoir où le festival en est vraiment, ce qu'il fait bien, ce qu'il doit changer, ce qu'il ne fait pas encore », détaillait Raphaël Bouju, responsable environnement chez Atemia, les « Eurocks » sont souvent un moteur parmi les festivals français, il a donc peu à peu imposé les déplacements en train, le tri sélectif, les gobelets réutilisables.", "q": "Que cherche à mesurer cette enquête ?", "c": ["La proportion de spectateurs écologistes.", "La réelle dimension écologique du festival.", "Le degré de popularité de ce festival en France.", "L'impact négatif du festival sur l'environnement."], "a": 1, "k": "Il s'agit de savoir où le festival en est vraiment", "_sources": ["test12#27"]}, {"t": "L'enfant fréquente le musée par obligation, avec ses parents ou son instituteur. L'adulte le vit par plaisir. Entre les deux, rien. Chez l'ado, la perspective de franchir ses portes, même gratuitement, provoque la nausée. Il préfère le spectacle d'une toile de cinéma ou le plongeon dans la toile du cyberespace. Les jeunes deviennent aujourd'hui pour les musées une cible prioritaire. Mais les inciter à venir n'est pas facile. La culture Internet a bouleversé leur relation au savoir. Les musées ne peuvent plus s'accrocher aux réseaux traditionnels de la transmission des connaissances. Le temps est venu de réfléchir à de nouvelles approches adaptées à ce public.", "q": "Que suggère l'auteur pour attirer le jeune public au musée ?", "c": ["A) D'analyser les moyens de séduire les jeunes.", "B) De moderniser le contenu des expositions.", "C) De s'inspirer des approches pédagogiques scolaires.", "D) De systématiser l'accès gratuit pour les adolescents."], "a": 0, "k": "Le temps est venu de réfléchir à de nouvelles approches adaptées à ce public", "_sources": ["test13#22"]}, {"t": "Renaissance : un mot porteur de sens à de nombreux égards\nHistoriquement, elle symbolise le passage vers une ère nouvelle, créatrice, effervescente.\nUn retour ou source et des artistes humanistes nourris par l'idée de temps nouveaux faits d'espoir et de confiance en l'homme. Ces Multiples lectures ont été source d'inspiration pour la nouvelle collection.\nC'est aussi l'énergie nouvelle, un regain de vitalité. Avec une ligne plus urbaine, hommes et femmes trouveront dans des coupes près du corps aux couleurs toniques des tenues à leurs mesures pour affronter l'hiver avec sourire et imagination.", "q": "D'où est tiré ce texte ?", "c": ["Un catalogue de styliste", "Un dictionnaire philosophique", "Un manuel d'histoire de l'art", "Une présentation de musée"], "a": 0, "k": "source d'inspiration pour la nouvelle collection", "_sources": ["test14#27"]}], "devoirs": [{"t": "Le CENTQUATRE a ouvert ses portes samedi dernier, voisins et passants, artistes et curieux, professionnels et amateurs, ont été invités à pénétrer dans le nouvel établissement artistique de la ville de Paris : le CENTQUATRE. Ce lieu de résidence et de création artistiques, unique au monde, s'étend sur près de 40 000 m² entre le 104 rue d'Aubervilliers et le 5, rue Curial à Paris (19%).", "q": "D'après cette annonce, à quoi doit servir le « CENTQUATRE » ?", "c": ["À accueillir des artistes ainsi que leurs œuvres.", "À créer des ateliers d'arts pour les habitants du quartier.", "À former une nouvelle génération d'artistes.", "À transformer des ateliers d'artistes en logement."], "a": 0, "k": "Ce lieu de résidence et de création artistiques", "_sources": ["test15#21"]}, {"t": "Il change le clavier de ses deux ordinateurs tous les six mois. Les touches cèdent sous ses mains qui, telles des araignées possédées, tissent roman après roman. En vingt ans, il a écrit près de mille cent titres. C'est un touche-à-tout : il pond aussi bien de la littérature pour herboristes que de la pharmacopée policière. Cet ancien chirurgien a abandonné le festin sanglant des blocs opératoires pour les joies de la graphomanie. « Je me suis lassé de la médecine. Mais j'écris mes romans avec toute la passion que j'avais pour la chirurgie », explique-t-il.", "q": "Quelle est la particularité de cet écrivain ?", "c": ["Il a écrit une œuvre abondante et variée.", "Il a toujours rêvé de devenir médecin.", "Il est emballé par les histoires d'épouvante.", "Il peine à écrire depuis quelques temps."], "a": 0, "k": "il a écrit près de mille cent titres", "_sources": ["test15#24", "test27#23", "test30#23"]}, {"t": "L'inverse de George Balanchine, maître du ballet russe qui gagna New York pour réviser ses classiques, William Forsythe quitta les États-Unis pour jouer les électrons libres de la scène chorégraphique européenne. À la tête du Ballet de Francfort, William Forsythe s'attache depuis quinze ans à décomposer le ballet, ses codes et ses rites. Son écriture flirte avec le virtuel - le chorégraphe n'hésitant pas à utiliser des logiciels pour composer ses pièces de danse - autant qu'avec le théâtre, dont les textes répondent aux préoccupations des interprètes. Il nous revient avec un travail visionnaire autour du corps en mouvement.\nRéinventant les pointes ou déconstruisant la ligne du buste. Il n'est jamais vraiment là où on l'attend. Paris, qui le suit depuis une décennie lui passe beaucoup de choses, sauf une : son absence. Le voici donc sur la scène.", "q": "Ses œuvres sont représentées…", "c": ["en grande majorité à New York.", "rarement ailleurs qu'à Francfort.", "en Russie et aux États-Unis.", "à Paris et partout en Europe."], "a": 3, "k": "Paris, qui le suit depuis une décennie", "_sources": ["test15#28"]}, {"t": "Il y a quelque chose de rare dans « Normandie Nue » : Ce film est résolument léger, tout en ayant du fond.\nÀ travers une histoire qui sert de fil conducteur cocasse et insolite, celle d'un artiste américain qui veut photographier des paysans dévêtus.\nÀ Bordes la crise des éleveurs avec beaucoup d'humanité, notamment grâce au maire du village qui voit dans l'avenue du photographe l'occasion de faire valoir sa cause aux yeux de la planète.\nParfois un peu maladroite, cette comédie amuse en caricaturant gentiment les médias, les artistes et les bobos parisiens ont mal de verdure.", "q": "Quelle est l'opinion du journaliste sur le film « Normandie Nue » ?", "c": ["Il est facile de s'identifier au personnage", "Les lieux de tournage sont authentiques", "On y dresse un portrait juste de la société", "Son humour fait passer un message sérieux"], "a": 3, "k": "cette comédie amuse en caricaturant gentiment les médias", "_sources": ["test16#20"]}, {"t": "Mathieu Iagouanère et Elodie Calas, 2 journalistes ont fait un tour du monde avec une idée originale : provoquer des rencontres en faisant goûter le roquefort, un fromage traditionnel, fabriqué dans leur région.\n« Le roquefort était simplement un moyen de faire connaissance avec les habitants. »", "q": "Quel était l'objectif de Mathieu et Elodie ?", "c": ["Découvrir des recettes locales", "Entrer en contact avec les gens", "Réaliser une opération publicitaire", "Vendre des spécialités françaises"], "a": 1, "k": "Le roquefort était simplement un moyen de faire connaissance avec les habitants", "_sources": ["test16#21"]}, {"t": "Dixième anniversaire du musée de l'Europe\nIl y a maintenant près de dix ans, le musée de l'Europe n'était encore qu'un projet lancé par un petit groupe d'historiens et de promoteurs culturels issus de la société civile.\nAvec pour ambition de faire découvrir aux Européens les racines de leur civilisation commune.", "q": "Quelles sont les personnes à l'origine de ce projet ?", "c": ["Des conservateurs de musée.", "Des élus européens.", "De simples citoyens.", "Des militants associatifs."], "a": 2, "k": "un petit groupe d'historiens et de promoteurs culturels issus de la société civile", "_sources": ["test16#27"]}, {"t": "Hier soir, lors du dernier concert du festival de jazz organisé par la ville de Nancy, une chanteuse lorraine, Mell, a enthousiasmé le public lors de la première partie. À tel point que le groupe prévu ensuite a dû décaler son horaire. En effet, lorsque la chanteuse a quitté la scène, la salle, noire de monde, s'est mise à hurler afin de l'empêcher de partir.", "q": "Comment le public a-t-il réagit lors du concert de Mell ?", "c": ["Il a acclamé de toutes ses forces la chanteuse.", "Il a demandé l'annulation du concert.", "Il a invité le groupe suivant à partir.", "Il l'a retenue prisonnière toute la nuit."], "a": 0, "k": "la salle, noire de monde, s'est mise à hurler afin de l'empêcher de partir", "_sources": ["test19#23", "test24#23", "test37#23"]}, {"t": "Vancouver s'affirme depuis plusieurs années comme un lieu de croisement inédit des humanismes et dispose de nombreuses connexions internationales, entre Shanghai et Tokyo, la Californie et l'Europe. Le colloque « L'avenir du contemporain » fait partie d'une série d'initiatives conduites par le consulat général de France à Vancouver pour renforcer les relations entre la France et l'Ouest canadien dans le domaine des arts. Il s'intéressera notamment aux nouveaux rôles des musées face aux contraintes et aux chances offertes, d'une part, par la mondialisation et, d'autre part, par la circulation intensifiée des artistes et des œuvres.", "q": "Quel atout de Vancouver l'auteur met-il en avant dans cet article ?", "c": ["Elle concentre une intense activité diplomatique.", "C'est un carrefour culturel intercontinental.", "C'est une plaque tournante du marché de l'art.", "Elle héberge de multiples lieux d'exposition."], "a": 1, "k": "Vancouver s'affirme depuis plusieurs années comme un lieu de croisement inédit des humanismes", "_sources": ["test20#23"]}, {"t": "Il y a quelque chose de rare dans « Normandie nue » : Ce film est résolument léger, tout en ayant un fond. A travers une histoire qui sert de fil conducteur cocasse et insolite – celle d'un artiste américain qui veut photographier des paysans dévêtus, « Normandie nue » aborde la crise des éleveurs avec beaucoup d'humanité, notamment grâce au maire du village qui voit dans la venue du photographe l'occasion de faire valoir sa cause aux yeux de la planète. Parfois un peu maladroite, cette comédie amuse en caricaturant gentiment les médias, les artistes et les bobos parisiens en mal de verdure.", "q": "Quelle est l'opinion du journaliste sur le film « Normandie Nue » ?", "c": ["Il est facile de s'identifier aux personnages.", "Les lieux de tournage sont authentiques.", "On y dresse un portrait juste de la société.", "Son humour fait passer un message sérieux."], "a": 3, "k": "cette comédie amuse en caricaturant", "_sources": ["test21#20", "test22#19"]}, {"t": "Paris veut réduire de 30% l'exposition aux ondes des antennes-relais pour devenir la métropole la plus protectrice d'Europe. Maîtriser l'exposition des Parisiens aux ondes, tout en continuant à faire de Paris une capitale numérique, c'est le double objectif de la nouvelle charte de téléphonie mobile que le maire soumettra fin mars au conseil de Paris. Il s'agit de trouver un équilibre entre préoccupations de santé publique et bonne qualité du service de téléphonie mobile.", "q": "Quel est l'objectif de la ville de Paris ?", "c": ["Améliorer la puissance de la réception.", "Diminuer les risques sanitaires.", "Limiter les dépenses de la ville.", "Respecter les normes internationales."], "a": 1, "k": "trouver un équilibre entre préoccupations de santé publique", "_sources": ["test21#27"]}, {"t": "La ville de Nantes a de quoi séduire grâce à son dynamisme culturel. Son renouveau, débute il y a plus de deux décennies, est exceptionnel. Elle a retrouvé le goût du risque, un grain de folie et un peu de naïveté. Nantes, « la bourgeoise cité des ducs de Bretagne », est une vraie boite à idées, toujours en quête de nouvelles manières de conjuguer le « vivre ensemble ». Pas étonnant qu'elle connaisse une des plus fortes croissances des métropoles de France.", "q": "Qu'est-ce qui attire les gens à Nantes ?", "c": ["Sa position géographique.", "Ses traditions régionales.", "Son ambiance créative.", "Son économie stable."], "a": 2, "k": "dynamisme culturel", "_sources": ["test23#21"]}, {"t": "Le château de la Bussière est une demeure du 17e siècle, située dans le Loiret. Surnommé le « château des Pécheurs », il possède des collections d'objets rares sur la pêche. Sans oublier un superbe parc. Aujourd'hui, ce monument est confronté à un fléau : un champignon ronge ses édifices. Les propriétaires ont déjà lancé une campagne de restauration, mais le champignon s'attaque aussi à d'autres parties du domaine. Les maîtres des lieux souhaitaient que le bâtiment retrouve son éclat en sollicitant les internautes. À partir de 15€, les contributeurs pourront recevoir des entrées gratuites, l'inscription de leur nom sur une plaque dans le château ou bien encore un diner avec les propriétaires.", "q": "D'après l'article, à quoi les internautes sont-ils encouragés ?", "c": ["À aider à la rénovation en travaillant au château.", "À entrer en contact avec les occupants du château.", "À financer les travaux du château par un don.", "À visiter le château, ses jardins et expositions."], "a": 2, "k": "en sollicitant les internautes. À partir de 15€", "_sources": ["test23#24"]}, {"t": "Vincent Van Gogh (1853-1890), un fou génial et sans le sou, s'est coupé l'oreille ; il n'a pas été reconnu de son vivant. Voilà à peu près l'image qu'on se fait du célèbre peintre néerlandais, du moins à en croire les livres, les films et les anecdotes dont il est le héros. Un mythe difficile à effacer s'est construit autour du peintre à partir d'une histoire romancée. Or une étude approfondie de l'ensemble de la correspondance de Vincent Van Gogh - échangée essentiellement avec son frère Théo, mais aussi avec Gauguin- donne une impression beaucoup plus nuancée. Van Gogh n'était pas si pauvre, il n'était pas si fou et il a bénéficié d'une certaine notoriété de son vivant, même si ce n'était pas auprès du grand public. Forte personnalité, dans ses lettres, il savait raconter merveilleusement et de façon captivante ce qui l'occupait et pourquoi il peignait un sujet de telle ou telle manière.", "q": "Qu'explique ce texte sur Vincent Van Gogh ?", "c": ["Que sa biographie aide à mieux comprendre ses tableaux.", "Que sa correspondance avec ses proches a influencé sa peinture.", "Que ses écrits permettent de mieux cerner qui il était.", "Que ses textes confortent l'image que l'on avait de lui."], "a": 2, "k": "une étude approfondie de l'ensemble de la correspondance de Vincent Van Gogh", "_sources": ["test24#29"]}, {"t": "Dora Bruder, publié en 1997, est considéré comme l'un des meilleurs romans de Patrick Modiano. L'écrivain aime fouiller l'histoire de la capitale et fréquente de nombreuses bibliothèques. Un jour, il tombe sur une annonce parue le 31 décembre 1941 dans Paris-soir : « On recherche une jeune fille, Dora Bruder, 15 ans, 1m55, visage ovale, yeux gris marron, manteau sport gris. Adressez toute indication à M. et Mme Bruder, 41, boulevard Ornano, Paris. » Modiano va alors s'attacher à lever le mystère de cette disparition en entraînant le lecteur dans les rues du 18e arrondissement", "q": "Que fait le journaliste dans cet extrait ?", "c": ["Il cite un extrait d'une œuvre de Modiano.", "Il explique l'idée de départ d'un livre de Modiano.", "Il présente le métier de Modiano à ses débuts.", "Il raconte la rencontre entre Modiano et sa femme."], "a": 1, "k": "Modiano va alors s'attacher à lever le mystère de cette disparition", "_sources": ["test25#20"]}, {"t": "Les distributeurs indépendants\ns'inquiètent de voir les salles de cinéma offrir de plus en plus de séances au spectacle vivant (opéras, ballets) ou au sport. Ces distributeurs sont le maillon le plus fragile du paysage cinématographique : ils prennent des risques sur la sortie des films et c'est à eux de financer la majeure partie de la numérisation des salles. Ils voient donc d'un mauvais œil que l'équipement numérique des grands complexes serve à passer autre chose que leurs films surtout quand les séances ont lieu le week-end, à l'heure où pour préserver la salle, le cinéma est interdit d'antenne à la télévision.", "q": "Qu'apprend-on sur les distributeurs indépendants ?", "c": ["À quel problème sont confrontés les distributeurs indépendants.", "La forte concurrence des vidéos à la demande à la télévision.", "Le désintérêt croissant du public pour les productions indépendantes.", "Les nombreux échecs des projections proposées le weekend."], "a": 0, "k": "s'inquiètent de voir les salles de cinéma offrir de plus en plus de séances au spectacle vivant", "_sources": ["test25#28"]}, {"t": "Soyez vous-même, ou sinon, devenez-le ! La rentrée de septembre voit s'afficher dans les couloirs du métro parisien et les vitrines des libraires les couvertures de livres de développement personnel et autres introductions à la méditation, destinés à faire passer la pilule du retour au bureau des corps vacanciers. Le nouveau film de Cédric Klapisch participe à sa manière à cette vague de bien-être sur fond de grisaille. Vous y verrez défiler votre vie monotone, heureusement suspendue à la promesse d'un grand bonheur croisé in extremis. La référence principale du film reste la psychanalyse. La sérénité est au bout du chemin, avec son secret apprendre à s'aimer pour aimer quelqu'un d'autre.", "q": "Quelle tendance est dans l'air du temps ?", "c": ["Commencer une thérapie.", "Multiplier les passe-temps.", "Rechercher l'âme sœur.", "Travailler sur soi-même."], "a": 3, "k": "apprendre à s'aimer pour aimer quelqu'un d'autre", "_sources": ["test25#29"]}, {"t": "Durant les investigations journalistiques, le recours à la caméra cachée est de plus en plus fréquent. Mais souvent, son utilisation n'est aussi qu'un cache-misère, un moyen de compenser l'absence d'informations dans les reportages, de remplir le vide par des scènes un peu spectaculaires. C'est une manière pour certains aussi de faire des économies. Par ailleurs, cette pratique pose une autre question celle du statut de personne filmée à son insu. La filmer en caméra cachée, n'est-ce pas supposer qu'elle a quelque chose à se reprocher avant d'avoir Commencé à parler ?", "q": "D'après ce texte, pourquoi les journalistes utilisent ils des caméras cachées ?", "c": ["Pour améliorer la qualité des documentaires.", "Pour dissimuler la pauvreté des contenus.", "Pour moderniser leurs méthodes de travail.", "Pour piéger les gens visés par les enquêtes."], "a": 1, "k": "un moyen de compenser l'absence d'informations dans les reportages", "_sources": ["test26#29"]}, {"t": "Les arts premiers au musée !\nSi cette reconnaissance sonne comme un cri de victoire, c'est qu'il marque l'issue d'un combat idéaliste qui n'a fait d'autres victimes que l'arrogance et les préjugés. Le signal en fut donné par Guillaume Apollinaire en 1909 : « le Louvre devrait recueillir certains chefs-d'œuvre exotiques dont l'aspect n'est pas moins émouvant que celui des beaux spécimens de la statuaire Occidentale ». Près d'un siècle plus tard, le vœux du poète est enfin comblé : plus d'une centaine de sculptures primitives d'Afrique, d'Asie, d'Océanie et des Amériques, jusqu'alors confinées dans des réserves ethnographiques, prennent place dans le temple de l'Art, jusqu'alors réservé à l'Europe et à ses sources.", "q": "Cet événement est présenté comme…", "c": ["le résultat d'une lutte menée par des gens orgueilleux et intolérants.", "le triomphe d'une opinion émise par Apollinaire, mais autrefois combattue.", "un miracle dû à la persévérance des archéologues sur plusieurs continents.", "la consécration des œuvres européennes jusqu'alors remisées dans les musées."], "a": 1, "k": "un siècle plus tard, le vœux du poète est enfin comblé", "_sources": ["test29#24"]}, {"t": "M. Khalifa, responsable du patrimoine, a accidentellement découvert une douzaine de sculptures, certaines endommagées par l'érosion ou des actes de vandalisme, qui dateraient d'environ 2000 ans. En me rendant sur la zone, j'ai en fait découvert que des chameaux étaient sculptés dans les affleurements de la montagne. Le mystère reste entier sur les sculptures et les outils utilisés. Un important travail de terrain est encore nécessaire.", "q": "Qu'apprend-on sur ces sculptures ?", "c": ["Ce sont des reproductions de qualité.", "Elles sont parfaitement conservées.", "Leur transfert dans un musée est en cours.", "On ignore comment elles ont été réalisées."], "a": 3, "k": "Le mystère reste entier sur les sculptures et les outils utilisés", "_sources": ["test31#26"]}, {"t": "C'est vrai qu'une forme d'intensité a marqué ma filmographie. Je suis assez épuisée par le fait de jouer des drames. Cela traverse le corps, le champ émotionnel, ça abime... C'est pour ça que j'essaie de ne pas faire plus d'un ou deux films par an. Cette intensité est projetée sur moi, mais moi, j'aime aussi l'oisiveté, parfois la futilité et, avant tout, que ce soit vivant.", "q": "Qu'est-ce qui est difficile pour cette comédienne ?", "c": ["Choisir les bons scénarios.", "Interpréter certains rôles.", "Obéir aux directives du réalisateur.", "Respecter les textes au mot près."], "a": 1, "k": "Je suis assez épuisée par le fait de jouer des drames", "_sources": ["test31#28"]}, {"t": "Clémence et son mari ont commencé par monter une société de design industriel pour donner un nouvel aspect à des objets du quotidien. Mais, peu à peu, les industriels se sont désintéressés du design et, en hommes d'affaires, se sont davantage préoccupés de la rentabilité que de l'inventivité. Le couple s'est alors lancé dans une nouvelle aventure en fondant une galerie, une sorte de laboratoire d'expérimentation où ils ont donné carte blanche à des designers libres d'exprimer leurs élans artistiques. Aujourd'hui, leur galerie compte 12 salariés et affiche un chiffre d'affaires en progression.", "q": "Qu'apprend-on au sujet de cette galerie ?", "c": ["Elle attire beaucoup d'investisseurs.", "Elle enregistre des ventes record.", "Elle recherche une clientèle aisée.", "Elle soutient l'esprit de création."], "a": 3, "k": "donné carte blanche à des designers", "_sources": ["test33#23"]}, {"t": "Prenant acte des bilans économiques moroses qui se succèdent, et plus particulièrement d'un résultat catastrophique pour le chiffre d'affaires des libraires l'an dernier - au point que l'on a même entendu un éditeur suggérer de mettre fin à cette authentique institution qu'est la rentrée littéraire en France..., - l'édition a décidé, cette année, d'opter pour la sobriété : 524 nouveaux romans paraitront entre la mi-août et octobre parmi lesquels 336 romans français et 188 romans traduits. On est, certes, encore loin de la diète, et même de la simple frugalité, mais il s'agit tout de même de la rentrée française la plus modeste en nombre de titres depuis vingt ans.", "q": "Quelle est la particularité de la nouvelle rentrée littéraire ?", "c": ["Des libraires menacent de fermer boutique.", "La qualité des livres publiés est catastrophique.", "Le nombre d'ouvrages à paraître a diminué.", "Un éditeur refuse de participer à cette tradition."], "a": 2, "k": "la rentrée française la plus modeste en nombre de titres", "_sources": ["test33#27"]}, {"t": "Soyez vous-mêmes, ou sinon, devenez-le ! La rentrée de septembre voit s'afficher dans les couloirs du métro parisien et les vitrines des libraires les couvertures de livres de développement personnel et autres introductions à la méditation, destinés à faire passer la pilule du retour au bureau des corps vacanciers. Le nouveau film de Cédric Klapisch participe à sa manière à cette vague de bien-être sur fond de grisaille. Vous y verrez défiler votre vie monotone, heureusement suspendue à la promesse d'un grand bonheur croisé in extremis. La référence principale du film reste la psychanalyse. La sérénité est au bout du chemin, avec son secret apprendre à s'aimer pour aimer quelqu'un d'autre.", "q": "Quelle tendance est dans l'air du temps?", "c": ["Commencer une thérapie.", "Multiplier les passe-temps.", "Rechercher l'âme sœur.", "Travailler sur soi-même."], "a": 3, "k": "livres de développement personnel et autres introductions à la méditation", "_sources": ["test35#28"]}]}, "Profession": {"cours": [{"t": "Job d'été, la première expérience\nQuand une entreprise fait appel pour la première fois à un jeune, elle n'a pas d'attente vis-à-vis de ses compétences professionnelles. C'est donc sur son comportement que vont se porter ses critères d'évaluation. Même saisonnier. Il faut montrer qu'on a vraiment envie de décrocher un job. Les jeunes sans expérience ont tout intérêt à parler de leur passion et à démontrer leur motivation. Pour un employeur, c'est ce qui reste souvent le critère le plus important.", "q": "Selon l'article, que faut-il faire pour trouver un job d'été ?", "c": ["Exposer l'ensemble de ses qualités professionnelles", "Faire preuve de son désir de travailler", "Parler avec enthousiasme de ses projets de formation", "Parler des emplois qu'on a déjà occupés"], "a": 1, "k": "Il faut montrer qu'on a vraiment envie de décrocher un job.", "_sources": ["test1#20"]}, {"t": "Le jour viendra où un fonds de pension ou un groupe alimentaire mondial investira dans l'entreprise d'un cuisinier reconnu pour orchestrer son développement international. Bien sûr, on ne peut qu'avoir de la nostalgie pour les temps héroïques ou une bande de copains inventait les codes de la nouvelle cuisine. Aujourd'hui, n'importe quel jeune cuisinier est prêt à payer très cher pour le privilège d'un stage de six mois chez un « grand chef ». Il rentabilisera vite cet investissement en s'autoproclamant « élève de… », car les marques des grands chefs ne cessent de prendre de la valeur.", "q": "Qu'apprend-on sur les grands chefs ?", "c": ["Leur conception de la cuisine est passée de mode", "Leur créativité leur assure une célébrité mondiale", "Leur nom s'est transformé en label de prestige", "Leurs établissements sont cotés en bourse"], "a": 2, "k": "les marques des grands chefs ne cessent de prendre de la valeur.", "_sources": ["test1#21"]}, {"t": "LE DIAMANT D'ESPELETTE\n\nLe piment d'Espelette, qui célèbre actuellement sa fête, est probablement aujourd'hui le produit le plus emblématique du Pays basque. Il a pourtant failli devenir un produit banal, c'est-à-dire le contraire absolu de ce qu'il est vraiment. Au début des années 90, on trouvait en effet et on produisait du piment, dit d'Espelette, en Afrique du Nord, en Corse, en Espagne … Bref partout où on aime ce goût puissant et peu piquant qui fait sa légitime réputation. Or les Basques n'aiment pas se faire voler leurs traditions. Ils ont donc obtenu en juin 2000 l'appellation d'origine contrôlée (AOC) interdisant tout plagiat. Aujourd'hui le diamant rouge d'Espelette est particulièrement apprécié de certains grands chefs qui l'utilisent pour faire « exploser » les saveurs.", "q": "L'appellation d'origine contrôlée accordée au piment d'Espelette permet aux Basques ...", "c": ["De lutter contre les imitations", "D'en accroître la production", "De développer sa saveur", "De le faire davantage connaître"], "a": 0, "k": "Ils ont donc obtenu en juin 2000 l'appellation d'origine contrôlée (AOC) interdisant tout plagiat.", "_sources": ["test2#20"]}, {"t": "Depuis plusieurs années, Thierry Marx, un grand chef français, intervient pour donner des cours de cuisine en prison. Faire découvrir à ce public, contraint de vivre en milieu fermé, qu'une profession, quelle qu'elle soit, peut être épanouissante, est une tâche qui le passionne et nécessite très naturellement une grande énergie. Le désir de rallumer cette lueur d'espoir, de montrer « qu'après », il peut y avoir une réinsertion réussie et que chacun la porte en lui, est un moteur pour relever ce défi.", "q": "Pourquoi Thierry Marx intervient-il dans les prisons ?", "c": ["Pour améliorer les méthodes de travail de la cantine", "Pour encourager la création de formations professionnelles", "Pour faire naître l'envie de s'investir dans un métier", "Pour sensibiliser le grand public à la réalité de la vie carcérale"], "a": 2, "k": "Faire découvrir à ce public, contraint de vivre en milieu fermé, qu'une profession, quelle qu'elle soit, peut être épanouissante", "_sources": ["test2#27", "test7#27"]}, {"t": "Un jour, en réfléchissant aux raisons qui m'avaient éloigné d'une carrière universitaire pourtant bien partie afin de me consacrer à mon travail de médecin praticien, j'ai compris que mon choix tenait en partie au fait que l'on riait beaucoup plus au contact des êtres humains plongés dans la vie qu'à celui des chercheurs. Comme un animal qui migre vers le sud en hiver, j'avais suivi le soleil de cette vibration qui fabrique du bonheur, du lien, de la santé. Je ne l'ai jamais regretté.", "q": "Qu'est-ce qui a guidé l'auteur dans ses choix professionnels ?", "c": ["L'attirance pour les études", "L'appel des pays chauds", "Le besoin d'interaction sociale", "Le désir de reconnaissance"], "a": 2, "k": "l'on riait beaucoup plus au contact des êtres humains plongés dans la vie", "_sources": ["test3#22", "test9#22"]}, {"t": "Elle a 27 ans et a trouvé sa vocation: restauratrice de meubles Stéphanie reçoit, à ce titre, le prix du jeune artisan d'art: « La dotation va me permettre d'ouvrir mon atelier. J'ai déjà trouvé le lieu, dans un village entre Narbonne et Carcassonne.» Son compagnon y a créé une menuiserie. Stéphanie a déjà touché à tout, au fil de sa formation, dont un BTS en alternance, obtenu dans son Auvergne natale. Nos vœux de réussite!", "q": "Quel projet cette personne va-t-elle réaliser ?", "c": ["Démarrer une activité professionnelle", "Présenter son travail à un concours", "S'associer à un groupement d'artisans", "Suivre une formation complémentaire"], "a": 0, "k": "La dotation va me permettre d'ouvrir mon atelier.", "_sources": ["test5#20"]}, {"t": "Madame Bertrand,\nJe vous écris suite à votre message électronique du 13 avril dernier au sujet de l'offre d'emploi n°23.\nVotre formation universitaire et votre expérience nous semblent particulièrement intéressantes.\nM. Martin, attaché culturel de l'ambassade de France, accepte de vous recevoir pour un entretien au consulat de New York pour discuter avec vous des possibilités d'emploi.\nJe suis à votre disposition pour envisager ensemble quelques dates.\nLaetitia Xavel\nSecrétariat du service.", "q": "Quel est le but de ce message ?", "c": ["Annoncer la signature d'un accord de coopération.", "Communiquer une offre de stage de fin d'études.", "Faire part de la réponse d'un responsable.", "Informer sur le profil d'un poste disponible."], "a": 2, "k": "M. Martin, attaché culturel de l'ambassade de France, accepte de vous recevoir", "_sources": ["test8#21"]}, {"t": "EMPLOI\nChanger de métier : évitez les aléas !\nChanger de métier ne doit pas être une décision prise à la légère. Il est important de prendre le temps de déterminer avec précision les raisons qui vous poussent à vouloir faire ce choix. Il est essentiel de bien s'orienter pour la recherche d'un nouveau travail, surtout si vous êtes dans le flou par rapport à vos envies. Faire le point sur vos compétences vous permettra de déterminer vers quels secteurs vous pouvez vous diriger. Avoir conscience de vos compétences sera également un plus au moment de vous vendre à un employeur potentiel.", "q": "Que conseille cet article à ceux qui désirent changer de métier ?", "c": ["D'élargir leurs perspectives professionnelles.", "D'évaluer les possibilités d'évolution de leur carrière.", "De faire un bilan de leurs aptitudes.", "De privilégier leur épanouissement personnel."], "a": 2, "k": "Faire le point sur vos compétences", "_sources": ["test9#23"]}, {"t": "Les salariés européens seraient 74% à songer à se reconvertir, et seuls 8% se déclarent satisfaits de leur carrière. La crise économique actuelle, loin de décourager les aspirants au changement, semble même précipiter les réorientations professionnelles volontaires.\nCe mouvement est à la fois individuel et social. Certes, l'individu, majeur et responsable, demeure l'acteur principal de sa reconversion.\nMais la société, à tant valoriser le changement personnel, transforme le changement professionnel en expérience sociale. L'idée qu'une autre vie est possible est admise dans tous les niveaux de la société.", "q": "Quel phénomène associé à la crise économique est décrit dans ce texte ?", "c": ["La lutte pour le maintien du niveau des salaires.", "La volonté de déménager à l'âge adulte.", "L'attachement aux valeurs de l'entreprise.", "Le désir d'évolution durant la vie active."], "a": 3, "k": "précipiter les réorientations professionnelles volontaires", "_sources": ["test9#25"]}, {"t": "Depuis des siècles, les gestes sont les mêmes. La précision obligatoire. Et le temps nécessaire. Pourtant, avant les défilés des collections automne-hiver, la fièvre règne dans les ganteries de Saint-Junien, principale ville gantière de France. Industrie saisonnière, pour que les gants soient livrés en automne, les cadences maximales de fabrication se situent avant, entre le printemps et l'été. Avec un handicap majeur : l'impossibilité d'embaucher en renfort des artisans gantiers supplémentaires, pour la simple raison qu'il n'en existe pas. L'apprentissage de ces métiers s'effectue forcément en interne puisque la dernière école de ganterie a mis clé sous la porte.", "q": "Quel est le principal problème que rencontre l'industrie du gant ?", "c": ["La réactivité aux changements de la mode.", "Le recrutement de personnels qualifiés.", "Les formations inadaptées aux besoins.", "Les techniques de production dépassées."], "a": 1, "k": "l'impossibilité d'embaucher en renfort des artisans gantiers supplémentaires", "_sources": ["test11#28"]}, {"t": "Il veut réhabiliter la charcuterie\nLe métier, bien sûr, mais aussi le produit. « on s'imagine un gros bonhomme avec un tablier taché de sang travaillant dans le froid, ironise Ludovic. C'est tout le contraire ! On travaille avec des matières nobles, dans des labos modernes. On s'éclate en cuisinant, on ne s'ennuie jamais. Quand elle est naturelle, la charcuterie est un excellent aliment, les nutritionnistes devraient faire preuve de discernement » autre obsession de ce puriste : La frontière des métiers. « comment peut-on se prétendre à la fois boucher, charcutier et traiteur ? C'est un non-sens ! »", "q": "Quel message cet homme veut-il transmettre ?", "c": ["L'avenir de son travail est menacé par l'industrie agroalimentaire", "La qualité des produits charcutiers est reconnue par les médecins", "Le passage d'un métier de boucher à un autre se fait facilement", "L'image attachée à sa profession et stéréotypée et peu valorisante"], "a": 3, "k": "on s'imagine un gros bonhomme avec un tablier taché de sang travaillant dans le froid", "_sources": ["test14#26"]}, {"t": "Madame,\nJe vous remercie pour les fiches de lecture que vous m'avez envoyées pour enrichir ma thèse. À première vue, elles viennent à point appuyer le concept de ma troisième partie. Cependant, des événements d'ordre privé ayant perturbé mon emploi du temps, je ne serai pas en mesure d'achever mes lectures avant notre prochain rendez-vous. Dans ces conditions, je pense qu'il est préférable de le reporter. Je vous demande de bien vouloir m'excuser pour ce contretemps. J'espère reprendre contact avec vous très prochainement pour enfin pouvoir échanger avec vous mes impressions sur ces lectures.\nCordialement,\nGéraldine Dupont", "q": "Qu'annonce Géraldine dans son message ?", "c": ["L'envoi d'un bilan de ses lectures.", "La fin des modifications sur sa thèse.", "Le retard pris dans ses recherches.", "La date de leur prochaine rencontre."], "a": 2, "k": "je ne serai pas en mesure d'achever mes lectures avant notre prochain rendez-vous", "_sources": ["test15#23"]}, {"t": "Monsieur,\nNous avons bien reçu votre offre de collaboration.\nNous allons l'étudier dans les prochains jours. Sans nouvelles de notre part d'ici trois semaines, vous pourrez considérer que votre candidature n'aura pas été retenue. Néanmoins, et sauf avis contraire de votre part, nous la conserverons au cas où de nouvelles opportunités se présentent. Nous tenons à vous remercier de l'intérêt que vous avez porté à notre société.\nSincères salutations.\nLe Service Recrutement", "q": "Qu'apprend le destinataire de ce courrier ?", "c": ["Que sa candidature est sélectionnée.", "Que sa proposition est acceptée.", "Que son dossier est examiné.", "Que son recrutement est retardé."], "a": 2, "k": "Nous allons l'étudier dans les prochains jours", "_sources": ["test15#29"]}, {"t": "Le PDG de la société SEB a avoué « ne plus espérer avoir une croissance importante sur les marchés occidentaux, arrivés à saturation.\nLui, qui a toujours défendu la valeur ajoutée et le savoir-faire des usines tricolores.\nN'a pas pu faire face à l'arrivée des pays émergents dans le petit électroménager : 80% des grille-pains vendus en France coûtent désormais moins de 30 €.", "q": "Que regrette le PDG de la société SEB ?", "c": ["La faible qualité de la production française", "Le manque d'innovation dans son entreprise", "Les contraintes des contrôles financiers", "L'expansion de la concurrence internationale"], "a": 3, "k": "n'a pas pu faire face à l'arrivée des pays émergents", "_sources": ["test16#23"]}, {"t": "Lors de l'inscription à la faculté de Médecine de Boston, les professeurs privilégient les candidats…ayant déjà connu des échecs.\nIls considèrent en effet que ces erreurs d'orientation permettent de grandir plus vite.\nIls réduisent aussi le risque de recruter des élèves qui vont se rendre compte au bout de quelques mois qu'ils ne veulent plus devenir médecins.\nIls ont déjà changé de voie une fois, il est moins probable qu'ils en changent une seconde fois.", "q": "Pourquoi les candidats qui se réorientent sont-ils privilégiés dans cette faculté ?", "c": ["Ils ont plus de facilités d'apprentissage", "Ils ont une idée claire de leur futur métier", "Ils sont déterminés à travailler beaucoup", "Ils sont plus sûrs de leur nouveaux choix"], "a": 3, "k": "il est moins probable qu'ils en changent une seconde fois", "_sources": ["test16#24"]}, {"t": "Journée « Portes Ouvertes » à Polytech'Tours.\nPrésentation des études et des métiers d'ingénieur par les responsables des spécialités sur chaque site.\nVisites guidées des salles de travaux pratiques, des centres de documentation, des laboratoires de recherche et de langues.", "q": "Quel est l'objectif de cette journée ?", "c": ["Découvrir le travail de recherche en laboratoire", "Faire découvrir les formations pour devenir ingénieur", "Inaugurer l'ouverture d'un campus universitaire", "Obtenir des conseils afin de créer une association"], "a": 1, "k": "Présentation des études et des métiers d'ingénieur", "_sources": ["test16#25"]}, {"t": "La rétrospective Mali Twist montre comment, par sa diversité et son éclat, l'œuvre de Malick Sidibé s'inscrit dans le champ contemporain de la photographie.\nTour à tour reporter et portraitiste, Malick Sidibé a construit, depuis l'ouverture de son studio à Bamako en 1962, un ensemble photographique en noir et blanc exceptionnel.\nMali Twist révèle son regard attentif et son talent pour mettre en lumière le meilleur de chacun, sa singularité.\nMalick Sidibé a fait de la photographie un art de l'échange.\nS'il a eu pour règle d'or d'embellir ses modèles, il témoigne aussi de la joie de vivre de la jeunesse bamakolaise, peu après l'indépendance du Mali.", "q": "Sur quoi repose le travail photographique de Malick Sidibé ?", "c": ["Un engagement politique", "Une contemplation abstraite", "Une mise en valeur de l'autre", "Une technique de retouche"], "a": 2, "k": "son talent pour mettre en lumière le meilleur de chacun, sa singularité", "_sources": ["test16#26"]}, {"t": "La désillusion de la jeunesse française d'aujourd'hui est un fait préoccupant.\nElle est surtout due à la crise internationale, qui réduit les offres d'emploi, fait pression sur les salaires et raréfie les possibilités de promotion.", "q": "D'où vient la désillusion des jeunes en France ?", "c": ["De la concurrence des autres générations.", "De la course à la compétitivité.", "De la situation économique tendue.", "Des critiques émanant de leurs parents."], "a": 2, "k": "due à la crise internationale, qui réduit les offres d'emploi", "_sources": ["test16#28"]}, {"t": "La gestion du mobilier urbain est une pratique traditionnellement très codifiée à la Ville de Paris qui a en charge sa sélection et le choix des lieux d'implantation. Le service technique concerné est la Direction de la voirie et des déplacements (DVD). Les critères de standardisation qu'elle applique touchent essentiellement à des dimensions techniques et patrimoniales. Cela se traduit par des formes de réglementation qu'il s'agit de faire respecter. Les agents de la Direction qui font le choix des types de bancs, de potelets ou encore de lampadaires, travaillent ainsi dans un cadre d'action précis, renforcé par des éléments concrets du territoire qui peuvent aussi contraindre certains choix (présence de réseaux souterrains par exemple).", "q": "Quel est le rôle de la Direction de la voirie et des déplacements (DVD) selon le texte ?", "c": ["Elle conçoit et fabrique le mobilier urbain", "Elle détermine et installe le mobilier urbain", "Elle entretient et répare le mobilier urbain", "Elle contrôle et sanctionne le mobilier urbain"], "a": 1, "k": "sélection et le choix des lieux d'implantation", "_sources": ["test18#23"]}, {"t": "Changer de métier : évitez les aléas !\nChanger de métier ne doit pas être un décision prise à la légère. Il est important de prendre le temps de déterminer avec précision les raisons qui vous poussent à vouloir faire ce choix. Il est essentiel de bien s'orienter pour la recherche d'un nouveau travail, surtout si vous êtes dans le flou par rapport à vos envies. Faire le point sur vos compétences vous permettra de déterminer vers quels secteurs vous pouvez vous diriger. Avoir confiance de vos compétences sera également un plus au moment de vous vendre à un employeur potentiel.", "q": "Que conseille l'article à ceux qui désirent changer de métier ?", "c": ["D'élargir leurs perspectives professionnelles", "D'évaluer les possibilités d'évolution de leur carrière", "De faire un bilan de leurs aptitudes", "De privilégier leur épanouissement personnel"], "a": 2, "k": "Faire le point sur vos compétences", "_sources": ["test18#24"]}], "devoirs": [{"t": "L'association « Savoir-faire et expérience » a huit ans\nSa philosophie : une personne handicapée n'est pas forcément une personne en fauteuil roulant. Et, de la même manière qu'il y a de nombreuses formes de handicap, il existe une multitude de métiers et de postes qui peuvent leur correspondre. C'est pourquoi cette association souhaite modifier la vision commune du handicap et encourager les entreprises à s'engager dans cette voie. C'est dans ce but qu'elle œuvre pour l'ouverture la plus large possible des dispositifs de formation professionnelle aux handicapés. Pour qu'enfin, on regarde le savoir-faire et l'expérience avant le handicap.", "q": "Quelle est la mission de l'association « Savoir-faire et expérience » ?", "c": ["Faire évoluer les mentalités au sujet du handicap au travail", "Permettre de modifier la législation sur le handicap au travail", "Recenser les discriminations dont sont victimes les handicapés", "Subventionner les entreprises qui recrutent des handicapés"], "a": 0, "k": "souhaite modifier la vision commune du handicap", "_sources": ["test18#29"]}, {"t": "Le problème des grandes associations caritatives, c'est qu'elles n'ont pas de relation de proximité avec le public. Le Comité de la charte rétablit ce lien et redonne confiance aux donateurs grâce à une charte de déontologie et à la nomination d'un censeur auprès de chaque organisation membre. Le système fonctionne comme un label : il faut se soumettre à ses contraintes. Pour donner confiance, il faut effectuer un travail pédagogique pour des donateurs et leur donner des informations sur les moyens dont disposent les associations : elles fonctionnent bien entendu, avec des bénévoles, mais également avec des salariés et ceux-ci doivent être correctement rémunérés pour fournir un travail de qualité.", "q": "Quel est l'objectif du Comité de la Charte ?", "c": ["Rationaliser la gestion des associations.", "Élargir le recrutement à de nouveaux bénévoles.", "Former les responsables des associations.", "Mieux communiquer sur l'utilisation des fonds."], "a": 3, "k": "donner des informations sur les moyens dont disposent les associations", "_sources": ["test19#25"]}, {"t": "L'association « Savoir-faire et expérience » a huit ans.\nSa philosophie : une personne handicapée n'est pas forcément une personne en fauteuil roulant. Et, de la même manière qu'il y a de nombreuses formes de handicap, il existe une multitude de métiers et de postes qui peuvent leur correspondre. C'est pourquoi cette association souhaite modifier la vision commune du handicap et encourager les entreprises à s'engager dans cette voie. C'est dans ce but qu'elle œuvre pour l'ouverture la plus large possible des dispositifs de formation professionnelle aux handicapés. Pour qu'enfin, on regarde le savoir-faire et l'expérience avant le handicap.", "q": "Quelle est la mission de l'association « Savoir-faire et expérience » ?", "c": ["Faire évoluer les mentalités au sujet du handicap au travail.", "Permettre de modifier la législation sur le handicap au travail.", "Recenser les discriminations dont sont victimes les handicapés.", "Subventionner les entreprises qui recrutent des handicapés."], "a": 0, "k": "cette association souhaite modifier la vision commune du handicap", "_sources": ["test20#29"]}, {"t": "Comment recruter la bonne personne, baby-sitter ou collaborateur ? Si le bouche-à-oreille ou les tests constituent des méthodes largement répandues, difficile pour autant d'être sûr à 100% que la personne choisie soit vraiment la bonne. C'est pourquoi, pour une somme modique, une entreprise californienne, Predictim, promet une analyse complète de la personnalité des candidats via les réseaux sociaux : grâce à un algorithme, toutes leurs publications sont étudiées en seulement quelques secondes. Cependant, l'usage de l'intelligence artificielle pour la sélection de candidats a rapidement montré ses limites. L'entreprise Amazon, par exemple, a dû renoncer à son logiciel de recrutement, car celui-ci avait tendance à privilégier les hommes.", "q": "Que devrait permettre l'intelligence artificielle dans le monde professionnel ?", "c": ["De protéger les droits du personnel.", "De vérifier le profil des postulants.", "D'encourager la création d'emplois.", "D'éviter la discrimination à l'embauche."], "a": 1, "k": "une analyse complète de la personnalité des candidats via les réseaux sociaux", "_sources": ["test24#25", "test38#25"]}, {"t": "La rétrospective « Mali Twist » montre comment, par sa diversité et son éclat, l'œuvre de Malick Sidibé s'inscrit dans le champ contemporain de la photographie. Tour à tour reporter et portraitiste, Malick Sidibé a construit, depuis l'ouverture de son studio à Bamako en 1962, un ensemble photographique en noir et blanc exceptionnel. « Mali Twist » révèle son regard attentif et son talent pour mettre en lumière le meilleur de chacun, sa singularité. Malick Sidibé a fait de la photographie un art de l'échange. S'il a eu pour règle d'or d'embellir ses modèles, il témoigne aussi de la joie de vivre de la jeunesse bamakoise, peu après l'indépendance du Mali. Entre visages anonymes et corps en mouvement, poseurs élégants et flâneurs, « Mali Twist » offre plus de 250 photographies.", "q": "Sur quoi repose le travail photographique de Malick Sidibé ?", "c": ["Un engagement politique.", "Une contemplation abstraite.", "Une mise en valeur de l'autre.", "Une technique de retouche."], "a": 2, "k": "mettre en lumière le meilleur de chacun, sa singularité", "_sources": ["test24#26"]}, {"t": "La vision traditionnelle de l'entreprise implique d'avoir pour seule finalité le profit. Toutefois, le discours change. On parle désormais des trois P : performance du profit, des personnes et de la planète, ce qui constitue certes un progrès et signifie que l'entreprise doit être responsable socialement et environnementalement pour faire du profit. Néanmoins, la finalité reste toujours le profit. L'entreprise « humaniste » inverse ce discours en s'appuyant sur un regroupement de personnes au service du bien commun. Les bénéfices de l'entreprise qui demeurent nécessaires deviennent un moyen et l'objectif, c'est le bien commun. Pour l'atteindre, l'entreprise humaniste est construite sur des relations de confiance interpersonnelles, sur des produits et un service de qualité ainsi que sur un impact environnemental fiable, voire nul.", "q": "Comment les entreprises humanistes se distinguent-elles des autres ?", "c": ["Par l'abolition des relations hiérarchiques classiques.", "Par la mise en place d'une carte écologique commune.", "Par la primauté de l'intérêt collectif sur bénéfices.", "Par la répartition équitable des profits entre salariés."], "a": 2, "k": "s'appuyant sur un regroupement de personnes au service du bien commun", "_sources": ["test25#25"]}, {"t": "Il veut réhabiliter la charcuterie.\nLe métier, bien sûr, mais aussi le produit. « On s'imagine un gros bonhomme avec un tablier taché de sang travaillant dans le froid, ironise Ludovic. C'est tout le contraire ! On s'éclate en cuisinant, on ne s'ennuie jamais. Quand elle est naturelle, la charcuterie est un : excellent aliment, les nutritionnistes devraient faire preuve de discernement. » Autre obsession de puriste : la frontière des métiers. « Comment peut-on se prétendre à la fois boucher, charcutier et traiteur ? C'est un non-sens ! »", "q": "Quel message cet homme veut-il transmettre ?", "c": ["L'avenir de son travail est menacé par l'industrie agroalimentaire.", "La qualité des produits charcutiers est reconnue par les médecins.", "Le passage d'un métier de bouche à un autre se fait facilement.", "L'image attachée à sa profession est stéréotypée et peu valorisante."], "a": 3, "k": "On s'imagine un gros bonhomme avec un tablier taché de sang", "_sources": ["test25#26"]}, {"t": "Faire du bénévolat à l'étranger est souvent sujet à controverse : missions peu claires ou non conformes à des principes éthiques, prix exorbitants, flou artistique et manque de transparence concernant la destination de l'argent récolté... Certaines agences spécialisées dans le domaine profitent de la tendance du
