 tourisme solidaire pour s'enrichir ! D'autres, au contraire, affichent clairement leurs exigences et leurs engagements. C'est le cas de « Travailler à l'étranger », basé au Royaume-Uni et qui envoie des voyageurs volontaires à travers le monde depuis 1997. Ils s'assurent du suivi des stagiaires, visitent toutes les structures et créent de vrais liens avec leurs partenaires.", "q": "Quel est l'objectif de l'agence « Travailler à l'étranger » ?", "c": ["Faire découvrir des destinations authentiques.", "Organiser des séjours à vocation humanitaire.", "Recruter des salariés à l'international.", "Reverser ses bénéfices à des associations."], "a": 1, "k": "envoie des voyageurs volontaires à travers le monde", "_sources": ["test26#27"]}, {"t": "Dans l'ensemble des espaces verts de la ville de Toulouse, les pelouses tondues régulièrement laissent place à 150 hectares de prairies urbaines, plus sauvages. En coupant l'herbe, on stoppe le cycle des végétaux. Or si on ne la coupe qu'une fois par an, c'est bon pour l'écosystème et ça permet l'intégration de nouvelles espèces, explique la conseillère municipale. Seul inconvénient, le résultat est nettement moins esthétique.", "q": "Quel est l'avantage principal de ne tondre l'herbe qu'une fois par an ?", "c": ["Cela réduit les coûts d'entretien des espaces verts.", "Cela préserve les habitats naturels.", "C'est plus esthétique pour les visiteurs.", "Cela évite le bruit constant des tondeuses dans la ville."], "a": 1, "k": "c'est bon pour l'écosystème et ça permet l'intégration de nouvelles espèces", "_sources": ["test31#27"]}, {"t": "Lors de l'inscription à la faculté de médecine de Boston, les professeurs privilégient les candidats.... ayant déjà connu des échecs, considèrent en effet que ces erreurs d'orientation permettent de grandir plus vite, de se rapprocher plus rapidement de sa vocation, bref, de mieux se connaitre. Plus simplement, ils réduisent aussi le risque de recruter des élèves qui vont se rendre compte au bout de quelques mois qu'ils ne veulent plus devenir médecins : ils ont déjà changé de voie une fois, il est moins probable qu'ils en changent une seconde fois.", "q": "Pourquoi les candidats qui se réorientent sont-ils privilégiés dans cette faculté ?", "c": ["Ils ont plus de facilités d'apprentissage.", "Ils ont une idée claire de leur futur métier.", "Ils sont déterminés à travailler beaucoup.", "Ils sont plus sûrs de leur nouveau choix."], "a": 3, "k": "ils ont déjà changé de voie une fois", "_sources": ["test33#24"]}, {"t": "Faire des horaires à rallonge, venir travailler même malade … Depuis quelques années, le présentéisme - une présence excessive au travail - s'étend dans les entreprises. En cause : une idée typiquement française selon laquelle la valeur de son travail dépend du nombre d'heures qu'on y passe. Favorisé par la crainte de perdre son emploi, le présentéisme est un phénomène difficile à repérer, mais qui représente un vrai danger pour les salariés et les entreprises. Contrairement à ce que l'on croit souvent, un salarié trop présent risque d'être moins efficace, car il s'épuisera avec des horaires trop importants, perdra sa concentration et sera démotivé.", "q": "Qu'apprend-on sur le présentéisme ?", "c": ["C'est un phénomène mondial", "Il influence la productivité des salariés", "On peut facilement le repérer", "Ses effets sont néfastes pour l'emploi"], "a": 1, "k": "un salarié trop présent risque d'être moins efficace", "_sources": ["test34#22"]}, {"t": "LE PARTAGE, UN NOUVEAU MODE DE CONSOMMATION\nLa consommation collaborative, basée sur l'échange, le partage, la location plutôt que la possession, n'est plus l'apanage de pionniers engagés. « Nous faisons face à un mouvement de fond, analyse le sociologue Erwan Lecoeur. Partager n'est pas nouveau, mais cet acte, longtemps le fait d'une minorité, est récupéré par des acteurs intermédiaires : entreprises, grandes associations, institutions. Par exemple, les parkings-relais se multiplient pour favoriser le covoiturage. De telles initiatives légitiment ces pratiques. » Faut-il y voir un effet de la crise ? « Non, répond cet observateur, la consommation collaborative vient juste conforter une nouvelle façon d'appréhender la consommation. »", "q": "Que constate Erwan Lecoeur sur la consommation collaborative ?", "c": ["Elle concerne une poignée de militants", "Elle consolide le système en place", "Elle répond aux tendances actuelles", "Elle résulte de difficultés économiques"], "a": 2, "k": "la consommation collaborative vient juste conforter une nouvelle façon d'appréhender la consommation", "_sources": ["test34#26"]}, {"t": "Faire des horaires à rallonge, venir travailler même malade... Depuis quelques années, le présentéisme - une présence excessive au travail s'étend dans les entreprises. En cause : une idée typiquement française selon laquelle la valeur de son travail dépend du nombre d'heures qu'on y passe. Favorisé par la crainte de perdre son emploi, le présentéisme est un phénomène difficile à repérer, mais qui représente un vrai danger pour les salariés et les entreprises. Contrairement à ce que l'on croit souvent, un salarié trop présent risque d'être moins efficace, car il s'épuisera avec des horaires trop importants, perdra sa concentration et sera démotivé.", "q": "Qu'apprend-on sur le présentéisme ?", "c": ["C'est un phénomène mondial.", "Il influence la productivité des salariés.", "On peut facilement le repérer.", "Ses effets sont néfastes pour l'emploi."], "a": 1, "k": "un salarié trop présent risque d'être moins efficace", "_sources": ["test35#23"]}, {"t": "Le PDG de la société SEB a avoué « ne plus espérer avoir une croissance importante » sur les marchés occidentaux, arrivés à saturation. Lui, qui a toujours défendu la valeur ajoutée et le savoir-faire des usines tricolores, n'a pas pu faire face à l'arrivée des pays émergents dans le petit électroménager : 80% des grille-pains vendus en France coûtent désormais moins de 30€. Résultat, les ventes de l'inventeur de la cocotte minute ont reculé de 5,6% en France et de 2,6% dans les autres pays de l'Union Européenne.", "q": "Que regrette le PDG de la société SEB ?", "c": ["La faible qualité de la production française.", "Le manque d'innovation dans son entreprise.", "Les contraintes des contrôles financiers.", "L'expansion de la concurrence internationale."], "a": 3, "k": "n'a pas pu faire face à l'arrivée des pays émergents dans le petit électroménager", "_sources": ["test35#24"]}, {"t": "Un salarié qui avale un sandwich devant l'écran en guise de pause déjeuner offre à son employeur 128 heures de travail non rémunéré, soit seize jours pleins, ont calculé des chercheurs britanniques.\nInterrogés sur leurs motivations, ces salariés expliquent se sentir trop coupables de s'arrêter de travailler. En ces temps de compétition exacerbée entre les salariés, ce serait interprété comme un manque d'efficacité. Un médecin rappelle pourtant que « faire des pauses régulières, se lever et marcher aide à s'aérer l'esprit » pendant sa journée de travail. « Prendre une pause déjeuner préparé à une après-midi productive », poursuit-il.\n\nD'après lexpress.fr", "q": "Pourquoi certains salariés travaillent-ils pendant la pause déjeuner ?", "c": ["Pour améliorer leur situation financière.", "Pour donner une bonne image d'eux.", "Pour exécuter les ordres de la direction.", "Pour quitter leur entreprise plus tôt."], "a": 1, "k": "ces salariés expliquent se sentir trop coupables de s'arrêter de travailler. En ces temps de compétition exacerbée entre les salariés, ce serait interprété comme un manque d'efficacité.", "_sources": ["test36#23"]}, {"t": "Le syndrome d'épuisement professionnel est-il uniquement lié au monde du travail ? Si l'on considère la sphère privée, certains médecins préfèrent utiliser le terme de surcharge mentale. Pour le docteur Marie-Pierre Guilho-Bailly, médecin-psychiatre spécialisée en pathologie professionnelle, il est indispensable de ne pas étendre le concept de ce syndrome à toutes les situations d'épuisement engendrées par la vie personnelle, familiale ou sociale.\nÀ son sens, le seul syndrome d'épuisement professionnel qui puisse être retenu concernant le milieu familial renvoie au travail des aidants familiaux. Toutefois, des études tendent à montrer que les symptômes peuvent survenir également dans la vie personnelle, notamment chez certains parents particulièrement épuisés.", "q": "Qu'apprend-on à propos du syndrome d'épuisement professionnel ?", "c": ["Il demande une prise charge médicale.", "Il peut s'étendre au domaine personnel.", "Il suscite un consensus parmi les spécialistes.", "Il touche surtout les aides-soignants."], "a": 1, "k": "des études tendent à montrer que les symptômes peuvent survenir également dans la vie personnelle, notamment chez certains parents particulièrement épuisés.", "_sources": ["test36#25"]}]}, "Education": {"cours": [{"t": "Les jeunes du Lycée Professionnel Hôtelier Paul-Valéry ont des idées …\nAfin de pallier la faiblesse des moyens de l'Education nationale pour financer leurs voyages d'étude. Ils n'arrêtent pas de mobiliser les bonnes volontés à coups d'initiatives originales et qui font mouche.\nAprès l'exemple donné par les terminales de restauration qui proposent un repas « tout citron » pour un voyage d'étude à Barcelone, c'est au tour des élèves de 2nde de battre le rappel. Ceux-ci bénéficieront des retombées d'un vide-greniers, organisé par le Lions Club, pour boucler le budget de leur voyage d'étude en Corse à la rentrée.", "q": "Quel est l'objectif des élèves de 2nde ?", "c": ["Elaborer le budget de leur voyage à Barcelone", "Gagner de l'argent pour payer leur séjour", "Montrer aux autres classes leurs talents culinaires", "Soutenir le futur projet des élèves de terminale"], "a": 1, "k": "Ceux-ci bénéficieront des retombées d'un vide-greniers, organisé par le Lions Club, pour boucler le budget de leur voyage d'étude en Corse", "_sources": ["test1#28"]}, {"t": "Erasmus,\n\nLe programme d'échange d'étudiants entre les universités européennes a du plomb dans l'aile. Au point qu'en France près de quatre mille bourses n'ont pas trouvé preneur. Ce phénomène n'est pas spécifique à la France puisqu'une baisse de 10% aurait été enregistrée dans une dizaine de pays. Toutes les études traduisent une absence de désir de mobilité chez les jeunes. Parmi les explications avancées, le coût mais surtout une préférence marquée pour les stages en entreprises. Voilà le grand concurrent d'Erasmus depuis quelques années : l'attention portée à l'insertion professionnelle.", "q": "Qu'explique le texte au sujet du programme Erasmus ?", "c": ["Il est financé par des universités publiques", "Il est remplacé par un autre programme", "Il facilite l'accès au monde de l'entreprise", "Son accès auprès des étudiants se dégrade"], "a": 3, "k": "Le programme d'échange d'étudiants entre les universités européennes a du plomb dans l'aile.", "_sources": ["test2#22"]}, {"t": "L'institution scolaire devra sans cesse être défendue, ne serait-ce que parce que la « société civile » n'aura sans cesse de vouloir assujettir l'école à ses demandes particulières. Il faut sans cesse rappeler, par exemple, que les règles de l'école ne sont pas celles de la maison. Car l'enfant n'y est plus seulement un enfant. Il y est un élève. A l'école, on ne se préoccupe plus du confort et de l'affection pour l'enfant. On s'adresse à l'intelligence de l'élève. Le rapport maitre/ élève n'est d'ailleurs pas un rapport affectif : on ne demande pas à un professeur d'être sympathique. On lui demande d'être exigeant et juste.", "q": "Quelle est l'opinion de l'auteur ?", "c": ["L'ambiance de l'école doit être calquée sur le modèle familial", "L'autorité du professeur doit être compensée par sa gentillesse", "L'épanouissement de l'enfant doit primer sur sa réussite", "L'impartialité doit être l'une des qualités principales d'un maître"], "a": 3, "k": "On lui demande d'être exigeant et juste.", "_sources": ["test2#28"]}, {"t": "L'Education nationale française vient d'inscrire aux programmes scolaires une initiation à la programmation informatique, appelée « code ». le but n'est pas de faire de tous les enfants des informaticiens mais il est clair que se limiter à être uniquement un utilisateur passif constituera, par la suite, un handicap professionnel. Le chantier est immense car il faut introduire cette nouvelle matière sans compter sur suffisamment de professeurs formés pour cela. En effet, la vitesse à laquelle les technologies numériques ont changé a été bien supérieure à celle de l'évolution de la formation des équipes pédagogiques.", "q": "Qu'apprend-on au sujet de l'enseignement du code à l'école ?", "c": ["Les enfants ont des difficultés de concentration dans ce domaine", "Les équipements informatiques des écoles sont devenus obsoletes", "Les établissements connexion illimitée doivent se doter d'une", "Les professeurs avec les compétences nécessaires sont rares"], "a": 3, "k": "il faut introduire cette nouvelle matière sans compter sur suffisamment de professeurs formés", "_sources": ["test3#25"]}, {"t": "Suite au peu d'intérêt porté à la formation professionnelle à Montréal, cinq comités scolaires ont décidé de lancer un projet pour encourager les élèves à choisir cette voie plutôt que celle des études longues. Ils ont ainsi créé un guide organisationnel et pédagogique régional, un outil qui servira aux enseignants à faire connaitre aux élèves les différentes possibilités de carrière dans la formation en apprentissage « D'ici dix ans, 30% des besoins de main-d'œuvre vont exiger des compétences professionnelles. Pas de diplômes universitaires ! » a rappelé Antonio Bernardelli, l'un des principaux créateurs du projet.", "q": "Quel est l'objectif de ce guide ?", "c": ["Faire la promotion de l'apprentissage d'un métier auprès des jeunes.", "Former les professeurs à de nouvelles méthodes d'enseignement", "Présenter les opportunités de stage en entreprise dans la région", "Proposer aux étudiants des stratégies de recherche d'emploi."], "a": 0, "k": "encourager les élèves à choisir cette voie plutôt que celle des études longues.", "_sources": ["test3#26"]}, {"t": "L'éducation nationale française vient d'inscrire aux programmes scolaires une initiation à la programmation informatique, appelée « code ». Le but n'est pas de faire de tous les enfants des informaticiens mais il est clair que se limiter à être uniquement un utilisateur passif constituera, par la suite, un handicap professionnel. Le chantier est immense car il faut introduire cette nouvelle matière sans compter sur suffisamment de professeurs formés pour cela. En effet, la vitesse à laquelle les technologies numériques ont changé a été bien supérieure à celle de l'évolution de la formation des équipes pédagogiques.", "q": "Qu'apprend-on au sujet de l'enseignement du code à l'école ?", "c": ["Les enfants ont des difficultés de concentration dans ce domaine.", "Les équipements informatiques des écoles sont devenus obsolètes.", "Les établissements doivent se doter d'une connexion illimitée.", "Les professeurs avec les compétences nécessaires sont rares."], "a": 3, "k": "il faut introduire cette nouvelle matière sans compter sur suffisamment de professeurs formés pour cela", "_sources": ["test5#25"]}, {"t": "Futur manager, soyez gentil !\n\nDepuis les scandales des traders, les grandes écoles ont été mises au ban des accusés: ce qu'elles transmettaient se limitait à du savoir technique, directement exploitable par les entreprises. Myopie sociale et absence d'esprit critique menaçaient les futurs managers du monde économique. L'éthique est maintenant à la mode dans toutes les grandes écoles de management. Il n'y est question que de « social business » ou de « développement durable». A côté des activités associatives traditionnelles, les actions humanitaires ont fleuri et de plus en plus d'étudiants s'y  investissent chaque année. Désormais, un étudiant doit avoir fait du soutien scolaire en banlieue ou monté du microcrédit en Afrique.", "q": "D'après ce texte, Quelle est la nouvelle orientation des grandes écoles ?", "c": ["Créer des partenaires avec le milieu associatif", "Former des jeunes défavorisés au management", "Intégrer des valeurs sociales et environnementales", "Préparer des techniciens aux dangers de la finance"], "a": 2, "k": "L'éthique est maintenant à la mode dans toutes les grandes écoles de management.", "_sources": ["test5#26"]}, {"t": "L'institution scolaire devra sans cesse être défendue, ne serait-ce que parce que la «société civile» n'aura de cesse de vouloir assujettir l'école à ses demandes particulières. Il faut sans cesse rappeler, par exemple, que les règles de l'école ne sont pas celles de la maison. Car l'enfant n'y est plus seulement un enfant, il y est un élève. À l'école, on ne se préoccupe plus du confort et de l'affection pour l'enfant. On s'adresse à l'intelligence de l'élève. Le rapport maître/élève n'est d'ailleurs pas un rapport affectif on ne demande pas à un professeur d'être sympathique. On lui demande d'être exigeant et juste.", "q": "Quelle est l'opinion de l'auteur ?", "c": ["L'ambiance de l'école doit être calquée sur le modelé familial", "L'autorité du professeur doit être récompensée par sa gentillesse", "L'épanouissement de l'enfant doit primer sur sa réussite", "L'impartialité doit être l'une des qualités principales d'un maître"], "a": 3, "k": "On lui demande d'être exigeant et juste.", "_sources": ["test5#28"]}, {"t": "Journée « Portes Ouvertes » à Polytech'Tours.\nVenez rencontrer les étudiants, enseignants et associations de Polytech 'Tours le samedi 12 février, de 9h à 16h\nsans interruption\n+ Espaces d'information présents sur les trois sites de l'école\n+ Présentation des études et des métiers d'ingénieur par les responsables des spécialités sur chaque site\n+ Visites guidées des salles de travaux pratiques, des centres de documentation, des laboratoires de recherche et de langues\n+ Démonstrations de projets réalisés dans nos cursus\n+ Présentation des associations étudiantes", "q": "Quel est l'objectif de cette journée ?", "c": ["Découvrir le travail de recherche en laboratoire", "Faire découvrir les formations pour devenir ingénieur", "Inaugurer l'ouverture d'un campus universitaire", "Obtenir des conseils afin de créer une association"], "a": 1, "k": "Présentation des études et des métiers d'ingénieur par les responsables des spécialités", "_sources": ["test6#24"]}, {"t": "L'année dernière, une étude publiée par la revue Nature faisait grand bruit. Menée par une équipe de l'université de Zurich, l'étude montrait qu'une odeur d'ocytocine diffusée lors d'un entretien avec un banquier pousse les gens à lui confier leur argent !\nL'expérience portait sur 56 personnes qui acceptaient de jouer à un jeu d'argent. On leur donnait une somme et ils devaient dire sils acceptaient ou non de la confier à un banquier après un entretien avec lui. Avant la discussion, la moitié des personnes avaient respiré un spray d'ocytocine hormone connue pour jouer un rôle dans l'établissement des relations interpersonnelles", "q": "Quel est le but de cette expérience ?", "c": ["Apprendre à gérer une entrevue importante avec un banquier.", "Déterminer le lien, positif ou non, que les gens ont avec l'argent.", "Identifier les conditions et facteurs d'addiction aux jeux de hasard.", "Montrer l'importance de la chimie dans les rapports humains."], "a": 3, "k": "une odeur d'ocytocine diffusée lors d'un entretien avec un banquier pousse les gens à lui confier leur argent", "_sources": ["test7#22"]}, {"t": "Dans le monde de l'éducation, la mode est au ludique.\n\nPas une description d'un nouveau matériel informatique sans l'utilisation de cet adjectif miraculeux. N'ayant rien de mieux à offrir, les publicitaires insistent sur le côté ludique et neutre de leur matériel, sous-entendant ainsi que les difficultés des enfants sont liées uniquement au côté poussiéreux de la présentation d'exercices et à l'ennui qu'ils suscitent. En changeant l'apparence, on suscitera l'intérêt et la réussite sera assurée. La rééducation risque d'être perçue comme la modernisation de la pédagogie sans autre questionnement sur l'échec de la pédagogie traditionnelle.", "q": "Que reproche l'auteur du texte à la mode du ludique ?", "c": ["Elle demande des connaissances techniques poussées.", "Elle empêche les jeunes utilisateurs de se concentrer.", "Elle masque les problèmes pédagogiques essentiels.", "Elle sert sans succès d'argument commercial"], "a": 2, "k": "La rééducation risque d'être perçue comme la modernisation de la pédagogie", "_sources": ["test8#24"]}, {"t": "Futur manager, soyez gentil !\n\nDepuis les scandales des traders, les grandes écoles ont été mises au banc des accusés : ce qu'elles transmettaient se limitait à du savoir technique, directement exploitable par les entreprises. Myopie sociale et absence d'esprit critique menaçaient les futurs managers du monde économique. L'éthique est maintenant à la mode dans toutes les grandes écoles de management. Il n'y est question que de « SOCIAL busines » ou de « développement durable ». À côté des activités associatives traditionnelles, les actions humanitaires ont fleuri et de plus en plus d'étudiants s'y investissent chaque année. Désormais, un étudiant doit avoir fait du soutien scolaire en banlieue ou monté du microcrédit en Afrique.", "q": "D'après ce texte, quelle est la nouvelle orientation des grandes écoles ?", "c": ["Créer des partenariats avec le milieu associatif.", "Former des jeunes défavorisés au management.", "Intégrer des valeurs sociales et environnementales.", "Préparer des techniciens aux dangers de la finance."], "a": 2, "k": "L'éthique est maintenant à la mode dans toutes les grandes écoles de management", "_sources": ["test10#25"]}, {"t": "Dans sa lutte constante contre l'analphabétisme, l'association Au Cœur des Mots innove cette année en mettant sur pied son centre de livres d'occasion à emprunter : La Bouquinerie. Cet espace réunira des livres de seconde main, dons de particuliers ou d'institutions. En plus d'être un loisir merveilleux, la lecture est à la base de tous les apprentissages et il est important de communiquer ce plaisir au plus grand nombre de personnes possible. La Bouquinerie permettra donc de promouvoir la lecture et de la rendre accessible à tous.", "q": "Quel est le projet de l'association Au Cœur des Mots ?", "c": ["Animer des lectures publiques.", "Faire la promotion d'un club de lecteurs.", "Ouvrir une bibliothèque pour tous.", "Publier une méthode pour apprendre à lire."], "a": 2, "k": "promouvoir la lecture et de la rendre accessible à tous.", "_sources": ["test11#24"]}, {"t": "Tony Schlink, l'homme qui aime la laine !\nL'histoire ne sera sans doute jamais si ce généticien, enfant, a été traumatisé par le port de vêtements trop petits. Tristement rétrécis après un lavage. Devenu depuis chercheur, il vient d'identifier un gène du mouton responsable de la modification des fibres de laine. C'est une caractéristique qui peut être modifiée en sélectionnant les animaux lors de la reproduction, permettant ainsi aux éleveurs d'identifier, puis de sélectionner les moutons qui produisent naturellement une laine enfin susceptible de supporter le lavage en machine.", "q": "Après quelle découverte le chercheur Tony Schlink est-il devenu célèbre ?", "c": ["Il a découvert une nouvelle race de mouton.", "Il a perfectionné une machine à laver la laine.", "Il a trouvé les causes du rétrécissement de la laine.", "Il a identifié une nouvelle façon de produire de la laine."], "a": 2, "k": "il vient d'identifier un gène du mouton responsable de la modification des fibres de laine", "_sources": ["test12#21"]}, {"t": "« Le Capacabana »,\nRestaurant brésilien.\nC'est un grand espace bien insonorisé qui offre l'ambiance et les spécialités gastronomiques du brésil à des prix abordables. La décoration baroque est un des éléments qui permet de créer cette ambiance exotique et originale. Les musiciens, qui viennent directement du Brésil, se produisent ici devant un public toujours aussi nombreux et fidèle. Aussi faut- il réserver une table à l'avance pour éviter la file d'attente à l'entrée de l'établissement. On peut d'ailleurs s'étonner que l'endroit soit si populaire avec un accueil si éloigné de la convivialité latino.", "q": "Quelle critique est faite à ce restaurant ?", "c": ["La salle a besoin d'une rénovation complète.", "Le personnel manque de chaleur et d'amabilité.", "Les artistes jouent trop fort pour le lieu.", "Les tarifs sont élevés une cuisine ordinaire."], "a": 1, "k": "un accueil si éloigné de la convivialité latino", "_sources": ["test12#24"]}, {"t": "À l'école de chiens guides d'aveugles de l'Ouest, nos amis à quatre pattes bénéficient depuis juin dernier de conditions d'apprentissage plus propices avec la création d'un parcours permettant de repérer les obstacles présents dans la vie quotidienne. L'association, forte d'une trentaine de salariés, procédé à la remise annuelle de 30 à 40 chiens guides d'aveugles et compte aujourd'hui sur une soixantaine de familles bénévoles pour pré éduquer les chiens « C'est toujours insuffisant », estime Christine Vaillant, qui recherche de nouveaux maitres, en maison ou en appartement, disponible un an minimum et très motivé. Les frais vétérinaires, alimentaires et matériels sont pris en charge par l'établissement.", "q": "De quoi se plaint Christine Vaillant ?", "c": ["Du manque de salariés motivés.", "Du manque de moyens financiers.", "Du manque de chiens à former.", "Du manque de familles d'accueil."], "a": 3, "k": "C'est toujours insuffisant", "_sources": ["test12#26"]}, {"t": "Monsieur,\nLe règlement de votre facture du mois dernier ne nous est pas encore parvenu. Peut-être avez-vous effectué ce paiement très récemment ? Dans ce cas, nous vous en remercions et nous vous prions de ne pas tenir compte de ce courrier. S'il s'agit d'un simple oubli, adressez-nous votre règlement à l'aide du coupon-réponse. Pour toute autre raison, contactez rapidement votre conseiller clientèle. Il vous renseignera sur votre facture ainsi que sur les moyens de paiement.\nNous vous prions d'agréer, Monsieur, nos sincères salutations.\nLe responsable clientèle.", "q": "Que contient ce courrier ?", "c": ["A) Un rappel d'un impayé en cours.", "B) Une facture à payer rapidement.", "C) Une proposition de paiement différé.", "D) Une erreur de règlement."], "a": 0, "k": "Le règlement de votre facture du mois dernier ne nous est pas encore parvenu", "_sources": ["test13#25"]}, {"t": "L'éthique, nouveau critère d'attractivité\nDiversité, handicap, éthique, développement durable... Autant de grands enjeux sociétaux englobés sous le terme de « responsabilité sociale de l'entreprise » (RSE). Suivant sa définition, la « RSE » repose sur trois piliers : les problématiques sociales, environnementales et économiques. En amont du marché du travail, les écoles n'échappent pas à ces obligations.\nLa RSE couvre les actions en faveur des lycéens issus de zones défavorisées, grâce à un tutorat proposé en classe de première et de terminale. Elle couvre aussi le champ humanitaire. Ses enjeux sont finalement proches des questions chères à la jeunesse. On comprend pourquoi les écoles, bien conscientes de l'attractivité exercée par la RSE, multiplient les initiatives dans le domaine.", "q": "Comment le texte justifie-t-il l'attrait qu'exerce la RSE auprès des écoles ?", "c": ["A) Elle favorise l'orientation des élèves après l'obtention du baccalauréat.", "B) Elle permet de renforcer les liens éducatifs entre adultes et élèves.", "C) Elle répond de manière pertinente aux difficultés et aux aspirations des élèves.", "D) Elle veille à la concrétisation des projets professionnels des élèves."], "a": 2, "k": "Ses enjeux sont finalement proches des questions chères à la jeunesse", "_sources": ["test13#26"]}, {"t": "Vous cherchez un contrat à durée indéterminée avec un salaire motivant et fixe ?\nDans le cadre du lancement d'une cellule de télévente, la société Adem recrute 12 télévendeurs confirmés. Si vous êtes un commercial, si vous êtes dynamique et motivé, contactez-nous : Job@ adem.fr", "q": "La société Adem recherche de télévendeurs …", "c": ["Qui débutent dans le métier de la télévente", "Qui ont de l'expérience dans la télévente", "Qui sont intéressés par un salaire modulable", "Qui recherche un contrat de courte durée"], "a": 1, "k": "la société Adem recrute 12 télévendeurs confirmés", "_sources": ["test14#21"]}, {"t": "Journée « Portes Ouvertes » à Polytech Tours.\nVenez rencontrer les étudiants, Enseignants et Associations de Polytech Tours\nLe samedi 12 février, De 9h à 16h sans interruption\n• Espaces d'information présents sur les trois sites de l'école.\n• Présentation des études et des métiers d'ingénieur par les responsables des spécialités sur chaque site.\n• Visites guidées des salles de travaux pratiques, des centres de documentation, des laboratoires de recherche et de langues.\n• Démonstration des projets réalisés dans nos cursus.\n• Présentation des associations étudiantes.", "q": "Quel est l'objectif de cette journée ?", "c": ["Découvrir le travail de recherche en laboratoire.", "Faire découvrir les formations pour devenir ingénieur.", "Inaugurer l'ouverture d'un campus universitaire.", "Obtenir des conseils afin de créer une association."], "a": 1, "k": "Présentation des études et des métiers d'ingénieur", "_sources": ["test15#26"]}], "devoirs": [{"t": "Une enquête réalisée auprès de professeurs révèle que le manuel scolaire numérique est préféré pour l'étude d'images, de photos, de cartes... Au contraire, le papier est privilégié pour la réalisation d'exercices, l'étude de textes et les évaluations. Les professeurs choisissent ainsi l'outil le mieux adapté à leurs besoins. Par ailleurs, les enseignants voient le manuel numérique comme un moyen de capter l'attention des élèves et d'améliorer la participation en classe.", "q": "Quelle information donne cette enquête sur les pratiques des enseignants ?", "c": ["Ils alternent les supports selon le type d'activité.", "Ils hésitent à utiliser les techniques informatiques.", "Ils optent toujours pour des ouvrages imprimés.", "Ils tiennent compte des progrès des apprenants."], "a": 0, "k": "Les professeurs choisissent ainsi l'outil le mieux adapté à leurs besoins", "_sources": ["test15#27"]}, {"t": "Dans cette belle institution qu'est l'Éducation nationale, ce sont les profs qui font tourner la boutique. Ce sont eux qui, chaque jour, nourrissent intellectuellement ceux qui feront la France de demain. Sans eux et leur amour du métier, l'école française se serait effondrée depuis belle lurette et ferait encore moins bien que ses résultats actuels. Notre journal veut donc leur dire merci en publiant quelques portraits et en vous demandant de nous signaler d'autres « héros de l'école »\nEnvoyez-nous vos messages, nous les publierons", "q": "D'après ce texte, quel rôle jouent les enseignants dans l'institution scolaire ?", "c": ["Ils influencent les élèves au-delà de la classe", "Ils installent le goût du travail en équipe", "Ils permettent au système de se maintenir", "Ils suscitent de nombreuses vocations"], "a": 2, "k": "Sans eux et leur amour du métier, l'école française se serait effondrée", "_sources": ["test17#25"]}, {"t": "Une enquête réalisée auprès des professeurs révèle que le manuel scolaire numérique est préféré pour l'étude d'images, de photos, de cartes … Au contraire, le papier est privilégié pour la réalisation d'exercices, l'étude de textes et les évaluations. Les professeurs choisissent ainsi l'outil le mieux adapté à leurs besoins. Par ailleurs, les enseignants voient le manuel numérique comme un moyen de capter l'attention des élèves et d'améliorer la participation en classe.", "q": "Quelle information donne cette enquête sur les pratiques des enseignants ?", "c": ["Ils alternent les supports selon le type d'activité", "Ils hésitent à utiliser les techniques informatiques", "Ils optent toujours pour des ouvrages imprimés", "Ils tiennent compte des progrès des apprenants"], "a": 0, "k": "Les professeurs choisissent ainsi l'outil le mieux adapté à leurs besoins", "_sources": ["test17#26"]}, {"t": "L'école doit être un lieu d'apprentissage et de culture, où les élèves acquièrent des connaissances et des compétences qui leur serviront tout au long de leur vie. Il ne faut pas confondre l'école avec un lieu de divertissement ou de loisir, où les élèves viennent pour se distraire ou se reposer. L'école exige un travail sérieux et régulier, ainsi qu'un respect des règles et des personnes. Le rôle du professeur n'est pas de plaire aux élèves ou de les flatter, mais de les guider et de les évaluer.", "q": "Quelle est l'idée principale du texte ?", "c": ["L'école est un lieu d'ennui et de contrainte", "L'école est un lieu de formation et d'éducation", "L'école est un lieu d'amusement et de détente", "L'école est un lieu de conflit et de violence"], "a": 1, "k": "L'école doit être un lieu d'apprentissage et de culture", "_sources": ["test17#28"]}, {"t": "La revue Science et Avenir cite une étude de l'université de Cambridge dans laquelle des chercheurs en psychologie et en éducation rapportaient les attitudes des écoliers à l'égard des mathématiques. Les scientifiques décrivent chez les petits Britanniques un sentiment de dégoût, de frustration ou de peur. Des observations qui reflètent exactement ce qui se passe en France. De nombreux enfants sont confrontés à un véritable blocage en manifestant tous les signes du stress, ce qui entraîne des effets négatifs sur les fonctions cognitives. Selon certains professeurs, les mathématiques apparaissent beaucoup trop techniques et déconnectées du monde qui nous entoure, alors que pour réconcilier les écoliers avec les maths, il faudrait les enseigner comme un outil de réflexion ancré dans le quotidien.", "q": "Qu'explique ce texte à propos de l'enseignement des mathématiques ?", "c": ["De nouvelles pédagogies semblent nécessaires.", "Il conviendrait d'améliorer les résultats des élèves.", "L'Europe doit engager une réforme des programmes.", "Un soutien scolaire journalier serait bénéfique."], "a": 0, "k": "pour réconcilier les écoliers avec les maths, il faudrait les enseigner comme un outil de réflexion ancré dans le quotidien.", "_sources": ["test20#26", "test33#26"]}, {"t": "Dans le monde de l'éducation, la mode est au « Ludique »\nPas de description d'un nouveau matériel informatique, mais l'utilisation de cet adjectif miraculeux, n'ayant rien de mieux à offrir, les publicitaires insistent sur le côté « ludique » et neutre de leur matériel, sous-entendant ainsi que les difficultés des enfants sont liées uniquement au côté poussiéreux de la présentation d'exercices et à l'ennui qu'ils suscitent. En changeant l'apparence, on suscitera l'intérêt et la réussite sera assurée. La rééducation risque d'être perçue comme la modernisation de la pédagogie sans autre questionnement sur l'échec de la pédagogie traditionnelle.", "q": "Que reproche l'auteur du texte à la mode du ludique ?", "c": ["Elle demande des connaissances techniques poussées.", "Elle empêche les jeunes utilisateurs de se concentrer.", "Elle masque les problèmes pédagogiques essentiels.", "Elle sert sans succès d'argument commercial."], "a": 2, "k": "sans autre questionnement sur l'échec de la pédagogie traditionnelle", "_sources": ["test21#22"]}, {"t": "Les conséquences de l'analphabétisme sont profondes, au point qu'elles peuvent mettre la vie en danger. Elles s'enracinent dans le refus d'un droit humain fondamental : le droit à l'éducation. À l'échelle de la société, dénier le droit à l'éducation c'est hypothéqué le progrès démocratique et social – et par conséquent, la paix et la sécurité internationale. En empêchant les enfants de se développer pleinement, l'analphabétisme sème d'embûches leur chemin vers l'âge adulte et rend encore plus difficile leur compréhension du monde dans sa diversité aussi bien que des valeurs de paix et d'égalité entre les personnes.\nL'analphabétisme prive également l'individu d'autres joies, comme celle de la culture et de l'art en général.", "q": "Selon ce texte, que favorise le respect du droit à l'éducation ?", "c": ["La constitution d'une culture nationale.", "La stimulation de la croissance économique.", "L'amélioration des comportements sanitaires.", "Le développement d'une conscience civique."], "a": 3, "k": "le progrès démocratique et social", "_sources": ["test21#28"]}, {"t": "Naya a rejoint le lycée agricole de Valdoie en janvier. Cette chienne, appartenant au documentaire de l'établissement, est l'un des seuls animaux de compagnie présents en France en milieu scolaire. Si elle est dans les locaux du lycée, ce n'est pas par hasard : l'établissement a décidé de l'associer à part entière à son projet pédagogique. « Elle apporte une présence apaisante et permet aux élèves de tisser un lien, au lieu d'être sur leur téléphone portables, ils dialoguent beaucoup avec elle. » D'autres part, Naya s'est fait des copains pour se promener, pour jouer, pour être câlinée, pour causer…et tous respectent son sommeil.", "q": "Quel est l'intérêt de la présence de NAYA ?", "c": ["Aider les élèves en situation de handicap.", "Améliorer les relations au sein du lycée.", "Expérimenter une méthode pédagogique.", "Renforcer la sécurité de l'établissement."], "a": 1, "k": "permet aux élèves de tisser un lien", "_sources": ["test23#25"]}, {"t": "Supprimer les concours des grandes écoles ? Changer nos élites ? Le débat a ouvert grand la porte aux envies de bousculer la formation de la jeunesse. Pendant longtemps, on a cru que les concours étaient d'indépassables garants de l'idéal républicain d'égalité. On a mis beaucoup de temps à se rendre compte qu'ils pouvaient entretenir la reproduction des élites. Ou écarter insidieusement une partie des jeunes, en fonction de leur origine sociale, voire ethnique. De ce constat, certains déduisent qu'il faut introduire des discriminations positives au sein des concours existants.", "q": "Qu'apprend-on sur les concours ?", "c": ["Ils perpétuent une forme d'exclusion.", "Le nombre de candidats s'amenuise.", "Leur niveau d'exigence diminue.", "On les réforme régulièrement."], "a": 0, "k": "écarter insidieusement une partie des jeunes", "_sources": ["test23#28"]}, {"t": "Elle écrivait récemment sa dernière chronique, lancée comme un appel à la résistance. « Je m'en vais et je pense que vous devriez me rejoindre... ». La journaliste Kelly H. annonçait trois choses : qu'elle démissionnait après une longue carrière dans un prestigieux quotidien, qu'elle devenait professeure de mathématiques et qu'elle créait une fondation pour encourager d'anciens entrepreneurs à devenir enseignant. « Vous avez eu une carrière à succès. Maintenant, faites quelque chose de plus important ! Enseignez ! », En tant que journaliste, elle avait effectué des enquêtes sur la vie des cadres supérieurs en ridiculisant le plus souvent l'engouement pour les concepts managériaux en vogue et en soulignant les crises existentielles des cadres.", "q": "Quelle est la nouvelle priorité de Kelly H. ?", "c": ["Changer la façon de gérer des équipes.", "Compenser le manque de formateurs.", "Réussir au sein d'une société.", "Transmettre des connaissances."], "a": 3, "k": "encourager d'anciens entrepreneurs à devenir enseignant", "_sources": ["test24#28"]}, {"t": "Nous vous rappelons que la présence d'élèves de moins de seize ans en milieu professionnel est autorisée, dès lors qu'ils restent sous l'autorité de l'établissement d'enseignement scolaire ou de l'école. Tous les stages ou les périodes de formation en milieu professionnel ne peuvent s'adresser qu'à des élèves qui suivent un enseignement alterné ou un enseignement professionnel. Les stages ne peuvent être proposés qu'à des élèves âgés de quatorze ans au moins, comme le précise l'article 8 du décret n° 96-465 du 29 mai 1996 relatif à l'organisation de la formation au collège.", "q": "Quel est l'objectif de cet article adressé aux enseignants ?", "c": ["Définir les conditions d'accueil des élèves en milieu professionnel.", "Expliquer le déroulement des stages en entreprise pour les élèves.", "Informer des mesures de sécurité des élèves lors de visites d'entreprises.", "Lister les différents types de stages professionnels destinés aux élèves."], "a": 0, "k": "la présence d'élèves de moins de seize ans en milieu professionnel est autorisée", "_sources": ["test26#23"]}, {"t": "C'est un fait majeur dans l'histoire du français : la France est devenue minoritaire en nombre de locuteurs dans le monde francophone. Ce qui vaut mieux que de faire partie des 2 000 langues qui, par les hasards de l'histoire et des rapports de force, risquent d'avoir disparu d'ici à la fin du siècle. En revanche, nous allons devoir abandonner certaines de nos postures traditionnelles. Et ce pour une raison simple : le français ne dépend pas seulement d'une élite intellectuelle, écrivains, enseignants ou académiciens, mais surtout de ses locuteurs. Aussi la langue va-t-elle nécessairement s'ouvrir davantage. Il semble acquis en tout cas que l'origine de la norme va se déplacer des rives de la Seine au vaste monde, sachant qu'il s'agit là d'un enrichissement et non d'une perte.", "q": "Comment l'auteur voit-il l'évolution du français ?", "c": ["Elle est dépendante de décisions politiques.", "Elle est limitée par les intellectuels.", "Elle est menacée par l'essor d'autres langues.", "Elle est modelée par ses locuteurs."], "a": 3, "k": "le français ne dépend pas seulement d'une élite intellectuelle… mais surtout de ses locuteurs", "_sources": ["test27#26"]}, {"t": "L'alliance française de Bordeaux recherche : un(e) professeur(e) de français langue étrangère. Vous assurerez les cours de français pour tous niveaux. Le public se compose d'élèves de tous âges. Les cours ont lieu de 15 h 00 à 21 h 00 (du lundi au jeudi). Matinées et vendredis libres. Possibilités d'heures supplémentaires en cours particuliers.\nRémunération : à débattre, en fonction de l'expérience.\nProfil : titulaire d'un diplôme d'enseignement de français langue étrangère, dynamique et motivé(e). Capacité à travailler en équipe. Une expérience auprès d'enfants serait un plus.", "q": "Quelles sont les conditions d'embauche ?", "c": ["Avoir une expérience dans l'enseignement.", "Être impérativement disponible le matin.", "Être titulaire d'une formation reconnue.", "Pouvoir travailler en totale autonomie."], "a": 2, "k": "titulaire d'un diplôme d'enseignement de français langue étrangère", "_sources": ["test28#23"]}, {"t": "En France, ce sont majoritairement les enfants des classes sociales favorisées qui accèdent aux études supérieures, quand ceux des classes moyennes et modestes en sont largement écartés, diminuant ainsi leurs chances d'accès aux postes à responsabilités et aux salaires qui en découlent. Si l'école ne peut être tenue pour responsable de cette situation, il n'en demeure pas moins qu'elle ne permet pas aux élèves des classes modestes de compenser les faiblesses de l'environnement social et familial dont on connaît l'impact majeur sur la réussite scolaire. C'est pourquoi nous devons examiner comment l'école peut être sa propre ressource afin de garantir une démocratisation de la réussite scolaire, aujourd'hui réservée de fait à quelques-uns.", "q": "Selon l'auteur, que devrait faire l'école ?", "c": ["Allouer une bourse aux plus modestes.", "Épauler les familles en difficulté.", "Favoriser l'égalité des chances.", "Garantir une pédagogie différenciée."], "a": 2, "k": "garantir une démocratisation de la réussite scolaire, aujourd'hui réservée de fait à quelques-uns.", "_sources": ["test28#24"]}, {"t": "Minoritaires au sein des filières scientifiques universitaires et dans les écoles d'ingénieurs, les filles sont de plus en plus nombreuses à suivre des études de médecine. Elles représentent désormais près de 70% des inscrits en première année. Attirance pour le secteur sanitaire et social, plus grande motivation et maturité sont des raisons invoquées pour expliquer cette forte féminisation de la profession. Mais l'origine de l'élève en médecine a peu changé : 40% de ces étudiants ont des parents-cadres supérieurs ou exerçant une profession libérale - contre 30% à l'université. Des chiffres stables qui en font une des formations les plus clivées socialement, derrière les classes préparatoires aux grandes écoles.", "q": "Que constate le journaliste à propos des études de médecine ?", "c": ["Elles ont moins de succès que les cursus scientifiques.", "Elles représentent inégalement les milieux sociaux.", "Elles séduisent des étudiants aux profils variés.", "Elles sont source de discrimination envers les femmes."], "a": 1, "k": "une des formations les plus clivées socialement", "_sources": ["test29#28", "test38#28"]}, {"t": "Le ministère de l'Éducation nationale prépare une campagne promotionnelle afin de revaloriser le métier d'enseignant.\nEn effet, s'il a supprimé des milliers de postes ces dernières années, il peine cependant à embaucher des professeurs. La présidente de la première organisation syndicale enseignante du pays ne décolère pas. « Le ministère prend le Problème à l'envers. Ce n'est pas en faisant de la communication que nous rendrons le métier d'enseignant attractif, proteste la syndicaliste. Comment donner envie aux étudiants de devenir enseignant quand on leur supprime leur formation ?» Pour elle, l'attractivité du métier passe aussi par une revalorisation de la paie. Or, le gouvernement a annoncé un gel des salaires dans la Fonction publique.", "q": "Comment rendre le métier d'enseignant plus attirant ?", "c": ["En limitant la part de l'apprentissage pratique.", "En rendant compréhensibles les décisions politiques.", "En renouvelant les perspectives d'évolution.", "En révisant les conditions de rémunération."], "a": 3, "k": "attractivité du métier passe aussi par une revalorisation de la paie", "_sources": ["test30#25"]}, {"t": "Elle écrivait récemment sa dernière chronique, lancée comme un appel à la résistance. « Je m'en vais et je pense que vous devriez me rejoindre... ». La journaliste Kelly H. annonçait trois choses : qu'elle démissionnait après une longue carrière dans un prestigieux quotidien, qu'elle devenait professeure de mathématiques et qu'elle créait une fondation pour encourager d'anciens entrepreneurs à devenir enseignant. « Vous avez eu une carrière à succès. Maintenant faites quelque chose de plus important ! Enseignez ».", "q": "Quelle est la nouvelle priorité de Kelly H ?", "c": ["Changer la façon de gérer des équipes.", "Compenser le manque de formateurs.", "Réussir au sein d'une société.", "Transmettre des connaissances."], "a": 3, "k": "encourager d'anciens entrepreneurs à devenir enseignant", "_sources": ["test30#28"]}, {"t": "La profession de marionnettiste a bien changé. « C'est un métier qui a beaucoup évolué et qui est devenu un art du théâtre à part entière », explique Lucile Bodson, directrice de l'École supérieure des arts de la marionnette (ESNAM). Et parce que la profession et la technique ont progressé, l'école propose un cursus pluridisciplinaire original. « La formation inclut non seulement les arts plastiques et la construction de marionnettes, le jeu dramatique et la manipulation mais aussi le travail sur la compréhension de la dramaturgie, la réalisation de synopsis, le rapport au corps et à l'espace ainsi que sur l'image », précise la directrice de l'ESNAM.", "q": "Quelle est la particularité de cette école ?", "c": ["Elle associe différentes formes d'expression artistique.", "Elle met l'accent sur la maitrise de la mise en scène.", "Elle propose des stages dans le monde du spectacle.", "Elle s'adresse exclusivement à des acteurs confirmés."], "a": 0, "k": "cursus pluridisciplinaire original", "_sources": ["test32#23"]}, {"t": "Au sein du groupe des 16 - un rassemblement regroupant syndicats enseignants et représentants de parents d'élèves - l'idée d'une journée de grève n'a pas fait l'unanimité. Même si la dernière mobilisation a été bonne, les enseignants regardent désormais à deux fois dans leur portefeuille, avant de sacrifier une journée de salaire. « On a la crainte de ne pas être assez nombreux », reconnaît le co-secrétaire général du Syndicat national des enseignements du second degré. Résultat, une autre forme d'action est à l'étude comme « Les jeudis de l'éducation », un rendez-vous hebdomadaire qui associerait familles et enseignants autour d'une réflexion sur le devenir de l'école.", "q": "Sur quoi les avis de ces acteurs de l'éducation diffèrent-ils ?", "c": ["La mise en œuvre d'une action collective", "La mission des organisations professionnelles", "Le contenu des revendications présentes", "Les orientations pédagogiques à soutenir"], "a": 0, "k": "l'idée d'une journée de grève n'a pas fait l'unanimité", "_sources": ["test32#29"]}, {"t": "Dans cette belle institution qu'est l'Education Nationale, ce sont les profs qui font tourner la boutique. Ce sont eux qui, chaque jour, nourrissent intellectuellement ceux qui feront la France de demain. Sans eux et leur amour du métier, l'école française se serait effondrée depuis belle lurette et ferait encore moins bien que ses résultats actuels. Notre journal veut donc leur dire merci en publiant quelques portraits et en vous demandant de nous signaler d'autres « héros de l'école »\nENVOYEZ-NOUS VOS MESSAGES, NOUS LES PUBLIERONS.", "q": "D'après ce texte, quel rôle jouent les enseignants dans l'institution scolaire ?", "c": ["Ils influencent les élèves au-delà de la classe.", "Ils instillent le goût du travail en équipe.", "Ils permettent au système de se maintenir.", "Ils suscitent de nombreuses vocations."], "a": 2, "k": "ce sont les profs qui font tourner la boutique", "_sources": ["test33#25"]}, {"t": "Supprimer les concours des grandes écoles ? Changera nos élites ? Le débat a ouvert grand la porte aux envies de bousculer la formation de la jeunesse.\nPendant longtemps, on a cru que les concours étaient d'indépassables garants de l'idéal républicain d'égalité. On a mis beaucoup de temps à se rendre compte qu'ils pouvaient entretenir la reproduction des élites ou écarter insidieusement une partie des jeunes, en fonction de leur origine sociale, voire ethnique.\nDe ce constat certains déduisent qu'il faut introduire des discriminations positives au sein des concours existants. Mais il existe une alternative pour répondre rapidement à cette nécessité de démocratisation : reconnaître d'autres compétences dans les processus de sélection comme l'esprit d'entraide, de solidarité et de coopération.", "q": "Qu'apprend-on sur les concours ?", "c": ["Ils perpétuent une forme d'exclusion.", "Le nombre de candidats s'amenuise.", "Leur niveau d'exigence diminue.", "On les réforme régulièrement."], "a": 0, "k": "écarter insidieusement une partie des jeunes", "_sources": ["test33#28"]}, {"t": "Au sein du groupe des 16 - un rassemblement regroupant syndicats, enseignants et représentants de parents d'élèves - l'idée d'une journée de grève n'a pas fait l'unanimité. Même si la dernière mobilisation a été bonne, les enseignants regardent désormais à deux fois dans leur portefeuille, avant de sacrifier une journée de salaire. On a la crainte de ne pas être assez « nombreux », reconnait le Co-secrétaire général du Syndicat national des enseignements du second degré. Résultat, une autre forme d'action est à l'étude comme « Les jeudis de l'éducation » : un rendez-vous hebdomadaire qui associerait familles et enseignants autour d'une réflexion sur le devenir de l'école.", "q": "Sur quoi les avis de ces acteurs de l'éducation diffèrent-ils ?", "c": ["La mise en œuvre d'une action collective", "La mission des organisations professionnelles", "Le contenu des revendications présentées", "Les orientations pédagogiques à soutenir"], "a": 0, "k": "l'idée d'une journée de grève n'a pas fait l'unanimité", "_sources": ["test34#28"]}, {"t": "L'un des grands enjeux de l'enseignement aujourd'hui est la question de la transmission. Elle renvoie à deux problématiques : celle des contenus culturels et celle des valeurs à transmettre. Ainsi, certains insistent sur l'importance de l'acquisition des langages, la maîtrise des connaissances et la découverte des œuvres. D'autres soulignent que l'essentiel est dans l'appropriation des valeurs et le développement de l'autonomie. Or, ces deux volets sont inséparables. En effet, toute transmission de connaissances véhicule, par les choix qu'elle effectue et qui ne sont jamais neutres, des valeurs explicites ou implicites, qui ne sont pas transmissibles sans la médiation de connaissances et sans incarnation dans un contexte historique. Ce qui devient alors essentiel, c'est la cohérence entre ces deux dimensions.", "q": "Qu'explique l'auteur sur l'enseignement des valeurs ?", "c": ["Il doit intervenir dès le plus jeune âge.", "Il est indissociable de celui des savoirs.", "Il exige une formation solide des professeurs.", "Il varie selon la politique éducative des pays."], "a": 1, "k": "ces deux volets sont inséparables.", "_sources": ["test35#29"]}, {"t": "L'éthique, nouveau critère d'attractivité.\n\nDiversité, handicap, éthique, développement durable... Autant de grands enjeux sociétaux englobés sous le terme de « responsabilité sociale de l'entreprise » (RSE). Suivant sa définition, la « RSE » repose sur trois piliers : les problématiques sociales, environnementales et économiques. En amant du marché du travail, les écoles n'échappent pas à ces obligations.\n\nLa RSE couvre les actions en faveur des lycéens issus de zones défavorisées, grâce à un tutorat proposé en classe de première et de terminale. Elle couvre aussi le champ humanitaire. Ses enjeux sont finalement proches des questions chères à la jeunesse. On comprend pourquoi les écoles, bien conscientes de l'attractivité exercée par la RSE, multiplient les initiatives dans le domaine.", "q": "Comment le texte justifie-t-il l'attractivité qu'exerce la RSE auprès des écoles ?", "c": ["Elle favorise l'orientation des élèves après l'obtention du baccalauréat.", "Elle permet de renforcer les liens éducatifs entre adultes et élèves.", "Elle répond de manière pertinente aux difficultés et aux aspirations des élèves.", "Elle veille à la concrétisation des projets professionnels des élèves."], "a": 2, "k": "Ses enjeux sont finalement proches des questions chères à la jeunesse.", "_sources": ["test39#26"]}, {"t": "Dans le monde de l'éducation, la mode est au\n« Ludique »\n\nPas une description d'un nouveau matériel informatique sans l'utilisation de cet adjectif miraculeux. N'ayant rien de mieux à offrir, les publicitaires insistent sur le côté « ludique » et neutre de leur matériel, sous-entendant ainsi que les difficultés des enfants sont liées uniquement au côté poussiéreux de la présentation d'exercices et à l'ennui qu'ils suscitent. En changeant l'apparence, on suscitera l'intérêt et la réussite sera assurée. La rééducation risque d'être perçue comme la modernisation de la pédagogie sans autre questionnement sur l'échec de la pédagogie traditionnelle.", "q": "Que reproche l'auteur du texte à la mode du ludique ?", "c": ["Elle demande des connaissances techniques poussées.", "Elle empêche les jeunes utilisateurs de se concentrer.", "Elle masque les problèmes pédagogiques essentiels.", "Elle sert sans succès d'argument commercial."], "a": 2, "k": "La rééducation risque d'être perçue comme la modernisation de la pédagogie sans autre questionnement sur l'échec de la pédagogie traditionnelle.", "_sources": ["test40#22"]}]}, "VieQuotidienne": {"cours": [{"t": "Elle devait être démolie et un nouveau lieu de culte reconstruit à l'arrière de l'église actuelle, le long du boulevard. Le projet qui prévoyait la restructuration complète de l'ilot avec la création de logements sociaux, ne verra finalement pas le jour. La ville et le diocèse ont pris la décision de conserver l'église Sainte-madeleine considérant avec certains experts que sa démolition aurait causé la perte regrettable d'un élément important du patrimoine nantais. Des travaux d'urgence vont être réalisés avant le lancement d'un véritable programme de restauration et de mise en valeur du bâtiment.", "q": "Selon cet article, quelle décision a été prise ?", "c": ["Bâtir une église identique dans le quartier", "Débuter le réaménagement du boulevard", "Entreprendre une rénovation du lieu", "Réhabiliter les logements sociaux existants"], "a": 2, "k": "Des travaux d'urgence vont être réalisés avant le lancement d'un véritable programme de restauration", "_sources": ["test1#23"]}, {"t": "Les gens empilaient les objets dans les chariots de métal, avec frénésie. Ils avaient des visages sérieux, contractés, et leurs paupières battaient de façon anormalement lente. Les femmes tendaient les mains vers les étals. On aurait dit que les gens ne savaient plus ce qu'ils faisaient. Comment l'auraient-ils su ? ce n'étaient pas eux qui saisissaient la marchandise. C'est la marchandise qui se collait d'elle-même à leurs mains, elle entrait directement dans les caddies. La nourriture n'était plus que des formes, et des couleurs rouge, blanche, verte, orange, les yeux avaient faim, des sphères et des pyramides, faim de plastiques lisses et de capsules de fer-blanc.", "q": "Dans cet extrait, qu'apprend-on sur les acheteurs ?", "c": ["Ils donnent l'impression de vénérer les produits", "Ils ont l'air éblouis par le gigantisme des magasins", "Ils paraissent manipulés par une force supérieure", "Ils semblent perdus dans le labyrinthe des rayons"], "a": 2, "k": "ce n'étaient pas eux qui saisissaient la marchandise. C'est la marchandise qui se collait d'elle-même à leurs mains", "_sources": ["test1#29", "test22#29"]}, {"t": "La Maison de Campagne :\nCe restaurant offre à sa clientèle un bel espace articulé en trois salles : cuisine, salle à manger et salon, décorées dans un joli style provençal. On choisit même sa bouteille de vin à la cave, comme à la maison ! Malheureusement, bien que les plats proposés soient élaborés à partir de produits frais sélectionnés au marché, la cuisine reste une cuisine vue et revue, tellement prévisible qu'il vaudra mieux choisir un restaurant en ville plutôt que se perdre dans cette campagne-là.", "q": "Sur quel point porte la critique négative faite à ce restaurant ?", "c": ["L'originalité des plats", "La qualité des produits", "Le cadre du restaurant", "Le prix des menus"], "a": 0, "k": "la cuisine reste une cuisine vue et revue, tellement prévisible", "_sources": ["test3#24", "test13#24"]}, {"t": "Le témoignage de Maud est très représentatif de la vie étudiante actuelle :\n« J'ai cherché un logement près de la fac. J'ai trouvé un studio à 600€ par mois. Mon père me donne 500€ par mois. Je dois travailler comme surveillante dans un lycée. Les fins de mois sont difficiles, mais mon dossier d'allocation logement vient d'être accepté. Finalement, j'ai de la chance ! »", "q": "Pourquoi Maud pense-t-elle avoir de la chance ?", "c": ["Elle aura un meilleur pouvoir d'achat sous peu.", "Elle se débrouille sans l'aide de personne.", "Elle trouvera facilement un emploi après l'université", "Elle va habiter près de chez ses parents."], "a": 0, "k": "mon dossier d'allocation logement vient d'être accepté", "_sources": ["test4#25"]}, {"t": "Monsieur Lereux,\nJ'ai l'honneur de vous informer que votre nom a été sélectionné pour « Magasins en fête » !\nDès à présent, rendez-vous dans votre magasin, un bulletin de participation vous sera remis en caisse à partir de 25 euros d'achat !\nC'est la dernière étape, alors n'attendez plus, venez remplir ce bulletin et gagnez un voyage de rêve, ou bien l'un de nos nombreux autres cadeaux !", "q": "Pourquoi Monsieur Lereux doit-il se rendre en magasin ?", "c": ["Pour bénéficier d'une promotion", "Pour participer à la finale d'un jeu", "Pour recevoir un coupon de voyage", "Pour retirer un chèque cadeau"], "a": 1, "k": "un bulletin de participation vous sera remis en caisse à partir de 25 euros d'achat", "_sources": ["test6#22"]}, {"t": "Pendant un an, la journaliste allemande Greta Taubert a décidé de quitter la société de consommation sans quitter son appartement berlinois. Pendant cette expérience, elle a bu, mangé, s'est habillée sans payer : elle a échangé jupes et pantalons avec ses voisines, planté des légumes dans un jardin collectif. Pour ses vacances, elle est allée chez des amis en faisant de l'auto-stop. « Aujourd'hui, je suis contente de ne plus vivre aussi radicalement, c'était difficile mais je cherche à intégrer dans mon quotidien ce que j'ai appris », explique-t-elle.", "q": "Quel est le constat de Greta Taubert après cette expérience?", "c": ["C'est possible à la campagne.", "C'est possible avec du temps.", "C'est possible mais pénible.", "C'est possible pour tous."], "a": 2, "k": "c'était difficile mais je cherche à intégrer dans mon quotidien ce que j'ai appris", "_sources": ["test7#21", "test17#22", "test36#22"]}, {"t": "La voie est libre pour la maire de Paris, mais pas sans embûches. Décidée de déployer 700 km de nouvelles pistes cyclables à Paris d'ici 2020, elle n'entend pas laisser le préfet de police lui mettre des bâtons dans les roues. Or, le préfet tire la sonnette d'alarme, car le projet municipal met en péril la capacité d'intervention de ses services en cas de crise majeure dans certains secteurs de la capitale. Sans nier l'intérêt certain d'une piste cyclable, il estime que restreindre la circulation automobile à une seule file au lieu de deux dans certaines rues aboutira à des phénomènes de congestion inquiétants en cas d'urgence.", "q": "Que reproche le préfet de police au projet de la maire de Paris ?", "c": ["il néglige les commerces dans les rues piétonnes", "il rend difficile l'accès aux secteurs touristiques.", "il répond peu aux besoins en pistes cyclables des habitants.", "il risque d'entraver la circulation des véhicules de secours."], "a": 3, "k": "le projet municipal met en péril la capacité d'intervention de ses services", "_sources": ["test8#22"]}, {"t": "L'abandon de l'énergie nucléaire ne peut s'entreprendre sur la base de motivations uniquement idéologiques et politiques. La question de la substitution des énergies doit être posée préalablement, et particulièrement pour la filière bois.\nCette dernière, à condition d'y être préparée, a vraisemblablement les moyens d'assurer une partie importante de la transition énergétique au moment de l'arrêt progressif des centrales nucléaires.\nDans le cas contraire, la sortie du nucléaire pourrait s'apparenter, contrairement à l'idée communément admise, à un mal pour un mal.", "q": "Quelle est l'idée développée par l'auteur ?", "c": ["Le recours à l'énergie nucléaire sera toujours indispensable.", "Le développement d'autres énergies que le nucléaire est superflu.", "Le renoncement au nucléaire doit être mûrement planifié.", "L'exploitation des forêts peut pallier entièrement le nucléaire."], "a": 2, "k": "La question de la substitution des énergies doit être posée préalablement", "_sources": ["test8#29"]}, {"t": "Selon une analyse approfondie réalisée par l'agence d'urbanisation de la région d'Angers, la périurbanisation gagne du terrain. Ce terme un peu technique désigne l'installation à la campagne de personnes qui travaillent en zone urbaine et y reviennent pour différentes activités et services.\nL'agence mène actuellement une étude sociologique pour mieux comprendre ce qui pousse les habitants à s'éloigner des métropoles. Leurs motivations correspondent souvent au désir d'accéder à la propriété ou de trouver un logement adapté lorsque la famille s'agrandit.", "q": "Quelle est l'une des caractéristiques des « périurbains » ?", "c": ["Ils ont une bonne situation financière.", "Ils pratiquent des loisirs en extérieur.", "Ils se préoccupent de l'environnement.", "Ils se rendent régulièrement en ville."], "a": 3, "k": "travaillent en zone urbaine et y reviennent pour différentes activités et services", "_sources": ["test9#26"]}, {"t": "Pour exprimer notre conception du temps, nous utilisons des métaphores spatiales. Dans toutes les langues connues, le passé est associé à l'espace situé derrière l'individu, et le futur à l'espace situé devant lui. Sauf dans la langue aymara, parlée dans une partie de la Bolivie, du Pérou et du Chili : associé à ce qui est connu par la vue, le passé est situé devant, tandis que le futur, inconnu, est derrière soi. Une enquête de terrain, qui a recoupé les mots et les gestes des locuteurs, a permis de confirmer qu'il s'agit bien d'une façon de penser inverse de la nôtre.", "q": "De quelle particularité de la langue aymara est-il question dans ce texte ?", "c": ["Le temps chronologique est impossible à représenter.", "La notion de projection spatiale a disparu au fil du temps.", "Les différentes expressions du temps ont la même forme linguistique.", "L'expression du temps est opposée à la représentation habituelle."], "a": 3, "k": "il s'agit bien d'une façon de penser inverse de la nôtre", "_sources": ["test10#20"]}, {"t": "Monsieur Lereux\nJ'ai l'honneur de vous informer que votre nom a été sélectionné pour Magasins en fête »!\n\nDès à présent, rendez-vous dans votre magasin, un bulletin de participation vous sera remis en caisse à partir de 25 euros d'achat !\n\nC'est la dernière étape, alors n'attendez plus. Venez remplir ce bulletin et gagnez Un voyage de rêve, ou bien l'un de nos nombreux autres cadeaux !", "q": "Pourquoi Monsieur Lereux doit-il se rendre en magasin ?", "c": ["Pour bénéficier d'une promotion.", "Pour participer à la finale d'un jeu.", "Pour recevoir un coupon de voyage.", "Pour retirer un chèque cadeau."], "a": 1, "k": "un bulletin de participation vous sera remis en caisse", "_sources": ["test10#22"]}, {"t": "Où est la propreté de Paris ?\n\nSelon le maire, la propreté est un enjeu majeur de la vie quotidienne :« Depuis plusieurs mois, de gros efforts ont été entrepris car nous avons davantage de moyens humains et techniques que par le passé. Néanmoins, il y a toujours trop de salissures en tous genres. Le civisme n'est pas toujours au rendez-vous. En dehors de la capacité à nettoyer, il est fondamental de dissuader les gens de salir. Pendant quatre jours, nous serons sur le terrain pour aller à la rencontre des riverains pour les sensibiliser aux enjeux de la propreté »", "q": "Le maire de Paris a décidé…", "c": ["de lutter contre la saleté dans la capitale.", "de proposer plus de moyens à l'avenir.", "de récompenser le civisme des gens.", "d'écouter les plaintes des riverains."], "a": 0, "k": "il est fondamental de dissuader les gens de salir", "_sources": ["test10#23"]}, {"t": "DAGONS CHHOIS A PARIS\nC'est avec enthousiasme que le départ des festivités pour célébrer le Nouvel An chinois a été donné hier à 14h30 sur la place de l'hôtel de Ville. Devant une foule joyeuse, éclairés par de petites lumières rouges, les dragons et les tigres ont commencé leur danse rythmée par les tambours. Si vous avez manqué ce défilé coloré, vous pourrez toujours vous rattraper aujourd'hui, il y en a un autre de prévu à 11h30 au métro Belleville.", "q": "Qu'a-t-on pu voir place de l'hôtel de Ville ?", "c": ["Un marché traditionnel.", "Un spectacle de cirque.", "Une cérémonie officielle.", "Une manifestation culturelle."], "a": 3, "k": "les dragons et les tigres ont commencé leur danse rythmée par les tambours", "_sources": ["test10#28"]}, {"t": "La voie est libre pour la maire de Paris, mais pas sans embûches. Décidée à déployer 700 km de nouvelles pistes cyclables à Paris d'ici 2020, elle n'entend pas laisser le préfet de police lui mettre des bâtons dans les roues. Or, le préfet tire la sonnette d'alarme, car le projet municipal met en péril la capacité d'intervention de ses services en cas de crise majeure dans certains secteurs de la capitale. Sans nier l'intérêt certain d'une piste cyclable, il estime que restreindre la circulation automobile à une seule file au lieu de deux dans certaines rues aboutira « à des phénomènes de congestion inquiétants en cas d'urgence. »", "q": "Que reproche le préfet de police au projet de la maire de Paris ?", "c": ["Il néglige les commerces dans les rues piétonnes.", "Il rend difficile l'accès aux secteurs touristiques.", "Il répond peu aux besoins en pistes cyclables des habitants.", "Il risque d'entraver la circulation des véhicules de secours"], "a": 3, "k": "met en péril la capacité d'intervention de ses services", "_sources": ["test11#22"]}, {"t": "L'huile de palme est l'huile la plus produite au monde.\nUn tiers de nos produits de consommation courante en contiennent. Or, on lui reproche beaucoup de choses. Elle serait responsable du cholestérol. Autre problème, environnemental cette fois : la culture du palmier à huile étant très rentable, les surfaces de plantation ne cessent d'augmenter, souvent en lieu et place des forêts. Il existe pourtant d'autres huiles qui peuvent la remplacer mais c'est une solution plus onéreuse pour les industriels du secteur agro-alimentaire.", "q": "Pourquoi l'huile de palme est-elle produite massivement ?", "c": ["C'est un produit recherché par les consommateurs", "Elle valorise des méthodes agricoles traditionnelles", "Ses qualités nutritionelles sont reconnues", "Son exploitation génère des revenus élevés"], "a": 3, "k": "la culture du palmier à huile étant très rentable", "_sources": ["test14#28"]}, {"t": "Le mystère de la lumière céleste\nUn soir d'été, les habitants d'un petit village ont été surpris par un phénomène étrange. Une lumière bleue et brillante est apparue dans le ciel, au-dessus des montagnes. Elle a duré quelques secondes, puis a disparu sans laisser de trace. Les témoins étaient perplexes et curieux. Certains ont pensé à une étoile filante, d'autres à un ovni, d'autres encore à un feu d'artifice. Mais personne n'avait d'explication rationnelle. Le lendemain, ils ont appris la vérité dans le journal : Il s'agit d'une décharge électrique qui se produit dans l'atmosphère, à haute altitude, lors d'un orage. Les scientifiques ont pu l'observer grâce à des caméras spéciales. Le mystère de la lumière céleste était résolu.", "q": "Quelle est l'origine de cette lumière ?", "c": ["Une étoile filante", "Un ovni spatial", "Un feu d'artifice", "Une étincelle orageuse"], "a": 3, "k": "une décharge électrique qui se produit dans l'atmosphère", "_sources": ["test18#28"]}, {"t": "La ville de Montreuil impose de nouvelles règles aux projets immobiliers du centre-ville pour promouvoir l'installation de commerces et d'ateliers d'artistes sur les axes centraux de la ville. Cette solution favorise la mixité des usages. En effet, la construction de logements est plus rentable que celle de locaux commerciaux ou artistiques, ce qui incite les promoteurs à ne construire que ce type de biens. Refusant de créer une ville-dortoir et décidée à préserver l'identité artistique de la ville, la municipalité entend soutenir l'installation de ces activités en rez-de-chaussée.", "q": "Quel est l'objectif de la politique urbaine de Montreuil ?", "c": ["Développer la mixité sociale dans les quartiers.", "Diversifier les activités en centre-ville.", "Encourager la croissance du secteur immobilier.", "Stabiliser le nombre de logements."], "a": 1, "k": "promouvoir l'installation de commerces et d'ateliers d'artistes", "_sources": ["test19#27", "test37#27"]}, {"t": "Le « moustique urbain », c'est son nom, qui hibernait depuis octobre, s'est réveillé plus tôt. Et une fois d'attaque, les mâles sont immédiatement allés féconder les femelles, qui se sont mises à pondre frénétiquement. Là où l'on ne rit plus, c'est quand on sait que les larves se nourrissent de matières organiques contenues dans les eaux stagnantes usées qui leur servent de nurseries et que, plus il fait chaud, plus il y a des moustiques de tailles XXL qui, sans que les scientifiques sachent pourquoi, délaissent les oiseaux pour s'attaquer de préférence aux humains, il ne nous reste plus qu'à courir acheter du répulsif !", "q": "Pourquoi les moustiques sont-ils plus gros que d'habitude ?", "c": ["Parce qu'il y a eu des pluies importantes.", "Parce que les femelles ont moins pondu.", "Parce que les larves ont beaucoup mangé.", "Parce qu'ils ont hiberné plus longtemps."], "a": 2, "k": "les larves se nourrissent de matières organiques", "_sources": ["test23#23"]}, {"t": "Les consommateurs du passé acceptaient de manger de la viande en se souvenant que derrière il y avait un animal. Aujourd'hui, on achète du poisson, mais on ne veut pas voir les yeux et les arêtes. On veut un bifteck anonyme. Si l'on nous dit que derrière le steak il y avait une génisse de 18 mois, ça nous coupe l'appétit. Il s'agit de la consommation d'une viande qui n'a plus aucune référence à l'animal. En fait, on ne veut pas savoir ce que l'on mange, bien qu'en même temps, on veuille être sûr de ce que l'on mange.", "q": "Quel est le paradoxe évoqué à propos des consommateurs ?", "c": ["Acheter les meilleurs produits et dépenser le moins possible.", "Avoir la garantie de la qualité du produit.", "Être amateur de viande et militer pour le bien-être animal.", "Privilégier les aliments bio et avoir du mal à s'en procurer."], "a": 1, "k": "on ne veut pas savoir ce que l'on mange, bien qu'en même temps, on veuille être sûr", "_sources": ["test26#22", "test32#21"]}, {"t": "Programme d'exception\n« C'est un endroit calme comme un village. La mairie n'est qu'à 200 mètres et, autour, tous les commerces et services dont on peut rêver sont accessibles, sans avoir besoin d'emprunter sa voiture. Inutile d'aller bien loin pour une promenade puisque le parc Étienne est à proximité de la résidence. Qui croirait que nous sommes à quelques minutes seulement de Paris ? », C'est ainsi que l'architecte décrit le lieu où il va construire deux bâtiments modernes cette année.", "q": "Quelle sera la particularité de ce projet immobilier ?", "c": ["Il sera éloigné des magasins.", "Il sera isolé au milieu d'un parc.", "Il sera proche d'un jardin public.", "Il sera situé près d'un axe routier."], "a": 2, "k": "le parc Étienne est à proximité de la résidence", "_sources": ["test27#25"]}], "devoirs": [{"t": "Initiée dans les années 1960, la bataille contre les mauvaises herbes n'a jamais cessé. Depuis, les sols, en plus d'être labourés à outrance, sont aspergés de pesticides qui se propagent sur les terres et dans les eaux voisines... Claude Bourguignon, ingénieur agricole, milite depuis plus de vingt ans pour tenter de convaincre les agriculteurs que le labourage intensif et les pesticides causent la perte de la matière organique terrestre. Présente sur la couche supérieure de la terre, elle est composée de microbes, d'insectes et de champignons et elle fournit des nutriments qui sont essentiels pour les sols.", "q": "Quel est l'objectif de Claude Bourguignon ?", "c": ["Démontrer les dégâts des méthodes de culture intensive.", "Prouver l'efficacité des insectes contre les parasites.", "Recommander des procédés de gestion durable de l'eau.", "Vulgariser des techniques de rendement des terres."], "a": 0, "k": "convaincre les agriculteurs que le labourage intensif et les pesticides causent la perte de la matière organique", "_sources": ["test27#28"]}, {"t": "Avec une histoire de plus de deux millénaires et une économie prospère, Aix-en-Provence rompt avec l'image de cité endormie que donne son labyrinthe de ruelles colorées. L'activité des commerçants, galeristes, aubergistes et autres passants offre un rythme singulier aux journées provençales, démontrant l'énergie créative de sa population cosmopolite. En plus d'un patrimoine important, la ville accueille l'élite de la danse contemporaine, 70 000 étudiants fréquentent les trois universités de la ville et des centaines d'entreprises occupent le pôle d'activité. Ce dynamisme n'a rien à envier à Marseille, située à quelques kilomètres, et promet des heures heureuses à Aix.", "q": "Selon ce texte, quelle est la particularité d'Aix-en-Provence ?", "c": ["Elle abrite une vie animée.", "Elle perpétue des traditions.", "Elle se préserve du tourisme.", "Elle tente d'imiter sa voisine."], "a": 0, "k": "démontrant l'énergie créative de sa population cosmopolite.", "_sources": ["test28#27", "test31#17"]}, {"t": "La mairie de Paris appelle les Parisiens à prendre part au budget participatif. 5 % du budget de la Ville est ainsi dédié à la réalisation de vœux émanant directement des habitants. D'abord, ces derniers font des propositions d'aménagements ou d'événements. Ensuite, les projets sont soumis au vote via Internet. Ceux qui obtiendront le plus de suffrages seront inscrits au budget de la Ville et verront le jour dans les mois suivants. L'objectif de cette initiative est d'assurer plus de transparence dans la gestion des finances et de valoriser l'expertise et la créativité des Parisiens concernant leur environnement immédiat.", "q": "Grâce à cette initiative, que peuvent faire les Parisiens ?", "c": ["Aider à la préservation de leur quartier.", "Choisir des actions pour leur commune.", "Contrôler les dépenses privées des élus.", "Opposer un veto à certaines décisions."], "a": 1, "k": "des propositions d'aménagements ou d'événements… soumises au vote", "_sources": ["test28#28"]}, {"t": "L'anglais est arrivé, au vingtième siècle, à la première place du palmarès des langues internationales. Près de la moitié de l'humanité est concernée par cette langue, car elle est quasi obligatoire dans de nombreux secteurs d'activité. Pourtant, cette situation a des limites et l'anglais devra faire face à la progression d'autres langues dans les années à venir. Les raisons sont la montée en puissance économique et industrielle de grands pays émergents, le développement d'échanges régionaux et ceux entre pays voisins.", "q": "Que dit-on de la langue anglaise dans cet article ?", "c": ["Elle doit devenir la langue de l'administration publique.", "Elle peut perdre son statut de langue dominante.", "Elle restera la langue privilégiée dans le commerce.", "Elle va provoquer la disparition de langues minoritaires."], "a": 1, "k": "l'anglais devra faire face à la progression d'autres langues", "_sources": ["test31#20"]}, {"t": "Le Moustique urbain, c'est son nom, qui hibernait depuis octobre, s'est réveillé plus tôt. Et une fois d'attaque, les mâles sont immédiatement allés féconder les femelles, qui se sont mises à pondre frénétiquement. Les larves se nourrissent de matières organiques contenues dans les eaux stagnantes usées qui leur servent de nurseries et que, plus il fait chaud, plus il y a de quoi profiter, ce qui donne des moustiques de taille XXL.", "q": "Pourquoi les moustiques sont-ils plus gros que d'habitude ?", "c": ["Parce qu'il y a eu des pluies importantes.", "Parce que les femelles ont moins pondu.", "Parce que les larves ont beaucoup mangé.", "Parce qu'ils ont hiberné plus longtemps."], "a": 2, "k": "les larves se nourrissent de matières organiques", "_sources": ["test31#23"]}, {"t": "Les économistes ne sont pas tous d'accord sur les effets du vieillissement de la population sur la consommation. Certains annoncent une chute possible de la consommation des baby-boomers (nés dans les années 50 et 60). Les baby-boomers n'ont pas assez épargné pour leur retraite. Des baisses significatives des pensions de retraite sont probables puisque les pays industrialisés réforment leurs systèmes. S'ils prennent conscience de ces effets, les baby-boomers pourraient limiter leur consommation pour se constituer une épargne pour leurs vieux jours.", "q": "Qu'explique l'auteur sur les baby-boomers ?", "c": ["Ils font preuve de solidarité économique avec les autres générations.", "Ils sont à l'origine d'une part significative de l'épargne des banques.", "La réforme des retraites influencera leurs comportements.", "Leur
