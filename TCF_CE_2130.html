 pouvoir d'achat est garanti dans les pays industrialisés."], "a": 2, "k": "les baby-boomers pourraient limiter leur consommation pour se constituer une épargne", "_sources": ["test31#24"]}, {"t": "Initiée dans les années 1960, la bataille contre les mauvaises herbes n'a jamais cessé. Depuis, les sols sont aspergés de pesticides qui se propagent sur les terres et dans les eaux voisines. Claude Bourguignon, ingénieur agricole, milite depuis plus de vingt ans pour convaincre les agriculteurs que le labourage intensif et les pesticides causent la perte de la matière organique terrestre. Présente sur la couche supérieure de la terre, elle est composée de microbes, d'insectes et de champignons et fournit des nutriments essentiels pour les sols.", "q": "Quel est l'objectif de Claude Bourguignon ?", "c": ["Démontrer les dégâts des méthodes de culture intensive.", "Prouver l'efficacité des insectes contre les parasites.", "Recommander des procédés de gestion durable de l'eau.", "Vulgariser des techniques de rendement des terres."], "a": 0, "k": "le labourage intensif et les pesticides causent la perte de la matière organique", "_sources": ["test31#29"]}, {"t": "Une AMAP*, un magasin de producteurs ou une cueillette à la ferme : les circuits courts gagnent du terrain et ils s'étendent sur tout le territoire. Ils touchent désormais toutes les couches de la population jeunes, retraités, urbains et ruraux. Les raisons de ce succès sont diverses. D'une part, les consommateurs sont en quête de qualité et de transparence quant à l'origine des produits. Ils sont aussi conscients des difficultés que connaissent les agriculteurs et ont compris que, grâce à leurs achats, ils pouvaient défendre l'économie locale. D'autre part, les producteurs cherchent de nouveaux débouchés et un contact approfondi avec les clients. Il s'agit donc d'une tendance qui répond aux attentes des uns et des autres.\n*AMAP : association pour le maintien d'une agriculture paysanne.", "q": "Pour quelle raison les consommateurs utilisent-ils les circuits courts ?", "c": ["Pour diversifier leur approvisionnement.", "Pour faire des achats à moindre coût.", "Pour réduire la consommation de carburant.", "Pour soutenir les agriculteurs de proximité."], "a": 3, "k": "ils pouvaient défendre l'économie locale", "_sources": ["test32#25"]}, {"t": "CACHE-CACHE GÉANT\nUn magasin de meubles, membre d'une chaîne bien connue, a dû faire intervenir la police dans ses rayons pour interrompre une partie de cache-cache lancée via les réseaux sociaux et intéressant plusieurs milliers de personnes. Ironie de l'histoire, c'est pourtant la chaîne elle-même qui avait lancé la mode en proposant des jeux dans certains de ses magasins. 500 personnes y avaient alors participé. Un succès qui avait donné des idées et conduit à de nombreux autres événements du même genre un peu partout en Europe, sans l'autorisation de la firme", "q": "De quoi est-il question dans cet article ?", "c": ["D'un rassemblement de clients mécontents", "D'une opération de vente promotionnelle", "De l'inauguration d'un nouvel établissement", "De l'organisation d'une animation clandestine"], "a": 3, "k": "interrompre une partie de cache-cache lancée via les réseaux sociaux", "_sources": ["test32#27"]}, {"t": "DRAGONS CHINOIS À PARIS\nC'est avec enthousiasme que le départ des festivités pour célébrer le Nouvel An chinois a été donné hier à 14 h 30 sur la place de l'Hôtel de Ville. Devant une foule joyeuse, éclairés par de petites lumières rouges, les dragons et les tigres ont commencé leur danse rythmée par les tambours. Si vous avez manqué ce défilé coloré, vous pourrez toujours vous rattraper aujourd'hui car il y en a un autre de prévu à 1h 30 au métro Belleville.", "q": "Qu'a-t-on pu voir place de l'Hôtel de Ville ?", "c": ["Un marché traditionnel", "Un spectacle de cirque", "Une cérémonie officielle", "Une manifestation culturelle"], "a": 3, "k": "festivités pour célébrer le Nouvel An chinois", "_sources": ["test32#28"]}, {"t": "C'est une tendance qui a envahi Lyon ces derniers mois. Dorénavant les végétariens (voire végétaliens) peuvent sortir dans des restaurants et commander des plats originaux et goûteux. Terminé le remplacement des viandes par une poêlée de légumes sans âme. « Maintenant un végétarien peut vraiment manger à Lyon qui a longtemps été une ville viandante ! Il existe de véritables alternatives aux plats carnés » assure Stéphanie Laguna, spécialiste des tendances en matière de nourriture à Lyon. Le point d'orgue de cette évolution réside probablement dans le succès du restaurant Culina Hortus, qui a ouvert il y a un peu plus d'un an. Ce restaurant gastronomique végétarien pourrait concourir à l'obtention d'une étoile sans rougir. Un grand pas dans une ville qui ne jure historiquement que par la cochonnaille.", "q": "Que constate l'auteur concernant la nouvelle tendance de la restauration lyonnaise ?", "c": ["L'adaptation de l'offre culinaire à la mode actuelle.", "La baisse de la qualité des établissements.", "La disparition graduelle de la cuisine traditionnelle.", "L'hostilité des critiques spécialisés locaux."], "a": 0, "k": "tendance qui a envahi Lyon", "_sources": ["test33#21"]}, {"t": "C'est une tendance qui a envahi Lyon ces derniers mois. Dorénavant, les végétariens (voire végétaliens) peuvent sortir dans des restaurants et commander des plats originaux et goûteux. Terminé le remplacement des viandes par une poêlée de légumes sans âme. « Maintenant, un végétarien peut vraiment manger à Lyon qui a longtemps été une ville viandante ! Il existe de véritables alternatives aux plats carnés » assure Stéphanie Iguna, spécialiste des tendances en matière de nourriture à Lyon. Le point d'orgue de cette évolution réside probablement dans le succès du restaurant « Culina Hortus », qui a ouvert il y a un peu plus d'un an. Ce restaurant gastronomique végétarien pourrait concourir à l'obtention d'une étoile sans rougir. Un grand pas dans une ville qui ne jure historiquement que par la cochonnaille.", "q": "Que constate l'auteur concernant la nouvelle tendance de la restauration lyonnaise ?", "c": ["L'adaptation de l'offre culinaire à la mode actuelle", "La baisse de la qualité des établissements", "La disparition graduelle de la cuisine traditionnelle", "L'hostilité des critiques spécialisés locaux"], "a": 0, "k": "les végétariens peuvent sortir dans des restaurants et commander des plats originaux et goûteux", "_sources": ["test34#20"]}, {"t": "C'est le défi quotidien du consommateur soucieux de son alimentation. Comment déchiffrer ce qui se cache derrière les sigles et les obscurs tableaux des étiquettes ? En France, l'état a bien décidé la mise en place d'un affichage simple, le Nutri-score, qui, avec une lettre et une couleur, informe le consommateur sur la qualité nutritionnelle d'un produit. Mais vous le verrez peu dans les rayons : son utilisation facultative est basée sur le volontariat de l'industrie agroalimentaire.", "q": "Qu'apprend-on sur l'affichage du Nutri-Score ?", "c": ["Il est obligatoire sur les produits", "Il facilite la lecture des étiquettes", "Il répond à une décision des fabricants", "Il transforme l'organisation des rayons"], "a": 1, "k": "le Nutri-score, qui, avec une lettre et une couleur, informe le consommateur sur la qualité nutritionnelle d'un produit", "_sources": ["test34#24"]}, {"t": "Depuis quelque temps, le culte du « bien vieillir » s'ajoute à celui de l'idéal esthétique et du jeunisme. En France, des chercheurs en sciences humaines se demandent s'il ne s'apparente pas à une idéologie tyrannique qui culpabilise de nombreuses personnes âgées, comme l'expliquent le sociologue Michel Billé et le philosophe Didier Maritz : «L'injonction est discrète et pénètre progressivement nos mentalités, s'insinue dans notre quotidien : chez le docteur et dans notre assiette, dans nos vêtements et dans le rapport que nous avons avec notre corps, dans les multiples publications sur la vieillesse et dans les médias. »", "q": "Qu'apprend-on sur le culte du « bien vieillir » ?", "c": ["Il a des effets encore inconnus.", "Il rallonge l'espérance de vie.", "Il se propage imperceptiblement.", "Il suscite un fort engouement."], "a": 2, "k": "L'injonction est discrète et pénètre progressivement nos mentalités", "_sources": ["test35#26"]}, {"t": "La Maison de compagne :\n\nCe restaurant offre à sa clientèle un bel espace articulé en trois salles : cuisine, salle à manger et salon, décorées dans un joli style provençal. On choisit même sa bouteille de vin à la cave, comme à la maison !  Malheureusement, bien que les plats proposés soient élaborés à partir de produits frais sélectionnés au marché, la cuisine reste une cuisine vue et revue, tellement prévisible qu'il vaudra mieux choisir un restaurant en ville plutôt que se perdre dans cette campagne-là.", "q": "Sur quel point porte la critique négative faite à ce restaurant ?", "c": ["L'originalité des plats.", "La qualité des produits.", "Le cadre du restaurant.", "Le prix des menus."], "a": 0, "k": "la cuisine reste une cuisine vue et revue, tellement prévisible", "_sources": ["test39#24"]}]}, "Famille": {"cours": [{"t": "La Néo-Ruralité est devenue un phénomène de société.\n\nCette dénomination date des années 70 : c'est « le retour à la terre ». Alors que la désertification des campagnes se poursuit, un mouvement de population inverse s'opère. Il concerne des personnes jeunes, sans enfant, portant les valeurs contestataires de mai 68. Issues de toutes les classes sociales, elles ne recherchent pas spécialement le confort. Elles veulent avant tout vivre une expérience, ce qui les différencie de la population locale et ne facilite pas leur intégration.", "q": "Que veulent les néo-ruraux ?", "c": ["Accéder à la propriété privée", "Avoir un mode de vie économique", "Participer à la vie associative", "Tenter une nouvelle aventure"], "a": 3, "k": "Elles veulent avant tout vivre une expérience", "_sources": ["test3#21", "test15#19"]}, {"t": "Le smartphone participe à l'entretien d'un lien pathologique de plus en plus répandu, le désir de mainmise des parents sur les adolescents. La crise d'adolescence confronte les parents au désir d'autonomie de l'adolescent, et les oblige à faire le deuil de leur position de parent. Cela suppose qu'ils lâchent prise et fassent confiance à leur enfant. Mais de plus en plus de parents souhaitent que leur ado reste à la maison. Le smartphone, qui permet de rester en lien avec ses copains, arrange donc les parents.", "q": "Quel constat fait l'auteur à propos des smartphones ?", "c": ["Ils éloignent les jeunes du monde des adultes", "Ils entraînent des comportements de type addictif", "Ils ont tendance à couper les adolescents du réel", "Ils peuvent être utilisés comme outils de contrôle"], "a": 3, "k": "Le smartphone, qui permet de rester en lien avec ses copains, arrange donc les parents.", "_sources": ["test4#22", "test8#23"]}, {"t": "Avez-vous déjà observé des familles en train de remplir des sachets de bonbons sur un stand de confiserie ?\n\nUn chercheur américain a montré qu'elles en achètent plus quand les bonbons sont de couleurs différentes. De nombreuses observations similaires prouvent que les entreprises agroalimentaires connaissent nos comportements et la manière dont nous prenons certaines de nos décisions. Par exemple, elles exploitent notre préférence innée pour le sucre, à tous les âges. Elles savent que l'éducation nutritionnelle des enfants et des jeunes est défaillante dans certaines familles et en profitent.", "q": "Que dénonce l'auteur de cet article ?", "c": ["La manipulation des clients par les industriels", "L'attitude imprévisible des consommateurs", "L'uniformisation des saveurs et des goûts", "L'utilisation abusive des produits de synthèse"], "a": 0, "k": "elles exploitent notre préférence innée pour le sucre, à tous les âges", "_sources": ["test4#28", "test8#28"]}, {"t": "Le rire pour soulager les enfants à l'hôpital\n\nLes «docteurs rêves» apportent joie et mieux-être aux enfants hospitalisés. Pour que le petit malade puisse oublier un peu ses souffrances et retrouver le sourire, de gentils «docteurs» viennent à sa rencontre. Ils visitent les jeunes enfants, vêtus d'une blouse blanche, stéthoscope autour du cou, comme de vrais médecins. On les appelle les «docteurs rêves». C'est en artistes professionnels spécialement formés qu'ils interviennent dans les hôpitaux pédiatriques tout en travaillant en synergie avec l'équipe médicale. Les enfants s'échappent un instant, grâce à eux, du monde hospitalier.", "q": "Quelle est la fonction des « docteurs rêves » ?", "c": ["Mettre en place une autre thérapie", "Remplacer les anciens médecins", "Faire rêver les petits patients", "Guérir les enfants par le rêve"], "a": 0, "k": "Les «docteurs rêves» apportent joie et mieux-être aux enfants hospitalisés.", "_sources": ["test5#21"]}, {"t": "Plus de peur que de mal pour ce petit garçon, près de Lorient, qui, dimanche soir, mangeait une part de fromage.\n« Papa, le fromage, il Est dur !!! … »\nDimanche, Youenn, 4 ans, mange une portion individuelle de fromage dans la maison familiale. Ses parents, occupés dans la pièce d'à côté, l'entendent tousser. « Comme s'il voulait vomir », raconte Yann, son père. En fait, l'enfant est en train de recracher… Un bout de plastique qui aurait pu l'étouffer\nD'après Ouest France.", "q": "Qu'est-il arrivé à Youenn ?", "c": ["Il a avalé un mauvais morceau de fromage", "Il a trouvé quelque chose dans son fromage", "Il est tombé malade en mangeant du fromage", "Il s'est fait mal aux dents avec le fromage"], "a": 1, "k": "Un bout de plastique qui aurait pu l'étouffer", "_sources": ["test6#20"]}, {"t": "Fini le poulet-purée !\nRictus inquiet du garçon de salle, regard accusateur des voisins de table... Oser se présenter au restaurant avec un enfant en bas âge déclenche bien souvent la fâcheuse impression d'être persona non grata.\nHeureusement les choses changent. La clientèle rajeunit et l'univers de la gastronomie se renouvelle. Les grands chefs, dérangés par l'idée d'une cuisine pour enfants, ont pris l'initiative de concocter un menu destiné aux gastronomes en culottes courtes. Comme si ces derniers ne pouvaient apprécier autre chose que du blanc de volaille ou des carottes râpées ! Ils ont préféré adapter la taille des assiettes plutôt que de simplifier leur contenu afin d'éduquer les papilles des bambins.\nD'après lexpress.fr du 06/04/2007", "q": "Que font les grands chefs pour les enfants ?", "c": ["Ils développent leur culture du goût", "Ils leur donnent des cours de cuisine", "Ils leur proposent un plat unique", "Ils limitent la variété de leurs menus"], "a": 0, "k": "afin d'éduquer les papilles des bambins", "_sources": ["test6#26"]}, {"t": "La crèche Tanger a rouvert ses portes\nAprès un an de travaux, la crèche municipale Tanger accueille à nouveau depuis mai dernier des enfants de 3 mois à 3 ans. Elle a été complètement réaménagée et ses capacités d'accueil augmentées. Elle reçoit à présent 52 enfants. Un passage permet aux « grands » d'accéder directement au jardin dont le revêtement au sol a été changé. Les enfants ont à leur disposition un nouveau toboggan et un double banc en forme de crocodile.", "q": "Pourquoi la crèche était-elle en travaux ?", "c": ["Pour accueillir des enfants plus âgés.", "Pour améliorer la sécurité du bâtiment.", "Pour multiplier les activités artistiques.", "Pour proposer davantage de places."], "a": 3, "k": "ses capacités d'accueil augmentées", "_sources": ["test11#23"]}, {"t": "L'espoir des enfants\nMarguerite Barankitse est un exemple pour toutes les Burundaises. Pour sauver les enfants de la guerre, elle se bat chaque jour. Ses actions ont d'abord été financées par des organismes allemands. Puis, la renommée mondiale de la fondatrice est devenue le carburant de l'association. Aujourd'hui, elle voyage à travers le monde pour parler de son pays et de ses enfants, dans l'espoir d'obtenir des subventions. Désormais, l'aide extérieure soutient la plupart des projets. Elle a ainsi ouvert deux centres pour enfants et un hôpital. Le travail de cette humanitaire débordante d'énergie a été couronné par de nombreux prix.", "q": "Quel est le but des déplacements à l'étranger de Mme Barankitse ?", "c": ["A) Obtenir de l'argent pour développer des centres d'accueil.", "B) Convaincre les entreprises étrangères d'investir au Burundi.", "C) Soutenir les étudiants burundais expatriés pour leurs études.", "D) Trouver des bénévoles pour s'occuper des enfants à l'hôpital."], "a": 0, "k": "dans l'espoir d'obtenir des subventions", "_sources": ["test13#27"]}, {"t": "La crèche Tanger a rouvert ses portes.\nAprès un an de travaux, la crèche municipale Tanger accueille à nouveau depuis mai dernier des enfants de 3 mois à 3 ans. Elle a été complètement réaménagée et ses capacités d'accueil augmentées. Elle reçoit à présent 52 enfants. Un passage permet aux « grands » d'accéder directement au jardin dont le revêtement au sol a été changé. Les enfants ont à leur disposition un nouveau toboggan et un double banc en forme de crocodile.", "q": "Pourquoi la crèche était-elle en travaux ?", "c": ["Pour accueillir des enfants plus âgés.", "Pour améliorer la sécurité du bâtiment.", "Pour multiplier les activités artistiques.", "Pour proposer davantage de places."], "a": 3, "k": "ses capacités d'accueil augmentées. Elle reçoit à présent 52 enfants", "_sources": ["test19#24"]}, {"t": "Dans les familles, il y a des conflits entre les parents, tout simplement parce que chacun a son style éducatif, ses valeurs, son expérience et sa culture familiale. Chacun a ses idées sur le rôle d'un père, d'une mère, la place d'un enfant. Et quand chacun veut les mettre en application, il se heurte à celles de l'autre et ça crée des disputes dans le couple. C'est inévitable, tout à fait normal et il n'y a pas à s'en inquiéter. On peut parfaitement éduquer son enfant sans être d'accord sur tout, à une condition : que les parents s'entendent sur les valeurs fondamentales qu'ils veulent lui donner et qu'ils respectent les méthodes éducatives de l'autre même s'ils ne les approuvent pas.", "q": "Selon cet article, que doivent faire les parents en matière d'éducation ?", "c": ["Dialoguer avec leurs enfants.", "Prendre appui sur leur expérience.", "S'affranchir de leur héritage familial.", "Trouver des valeurs communes."], "a": 3, "k": "que les parents s'entendent sur les valeurs fondamentales qu'ils veulent lui donner", "_sources": ["test19#26"]}, {"t": "La désillusion de la jeunesse française d'aujourd'hui est un fait préoccupant. Elle est surtout due à la crise internationale, qui réduit les offres d'emploi, fait pression sur les salaires et raréfie les possibilités de promotion. Mais on peut également l'attribuer à un conflit de générations larvées : il oppose la classe d'âge des « baby-boomers », devenus aujourd'hui « papy boomers » triomphants tout au long de leurs parcours, à celle de leurs enfants et maintenant de leurs petits-enfants.", "q": "D'où provient la désillusion des jeunes en France ?", "c": ["De la concurrence des autres générations.", "De la course à la compétitivité.", "De la situation économique tendue.", "Des critiques émanant de leurs parents."], "a": 2, "k": "Elle est surtout due à la crise internationale, qui réduit les offres d'emploi", "_sources": ["test19#28"]}, {"t": "Parents Mode d'Emploi\nSérié-télévisée, du lundi au vendredi à 20h40\nNous découvrons le quotidien de Gaby et Isa, les personnages principaux, quadragénaires d'aujourd'hui, qui cherchent un mode d'emploi pour être de bons parents ! ils essaient de contrôler la situation et seraient même prêts à nous donner des conseils mais comme tous les parents, ils font de grosses erreurs … ce qui nous amuse et nous fait rire, pour notre plus grand plaisir !", "q": "Quel est l'objectif de cette série télévisée ?", "c": ["Informer sur de nouvelles méthodes éducatives", "Montrer la vie de tous les jours d'un jeune couple", "Présenter les relations familiales avec humour", "Proposer des solutions des situations de crise"], "a": 2, "k": "ce qui nous amuse et nous fait rire", "_sources": ["test22#20"]}, {"t": "Dans les familles, il y a des conflits entre les parents, tout simplement parce que chacun a son style éducatif, ses valeurs, son expérience et sa culture familiale. Chacun a ses idées sur le rôle d'un père, d'une mère, la place d'un enfant... et quand chacun veut les mettre en application, il se heurte à celles de l'autre et ça crée des disputes dans le couple. C'est inévitable, tout à fait normal. Et il n'y a pas à s'en inquiéter. On peut parfaitement éduquer son enfant sans être d'accord sur tout, à une condition : que les parents s'entendent sur les valeurs fondamentales qu'ils veulent lui donner. Et qu'ils respectent les méthodes éducatives de l'autre même sils ne les approuvent pas.", "q": "Selon l'article, que doivent faire les parents en matière d'éducation ?", "c": ["Dialoguer avec leurs enfants.", "Prendre appui sur leur expérience.", "S'affranchir de leur héritage familial.", "Trouver des valeurs communes."], "a": 3, "k": "que les parents s'entendent sur les valeurs fondamentales", "_sources": ["test23#26"]}, {"t": "Société\nPlus que jamais peut-être, des lycéens, étudiants, jeunes travailleurs sont nombreux à consacrer une partie de leur activité, souvent bénévolement, aux plus âgés. Tout au long de la semaine, ils passent faire un brin de causette, histoire de tenir compagnie à ces personnes isolées, délaissées par leur famille. Rencontrer des jeunes n'est-il pas le plus sûr moyen de conserver un semblant de la vie sociale ?", "q": "Pourquoi certains jeunes consacrent-ils du temps aux personnes âgées ?", "c": ["Pour créer un lien entre générations.", "Pour compléter leurs études.", "Pour améliorer leurs revenus.", "Parce qu'ils ne veulent plus être seuls."], "a": 0, "k": "tenir compagnie à ces personnes isolées, délaissées par leur famille", "_sources": ["test24#21"]}, {"t": "Si des animés japonais étaient diffusés avant Dragon Ball, c'est cette saga qui a popularisé le manga en France. Le personnage principal, Goku, est d'abord un enfant simple et très joyeux. Avec l'âge et l'expérience, il mûrit et assume les responsabilités liées au développement de ses supers pouvoirs. Cette évolution du protagoniste, parallèle à celle de ses lecteurs, leur a permis de s'identifier à lui. Ce procédé narratif, qui consiste à faire grandir le personnage au fil du temps, était sans précédent et surtout en opposition claire avec les comics américains dont les personnages ne vieillissent jamais.", "q": "D'après cet article, qu'est-ce qui explique le succès de ce manga ?", "c": ["Le dessinateur utilise une technique inédite.", "Le public se reconnaît à travers le héros.", "Le scénario repose sur une intrigue excitante.", "Les adolescents adorent l'univers imaginé."], "a": 1, "k": "Cette évolution du protagoniste, parallèle à celle de ses lecteurs, leur a permis de s'identifier à lui.", "_sources": ["test28#21"]}, {"t": "En tournage dans le Vaucluse jusqu'en décembre, l'héroïne d'« Une femme d'honneur », l'un des feuilletons stars de la première chaîne de télévision (TF), a pris le temps de marquer une pause pour parler de la sécurité routière. « Non pas avec le prisme de mon rôle de gendarme » dit-elle, « mais en tant que mère et automobiliste choquée par le comportement de certains conducteurs. » Corinne Touzet sait de quoi elle parle : chaque année, elle avale en monospace 25 000 kilomètres sur les routes de France.", "q": "Corinne Touzet est", "c": ["actrice à la télévision française.", "gendarme sur les routes de France.", "championne française de conduite.", "reporter pour la télévision française."], "a": 0, "k": "l'héroïne d'« Une femme d'honneur »", "_sources": ["test29#21"]}, {"t": "LA NEO-RURALITE EST DEVENUE UN PHENOMENE DE SOCIETE.\n\nCette dénomination date des années 70 : c'est le retour à la terre. Alors que la désertification des campagnes se poursuit, un mouvement de population inverse s'opère. Il concerne des personnes jeunes, sans enfant, portant les valeurs contestataires de mai 68. Issues de toutes les classes sociales, elles ne recherchent pas spécialement le confort. Elles veulent avant tout vivre une expérience, ce qui les différencie de la population locale et ne facilite pas leur intégration.", "q": "Que veulent les néo-ruraux ?", "c": ["Accéder à la propriété privée.", "Avoir un mode de vie économique.", "Participer à la vie associative.", "Tenter une nouvelle aventure."], "a": 3, "k": "Elles veulent avant tout vivre une expérience", "_sources": ["test31#22"]}, {"t": "Société\nPlus que jamais peut-être, des lycéens, étudiants, jeunes travailleurs sont nombreux à consacrer une partie de leur activité, souvent bénévolement, aux plus âgés. Tout au long de la semaine, ils passent faire un brin de causette, histoire de tenir compagnie à ces personnes isolées, délaissées par leur famille. Rencontrer des jeunes n'est-il pas le plus sûr moyen de conserver un semblant de vie sociale ?", "q": "Pourquoi certains jeunes consacrent-ils du temps aux seniors ?", "c": ["Pour créer un lien entre générations.", "Pour compléter leurs études.", "Pour améliorer leurs revenus.", "Parce qu'ils ne veulent plus être seuls."], "a": 0, "k": "conserver un semblant de vie sociale", "_sources": ["test35#20"]}, {"t": "FILM DOCUMENTAIRE « TISSEUSES DE RÊVES »\n\nMères, filles, grand-mères, une poignée de femme berbères travaillent dur aux tâches domestiques comme à la fabrication de tapis traditionnels. Dans une économie autarcique, elles restent sans autonomie financière, ni reconnaissance de leur talent. Elles veulent farouchement s'arracher à leur condition et offrir études et avenir à leurs enfants. D'Essaouira, sur la côte atlantique, leur parviennent les nouvelles de femmes, semblables à celles, qui ont créé des coopératives de production d'huile d'Argan et changé leurs vies. Taaborth et Erkia partent en exploratrices et, éblouies, rapportent à leurs sœurs les images de ce premier voyage hors de leurs montagnes et un espoir.\n\nD'après amc2-production", "q": "De quoi traite le documentaire sur les femmes berbères ?", "c": ["De l'éducation des plus jeunes.", "De la transmission d'un savoir-faire.", "De la volonté d'émancipation.", "Du rapport entre les générations."], "a": 2, "k": "Elles veulent farouchement s'arracher à leur condition et offrir études et avenir à leurs enfants.", "_sources": ["test36#26"]}, {"t": "En tournage dans le Vaucluse jusqu'en décembre, l'héroïne d'« Une femme d'honneur, l'un des feuilletons stars de la première chaîne de télévision (TF1), a pris le temps de marquer une pause pour parler de la sécurité routière. « Non pas avec le prisme de mon rôle de gendarme » dit-elle, « mais en tant que mère et automobiliste choquée par le comportement de certains conducteurs. » Corinne Touzet sait de quoi elle parle : chaque année, elle avale en monospace 25 000 kilomètres sur les routes de France.", "q": "Corinne Touzet est _____", "c": ["actrice à la télévision française.", "gendarme sur les routes de France.", "championne française de conduite.", "reporter pour la télévision française."], "a": 0, "k": "l'héroïne d'« Une femme d'honneur, l'un des feuilletons stars de la première chaîne de télévision (TF1)", "_sources": ["test38#21"]}], "devoirs": [{"t": "L'espoir des enfants\n\nMarguerite Barankiste est un exemple pour toutes les Burundaises. Pour sauver les enfants de la guerre, elle se bat chaque jour. Ses actions ont d'abord été financées par des organismes allemands. Puis, la renommée mondiale de la fondatrice est devenue le carburant de l'association. Aujourd'hui, elle voyage à travers le monde pour parler de son pays et de ses enfants, dans l'espoir d'obtenir des subventions. Désormais, l'aide extérieure soutient la plupart des projets. Elle a ainsi ouvert deux centres pour enfants et un hôpital. Le travail de cette humanitaire débordante d'énergie a été couronné par de nombreux prix.", "q": "Quel est le but des déplacements à l'étranger de M. Barankitse ?", "c": ["Obtenir de l'argent pour développer des centres d'accueil.", "Convaincre les entreprises étrangères d'investir au Burundi.", "Soutenir les étudiants burundais expatriés pour leurs études.", "Trouver des bénévoles pour s'occuper des enfants à l'hôpital."], "a": 0, "k": "elle voyage à travers le monde pour parler de son pays et de ses enfants, dans l'espoir d'obtenir des subventions", "_sources": ["test39#27"]}]}, "Loisirs": {"cours": [{"t": "Ralentissement du traitement de l'information, baisse de l'attention et de notre mémorisation à court terme … avec l'âge, le vieillissement du cerveau semble inévitable. Pourtant, notre santé cognitive dépend aussi de notre mode de vie. Il est ainsi primordial, après la soixantaine, de conserver une vie active, physiquement par une pratique spotive régulière et aussi intellectuellement en sollicitant nos fonctions mentales par un apprentissage permanent. Pour cela, il est essentiel de garder une vie sociale riche d'interactions avec les autres et également de cultiver des activités, asscoaitives ou sportives, par exemple.", "q": "Quel est l'objectif des conseils donnés dans cet article ?", "c": ["Améliorer les capacités physiques", "Découvrir de nouveaux types de sports", "Développer le cercle de ses relations sociales", "Maintenir les performances de la mémoire"], "a": 3, "k": "notre santé cognitive dépend aussi de notre mode de vie.", "_sources": ["test3#20"]}, {"t": "Chers Valérie et Serge,\nQue vos projets immobiliers voient enfin le jour avec cette année qui débute ! Qu'elle vous apporte la joie de déménager à Nancy quand vous le souhaitez, mais aussi, à tous les niveaux, réussite et beaucoup de bonheur ! J'espère que nous aurons le temps de nous voir plus souvent et de partir à nouveau en vacances ensemble. Notre séjour en Corse reste un merveilleux souvenir pour moi.\nJe vous embrasse,\nElisa", "q": "Quel est le but de cette lettre ?", "c": ["Annoncer l'achat d'un appartement", "Donner des nouvelles à des amis", "Envoyer des vœux de nouvel an", "Organiser un voyage en Corse"], "a": 2, "k": "Que vos projets immobiliers voient enfin le jour avec cette année qui débute !", "_sources": ["test4#20"]}, {"t": "Mathieu Lagouanère et Élodie Calas, deux journalistes, ont fait un tour du monde avec une idée originale : provoquer des rencontres en faisant goûter le roquefort, un fromage traditionnel, fabriqué dans leur région. « Le roquefort était simplement un moyen de faire connaissance avec les habitants. Ses principales caractéristiques, les taches de moisissure et l'odeur, peuvent faire réagir », explique Mathieu. La société Roquefort leur a fourni les fromages. Ils ont raconté leurs aventures dans un blog de voyage.", "q": "Quel était l'objectif de Mathieu et Elodie ?", "c": ["Découvrir des recettes locales", "Entrer en contact avec les gens", "Réaliser une opération publicitaire", "Vendre des spécialités françaises"], "a": 1, "k": "Le roquefort était simplement un moyen de faire connaissance avec les habitants", "_sources": ["test6#21", "test40#21"]}, {"t": "On réserve trop facilement le covoiturage aux étudiants sans un sou. Les clichés sont tenaces. Pourtant, le temps de la petite annonce papier accrochée près de la machine à café est bel et bien terminé, les nouveaux moyens de communication ont changé les choses. L'organisation d'un trajet entre plusieurs personnes qui se rendent dans la même direction est devenue si simple et si efficace avec les sites spécialisés que le covoiturage est en train d'élargir son public et de gagner son statut de mode de transport à part entière.", "q": "Quel développement connaît le covoiturage ?", "c": ["Il devient la solution idéale des voyages organisés à la dernière minute", "Il est accessible à un nombre croissant d'utilisateurs grâce à Internet.", "Il occupe une place grandissante dans les petites annonces des journaux.", "Il s'impose comme le moyen de déplacement à la mode chez les jeunes."], "a": 1, "k": "le covoiturage est en train d'élargir son public", "_sources": ["test7#24", "test9#24", "test20#24"]}, {"t": "Ralentissement du traitement de l'information, baisse de l'attention et de notre mémorisation à court terme...\nAvec l'âge, le vieillissement du cerveau semble inévitable. Pourtant, notre santé cognitive dépend aussi de notre mode de vie. Il est ainsi primordial, après la soixantaine, de conserver une vie active, physiquement par une pratique sportive régulière et aussi intellectuellement en sollicitant nos fonctions mentales par un apprentissage permanent. Pour cela, il est essentiel de garder une vie sociale riche d'interactions avec les autres et également de cultiver des activités associatives ou sportives par exemple.", "q": "Quel est l'objectif des conseils donnés dans cet article ?", "c": ["Améliorer les capacités physiques", "Découvrir de nouveaux types de sports.", "Développer le cercle de ses relations sociales.", "Maintenir les performances de la mémoire."], "a": 3, "k": "notre santé cognitive dépend aussi de notre mode de vie", "_sources": ["test8#20", "test27#21", "test37#21"]}, {"t": "MATCH SÈTE - TOURS\nMercredi 12 novembre\n• Achat des billets aux points de vente habituels : 15 €\n• Réduction pour les étudiants et les détenteurs de carte « Famille nombreuse ».\n• Vente aux guichets du stade, le soir même : 20 €", "q": "À quelle condition l'acheteur a-t-il un meilleur prix ?", "c": ["En achetant les billets à l'avance.", "En choisissant des places pour quatre matchs.", "En prenant des billets pour un groupe.", "En présentant une carte de club de sport."], "a": 0, "k": "Achat des billets aux points de vente habituels : 15 €", "_sources": ["test9#20"]}, {"t": "Match Sète – Tours\nMercredi 12 novembre\n\n• Achat des billets aux points de vente habituels : 15 €\n\n• Réduction pour les étudiants et les détenteurs de carte « famille nombreuse »\n\n• Vente aux guichets du stade, le soir même : 20 €", "q": "A quelle condition l'acheteur a-t-il un meilleur prix ?", "c": ["En achetant les billets à l'avance", "En choisissant des places pour quatre matchs", "En prenant des billets pour un groupe", "En présentant une carte de club de sport"], "a": 0, "k": "Achat des billets aux points de vente habituels : 15 €", "_sources": ["test11#20"]}, {"t": "Laissez la voiture au garage !\nQue vous soyez un abonné ou non au transport public, un particulier, une entreprise, un cycliste régulier ou occasionnel..., la municipalité met à votre disposition tous les moyens de profiter de la ville à vélo.\nLes vélos en libre-service, la location longue durée, les vélos-parcs sécurisés ou la location touristique, ces services s'intègre à l'offre Transroch. Ils sont un des modes de transport qui facilitent vos déplacements... Trente stations dans le centre de la ville et bientôt cinquante ! Renseignez-vous auprès de l'Espace Accueil pour savoir quelle offre vous correspond.", "q": "Quel est le but de l'offre Transroch ?", "c": ["Découvrir les sites touristiques hors des sentiers battus.", "Diversifier l'offre d'abonnement aux transports en commun.", "Favoriser la mobilité urbaine grâce aux cycles non motorisés.", "Promouvoir les énergies propres respectant l'environnement."], "a": 2, "k": "ces services s'intègre à l'offre Transroch. Ils sont un des modes de transport qui facilitent vos déplacements", "_sources": ["test12#20"]}, {"t": "Depuis plus de deux siècles, les violons fabriqués par le célèbre artisan Antonio Stradivari sont réputés pour la supériorité de leur sonorité. Des spécialistes ont voulu le vérifier par une petite expérience. Ils ont demandé à des participants de fermer les yeux et d'écouter des musiciens jouer sur des violons, trois étaient modernes et trois avaient été fabriqués par Stradivari. Que les participants aient ou non une expérience dans le domaine musical, tous ont préféré la sonorité des premiers.", "q": "A quelle conclusion aboutit cette expérience ?", "c": ["Ce sont les violons récents qui sont les plus estimés.", "Il est difficile de maîtriser les violons anciens.", "La qualité des violons évolue avec le temps.", "Voir le violon modifier l'appréciation de l'auditeur."], "a": 0, "k": "tous ont préféré la sonorité des premiers", "_sources": ["test12#29", "test27#30"]}, {"t": "Mathieu Lagouanère et Élodie Calas, deux journalistes, ont fait un tour du monde avec une idée originale : Provoquer des rencontres en faisant goûter le roquefort, un fromage traditionnel, fabriqué dans leur région. « le roquefort était simplement un moyen de faire connaissance avec les habitants. ses principales caractéristiques, les taches de moisissures et l'odeur, peuvent faire réagir », explique Mathieu. La société roquefort leur a fourni les fromages. Ils ont raconté leurs aventures dans un bloc de voyage.", "q": "Quel était l'objectif de Mathieu et Élodie ?", "c": ["Découvrir des recettes locales", "Entrer en contact avec les gens", "Réaliser une opération publicitaire", "Vendre des spécialités françaises"], "a": 1, "k": "un moyen de faire connaissance avec les habitants", "_sources": ["test14#20"]}, {"t": "Le sport est avant tout un loisir et doit le rester. Pour chacun, quelle que soit sa pratique. Pour que celle-ci reste toujours agréable, une règle de base : se préparer. Avant tout, assurez-vous que vous êtes apte à faire du sport. Les interdictions sont essentiellement liées à l'âge ou à des pathologies préexistantes. L'entraînement doit être régulier. Il faut progresser lentement dans la durée et dans l'intensité. C'est la meilleure garantie pour ne pas souffrir en faisant du sport, à condition aussi de savoir s'échauffer avant chaque séance. Il va sans dire que le matériel doit être bien adapté à votre taille et à votre niveau sportif.", "q": "Quel titre convient le mieux à cet article ?", "c": ["Les sports à risque.", "Le sport sans douleur.", "Les dangers du sport.", "Les bienfaits du sport."], "a": 1, "k": "C'est la meilleure garantie pour ne pas souffrir en faisant du sport", "_sources": ["test15#25"]}, {"t": "Situé au cœur d'un jardin tropical et en bordure d'une grande plage de sable fin, le Coralia est un hôtel-club de dernière génération, confortable et convivial. Complet et bien équipé, il satisfera les familles comme les sportifs. Vous pourrez pratiquer tous les sports nautiques et vous détendre dans nos salles de musculation et de fitness. Son magnifique restaurant vous accueillera jusque très tard dans la nuit. L'un des rares hôtels de la région à proposer une animation 100 % francophone.", "q": "Que propose cet hôtel ?", "c": ["Un club pour les jeunes enfants.", "Un espace de remise en forme.", "Une formule en pension complète.", "Une offre de restauration variée."], "a": 1, "k": "vous détendre dans nos salles de musculation et de fitness", "_sources": ["test19#20"]}, {"t": "Ralentissement du traitement de l'information, baisse de l'attention et de notre mémorisation à court terme… Avec l'âge, le vieillissement du cerveau semble inévitable. Pourtant, notre santé cognitive dépend aussi de notre mode de vie. Il est ainsi primordial, après la soixantaine, de conserver une vie active, physiquement par une pratique sportive régulière et aussi intellectuellement en sollicitant nos fonctions mentales par un apprentissage permanent. Pour cela, il est essentiel de garder une vie sociale riche d'interactions avec les autres et également de cultiver des activités associatives ou sportives par exemple.", "q": "Quel est l'objectif des conseils donnés dans cet article ?", "c": ["Améliorer les capacités physiques.", "Découvrir de nouveaux types de sports.", "Développer le cercle de ses relations sociales.", "Maintenir les performances de la mémoire."], "a": 3, "k": "notre santé cognitive dépend aussi de notre mode de vie", "_sources": ["test19#21"]}, {"t": "La Ligue de Football Professionnel vient d'annoncer que l'assistance vidéo sera prochainement introduite en première ligue. Mais la polémique demeure sur sa nécessité. Quand il y aura un but dans un stade, les gens devront attendre », s'inquiète un ancien défenseur de première ligue. Pour lui, « on oublie l'essence même du football, qui est la joie, la folie. On ne va même plus profiter des buts ». Généralement, un arrêt de jeu ne doit pas dépasser 30 secondes, or « actuellement on est souvent à 50 secondes parce que le système n'est pas encore tout à fait performant. »", "q": "Quelle est la conséquence de l'assistance vidéo pour le football ?", "c": ["Un manque d'intérêt du grand public.", "Un risque de déconcentration des joueurs.", "Une moindre crédibilité des arbitres.", "Une perte de spontanéité des matchs."], "a": 3, "k": "on oublie l'essence même du football, qui est la joie, la folie.", "_sources": ["test20#20"]}, {"t": "Le tourisme en France a longtemps été perçu comme un filon, mais il pourrait à l'avenir se transformer en calamité : celle du « surtourisme ». Ce phénomène résulte d'une mauvaise gestion de foules sans cesse plus nombreuses qui pourraient bientôt toucher la France, où nombre de sites mythiques sont inadaptés à une affluence en forte croissance, le Louvre et la Tour Eiffel, à Paris, en tête. « L'objectif de 100 millions de touristes par an pourrait bien être atteint, précise un directeur d'agence organisant des séjours en France. Mais, en l'absence de tout aménagement et alors que 20% du pays accueillent 80% des touristes, cela pourrait devenir un danger. »", "q": "Qu'apprend-on au sujet du « surtourisme » ?", "c": ["Il est à l'origine d'une pratique de diminution des flux.", "Il nécessite une réorganisation des lieux les plus visités.", "Il permet de répartir les voyageurs sur tout le territoire.", "Il suscite l'engagement des professionnels du secteur."], "a": 1, "k": "nombre de sites mythiques sont inadaptés à une affluence en forte croissance", "_sources": ["test20#22"]}, {"t": "Mathieu Lagouanère et Elodie Calas, deux journalistes, ont fait un tour du monde avec une idée originale : provoquer des rencontres en faisant goûter le roquefort, un fromage traditionnel, fabriqué dans leur région. « Le Roquefort était simplement un moyen de faire connaissance avec les habitants. Ses principales caractéristiques, les taches de moisissure et l'odeur, peuvent faire réagir », explique Mathieu. La société Roquefort leur a fourni les fromages. Ils ont raconté leurs aventures dans un blog de voyage.", "q": "Quel était l'objectif de Mathieu et Elodie ?", "c": ["Découvrir des recettes locales.", "Entrer en contact avec les gens.", "Réaliser une opération publicitaire.", "Vendre des spécialités françaises."], "a": 1, "k": "provoquer des rencontres", "_sources": ["test21#21"]}, {"t": "La charte des jeux olympiques est sans ambiguïté : les deux langues officielles du Comité international olympique sont le français et l'anglais. Une étude permettant d'identifier la place et le statut de la langue française dans les organisations.\nSportives internationales a été lancée en 2008 : les francophones sont présents dans les instances des fédérations sportives internationales mais en nombre insuffisant aux postes de décision, les documents officiels étant rarement rédigées en français. La priorité a donc été accordée à l'aide à la traduction des textes et à la mobilisation des francophones dans leur ensemble afin qu'ils s'entraident à accéder aux postes décisionnels.", "q": "À quel constat a abouti l'enquête sur la place de la francophonie dans le mouvement sportif mondial ?", "c": ["La langue française et l'anglais jouissent d'un statut équitable.", "Les lignes sportives internationales comptent peu de francophones.", "Les textes officiels et les règlements sont traduits en langue française.", "Très peu de francophones occupent des fonctions à responsabilité."], "a": 3, "k": "en nombre insuffisant aux postes de décision", "_sources": ["test21#24"]}, {"t": "Envie de faire le Clown ?\nPendant les vacances de pâques, l'équipe d'animateurs du centre de loisirs dessinera chaque jour sur les joues des enfants des animaux marins : hippocampes, phoques, manchots, poissons clowns …", "q": "Quelle activité proposera-t-on aux enfants pendant les vacances de pâques ?", "c": ["Un spectacle de cirque", "Une activité de maquillage", "Une rencontre avec un clown", "Une sortie au Zoo"], "a": 1, "k": "dessinera chaque jour sur les joues des enfants", "_sources": ["test22#21"]}, {"t": "En quelques années, le camping est devenu le premier mode d'hébergement touristique, devant les hôtels, les résidences et les villages de vacances. « Les familles qui louaient des villas ou partaient à l'hôtel choisissent de plus en plus ce type de séjour en plein air et tout compris », déclare un expert.\nCes nouveaux adeptes du camping, souvent plus fortunés, se tournent vers les tentes meublées, chalets et mobil-home classés 3 à 5 étoiles qui existaient peu auparavant. Il y a quelques années, certains avaient honte de dire : je suis allé au camping. Aujourd'hui, ce n'est plus vrai.", "q": "Que constate l'expert à propos du camping ?", "c": ["Le confort a été très nettement amélioré", "Le mode d'hébergement est écologique", "Les prestations proposées sont inédites", "Les prix deviennent de plus en plus attractifs"], "a": 0, "k": "choisissent de plus en plus ce type de séjour en plein air et tout compris", "_sources": ["test22#23"]}, {"t": "Les jours rallongent, la température monte, les arbres sont en fleurs, bref... l'été approche, et les grandes vacances aussi. Mais savez-vous déjà comment vos enfants vont passer ces deux mois ? Ils ont un besoin vital de se détendre et ils sont curieux de tout. De votre côté, vous cherchez des solutions pratiques et des vacances intelligentes et sûres, nous vous proposons des ateliers scientifiques passionnants dans des centres de vacances rigoureusement sélectionnés. Alors, appelez-nous vite !", "q": "Qu'offrent ces centres de vacances ?", "c": ["Des cours de rattrapage scolaires en sciences.", "Des activités de découverte de la nature.", "Des stages de travail en laboratoire.", "Des séjours alliant détente et découvertes."], "a": 3, "k": "des ateliers scientifiques passionnants dans des centres de vacances", "_sources": ["test23#20"]}], "devoirs": [{"t": "Ralentissement du traitement de l'information, baisse de l'attention et de notre mémorisation à court terme…. Avec l'âge, le vieillissement du cerveau semble inévitable. Pourtant, notre santé cognitive dépend aussi de notre mode de vie. Il est ainsi primordial, après la soixantaine, de conserver une vie active, physiquement par une pratique sportive régulière et aussi intellectuellement en sollicitant nos fonctions mentales par un apprentissage permanent. Pour cela, il est essentiel de garder une vie sociale riche d'interactions avec les autres et également de cultiver des activités, associatives ou sportives, par exemple.", "q": "Quel est l'objectif des conseils donnés dans cet article ?", "c": ["Améliorer les capacités physiques.", "Découvrir de nouveaux types de sports.", "Développer le cercle de ses relations sociales.", "Maintenir les performances de la mémoire."], "a": 3, "k": "notre santé cognitive dépend aussi de notre mode de vie.", "_sources": ["test28#20"]}, {"t": "L'individualisme a souvent mauvaise presse dans les discours actuels. On a tendance à lui imputer tous les maux de nos sociétés : égoïsme, compétition, exclusion, communautarisme, voire déliquescence morale... Erreur, explique le sociologue François de Singly dans un petit essai percutant. On assimile l'individualisme à ces réactions adolescentes du type « j'ai bien le droit de faire ce que je veux », alors qu'il est tout le contraire. Fruit d'une pensée élaborée depuis la Renaissance, l'individualisme est un projet de société dans lequel chacun devrait trouver les meilleures conditions de son épanouissement.", "q": "Qu'explique François de Singly à propos de l'individualisme ?", "c": ["Il appartient à une réflexion philosophique.", "Il fait souvent la une des journaux.", "Il résulte des modes de vie contemporains.", "Il véhicule des valeurs obsolètes."], "a": 0, "k": "Fruit d'une pensée élaborée depuis la Renaissance", "_sources": ["test28#29"]}, {"t": "On assiste aujourd'hui à la naissance d'une véritable géopolitique du sport, caractérisée par trois éléments :\n\n- L'intégration du sport et des rencontres sportives internationales dans les réalités et les dynamiques internationales.\n- La place de plus en plus importante des instances internationales du sport et des athlètes dans les questions diplomatiques bi ou multilatérales.\n- la multiplication d'acteurs internationaux non-sportifs, qui s'emparent du sport comme moyen d'action et l'utilisent comme un élément moteur de politique étrangère.", "q": "Quel est l'objectif de ce texte ?", "c": ["Critiquer l'engagement des sportifs en politique internationale.", "Décrire les rapports du sport et de la politique internationale.", "Dénoncer l'utilisation de l'image des sportifs en diplomatie.", "Montrer l'utilité du sport dans la résolution de conflits internationaux."], "a": 1, "k": "La place de plus en plus importante des instances internationales du sport et des athlètes dans les questions diplomatiques", "_sources": ["test35#27"]}]}, "Environnement": {"cours": [{"t": "Une étude récente révèle que la concentration de déchets plastiques flottant à la surface du Pacifique nord a été multipliée par cent en quarante ans.\nCe constat, émis par les pêcheurs en haute mers, est alarmant car cette pollution a des conséquences écologiques. La gigantesque plaque de déchets flottant sur l'océan Pacifique, épaisse par endroits de plusieurs dizaines de mètres, constitue un milieu favorable à la reproduction d'une espèce d'araignée d'eau. Cet insecte est en train de se multiplier dans le Pacifique nord. Si la densité des plastiques continue à augmenter, certaines espèces pourraient continuer à se multiplier, risquant de déséquilibrer l'écosystème du Pacifique.", "q": "Quel danger représentent ces déchets ?", "c": ["Un obstacle pour les bateaux de pêche", "Un réchauffement dramatique des eaux", "Un risque d'intoxication des populations du Pacifique", "Une diminution de la diversité de la faune océanique"], "a": 3, "k": "certaines espèces pourraient continuer à se multiplier, risquant de déséquilibrer l'écosystème du Pacifique.", "_sources": ["test1#27", "test4#27"]}, {"t": "Les bons vieux bancs verts sur les trottoirs parisiens ont de la concurrence. Depuis le mois de décembre, sur certains boulevards, un nouveau mobilier urbain a fait son apparition, avec 12 modèles de banquettes, chaises et tabourets. Pour la première fois, la Ville de Paris recueille l'avis des usagers et des riverains. Le traditionnel banc en fonte et bois a-t-il de l'avenir au milieu de ce mobilier futuriste ?", "q": "Quelle est l'originalité de ce projet ?", "c": ["La priorité donnée à l'aspect écologique", "La prise en compte de l'opinion publique", "Le caractère provisoire de l'installation", "Le choix des matériaux de fabrication"], "a": 1, "k": "Pour la première fois, la Ville de Paris recueille l'avis des usagers et des riverains.", "_sources": ["test4#21"]}, {"t": "Quelles sont les forces dont disposa l'Homme pour conquérir l'hégémonie sur la planète ?\n\nL'Homme est dépourvu de moyens physiques, il n'a ni crocs, ni griffes, ni armure ; il est chétif, fragile et vulnérable. Mais, d'une part, il prime tous les autres compagnons de vie par la puissance de son cerveau ; d'autre part, il est attiré par ses semblables, il tend à faire groupe avec les autres individus de son espèce, et ce sont ces tendances sociales qui, multipliant l'Homme par lui-même. Lui ont donné le moyen d'atteindre à de si prodigieux résultats dans le domaine du savoir comme dans celui du pouvoir.", "q": "Qu'est-ce qui a permis à l'espèce humaine de conquérir le monde, à part son intelligence ?", "c": ["La fréquentation de ses congénères.", "L'amélioration de son habitat naturel.", "Les mutations de son organisme.", "L'extermination des autres espèces."], "a": 0, "k": "il tend à faire groupe avec les autres individus de son espèce, et ce sont ces tendances sociales qui", "_sources": ["test4#24"]}, {"t": "L'étendue et la variété des invités reçus par le parlement européen ne cessent d'étonner. Prix Nobel, stars de série télé, grand maitre des échecs … Cette diversité n'a d'égale que l'éclectisme des sujets préparés et débattus au sein de l'hémicycle : la situation dans des pays de guerre, les relations entre pays, les changements climatiques … Bien évidemment, ces personnalités connues et reconnues ne sont pas choisies pour les paillettes et le strass qu'elles peuvent, parfois, véhiculer, mais parce qu'elles ont une expertise reconnue ou un message à délivrer.", "q": "À quoi se réfère le terme « diversité » dans le texte ?", "c": ["Aux hôtes du Parlement", "Aux idées débattues", "Aux pays représentés", "Aux projets de loi votés"], "a": 0, "k": "L'étendue et la variété des invités reçus par le parlement européen ne cessent d'étonner.", "_sources": ["test4#29"]}, {"t": "Avant de pouvoir entrer, il faut jurer par écrit que l'on s'engage à participer à la lutte contre le réchauffement de la planète.\n\nBar Surya est devenue la première boite de nuit écologique. Située à Londres, elle ne propose que des boissons biologiques, et offre une entrée gratuite aux clients qui peuvent prouver qu'ils sont venus à pied, à vélo, en bus ou en métro. En outre, un système d'énergie recyclable utilise les mouvements des pieds des danseurs pour fournir une partie de l'électricité. L'objectif affiché est de sensibiliser les jeunes au développement durable. Une bonne idée marketing qui devrait inspirer d'autres initiatives du même type...", "q": "Quelle est l'originalité de la discothèque dont il est question ?", "c": ["Elle s'adresse exclusivement à une clientèle soucieuse des questions d'environnement.", "Elle travaille à la réduction des accidents de la route dus à l'alcool", "Le coût du billet d'entrée varie en fonction de l'énergie produite par les danseurs.", "Les jeunes doivent consommer sur place les produits du commerce équitable"], "a": 0, "k": "il faut jurer par écrit que l'on s'engage à participer à la lutte contre le réchauffement de la planète", "_sources": ["test5#22"]}, {"t": "Fixer des limites strictes à la pêche, c'est l'action que va mener l'Australie afin de protéger la vie aquatique. « Il est temps que la planète franchisse une nouvelle étape dans la protection des océans » a déclaré le ministre australien de l'environnement. La création d'un réseau de parcs naturels aura un impact sur le secteur de la pêche commerciale qui devrait recevoir 79,2 millions d'euros en contrepartie. La fondation australienne pour la protection de l'environnement a qualifié cette annonce d'historique » mais elle a souligné que plusieurs zones restaient menacées par l'exploitation humaine des ressources naturelles.", "q": "Que projette le gouvernement australien ?", "c": ["D'aménager des réserves restreignant la pêche", "D'encourager une politique mondiale de la pêche", "D'organiser des contrôles pour surveiller la pêche", "De créer des taxes sur les produits de la pêche"], "a": 0, "k": "La création d'un réseau de parcs naturels aura un impact sur le secteur de la pêche commerciale", "_sources": ["test5#24"]}, {"t": "Dans une interview, le ministre de l'Écologie proposait ces quelques conseils, mis en pratique par lui-même au quotidien, afin de mieux contribuer au respect de l'environnement : « Ma famille et moi-même avons d'abord installé des économiseurs sur tous les robinets de la maison. D'autre part, nous faisons très attention à ne consommer que des produits de saison afin de réduire au maximum les emballages inutiles que produisent les techniques de congélation et de mise en conserve des aliments. Bref, nous essayons d'appliquer tous ces petits gestes qui doivent devenir de vrais réflexes. »", "q": "Quelle pratique, entre autres, le ministre de l'écologie cherche-t-il à limiter ?", "c": ["La consommation de produits importés par avion", "La distribution de sacs en plastique en magasin", "L'utilisation de métaux toxiques dans les tuyaux", "Le gaspillage de l'eau dans le réseau domestique"], "a": 3, "k": "avons d'abord installé des économiseurs sur tous les robinets de la maison", "_sources": ["test6#27"]}, {"t": "Les bénéfices du bio pour la santé et pour l'environnement sont aujourd'hui prouvés. Mais pour ses détracteurs, ce type de production ne serait pas viable, faute de rendements suffisants pour subvenir aux besoins d'une planète à la démographie galopante. Une idée répandue que réfutent des chercheurs européens qui affirment qu'il est possible de nourrir plus de 9 milliards d'êtres humains en 2050 avec 100% d'agriculture biologique, à deux conditions : réduire le gaspillage alimentaire et limiter la consommation de produits d'origine animale. Un défi de taille, alors que le bio ne représente que 1% de la surface agricole utile dans le monde.", "q": "De quel défi est-il question ?", "c": ["Augmenter la surface des terres agricoles.", "Garantir la qualité des aliments pour animaux.", "Généraliser l'agriculture biologique.", "Lutter contre la démographie galopante."], "a": 2, "k": "il est possible de nourrir plus de 9 milliards d'êtres humains en 2050 avec 100% d'agriculture biologique", "_sources": ["test10#26", "test40#26"]}, {"t": "Dans l'ensemble des espaces verts de la ville de Toulouse, les pelouses tondues régulièrement laissent place à 150 hectares de prairies urbaines, plus sauvages. « En coupant l'herbe, on stoppe le cycle des végétaux. Or si on ne la coupe qu'une fois par an, c'est bon pour l'écosystème et ça permet l'intégration de nouvelles espèces », explique la conseillère municipale en charge des espaces verts. Seul inconvénient, le résultat est nettement moins esthétique. « Au début, c'était mal compris car les gens pensaient que c'était sale, reconnait l'élue. Mais aujourd'hui, on voit des petites fleurs réapparaître et je ne reçois plus de courriers »", "q": "Pourquoi les gens écrivaient-ils à la conseillère municipale à propos des espaces verts ?", "c": ["Pour demander une diminution des frais.", "Pour dénoncer le manque d'entretien.", "Pour exiger plus de variété de plantes.", "Pour réclamer l'ouverture d'autres parcs"], "a": 1, "k": "c'était mal compris car les gens pensaient que c'était sale", "_sources": ["test11#26"]}, {"t": "Réparer un véhicule endommagé avec des pièces d'occasion recyclées, c'est désormais possible. Depuis le printemps dernier, l'expert d'une compagnie d'assurances peut, en effet, proposer à un assuré des pièces de réemploi. Ces pièces, issues de véhicules hors d'usage, accidentés ou arrivés en fin de vie, sont démontées, contrôlées et revendues à des réparateurs par des recycleurs agréés. Cette disposition est une alternative au neuf et répond à de nouvelles attentes. La récupération de pièces valides permet ainsi de prolonger leur longévité ainsi que celle d'autres véhicules avec un bénéfice économique, environnemental et social.", "q": "D'après cet article, quel avantage présente l'utilisation de pièces recyclées ?", "c": ["A) Elle donne l'assurance d'un dépannage rapide.", "B) Elle donne lieu à une réduction sur l'assurance", "C) Elle offre la possibilité d'une garantie de qualité.", "D) Elle permet de dépenser moins d'argent."], "a": 3, "k": "bénéfice économique", "_sources": ["test13#23"]}, {"t": "Ecologiques par nature, les solutions que nous proposons représentent un atout certain pour lutter contre les émissions de gaz à effet de serre. Audioconférence, visioconférence et messagerie vous évitent des déplacements inutiles, tout en vous permettant de contribuer à la préservation de la planète. En effet, une étude environnementale a calculé qu'en remplaçant 20% des voyages d'affaires par des visioconférences, on économiserait 22 millions de tonnes de CO2 par an. Ensemble, agissons pour un monde plus vert !", "q": "Que propose cette entreprise ?", "c": ["A) Des outils de communication.", "B) Des voyages organisés.", "C) Une formation à l'écologie.", "D) Un système d'information."], "a": 0, "k": "Audioconférence, visioconférence et messagerie", "_sources": ["test13#28"]}, {"t": "Deux mondes s'affrontent : ceux de l'ancienne agriculture et de la nouvelle. Le productivisme soutenu par la chimie a fait progresser comme jamais les rendements agricoles, nourri la planète et abaissé le prix des denrées, dont on peut comprendre les motivations, tant les agriculteurs travaillent sous la pression éreintante de la compétitivité, soutiennent qu'il n'existe pas d'autres solution. Notre enquête montre le contraire : l'alliance de la technologie et de l'écologie pour remplacer des substances nocives par une panoplie de techniques inédites offre une alternative originale, crédible et soutenable à la dispersion incontrôlée de composants chimiques nuisibles à tous. C'est la voie de la sagesse autant que de la modernité.", "q": "Que défend le journaliste ?", "c": ["L'accès universel à des aliments bon marché", "L'innovation des procédés de production", "Le développement du commerce équitable", "Le partage d'expériences traditionnelles"], "a": 1, "k": "l'alliance de la technologie et de l'écologie pour remplacer des substances nocives", "_sources": ["test14#29"]}, {"t": "Pour lutter efficacement contre le changement climatique, il est essentiel de trouver des réponses technologiques à notre consommation d'énergie. Néanmoins, il est également nécessaire de concilier mesures environnementales et activités économiques. Si nous ne respectons pas ce point, nous n'atteindrons pas nos objectifs. Ainsi, le futur Plan Climat devra être mis en place en concertation avec les habitants mais également avec les entreprises implantées dans la région, afin que chacun ait un objectif à atteindre dans la lutte contre le changement climatique.", "q": "Que faudrait-il faire pour lutter efficacement contre le changement climatique ?", "c": ["Moderniser les installations anti-pollution.", "Modifier les circuits de production.", "Organiser des formations sur le sujet.", "Responsabiliser les acteurs concernés."], "a": 3, "k": "en concertation avec les habitants mais également avec les entreprises", "_sources": ["test15#20"]}, {"t": "La ville de Paris lance un concours mondial de créations urbaines innovantes. Ouvert à tous, professionnel ou citoyen, du moment qu'un architecte est associé au projet, le concours a pour objectif d'imaginer le Paris de demain en innovant. « Faire autrement, explique l'adjoint en charge de l'urbanisme, c'est utiliser la matière de manière responsable pour consommer moins de matières premières, choisir de bons matériaux, tendre vers le zéro déchet, produire en co-construction la ville avec les citoyens en s'inspirant des idées qu'ils proposent »", "q": "Que propose la mairie de Paris au public ?", "c": ["De développer des projets collectifs pour la ville", "De donner un avis sur les nouveaux bâtiments", "De participer à des débats sur l'environnement", "De visiter des expositions dans des lieux insolites"], "a": 0, "k": "concours mondial de créations urbaines innovantes", "_sources": ["test18#20"]}, {"t": "Il faut savoir ce que l'on veut… On sait que les humains ont la mémoire courte, et que les biais cognitifs ont le dos large, et que les changements sont longs à opérer. Mais quand même, parfois on hallucine par tant d'incohérence ! La bio a fait ses preuves avec 30 % de biodiversité en plus sur les fermes bio, une eau et des sols de meilleures qualités, moins de rejets polluants de gaz à effet de serre, plus de carbone stocké dans les sols, plus d'emplois et en prime, une alimentation de qualité… Avec preuves à l'appui. Alors stop au déni : la bio doit rebondir, en mettant en avant ses externalités positives.", "q": "De quoi il est question dans cet article ?", "c": ["Des avantages de l'agriculture biologique", "Des inconvénients de l'agriculture conventionnelle", "Des difficultés de la transition écologique", "Des conséquences du changement climatique"], "a": 0, "k": "La bio a fait ses preuves", "_sources": ["test18#22"]}, {"t": "Les villes se montrent soucieuses d'améliorer leur qualité de l'air. Une solution : la plantation d'arbres. En effet, les arbres filtrent les particules contenues dans l'atmosphère. Mais la plantation d'arbres doit être réfléchie. Il est pertinent de mettre des arbres le long des axes de circulation pour protéger les habitations des polluants, mais aussi dans les zones piétonnes.\nLe choix des arbres a aussi son importance. Les espèces d'arbres plantées il y a 50 ans ne répondent pas aux besoins d'aujourd'hui car elles forment un couvercle retenant au sol la pollution. En revanche, les arbres aux feuilles poilues sont, eux, efficaces.", "q": "A quelle condition les arbres peuvent-ils aider à combattre la pollution urbaine ?", "c": ["S'ils appartiennent à une espèce adéquate", "S'ils ont des feuilles persistantes en hiver", "S'ils ont été plantés il y a longtemps", "S'ils se trouvent loin des zones de logement"], "a": 0, "k": "les arbres aux feuilles poilues sont, eux, efficaces", "_sources": ["test18#25", "test21#25"]}, {"t": "Pourrait-on nourrir les 9 milliards d'humains que comptera la Terre en 2050 uniquement par l'agriculture biologique ? Oui, répondent certains chercheurs. Mais selon eux, la tâche sera difficile car pour se défaire des pesticides, des engrais de synthèse et des OGM, il faudrait absolument diminuer la consommation de viande et le gaspillage alimentaire. Et même à ces conditions, il resterait encore des obstacles au « tout bio ». Alors, agriculture biologique ou conventionnelle ? Les incertitudes scientifiques demeurent quant à leurs réels impacts sur les rendements et les prédictions sur ce sujet sont encore floues.", "q": "Sur quoi insiste l'auteur de ce texte ?", "c": ["Les conséquences d'un régime végétarien.", "Les doutes sur les méthodes de production.", "Les effets de l'usage de produits chimiques.", "Les problèmes causés par la surpopulation."], "a": 1, "k": "Les incertitudes scientifiques demeurent quant à leurs réels impacts sur les rendements", "_sources": ["test20#27"]}, {"t": "Certaines grandes surfaces ont désigné un coach antigaspi au sein du personnel, ont cassé les prix des produits à date de péremption proche, ont réduit le nombre d'articles en rayon et ont proposé les fruits et légumes en vrac.\nCes mesures ont permis de réduire les pertes alimentaires de 22% en trois mois !\nLes solutions pour lutter contre le gaspillage en grande distribution existent donc bel et bien. Des initiatives similaires, dont les résultats devraient paraitre prochainement, sont au cours dans d'autres secteurs (industries agroalimentaires, producteurs, etc.)", "q": "Selon cet article, quel type d'action faudrait-il poursuivre ?", "c": ["De nouvelles pratiques de vente", "Des comportements d'achat différents", "Des habitudes alimentaires saines", "Des modes de recyclage innovants"], "a": 0, "k": "réduire les pertes alimentaires de 22% en trois mois", "_sources": ["test22#24"]}, {"t": "La sonorité naturelle qui berce l'océan depuis des millions d'années a presque disparu, éclipsée par les bruits artificiels générés depuis la première guerre industrielle.\nLe bio acousticien Michel André alerte sur cette nuisance invisible qui menace la vie marine : la cacophonie engendrée par les activités humaines. A la différence de la lumière qui pénètre qu'à quelques mètres sous l'eau et n'est d'aucune utilité pour transmettre des informations sur de longues distances, le son, lui, se propage à des centaines de kilomètres. Heureusement, le bruit, dès qu'on le coupe, n'a plus aucun effet. Si nous travaillons sur des méthodes pour éliminer ces sons produits par les êtres humains, la nuisance pourrait être diminuée.", "q": "De quoi est-il question dans cet article ?", "c": ["D'un moyen de communication inédit", "D'un système de guidage par ondes", "D'une innovation technologique", "D'une pollution imperceptible"], "a": 3, "k": "nuisance invisible qui menace la vie marine", "_sources": ["test22#28"]}, {"t": "L'épisode meurtrier de canicule, qui a entraîné la mort d'un si grand nombre de personnes du troisième âge en Europe, a imposé un nouveau défi sanitaire. « Une seule solution, la climatisation » a-t-on entendu à cette occasion. La revue Durable, chantre du développement durable, s'insurge contre cette facilité. « Le but n'est pas de condamner la climatisation par principe, notamment dans les hôpitaux et les foyers de personnes âgées, mais celle-ci crée des tensions sur le réseau électrique ; donc, avant de l'installer, il serait bon de considérer d'autres moyens efficaces tels que les systèmes de circulation d'eau, appareillage sophistiqué de stores orientables jouant avec la brise et le rayonnement, etc. »", "q": "Que reproche la revue Durable à la climatisation ?", "c": ["Elle est simple à mettre en place, mais aussi très couteuse.", "Elle est source d'infection pour des patients déjà fragiles.", "Elle entraine une trop grande consommation d'énergie.", "Elle concurrence des modes naturels de rafraîchissement de l'air."], "a": 2, "k": "celle-ci crée des tensions sur le réseau électrique", "_sources": ["test25#23"]}], "devoirs": [{"t": "Lettre à G, un documentaire passionnant\nLes 4 jeunes réalisateurs de ce documentaire consacré au philosophe-journaliste André Gorz ont décidé de tourner ce film, après avoir découvert sa pensée presque par hasard. Ni pédagogique, ni austère, ni alarmiste, c'est, une œuvre qui ouvre l'horizon et arrive à point nommé pour nous rappeler que l'écologie politique peut être une renaissance. Elle propose, en même temps qu'une découverte de cet auteur atypique, une lecture claire de son projet d'émancipation sociale à l'heure de l'urgence écologique. Car même si le contexte actuel est grave, la somme des connaissances psychologiques et scientifiques favorise, selon lui, « des possibilités d'émancipation, de développement et d'enrichissement de la vie qui n'ont jamais existé avant", "q": "Dans cet article, qu'apprend-on sur André Gorz ?", "c": ["Il dissocie environnement et questions sociales.", "Il envisage avec optimisme les futurs possibles.", "Il reste sceptique envers les scientifiques.", "Il s'associe à l'écriture d'un documentaire."], "a": 1, "k": "des possibilités d'émancipation, de développement et d'enrichissement de la vie", "_sources": ["test25#27"]}, {"t": "En Provence et sur la Côte d'Azur, les campagnes sont jalonnées d'oliviers, d'orangers et autres pruniers dont les fruits ne sont jamais ramassés. À Grasse, l'association d'insertion « Renouer » a eu l'excellente idée de valoriser ces denrées pour s'auto-financer. Depuis 2012, la structure intervient dans les vergers de particuliers via des cueillettes dites solidaires. « Nous répertorions des parcelles laissées en friche et nous proposons aux propriétaires de ramasser les fruits à leur place » précise Sophie Allain, bénévole qui coordonne l'opération. Tous les ans, l'action mobilise entre 10 et 15 employés en insertion ainsi que des citoyens séduits par la dimension à la fois sociale et écologique de l'initiative.", "q": "Quelle est l'activité de cette association ?", "c": ["Elle cultive des espaces verts abandonnés.", "Elle réalise de petits services d'entretien.", "Elle récolte les produits de terrains privés.", "Elle s'occupe de gérer des jardins collectifs."], "a": 2, "k": "nous proposons aux propriétaires de ramasser les fruits à leur place", "_sources": ["test27#20"]}, {"t": "Plus de trente monnaies locales circulent en France, la plupart sont créées et pilotées par des groupes de citoyens. En version papier ou exclusivement numériques, elles dessinent une nouvelle carte économique des villes, fondées sur le développement local des entreprises et la promotion des circuits courts. Ces nouveaux moyens complémentaires se veulent aussi des outils de réappropriation de l'économie locale par les habitants. Si leurs effets sur l'environnement sont moins mesurables que les impacts économiques et sociaux, les monnaies locales restent des outils intéressants pour encourager l'adoption de comportements plus écologiques. Elles orientent ainsi le consommateur vers des acteurs économiques plus respectueux de la planète.", "q": "Selon cet article, quel intérêt présentent les monnaies locales ?", "c": ["Elles concurrencent le marché numérique.", "Elles contribuent à protéger l'environnement.", "Elles favorisent l'épargne des citoyens.", "Elles sécurisent les modes de paiement."], "a": 1, "k": "encourager l'adoption de comportements plus écologiques", "_sources": ["test27#24"]}, {"t": "Dans les villes françaises, les arbres ont poussé tout l'hiver ! Insatiables capteurs de CO2, ils sont surtout de puissants climatiseurs. Devant l'urgence, il faudrait en planter partout, dans les moindres interstices, et vite. Depuis des années, l'organisation Mondiale de la Santé recommande un verdissement maximum des villes, insistant sur l'action de la nature quant à la réduction potentielle de l'exposition à la pollution de l'air, au bruit et à la chaleur excessive. Mais sur le terrain, la mise en œuvre de tels programmes ne coule pas de source. Le temps des politiques n'est pas le temps de l'arbre. Pour qu'il rende pleinement les services qu'on attend de lui, il lui faut des dizaines d'années, un accès à l'eau, de l'espace, des congénères, un environnement écologique...", "q": "Que pense ce journaliste de l'arborisation des villes ?", "c": ["Elle a peu d'action sur le dérèglement climatique.", "Elle demande trop d'entretien aux petites villes.", "Elle doit figurer dans les programmes électoraux.", "Elle est incompatible avec les objectifs politiques."], "a": 2, "k": "Le temps des politiques n'est pas le temps de l'arbre", "_sources": ["test27#29"]}, {"t": "Selon plusieurs scientifiques, les nouvelles solutions « écologiques » Comme la voiture électrique, tendent en fait à accroitre l'activité économique et ne pourront pas préserver notre modèle de développement. Au-delà du double écueil de la fabrication des voitures électriques qui est énergivore et génère beaucoup de déchets, le problème des technologies dites « vertes » est principalement dû à l'effet rebond, c'est-à-dire l'augmentation de l'activité globale qu'entraîne toute découverte ou amélioration technologique. Ainsi, une véritable approche écologique devrait obligatoirement comporter une part de sobriété, grâce à laquelle le progrès technique servirait une réduction de la consommation.", "q": "Que pense l'auteur des nouvelles solutions écologiques ?", "c": ["Il déconseille au grand public de les adopter.", "Il estime qu'elles sont insuffisamment promues.", "Il remet en question leurs retombées positives.", "Il révèle qu'elles contribuent au déclin industriel."], "a": 2, "k": "l'effet rebond, c'est-à-dire l'augmentation de l'activité globale", "_sources": ["test29#26"]}, {"t": "Le son aigu des petites voix résonne au rythme des couverts. Chaque midi, les enfants de l'école maternelle Rochechouart à Paris s'asseyent autour des tables du restaurant scolaire avec une nouvelle habitude : trier leurs déchets à l'issue du déjeuner. Pour instaurer ce nouveau geste, les enfants ont appris ce qu'étaient les biodéchets. Ils deviennent ainsi des ambassadeurs du tri. Les parents risquent désormais de se faire rappeler à l'ordre s'ils ne trient pas leurs déchets à la maison. Plus on vieillit, plus il est difficile de changer ses habitudes, d'où l'intérêt de commencer dès le plus jeune âge.", "q": "Que constate-t-on quand les enfants très jeunes apprennent à trier leurs déchets ?", "c": ["Ils allègent la tâche du personnel de cantine", "Ils attendent le repas avec impatience", "Ils servent d'exemple aux élèves plus âgés", "Ils incitent leur entourage à les imiter"], "a": 3, "k": "Ils deviennent ainsi des ambassadeurs du tri.", "_sources": ["test34#25"]}, {"t": "Écologique par nature, les solutions que nous proposons représentent un atout certain pour lutter contre les émissions de gaz à effet de serre. Audioconférence, visioconférence et messagerie vous évitent des déplacements inutiles, tout en vous permettant de contribuer à la préservation de la planète. En effet, une étude environnementale a calculé qu'en remplaçant 20 % des voyages d'affaires par des visioconférences, on économiserait 22 millions de tonnes de CO2 par an. Ensemble, agissons pour un monde plus vert !", "q": "Que propose cette entreprise ?", "c": ["Des outils de communication.", "Des voyages organisés.", "Une formation à l'écologie.", "Un système d'information."], "a": 0, "k": "Audioconférence, visioconférence et messagerie vous évitent des déplacements inutiles", "_sources": ["test39#28"]}, {"t": "Les villes se montrent soucieuses d'améliorer leur qualité de l'air.\nUne solution : la plantation d'arbres. En effet, les arbres filtrent les particules contenues dans l'atmosphère.\nMais la plantation d'arbres doit être réfléchie. Il est pertinent de mettre des arbres le long des axes de circulation pour protéger les habitations des polluants, mais aussi dans les zones piétonnes. Le choix des arbres a aussi son importance. Les espèces d'arbres plantées il y a 50 ans ne répondent pas aux besoins d'aujourd'hui, car elles forment un couvercle retenant au sol la pollution. En revanche, les arbres aux feuilles poilues sont, eux, efficaces.", "q": "À quelle condition les arbres peuvent-ils aider à combattre la pollution urbaine ?", "c": ["S'ils appartiennent à une espèce adéquate.", "S'ils ont des feuilles persistantes en hiver.", "S'ils ont été plantés il y a longtemps.", "S'ils se trouvent loin des zones de logement."], "a": 0, "k": "Le choix des arbres a aussi son importance.", "_sources": ["test40#25"]}]}, "Sante": {"cours": [{"t": "L'insecte pourrait devenir une solution économique à notre appétit de protéines. Vous attrapez trois grillons déshydratés et les enfournez dans votre bouche, vous voilà mangeur d'insectes. Vous contribuez à la préservation des ressources. En effet, il faut 10 kg de céréales pour produire 1 kg de bœuf ou 9 kg d'insectes. La demande mondiale de protéines va doubler et les insectes, c'est riche en protéines. Depuis l'an dernier, la communauté européenne subventionne les projets de recherche dans ce secteur. Les grands groupes alimentaires s'intéressent au sujet, mais attendent que les citoyens soient psychologiquement prêts.", "q": "Qu'apprend-on sur la production d'insectes ?", "c": ["C'est une réponse à des besoins alimentaires accrus", "Des recherches remettent en cause l'intérêt nutritif", "Elle s'avère moins rentable que les cultures de céréales", "Les citoyens exigent des garanties sanitaires"], "a": 0, "k": "La demande mondiale de protéines va doubler et les insectes, c'est riche en protéines.", "_sources": ["test1#24"]}, {"t": "Savoir opter pour la bonne route n'est pas tout. L'ultime clé pour gagner la course de la Route du rhum, c'est la connaissance de soi et tout particulièrement de ses rythmes de sommeil. C'est un des aspects les plus méconnus de la voile de compétition, mais c'est sur la faculté de récupération que peut se jouer un podium. Ainsi, Alain Gautier reconnait avoir perdu la dernière Route du rhum parce qu'il n'a pas su, dès les premiers jours de la course, gérer correctement ses phases de repos. « à la fin, j'ai manqué de lucidité et j'ai commis des erreurs », avoue-t-il après sa défaite.", "q": "Quel conseil donne le journaliste pour remporter la course ?", "c": ["Connaître ses adversaires", "Cultiver sa concentration", "Dormir efficacement", "Ménager ses efforts"], "a": 2, "k": "c'est la connaissance de soi et tout particulièrement de ses rythmes de sommeil", "_sources": ["test2#23", "test6#23"]}, {"t": "Longtemps délaissées, les algues semblent peu à peu séduire les consommateurs\n\nEn raison de leur confusion avec les algues vertes qui p
