olluent le littoral, ces légumes de mer sont parfois mal considérés. Pourtant, si les algues ne font pas encore partie de notre univers culturel alimentaire, leur consommation est en progression : « les occidentaux sont-ils prêts à en faire un produit courant ? », questionne le docteur Arnaud Cocaul. Pas sûr. « Malgré leurs bienfaits nutritionnels. Leur consommation restera sans doute limitée », estime ce nutritionniste.", "q": "Quelle place occupent les algues en France ?", "c": ["Elles font partie de la gastronomie régionale", "Les gens en mangent plus que par le passé", "Les médecins conseillent leur usage en cuisine", "Leur culture augmente rapidement sur les côtes"], "a": 1, "k": "leur consommation est en progression", "_sources": ["test2#26"]}, {"t": "Le rapport de l'Agence internationale de l'énergie se concentre sur les données de la dernière conférence climatique. Il contient une information intéressante : d'après l'agence, les réserves mondiales de gaz sont plus importantes que prévues. Le marché mondial serait même sous la menace d'un excédent massif, en raison de l'essor de la production américaine et d'une chute de la demande liée à la crise.", "q": "Qu'a révélé le rapport de l'Agence internationale de l'énergie ?", "c": ["La consommation de gaz dans le monde augmente", "La demande croissante en gaz a des effets sur le climat", "Les besoins en gaz des Américains sont supérieurs à l'offre", "Les ressources en gaz à l'échelle mondiale s'accroissent"], "a": 3, "k": "les réserves mondiales de gaz sont plus importantes que prévues", "_sources": ["test4#26"]}, {"t": "Un Français sur quatre renonce à se soigner faute de moyens. Beaucoup d'hôpitaux diminuent leur personnel et facturent plus cher leurs services aux malades. Le prix des médicaments a doublé en 20 ans. Les inégalités face aux soins s'aggravent.\nC'est pourquoi nous demandons au gouvernement de mettre en place le remboursement à 100 % des dépenses médicales, de faciliter l'installation des jeunes médecins dans les zones qui en manquent, de développer la prévention des maladies et de multiplier les centres médicaux avec des consultations gratuites !\nLa santé ne peut pas être un commerce !", "q": "Qu'est-ce qui indigne l'auteur de cet article ?", "c": ["La multiplication des pathologies", "L'absence de programme politique", "Le manque de qualité des infrastructures", "L'incompétence du personnel de santé"], "a": 1, "k": "La santé ne peut pas être un commerce", "_sources": ["test6#28"]}, {"t": "Longtemps délaissées, les algues semblent peu à peu séduire les consommateurs.\n\nEn raison de leur confusion avec les algues vertes qui polluent le littoral, ces légumes de mer sont parfois mal considérés.\nPourtant, si les algues ne font pas encore partie de notre univers culturel alimentaire, leur consommation est en progression. Les Occidentaux sont-ils prêts à en faire un produit courant ? questionne le docteur Arnaud Cocaul. Pas sûr. Malgré leurs bienfaits nutritionnels, leur consommation restera sans doute limitée, estime ce nutritionniste.", "q": "Quelle place occupent les algues en France ?", "c": ["Elles font partie de la gastronomie régionale.", "Les gens en mangent plus que par le passé.", "Les médecins conseillent leur usage en cuisine.", "Leur culture augmente rapidement sur les côtes."], "a": 1, "k": "leur consommation est en progression", "_sources": ["test8#26"]}, {"t": "On dit souvent que, pour avoir un bon moral et résister au stress, il faut une bonne condition physique, c'est encore plus vrai en période d'examen où il faut s'astreindre à quelques règles d'hygiène simples pour une bonne concentration. Le cerveaux a besoin plus que jamais d'aliments et de nutriments variés pour être le plus efficace.\nPersonnellement, j'ai arrêté les sandwiches et le café, et privilégié les œufs (vitamine B9), les céréales (vitamine Bl), les viandes riches en Fer. L'iode avec les poissons et les Légumes verts.", "q": "Quelle conduite alimentaire a tenu cette étudiante pendant ses examens ?", "c": ["Elle a consommé des sucres lents.", "Elle a diversifié son alimentation.", "Elle a préféré sauter certains repas.", "Elle a privilégié les repas rapides."], "a": 1, "k": "j'ai arrêté les sandwiches et le café, et privilégié les œufs", "_sources": ["test12#22"]}, {"t": "Les publicités vantant les vertus supposées des produits alimentaires sur la santé seront soumises à des règles strictes. Les allégations liées à la santé se multipliant et sont de nature à tromper le public, car des aliments sont présentés comme des antidotes. Ainsi, une marque de yaourts suggère les effets antibactériens de son produit en montrant un enfant qui remet à la bouche son gâteau tombé dans le sable. Ce spot a été interdit d'antenne. Il serait criminel de laisser croire que l'aliment immunise l'enfant alors qu'il vient d'un endroit qui pullule de bactéries.", "q": "Pourquoi cette publicité pour le yaourt a-t-elle été interdite ?", "c": ["L'image proposée par la publicité nuisait au fabricant.", "Le produit vendu par la publicité était nocif pour la santé.", "Le message véhiculé par la publicité était inacceptable.", "L'usage du produit promu par la publicité était illicite."], "a": 2, "k": "Il serait criminel de laisser croire que l'aliment immunise l'enfant", "_sources": ["test12#28"]}, {"t": "Il est désormais possible de modifier la couleur des yeux. Une technique laser, expérimentée en laboratoire, détruit à vie les pigments de l'iris pour l'éclaircir. La séance se déroule dans le cabinet du spécialiste et en 20 secondes, les yeux du patient passent d'une couleur à l'autre. Mais, comme le laser décolore l'iris, seuls les yeux marrons peuvent espérer passer à une couleur plus claire.", "q": "Qu'apprend-t-on sur cette technique laser ?", "c": ["Elle est en cours de test", "Le changement est définitif", "Tout le monde peut en bénéficier", "Une hospitalisation est nécessaire"], "a": 1, "k": "détruit à vie les pigments de l'iris", "_sources": ["test14#23"]}, {"t": "La population d'insectes volants, essentiels aux écosystèmes, à diminuer de plus de 75 % en près de 30 ans en Allemagne sans que les scientifiques ne parviennent à en déterminer la cause avec certitude. Les chercheurs, qui ont mené leur étude dans des zones protégées en Allemagne depuis 1989, suspectent les pesticides agricoles d'être responsables de ce phénomène préoccupant. Selon leurs conclusions publiées dans la revue Plos one, se fort déclin a été observé quels que soient les changements météorologiques, le type d'exploitation des sols ou les caractéristiques de l'habitat", "q": "À quoi serait dû la baisse du nombre d'insectes ?", "c": ["L'urbanisation galopante des campagnes", "La faible étendue des réserves écologiques", "Le dérèglement climatique de la planète", "Les produits utilisés dans les cultures"], "a": 3, "k": "suspectent les pesticides agricoles d'être responsables de ce phénomène", "_sources": ["test14#24"]}, {"t": "Plus de 40% des espèces d'insectes sont en déclin et un tiers sont menacées. Leur taux de mortalité est huit fois plus rapide que celui des mammifères. À ce rythme, s'inquiètent les scientifiques, les insectes pourraient disparaître d'ici un siècle. Cette prévision est préoccupante car ils sont essentiels au bon fonctionnement de tous les écosystèmes. Ils pollinisent les plantes, recyclent les nutriments et servent de nourriture aux autres animaux. Leur disparition « aura des conséquences catastrophiques à la fois pour les écosystèmes de la planète et pour la survie de l'humanité ». « Si les modes de production alimentaire ne changent pas, les insectes dans leur ensemble s'engageront sur la voie de l'extinction dans quelques décennies », écrivent les chercheurs.", "q": "D'après l'article, qu'est-ce qui est à l'origine de la disparition des insectes ?", "c": ["Les changements de climat", "Les méthodes de culture", "Les oiseaux prédateurs", "Les politiques publiques"], "a": 1, "k": "Si les modes de production alimentaire ne changent pas", "_sources": ["test17#29", "test21#29", "test34#29"]}, {"t": "La prévision intéresse les démographes depuis longtemps, mais reste un art difficile. Un progrès très important a consisté, à partir des années 1960, à utiliser la méthode « des composantes » dans laquelle la population projetée résulte des niveaux de fécondité, de mortalité et de migrations choisis, la projection d'une année à l'autre se faisant âge par âge et pour chaque sexe séparément. Cette méthode est beaucoup plus fiable qu'une simple extrapolation de la population totale ou de son taux d'accroissement parce qu'elle met en œuvre explicitement les trois facteurs déterminants dans l'évolution d'une population : les tendances de la mortalité, de la fécondité et des migrations, avec pour chacune des taux par sexe et âge pouvant évoluer au cours de la projection. L'art (ou la difficulté) de la projection consiste alors à faire des choix pour ces tendances, mais on peut aussi relier celles-ci à l'évolution prévue d'autres facteurs, comme les pratiques contraceptives ou les progrès en matière de santé, et envisager divers scénarios.", "q": "Quelle est la méthode « des composantes » utilisée par les démographes selon le texte ?", "c": ["Elle consiste à extrapoler la population totale ou son taux d'accroissement", "Elle consiste à projeter la population en fonction des niveaux de fécondité, de mortalité et de migrations", "Elle consiste à relier la population à l'évolution prévue d'autres facteurs, comme les pratiques contraceptives ou les progrès en matière de santé", "Elle consiste à envisager divers scénarios pour la population en fonction des tendances de la mortalité, de la fécondité et des migrations"], "a": 1, "k": "la population projetée résulte des niveaux de fécondité", "_sources": ["test18#26"]}, {"t": "Mario Leno\nAvenue d'Italie\n76500 Paris\n\nSociété immobilière\n30 boulevard Raspail\n750600 Paris\n\nParis, le 26 janvier\nJe vous écris pour vous faire part des nuisances sonores provoquées par les locataires du 7ème étage.\nIls écoutent de la musique jusque tard dans la nuit à un volume qui ne me permet pas de dormir dans de bonnes conditions. Je leur ai demandé plusieurs fois de baisser le son et de faire attention à l'heure, mais ils ne m'ont pas écouté.\nJe vous demande de bien vouloir agir afin qu'ils changent de comportement au plus vite.\nCordialement,\nMario Leno", "q": "Quel est l'objet de ce courriel ?", "c": ["C'est un dépôt de plainte destiné aux services de police", "C'est une lettre de menace destinée à des voisins bruyants", "C'est une mise en demeure destinée à un propriétaire", "C'est une réclamation destinée au gérant d'un immeuble"], "a": 3, "k": "nuisances sonores provoquées par les locataires", "_sources": ["test22#25"]}, {"t": "Direction l'Italie pour découvrir la brigade des fromages\nUn département entier de policiers situé à Rome traque les imitations alimentaires et notamment celle du plus célèbre des fromages italiens, le parmesan. Ils ont, en effet, fort à faire avec des meules de parmesan AOP (appellation d'origine protégée) qui peuvent valoir plusieurs milliers d'euros. Le parmesan représente 900 ans de tradition concentrés entre les mains de 350 fabricants dans le nord de la péninsule, un savoir fièrement défendu par cette brigade.", "q": "Quel est l'objectif de cette brigade spéciale ?", "c": ["Contrôler la qualité sanitaire des fromages", "Empêcher le trafic des fromages de contrebande", "Enquêter sur les vols de fromage de luxe", "Protéger les secrets d'élaboration des fromages"], "a": 1, "k": "traque les imitations alimentaires", "_sources": ["test22#27"]}, {"t": "Plus de 40% des espèces d'insectes sont en déclin et un tiers sont menacés. Leur taux de mortalité est huit fois plus rapide que celui des mammifères. A ce rythme, s'inquiètent les scientifiques, les insectes pourraient disparaitre d'ici un siècle. Cette prévision est préoccupante, car ils sont essentiels au bon fonctionnement de tous les écosystèmes. Ils pollinisent les plantes, recyclent les nutriments et servent de nourriture aux autres animaux. « Si les modes de production alimentaire ne changent pas, les insectes dans leur ensemble s'engageront sur la voie de l'extinction dans quelques décennies », écrivent les chercheurs.", "q": "D'après l'article, qu'est-ce qui est à l'origine de la disparition des insectes ?", "c": ["Les changements de climat.", "Les méthodes de culture.", "Les oiseaux prédateurs.", "Les politiques publiques."], "a": 1, "k": "Si les modes de production alimentaire ne changent pas", "_sources": ["test23#29"]}, {"t": "Dans la nuit de samedi à dimanche, il faudra retarder ses montres à 3 heures, il sera en fait 2 heures. Ce changement est conçu pour économiser de l'énergie en profitant des périodes de jour plus longues l'été. Selon un sondage, les Français seraient majoritairement contre cette pratique. Ils mettent en avant un impact négatif sur « le sommeil, l'alimentation ou l'humeur ». Cependant un rapport de Sénat de l'année dernière assurait que le monde médical restait partagé sur l'existence de troubles imputables à l'heure d'été, mais que de nombreux pharmaciens faisaient état d'une augmentation de leurs ventes de médicaments au moment du changement d'heure, encore qu'aucune étude scientifique ne puisse l'attribuer à ce seul facteur.", "q": "Qu'apprend-on sur le passage à l'heure d'hiver ?", "c": ["Il est difficile d'en évaluer l'impact sur la santé.", "Il permet la consommation de médicaments.", "Le sénat a toujours refusé de voter une loi sur le sujet.", "Les Français sont encore attachés à cette tradition."], "a": 0, "k": "le monde médical restait partagé sur l'existence de troubles", "_sources": ["test26#28"]}, {"t": "Dans une société qui ne tolère plus l'attente, est-il possible d'éviter la frustration lorsqu'on patiente à la caisse d'un supermarché ? La question préoccupe les grandes chaînes commerciales. Il existe plusieurs systèmes pour optimiser l'organisation des files d'attente et, pour les départager, il faut faire appel à la stratégie. Si une seule file très longue peut être décourageante, proposer plusieurs files plus courtes présente un autre inconvénient : celui de devoir en choisir une. Or, se trouver en situation de devoir faire un choix peut générer de l'incertitude, du stress et de la colère.", "q": "Qu'apprend-on sur les files d'attente ?", "c": ["Chaque magasin met en place son propre système.", "Elles diminuent avec l'automatisation des caisses.", "L'optimisation de leur gestion est en cours d'étude.", "Leur multiplication réduit le stress des consommateurs."], "a": 2, "k": "il existe plusieurs systèmes pour optimiser l'organisation des files d'attente", "_sources": ["test28#25"]}, {"t": "7116 TONNES\nC'est la quantité de médicaments non utilisés qui dorment dans les armoires des Français. Pour les inciter à les ramener en pharmacie, l'Association santé environnement France (Asef) lance une grande opération. Des tampons avec l'inscription « rapportez vos médicaments non utilisés à votre pharmacie, vont être remis aux 1 500 médecins et professionnels de santé adhérents de l'Asef. Ces derniers pourront les appliquer sur les ordonnances pour sensibiliser les patients au gaspillage des médicaments.", "q": "Sur quoi repose le bon fonctionnement de l'opération lancée par l'Asef ?", "c": ["L'efficacité d'un slogan choc.", "La coopération de ses membres.", "La distribution de brochures.", "La promotion en ligne de la campagne."], "a": 1, "k": "remis aux 1 500 médecins et professionnels de santé adhérents de l'Asef", "_sources": ["test29#27"]}, {"t": "La décision du gouvernement d'abattre 40 loups a fait grincer les dents d'un grand nombre d'organisations non gouvernementales. L'espèce est en effet sur la liste rouge des animaux en voie d'extinction de l'Office National de la Chasse et de la Faune Sauvage. Selon une étude scientifique récente, la disparition du loup dans le parc de Yellowstone aux États-Unis a perturbé tout un écosystème. Certaines espèces consommatrices d'arbres et d'arbustes que le canidé chassait ont proliféré au point de menacer la végétation. De surcroit, le loup aurait d'autres bienfaits : prédateur opportuniste, il cible les proies les plus fragiles ou en mauvaise santé favorisant ainsi la vigueur des espèces qu'il traque.", "q": "Qu'apprend-on sur les loups ?", "c": ["Ils ont de moins en moins d'espace naturel.", "Ils permettent de protéger la biodiversité.", "Ils représentent un danger exagéré.", "Ils sont décimés par la maladie."], "a": 1, "k": "disparition du loup dans le parc de Yellowstone aux États-Unis a perturbé tout un écosystème", "_sources": ["test30#22"]}, {"t": "Le rapport de l'Agence Internationale de l'Energie se concentre sur les données de la dernière conférence climatique. Il contient une information intéressante : d'après l'agence, les réserves mondiales de gaz sont plus importantes que prévues. Le marché mondial serait même sous la menace d'un excédent massif, en raison de l'essor de la production américaine et d'une chute de la demande liée à la crise.", "q": "Qu'a révélé le rapport de l'Agence Internationale de l'Energie ?", "c": ["La consommation de gaz dans le monde augmente.", "La demande croissante en gaz a des effets sur le climat.", "Les besoins en gaz des Américains sont supérieurs à l'offre.", "Les ressources en gaz à l'échelle mondiale s'accroissent."], "a": 3, "k": "les réserves mondiales de gaz sont plus importantes que prévues", "_sources": ["test32#26"]}], "devoirs": [{"t": "En dix ans le nombre de sources lumineuses sur la voie publique - panneaux publicitaires, lampadaires - a progressé en France de 30%. Première conséquence de cette consommation électrique : 50% de la population ne peut plus voir les étoiles. Seconde conséquence : la disparition des papillons, moustiques et autres insectes, qui tournent jusqu'à épuisement la nuit sous les lampadaires ou meurent grillés.", "q": "Que déplore l'auteur du texte ?", "c": ["La multiplication des éclairages publics", "La prolifération des insectes nocturnes", "La suppression des supports publicitaires", "Le montant élevé des frais d'électricité"], "a": 0, "k": "le nombre de sources lumineuses sur la voie publique - panneaux publicitaires, lampadaires - a progressé en France de 30%", "_sources": ["test34#23"]}, {"t": "Quand on choisit une voiture, on compare les prix et les performances avant de faire son choix. Mais quand il s'agit d'une prothèse de hanche ou de sein, on prend ce que le spécialiste impose. On ne se sent souvent ni le droit, ni le courage, ni la capacité de vérifier si le matériel proposé est le plus adapté ou si le médecin est sous influence des fabricants. Ce qui explique cette confiance totale accordée au médecin. Cet abandon du patient à son médecin ou à l'hôpital exigent donc en retour une éthique et un professionnalisme sans faille de l'univers médical qui doit notamment se protéger du marketing très agressif des fabricants du matériel.\n\nD'après Le Soir", "q": "Que souligne l'article au sujet des prothèses ?", "c": ["Le coût des dispositifs pose un problème d'éthique.", "Le respect de la déontologie médicale est primordial.", "Les fabricants d'implants doivent signer une charte.", "Les patients ont le devoir de s'informer davantage."], "a": 1, "k": "Cet abandon du patient à son médecin ou à l'hôpital exigent donc en retour une éthique et un professionnalisme sans faille de l'univers médical", "_sources": ["test36#27"]}, {"t": "Est-on plus heureux\nquand on est riche?\nquand on croit en Dieu?\nquand on vit en couple?\nDepuis quelques décennies, de nombreuses recherches concernant le bien-être sont menées sur les facteurs sociaux et psychologiques qui favorisent ou non le bonheur. On pourrait penser que le bien-être est un phénomène subjectif, inaccessible donc à l'investigation scientifique et à la mesure. Or, grâce à des instruments divers mis en place depuis plus de trente ans pour mesurer le niveau de satisfaction de vie des individus et des populations, des méthodologies diverses ont été mises au point pour permettre de mesurer la qualité de vie telle qu'elle est perçue.", "q": "Qu'apprend-on sur le bien-être dans cet article ?", "c": ["C'est un état difficile à évaluer chez une personne.", "Des outils ont été élaborés pour en estimer l'intensité.", "Les enquêtes dont le sujet sont innombrables.", "Malgré des études sérieuses, l'analyse est impossible."], "a": 1, "k": "grâce à des instruments divers mis en place depuis plus de trente ans pour mesurer le niveau de satisfaction de vie des individus et des populations", "_sources": ["test36#28"]}, {"t": "On dit souvent que, pour avoir un bon moral et résister au stress, il faut une bonne condition physique c'est encore plus vrai en période d'examen où il faut s'astreindre à quelques règles d'hygiène simples pour une bonne concentration. Le cerveaux a besoin plus que jamais d'aliments et de nutriments variés pour être le plus efficace. Personnellement, j'ai arrêté les sandwiches et le café, et privilégié les œufs (vitamine B9), les céréales (vitamine B1), les viandes riches en Fer. L'iode avec les poissons et les Légumes verts.", "q": "Quelle conduite alimentaire a tenu cette étudiante pendant ses examens ?", "c": ["Elle a consommé des sucres lents.", "Elle a diversifié son alimentation.", "Elle a préféré sauter certains repas.", "Elle a privilégié les repas rapides."], "a": 1, "k": "j'ai arrêté les sandwiches et le café, et privilégié les œufs", "_sources": ["test38#22"]}, {"t": "7 116 TONNES\n\nC'est la quantité de médicaments non utilisés qui dorment dans les armoires des Français. Pour les inciter à les ramener en pharmacie, l'Association santé environnement France (Asef) lance une grande opération. Des tampons avec l'inscription « rapportez vos médicaments non utilisés à votre pharmacie, vont être remis aux 1 500 médecins et professionnels de santé adhérents de l'Asef. Ces derniers pourront les appliquer sur les ordonnances pour sensibiliser les patients au gaspillage des médicaments.", "q": "Sur quoi repose le bon fonctionnement de l'opération lancée par l'Asef ?", "c": ["L'efficacité d'un slogan choc.", "La coopération de ses membres.", "La distribution de brochures.", "La promotion en ligne de la campagne."], "a": 1, "k": "vont être remis aux 1 500 médecins et professionnels de santé adhérents de l'Asef.", "_sources": ["test38#27"]}]}, "Technologie": {"cours": [{"t": "Le droit à l'oubli sur Internet est fondamental. Aujourd'hui, Internet nous expose à des risques, en mettant à portée d'institutions ou d'entreprises des informations personnelles que nous avons oubliées ou que nous souhaitons oublier. Or l'oubli, autant que la mémoire, est essentiel à l'humain pour être capable d'agir et de fonctionner dans le présent. Un spécialiste de la question propose une solution. Si les gens ont envie de sauvegarder des informations les concernant, ils y attacheront une date d'expiration. Les citoyens doivent choisir eux-mêmes ce qui, de leurs informations personnelles, sera retenu ou effacé. Cela ne doit pas résulter du choix de grosses sortes ou de gouvernements.", "q": "Pourquoi le droit à l'oubli sur Internet est-il important ?", "c": ["Pour aider à faire le deuil du passé", "Pour alléger le stockage des données", "Pour faire obstacle aux multinationales", "Pour rester maître de sa vie privée"], "a": 3, "k": "Les citoyens doivent choisir eux-mêmes ce qui, de leurs informations personnelles, sera retenu ou effacé.", "_sources": ["test1#26"]}, {"t": "Théo, la poupée « inter-affective »\n\nThéo a deux ans, il mesure 52 cm et communique spontanément avec sa maman. Lancé par Berchet, ce robot est bourré d'électronique et de capteurs pour interagir avec l'enfant. Ainsi, Théo dort lorsqu'il fait nuit, se réveille au lever du jour, réclame à manger ou à boire et même à aller au pot. Sa voix numérisée est d'un naturel confondant. Surtout, il s'adapte aux capacités de jeux de chaque enfant : plus il manifestera son désir de jouer, plus le jeu sera réactif.", "q": "La voix numérisée de Théo est d'un « naturel confondant », ce qui signifie qu'elle …", "c": ["A un timbre qui n'existe pas naturellement", "Se confond avec la voix de l'enfant qui joue", "Enregistre et reproduit les voix entendues", "Imite à la perfection la voix d'un enfant"], "a": 3, "k": "Sa voix numérisée est d'un naturel confondant.", "_sources": ["test2#21"]}, {"t": "En écrivant à la main, chacun trouve sa manière de tracer son rythme et choisit son moment et ses mots. Le monde de la communication par textos, lui, est celui d'une communication homogène. Avec la numérisation des échanges, on ne connait plus l'attente d'une lettre ou d'une carte postale. Rendez-vous avec un ami : un SMS pour prévenir qu'on arrive dans cinq minutes, un autre dès qu'on est arrivé, un autre si on est en retard. Bienvenue dans un monde sans attente, où tous les vides doivent être comblés.", "q": "Qu'apprend-on sur la communication numérique ?", "c": ["Elle appauvrit le lexique courant", "Elle modifie le rapport au temps", "Elle provoque la fin du courrier postal", "Elle transforme le geste graphique"], "a": 1, "k": "on ne connait plus l'attente d'une lettre ou d'une carte postale.", "_sources": ["test3#27"]}, {"t": "Marilyn Monroe\nÉtait une grande actrice et aussi une vraie énigme. Ce qui est frappant c'est que tout le monde l'aime. Il y a toujours, toutes générations confondues, une tendresse, une compréhension, un attachement à son égard. Son souvenir reste vif. Elle voulait que ce soit mieux, toujours plus intense. Elle était en quête d'absolu, ce qui se traduisait, à l'écran, par un don de soi total. Elle ne comptait pas. Et Marilyn Monroe continue de hanter les consciences parce qu'elle a donné plus que d'autres.", "q": "Selon l'auteur, qu'est-ce qui explique la passion du public pour l'actrice Marilyn Monroe ?", "c": ["L'affection qu'elle portait à ses admirateurs", "L'originalité qui caractérisait le choix de ses rôles", "La générosité qu'elle manifestait dans sa vie", "La séduction qui était son principal atout"], "a": 2, "k": "elle a donné plus que d'autres.", "_sources": ["test3#28"]}, {"t": "La ville chinoise de Chongging vient d'inaugurer des voies réservées aux « accro » du portable sur les trottoirs. Les piétons sont en effet nombreux à ne prêter aucune attention à leur entourage, au risque de provoquer des accidents. Un parcours délimité par des lignes blanches peintes au sol invite ceux qui ne quittent pas des yeux leur écran à les emprunter. L'idée de ce marquage n'est pas d'encourager l'usage des portables mais d'inciter chacun à réfléchir à la place qu'il leur donne dans son quotidien et à faire attention aux autres.", "q": "Quel est l'objectif de cette initiative concernant les portables ?", "c": ["Faciliter leur utilisation dans l'ensemble de la commune", "Faire prendre conscience des excès liés à leur usage", "Instaurer de nouvelles règles de priorité de circulation", "Multiplier les espaces publicitaires le long des avenues"], "a": 1, "k": "d'inciter chacun à réfléchir à la place qu'il leur donne dans son quotidien et à faire attention aux autres", "_sources": ["test5#23"]}, {"t": "\"Pendant des millénaires, les chercheurs du monde entier ont jalousement gardé leurs données. Essentiellement parce qu'ils pensaient que le contrôle de l'information donnait le pouvoir\"\ndéclare le conservateur en paléontologie au musée d'Histoire naturelle de Londres. Les mentalités ont changé depuis quelques années à partir du moment où les savants ont pris conscience des bénéfices du travail collaboratif et du partage de l'information.\nCependant, vouloir échanger entre chercheurs et parvenir à le faire correctement sont deux choses très différentes, c'est ce que constatent les invités d'une conférence internationale sur la biodiversité qui se tient dans la capitale britannique.", "q": "Que souhaitent actuellement les chercheurs ?", "c": ["Mettre en commun les données.", "Multiplier les colloques internationaux", "Protéger les résultats de leurs études", "Vulgariser l'information scientifique"], "a": 0, "k": "les savants ont pris conscience des bénéfices du travail collaboratif et du partage de l'information", "_sources": ["test5#29"]}, {"t": "Paris, le 13 mars\nMadame, Monsieur,\nCe courrier fait suite à mon achat d'un téléphone le 5 mars dernier. Après réflexion, je souhaiterais le rendre car l'ai finalement décidé d'acheter un appareil avec messagerie intégrée.\nAinsi, je vous prie de bien vouloir me restituer la somme de 80 euros, correspondant à la somme versée le 5 mars par chèque.\nDans l'attente de votre réponse, je vous transmets, Madame, Monsieur, mes meilleures salutations.\nAndré Cellier", "q": "Quel est l'objet de la lettre de monsieur Cellier ?", "c": ["Le remboursement de son article.", "L'échange de son téléphone.", "L'envoi de son téléphone par la poste.", "Une réclamation sur son achat."], "a": 0, "k": "je vous prie de bien vouloir me restituer la somme de 80 euros", "_sources": ["test7#20"]}, {"t": "Éducation numérique\nIl n'y a presque plus aujourd'hui de manuel scolaire qui paraisse sans avoir une double traduction, numérique et en ligne. C'est devenu le standard de la production au terme d'une mutation très rapide. Mais cependant, nous restons en proximité forte avec le manuel classique. De nouvelles applications qui seraient déconnectées du livre papier ne nous paraissent pas encore à ce stade conformes à notre mission, ni répondre aux attentes de la majorité des enseignants. En outre, cela ne correspond pas à l'équipement de la très grande majorité des établissements. Autrement dit, les conditions d'un changement d'ensemble ne sont pas réunies.\nM. Huet, éditeur de manuels scolaires", "q": "Quelle est la position de cet éditeur de manuels sur la croissance du support numérique ?", "c": ["Il considère que l'ère du support papier est définitivement terminée.", "Il estime qu'il reste du travail à faire pour mieux préparer cette évolution.", "Il juge indispensable de n'utiliser que les supports électroniques.", "Il pense qu'il faut privilégier le contact des élèves avec l'outil Internet."], "a": 1, "k": "les conditions d'un changement d'ensemble ne sont pas réunies", "_sources": ["test7#23"]}, {"t": "En rendant accessible à tout moment une multitude d'informations, Internet modifie profondément notre relation à la connaissance. Il serait pourtant tout à fait illusoire d'imaginer que ce qui est accessible sur la Toile n'a pas besoin d'être appris pour la simple raison de sa disponibilité permanente, car posséder tous les livres du monde, comme pouvoir accéder à tous les sites du monde, ne se substitue pas à la connaissance. Avoir accès par la Toile aux mêmes informations ne compense absolument pas l'absence d'apprentissage.", "q": "D'après l'article, de quelle manière Internet agit-il sur nous ?", "c": ["Il change notre regard sur les livres.", "Il facilite la mémorisation de nouveaux concepts.", "Il revalorise la culture transmise par l'école.", "Il transforme notre rapport au savoir."], "a": 3, "k": "Internet modifie profondément notre relation à la connaissance", "_sources": ["test7#28"]}, {"t": "Aux débuts d'Internet, je me souviens d'avoir lu, éberluée, dans un magazine féminin « Mon mari était absent, il passait tout son temps sur le chat », et j'en étais à tenter de visualiser ce triste état de fait lorsque je compris ma méprise : avoir confondu le chat, le félidé, avec le chat, la discussion sur Internet. Depuis ce jour, aucun progrès sur cette équivoque terrible de la langue, alors que l'usage informatique du mot souris démultiplie les sources de confusions. Le bon sens voudrait que la phonétique l'emporte et que l'on écrive « tchat ». Au lieu de cette solution évidente, le Petit Larousse a laissé entrer en 2004 dans le dictionnaire le monstrueux mot-valise « clavardage ».", "q": "Qu'est-ce qui dérange l'auteur de ce texte ?", "c": ["L'abus d'anglicismes en langage informatique.", "L'ambiguïté du néologisme « chat » à l'écrit.", "Le laxisme orthographique dans les forums.", "Le manque d'imagination des lexicologues."], "a": 1, "k": "aucun progrès sur cette équivoque terrible de la langue", "_sources": ["test7#29", "test13#29", "test39#29"]}, {"t": "Localiser un boucher, trouver un hôtel, calculer son itinéraire, observer sa maison par satellite... Les cartes fleurissent sur le web et les internautes y sont accros.\nPlus de 13 millions de Français Consultent régulièrement des sites de localisation sur Internet. Sans oublier le succès phénoménal des photos-satellite mises en ligne. Ces services gratuits pour les internautes cachent un véritable business. De grandes sociétés rémunèrent les sites de localisation pour être bien placées sur les cartes. C'est d'autant plus efficace que les utilisateurs ne perçoivent pas immédiatement ces liens sponsorisés comme une publicité, mais comme un service.", "q": "Qu'apprend-on sur les services de localisation sur Internet ?", "c": ["Ce sont des réseaux de commerçants qui les ont créés.", "Ils sont financés discrètement par des entreprises.", "Les prestations qu'ils proposent sont payantes.", "Leur maintenance est assurée par des bénévoles."], "a": 1, "k": "De grandes sociétés rémunèrent les sites de localisation", "_sources": ["test10#24", "test12#25"]}, {"t": "Paris, le 13 mars.\nMadame, Monsieur,\nCe courrier fait suite à mon achat d'un téléphone le 5 mars dernier. Après réflexion, je souhaiterais le rendre car j'ai finalement décidé d'acheter un appareil avec messagerie intégrée.\nAinsi, je vous prie de bien vouloir me restituer la somme de 80 euros, correspondant à la somme versée le 5 mars par chèque.\nDans l'attente de votre réponse, je vous transmets, Madame, Monsieur, mes meilleures salutations.", "q": "Quel est l'objet de la lettre de monsieur Cellier ?", "c": ["A) L'échange de son téléphone.", "B) Le remboursement de son article.", "C) L'envoi de son téléphone par la poste.", "D) Une réclamation sur son achat."], "a": 1, "k": "je vous prie de bien vouloir me restituer la somme de 80 euros", "_sources": ["test13#21"]}, {"t": "Près de 500 écrans alignés sur deux étages et 1200 m²\nLa plus grande salle de jeux vidéo en réseau d'Europe a ouvert ses portes au public à Paris. Baignée dans une ambiance bleu métal et noire, cette salle de jeux à l'ambition de devenir à la fois un « stade numérique » où les professionnels et amateurs de jeux vidéo pourront s'affronter à l'occasion de joutes virtuelles, et une « école de jeux » pour les débutants. Une quinzaine d'animateurs sont constamment présents dans la salle pour guider et initier les joueurs et animer des tournois.", "q": "En quoi cette salle de jeux est-elle un événement ?", "c": ["Du fait de sa taille", "Du fait de sa localisation", "Du fait de sa décoration", "Du fait de son personnel"], "a": 0, "k": "La plus grande salle de jeux vidéo en réseau d'Europe", "_sources": ["test14#22"]}, {"t": "Au cœur de l'histoire\nRevisiter l'histoire de France à la lumière de la société contemporaine, c'est le concept du nouveau magazine proposé par la chaîne de télévision France 5. Les citoyens sont invités à interagir avec la présentatrice et ses invités en communiquant leurs propres témoignages et documents. L'émission se décline en deux temps, avec un documentaire suivi d'un débat en public entre témoins anonymes et acteurs de l'Histoire. Ce débat est construit en amont grâce à des récits d'internautes sur le site de l'émission. Tous ceux qui le souhaitent peuvent poster sur la toile vidéo, photos et anecdotes personnelles afin de croiser la petite et la grande Histoire.", "q": "De quelle façon peut-on contribuer à cette nouvelle émission ?", "c": ["En envoyant des courriels sur la plateforme de l'émission", "En étant sélectionné pour être convié sur le plateau", "En joignant le standard de la chaîne pendant le direct", "On participe à distance au moyen d'une cybercaméra"], "a": 0, "k": "Tous ceux qui le souhaitent peuvent poster sur la toile vidéo, photos et anecdotes personnelles", "_sources": ["test14#25"]}, {"t": "Dans un monde rationnel, l'innovation technologique devrait découler d'un besoin et y apporter une solution. Depuis quelques décennies, nous observons l'inverse, aussi bien dans le monde professionnel que dans celui de la vie privée. Nous nous voyons proposer un nouveau type de produit à la technologie révolutionnaire, nous lui trouvons avec jubilation une place dans notre vie, puis nous en devenons souvent prisonniers. De cette manière, ce que nous appelons le progrès devient incontrôlable et nous en devenons les suiveurs inconscients. Mon propos n'est certainement pas de condamner ni le progrès ni la consommation, mais de faire un plaidoyer pour que nous en soyons les maîtres et non les esclaves.", "q": "Quelle est l'idée de ce texte ?", "c": ["Le progrès passe par les nouvelles technologies.", "L'attrait de la nouveauté est incontournable.", "L'homme se laisse dominer par la technologie.", "La technologie est le reflet de la modernité."], "a": 2, "k": "nous en devenons souvent prisonniers", "_sources": ["test15#22"]}, {"t": "Les implants médicaux (prothèses mammaires, de hanche, etc.) sont censés vous améliorer la vie.\nMais des lacunes dans leur contrôle seraient à l'origine d'incidents en nombre croissant.\nOn apprend que, en France, le nombre d'incidents lié à ces implants aurait doublé en dix ans.", "q": "Quel problème révèle cet article à propos des implants médicaux ?", "c": ["Les données des malades sont transmises aux fabricants.", "Les incidents dus aux erreurs de diagnostic augmentent.", "Les patients se méfient des innovations technologiques.", "Les recherches sont limitées par le manque d'informations."], "a": 3, "k": "le nombre d'incidents lié à ces implants aurait doublé en dix ans", "_sources": ["test16#29"]}, {"t": "À l'ère des réseaux sociaux, il n'y a pas une table où les convives ne dégainent leur smartphone pour « poster » immédiatement leur assiette. Peu importe qu'elle refroidisse, que ce soit bon ou pas. Sur la toile, la cuisine est devenue l'univers le plus plébiscité avec le voyage. Et même si la vue des mets est un avant-goût du plaisir, réduire la cuisine à une galerie de natures mortes, aussi belles soient-elles, n'est pas sans interroger. « Pour moi, la bonne cuisine, c'est quand on soulève le couvercle, que ça fume, que ça sent bon et qu'on peut se servir », disait le grand cuisinier Paul Bocuse. Pour les réseaux sociaux, c'est un plat qui en met plein la vue et qu'on vous sert sur écran plat.", "q": "Qu'apprend-on dans cet article ?", "c": ["La réputation de restaurants touristiques est menacée par internet", "La technologie modifie la relation à la gastronomie", "Les grands chefs livrent leurs secrets sur des sites", "Les traditions culinaires peuvent se perpétuer grâce au numérique"], "a": 1, "k": "la cuisine est devenue l'univers le plus plébiscité avec le voyage", "_sources": ["test17#20"]}, {"t": "Éducation numérique\nIl n'y a presque plus aujourd'hui de manuel scolaire qui paraisse sans avoir une double traduction : numérique et en ligne. C'est devenu le standard de la production au terme d'une mutation très rapide. Mais cependant, nous restons en proximité avec le manuel classique. De nouvelles applications qui seraient déconnectées du livre papier ne nous paraissent pas encore à ce stade conformes à notre mission, ni répondre aux attentes de la majorité des enseignants. En outre, cela ne correspond pas à l'équipement de la très grande majorité des établissements. Autrement dit, les conditions d'un changement d'ensemble ne sont pas réunies.", "q": "Quelle est la proposition de cet éditeur de manuels sur la croissance du support numérique ?", "c": ["Il considère que l'ère du support papier est définitivement terminée", "Il estime qu'il reste du travail à faire pour mieux préparer cette évolution", "Il juge indispensable de n'utiliser que les supports électroniques", "Il pense qu'il faut privilégier le contact des élèves avec l'outil internet"], "a": 1, "k": "les conditions d'un changement d'ensemble ne sont pas réunies", "_sources": ["test17#23"]}, {"t": "Les termes « intelligence artificielle » entrainent généralement des inquiétudes. Pourtant, une étude menée auprès de 14.078 salariés, dans onze pays différents et dans plusieurs secteur d'activités (santé, transports, énergie …), tente de prouver que l'intelligence artificielle pourrait augmenter de 10%, en moyenne, les effectifs des entreprises ayant investi dans cette technologie. De plus, elle donnerait lieu à un changement radical de modèle et ouvrirait la possibilité pour les entreprises d'inventer des services et de s'ouvrir à de nouvelles opportunités.", "q": "Selon cet article, quelle est l'une des possibilités offertes par l'intelligence artificielle ?", "c": ["Baisser les salaires", "Créer des emplois", "Diviser le travail", "Favoriser la recherche"], "a": 1, "k": "augmenter de 10%", "_sources": ["test18#21"]}, {"t": "Le rêve des astronautes\nThomas Pesquet est un exemple pour tous les français. Pour réaliser son rêve de devenir astronaute, il a suivi un parcours d'excellence. Ses compétences ont d'abord été reconnues par l'Agence spatiale européenne. Puis, la sélection rigoureuse de la NASA est devenue le défi de sa carrière. Aujourd'hui, il séjourne à bord de la Station spatiale internationale pour mener des expériences scientifiques. Dans son temps libre, il partage ses photos et ses impressions sur les réseaux sociaux, dans l'espoir de faire découvrir l'espace au grand public. Désormais, son aventure fascine la plupart des médias. Il a ainsi donné plusieurs interviews et conférences depuis l'orbite. Le parcours de cet astronaute passionné d'aviation a été salué par de nombreux hommages.", "q": "Quel est le but des publications sur les réseaux sociaux de T. Pesquet ?", "c": ["Faire la promotion des agences spatiales qui l'emploient", "Faire participer les internautes à ses expériences", "Faire connaitre la vie et le travail des astronautes", "Faire rire ses collègues et ses amis avec son humour"], "a": 2, "k": "faire découvrir l'espace au grand public", "_sources": ["test18#27"]}], "devoirs": [{"t": "En Belgique, un studio de technologie créative propose au public de se livrer à une expérience artistique d'un genre inédit : coiffés d'un casque spécial, les participants doivent se remémorer une histoire personnelle durant trente à soixante secondes. Des données ressortent alors sous forme d'algorithmes et sont analysées par un système de mesure émotionnelle, ce qui permet de leur donner forme et couleur. Ainsi, des peintures virtuelles sont créées à partir des émotions de chacun. Et comme chaque histoire est unique, chaque œuvre l'est aussi !", "q": "Quel est le rôle des participants à cette expérience ?", "c": ["Effectuer un calcul.", "Évoquer un fait divers.", "Fournir un support.", "Sélectionner un souvenir."], "a": 3, "k": "les participants doivent se remémorer une histoire personnelle", "_sources": ["test19#22", "test27#22", "test29#23", "test33#22", "test37#22", "test38#23"]}, {"t": "SEIS sera le premier sismomètre déployé sur un autre sol que celui de la Terre. Sur Mars, cet instrument français va ausculter les séismes qui secouent la planète rouge et récolter des données qui permettront de déterminer si le noyau de la planète est liquide ou solide. Mars a le même âge que la planète Terre, mais il y a 3 ou 4 milliards d'années, toute vie y a cessé et elle est devenue une planète morte. Si nous savons déjà de quoi sont constituées son atmosphère et sa Surface, nous ignorons encore ce qui s'est produit à ce moment-là et ce qu'elle recèle dans son sous-sol.", "q": "Pourquoi SEIS a-t-il été envoyé sur Mars ?", "c": ["Pour comparer son histoire à celle de la Terre.", "Pour évaluer les possibilités d'aller y vivre.", "Pour expliquer son grand nombre de séismes.", "Pour obtenir des données sur sa composition."], "a": 3, "k": "récolter des données qui permettront de déterminer si le noyau de la planète est liquide ou solide.", "_sources": ["test20#25", "test26#25"]}, {"t": "Outre-manche, une jeune députée a attiré l'attention des médias et photographes en proposant un décret qui imposerait la mention « retouchée numériquement » sur toutes les photos corrigées. Le parti libéral démocratique a d'ailleurs approuvé cette proposition « je ne veux pas interdire aux publicitaires de recourir à des mannequins plus beaux que la femme de tous les jours, mais il y a une différence entre choisir la beauté et retoucher cette beauté pour atteindre des propositions impossibles en ce qui me concerne, par exemple, la taille des jambes », s'insurge la députée.", "q": "Que propose cette députée à propos des publicités mettant en scène des femmes ?", "c": ["D'interdire les photos portant atteinte à leur dignité", "De diversifier le type de femmes prises pour modèles", "De mentionner les références précises des produits", "De signaler sur les photos les modifications effectuées"], "a": 3, "k": "imposerait la mention « retouchée numériquement »", "_sources": ["test22#22"]}, {"t": "Prendre le métro à Lyon est devenu compliqué pour celui qui ne veut pas se faire racoler. En découvrant l'écran publicitaire géant installé à la station Bellecour, j'ai été sidéré. Le publicitaire qui a reçu la bénédiction des élus pour installer cet écran géant et près de cent écrans de télévision de 2m2 sur les quais, pour être fier de lui. Il se félicite d'ailleurs, Sur son site internet, de « susciter encore plus d'émotion ». Générer des sentiments de la peur ou de la joie, c'est s'assurer que le message publicitaire aura plus d'impact, il pourra alors vendre plus cher aux marques le droit d'accaparer toujours plus notre attention.", "q": "Quelle est l'attitude de l'auteur vis-à-vis de cette campagne publicitaire ?", "c": ["Il critique son concept.", "Il dénonce son coût élevé.", "Il doute se son efficacité.", "Il prédit son échec."], "a": 0, "k": "j'ai été sidéré", "_sources": ["test23#27"]}, {"t": "A l'ère des réseaux sociaux, il n'y a pas une table où les convives ne dégainent leur smartphone pour « poster » immédiatement leur assiette. Peu importe qu'elle refroidisse, que ce soit bon ou pas. Sur la toile, la cuisine est devenue l'univers le plus plébiscité avec le voyage. Et même si la vue des mets est un avant-goût du plaisir, réduire la cuisine à une galerie de natures mortes, aussi belles soient-elles, n'est pas sans interroger. « Pour moi, la bonne cuisine, c'est quand on soulève le couvercle, que ça fume, que ça sent bon et qu'on peut se resservir », disait le grand cuisinier Paul Bocuse. Pour les réseaux sociaux, c'est un plat qui en met plein la vue et qu'on vous sert sur écran plat.", "q": "Qu'apprend-on dans cet article ?", "c": ["La réputation de restaurants touristiques est menacée par internet.", "La technologie modifie la relation à la gastronomie.", "Les grands chefs livrent leurs secrets sur des sites.", "Les traditions culinaires peuvent se perpétuer grâce au numérique."], "a": 1, "k": "la cuisine est devenue l'univers le plus plébiscité avec le voyage", "_sources": ["test24#20"]}, {"t": "Madame, Monsieur, Ce courrier fait suite à mon achat d'un téléphone le 5 mars dernier. Après réflexion, je souhaiterais le rendre, car j'ai finalement décidé d'acheter un appareil avec messagerie intégrée. Ainsi, je vous prie de bien vouloir me restituer la somme de 80 euros, correspondant à la somme versée le 5 mars par chèque.\nDans l'attente de votre réponse, je vous transmets, Madame, Monsieur, mes meilleures salutations.\nAndré Cellier", "q": "Quel est l'objet de la lettre de Monsieur Cellier ?", "c": ["Le remboursement de son article.", "L'échange de son téléphone.", "L'envoi de son téléphone par la poste.", "Une réclamation sur son achat."], "a": 0, "k": "je vous prie de bien vouloir me restituer la somme de 80 euros", "_sources": ["test25#21"]}, {"t": "En Belgique, un studio de technologie créative propose au public de se livrer à une expérience artistique d'un genre inédit : coiffés d'un casque spécial, les participants doivent se remémorer une histoire personnelle durant trente à soixante secondes. Des données ressortent alors sous forme d'algorithmes et sont analysées par un système de mesure émotionnelle, ce qui permet de leur donner forme et couleur. Ainsi, des peintures virtuelles sont créées à partir des émotions de chacun. Et comme chaque histoire est unique, chaque œuvre l'est aussi", "q": "Quel est le rôle des participants dans cette expérience ?", "c": ["Effectuer un calcul.", "Évoquer un fait divers.", "Fournir un support.", "Sélectionner un souvenir."], "a": 3, "k": "les participants doivent se remémorer une histoire personnelle", "_sources": ["test25#22"]}, {"t": "Ma conviction est que l'économie collaborative, l'économie du partage, s'installe durablement. Elle repose sur la mise en réseau grâce au numérique et sur la quête de valeurs morales et culturelles. La crise économique en est un accélérateur, car ces pratiques permettent de consommer mieux pour moins cher ou de générer des revenus complémentaires. L'usage de ces services augmente à grande vitesse. Ainsi, 80% des 18-25 ans préféreraient vivre sans voiture que sans smartphone. Car la voiture, aujourd'hui, est dans le smartphone via le covoiturage, l'autopartage, la location entre particuliers ! L'accès à un bien devient plus pratique que sa possession. La question de demain sera : « Serez-vous assez intelligent pour ne pas posséder ? ».", "q": "Que constate l'auteur de cet article ?", "c": ["L'essor de nouveaux modes de consommation.", "La stagnation de la dépendance au numérique.", "Le développement des voitures ultra connectées.", "Le recul des difficultés économiques des ménages."], "a": 0, "k": "l'économie collaborative, l'économie du partage, s'installe durablement", "_sources": ["test26#26"]}, {"t": "Avec la technologie actuelle, il faut six à neuf mois pour un vol de la Terre à Mars. Pour connaître les effets de l'isolement spatial de longue durée, six volontaires ont joué les astronautes dans un dôme de 90 m² installé sur un volcan à Hawaï et qui faisait office de base martienne. Ils en sont ressortis dimanche, épuisés, mais heureux de respirer l'air frais et de converser avec d'autres humains. Pendant un an, ils sont restés ensemble en milieu fermé (avec quelques rares sorties en combinaison spatiale), ont mangé une nourriture déshydratée et effectuée des expériences pour améliorer les systèmes autonomes.", "q": "À quoi ont participé ces six personnes ?", "c": ["À un vol interstellaire vers une planète lointaine.", "À une expérience d'autosuffisance alimentaire.", "À une exploration de cratères de volcans.", "À une simulation de mission spatiale."], "a": 3, "k": "six volontaires ont joué les astronautes dans un dôme de 90 m² installé sur un volcan à Hawaï et qui faisait office de base martienne.", "_sources": ["test28#22"]}, {"t": "Théo, la poupée « inter-affective ».\nThéo a deux ans. Il mesure 52 cm et communique spontanément avec sa maman. Lancé par Berchet, ce robot est bourré d'électronique et de capteurs pour interagir avec l'enfant. Ainsi, Théo dort lorsqu'il fait nuit, se réveille au lever du jour, réclame à manger ou à boire et même à aller au pot. Sa voix numérisée est d'un naturel confondant. Surtout, il s'adapte aux capacités de jeux de chaque enfant : plus il manifestera son désir de jouer, plus le jouet sera réactif.", "q": "La voix numérisée de Théo est d'un « naturel confondant », ce qui signifie qu'elle …", "c": ["a un timbre qui n'existe pas naturellement.", "se confond avec la voix de l'enfant qui joue.", "enregistre et reproduit les voix entendues.", "imite à la perfection la voix d'un enfant."], "a": 3, "k": "voix numérisée est d'un naturel confondant", "_sources": ["test30#21"]}, {"t": "En tant que philosophe, que répondez-vous à ceux qui s'inquiètent de voir évoluer les jeunes dans l'univers virtuel des nouvelles technologies ?\nRendez-vous compte que la culture est à la portée de chacun ! Quel progrès ! On sait que les nouvelles technologies n'activent pas les mêmes régions du cerveau que les livres. Cet organe évolue, de la même façon qu'il avait déjà révélé des capacités nouvelles lorsqu'on est passé de l'oral à l'écrit.\nQue faisaient nos neurones avant l'invention de l'écriture ?\nLes facultés cognitives ne sont pas stables chez l'homme. C'est ma réponse aux vieux grognons qui accusent les jeunes de ne plus avoir de mémoire. Ils jugent avec les facultés cognitives qui sont les leurs, sans admettre que le cerveau évolue.", "q": "Quel est l'avis de ce philosophe concernant les nouvelles technologies ?", "c": ["Elles détruisent les cellules du cerveau.", "Elles développent la mémoire à court terme.", "Elles modifient nos processus cognitifs.", "Elles provoquent la disparition de l'écriture."], "a": 2, "k": "les nouvelles technologies n'activent pas les mêmes régions du cerveau que les livres", "_sources": ["test30#29"]}, {"t": "Avec la technologie actuelle, il faut six à neuf mois pour un vol de la terre à Mars. Pour connaitre les effets de l'isolement spatial de longue durée, six volontaires ont joué les astronautes dans un dôme de 90 m² installé sur un volcan à Hawaï et qui faisait office de base martienne. Ils en sont ressortis épuisés, mais heureux de respirer l'air frais. Pendant un an, ils sont restés ensemble en milieu fermé, ont mangé une nourriture déshydratée et effectué des expériences pour améliorer les systèmes autonomes.", "q": "À quoi ont participé ces six personnes ?", "c": ["À un vol interstellaire vers une planète lointaine.", "À une expérience d'autosuffisance alimentaire.", "À une exploration de cratères de volcans.", "À une simulation de mission spatiale."], "a": 3, "k": "six volontaires ont joué les astronautes dans un dôme", "_sources": ["test31#25"]}, {"t": "Cherchant à promouvoir les acteurs nationaux de l'ameublement, du design et de la décoration d'intérieure, le site www.monmobilier.fr, présente à ses clients, sur la boutique en ligne, des produits variés : mobilier et outils pour le jardin, tables basses, papiers peints, linge de maison… tous fabriqués en France. Mieux encore, la livraison se fait directement du fabricant au client. Ce choix permet de diminuer l'impact environnemental en supprimant plusieurs intermédiaires tout en accordant aux enseignes la possibilité de réaliser des marges plus intéressantes. Ce site « 100% made in France » collabore aujourd'hui sur une centaine de marques.", "q": "Qu'apprend-on à propos de ce site ?", "c": ["Il propose des modèles uniques.", "Il réalise un chiffre d'affaires élevé.", "Il sélectionne des articles écologiques.", "Il soutient les entreprises locales."], "a": 3, "k": "promouvoir les acteurs nationaux", "_sources": ["test32#24"]}, {"t": "Les montres connectées ont longtemps été boudées par le public, du fait de leur utilité limitée. Les nouvelles générations de ces produits offrent donc des services de plus en plus variés, comme payer ses achats ou passer des appels. Mais aujourd'hui, la motivation première des consommateurs pour acquérir ce type de produit réside dans toutes les fonctionnalités ayant trait au sport, au bien-être et à la santé. Les constructeurs en sont conscients et surenchérissent d'arguments sur ce thème. Un fabricant français qui a lancé sa nouvelle montre décrit celle-ci comme « le partenaire idéal de tous les sportifs » et « l'allié du sommeil réparateur ». Un concurrent américain affirme avoir entièrement repensé son produit pour aider le consommateur à être plus actif et en meilleure santé.", "q": "Qu'est-ce qui fait le succès des montres connectées aujourd'hui ?", "c": ["Elles contribuent à une bonne hygiène de vie.", "Elles facilitent les transactions sur Internet.", "Elles permettent de communiquer à moindre frais.", "Elles sont recommandées par le corps médical."], "a": 0, "k": "fonctionnalités ayant trait au sport, au bien-être et à la santé", "_sources": ["test33#29"]}, {"t": "Outre-Manche, une jeune députée a attiré l'attention des médias et des photographes en proposant un décret qui imposerait la mention « retouchée numériquement » sur toutes les photos corrigées. Le parti libéral démocratique a d'ailleurs approuvé cette proposition. « Je ne veux pas interdire aux publicitaires de recourir à des mannequins plus beaux que la femme de tous les jours, mais il y a une différence entre choisir la beauté et retoucher cette beauté pour atteindre des proportions impossibles en ce qui concerne, par exemple, la taille des jambes », s'insurge la députée.", "q": "Que propose cette députée à propos des publicités mettant en scène des femmes ?", "c": ["D'interdire les photos portant atteinte à leur dignité.", "De diversifier le type de femmes prises pour modèles.", "De mentionner les références précises des produits.", "De signaler sur les photos les modifications effectuées."], "a": 3, "k": "un décret qui imposerait la mention « retouchée numériquement » sur toutes les photos corrigées.", "_sources": ["test35#22"]}]}}</script>

var ZOOM_MIN = 60, ZOOM_MAX = 200, curZoom = 100;
function applyZoom(v){
  v = parseInt(v,10); if(isNaN(v)) v = 100;
  v = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, v));
  curZoom = v;
  var stage = document.getElementById("zoomStage");
  if(stage) stage.style.transform = "scale(" + (v/100) + ")";
  var val = document.getElementById("zoomVal");
  if(val) val.textContent = v + "%";
  var r = document.getElementById("zoomRange");
  if(r && parseInt(r.value,10) !== v) r.value = v;
}
function zoomStep(d){ applyZoom(curZoom + d); }
var PROGRESS_KEY = "tcf_ce_nclc6_all9";
function loadProgress(){
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}") || {}; }
  catch(e){ return {}; }
}
function saveProgress(lv, idx){
  try {
    var p = loadProgress();
    p[lv] = idx;
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
  } catch(e){}
}
function getSavedIndex(lv){
  var p = loadProgress();
  var v = p[lv];
  if (typeof v === "number" && v >= 0 && QQ && v < QQ.length) return v;
  return 0;
}


function esc(s) {
  var t = String(s);
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function hlText(text, key) {
  var h = esc(text).replace(/\n/g,"<br>");
  if (!key) return h;
  try {
    var ek = esc(key);
    var idx = h.toLowerCase().indexOf(ek.toLowerCase());
    if (idx >= 0) {
      h = h.substring(0,idx) + "<mark>" + h.substring(idx, idx+ek.length) + "</mark>" + h.substring(idx+ek.length);
    }
  } catch(e) {}
  return h;
}

function updateHeader() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  document.getElementById("hdr-sub").textContent = QQ.length + " questions · " + ok + " correcte(s)";
  var pct = Math.round((Object.keys(ans).length / QQ.length) * 100);
  document.getElementById("prog").style.width = pct + "%";
  document.getElementById("pleft").textContent = "Question " + (cur+1) + " / " + QQ.length;
  document.getElementById("pright").textContent = pct + "% complété";
}

function render(i) {
  cur = i;
  if (CUR_LEVEL) saveProgress(CUR_LEVEL, i);
  var q = QQ[i];
  var ua = ans[i];
  var done = ua !== undefined;
  var labels = ["A","B","C","D"];

  var textHtml = done ? hlText(q.t, q.k) : esc(q.t).replace(/\n/g,"<br>");
  var keyLabel = done ? "<div class='key-label'>🔑 Phrase-clé surlignée</div>" : "";

  var choicesHtml = "";
  for (var ci=0; ci<q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      cls += " disabled";
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    choicesHtml += "<button class='"+cls+"' onclick='pick("+i+","+ci+")'><span class='badge'>"+labels[ci]+"</span><span>"+esc(q.c[ci])+"</span></button>";
  }

  var feedbackHtml = "";
  if (done) {
    feedbackHtml = ua.ok
      ? "<div class='feedback ok'>✅ Bonne réponse !</div>"
      : "<div class='feedback ko'>❌ Réponse incorrecte. La bonne réponse est <strong>"+labels[q.a]+". "+esc(q.c[q.a])+"</strong></div>";
  }

  var prevDis = i===0 ? " disabled" : "";
  var nextDis = i===QQ.length-1 ? " disabled" : "";
  var srcLabel = (q._sources && q._sources.length) ? "<span class='src-label'>Présent dans : "+q._sources.join(" · ")+"</span>" : "";

  document.getElementById("view").innerHTML =
    "<div class='nav'>" +
      "<button class='btn' onclick='showLevelSelect()'>🏠 Thèmes</button>" +
      "<button class='btn'"+prevDis+" onclick='render("+(i-1)+")'>← Précédente</button>" +
      "<button class='btn'"+nextDis+" onclick='render("+(i+1)+")'>Suivante →</button>" +
      "<button class='btn btn-results' onclick='summary()'>Résultats</button>" +
    "</div>" +
    buildJumpBar(i) +
    "<div class='card'>" +
      "<div class='q-type-label'>📄 Compréhension écrite</div>" + srcLabel +
      keyLabel +
      "<div class='passage-box'>" + textHtml + "</div>" +
      "<div class='question'>Q"+(i+1)+". " + esc(q.q) + "</div>" +
      "<div class='choices'>"+choicesHtml+"</div>" +
      feedbackHtml +
    "</div>";

  updateHeader();
}

function buildJumpBar(cur_i) {
  if (!QQ || !QQ.length) return "";
  var h = "<div class='qjump'><span class='qjlabel'>Aller à la question :</span>";
  for (var j = 0; j < QQ.length; j++) {
    var cls = "qj";
    if (ans[j] !== undefined) cls += " answered";
    if (j === cur_i) cls += " current";
    h += "<button class='" + cls + "' onclick='render(" + j + ")'>" + (j + 1) + "</button>";
  }
  h += "</div>";
  return h;
}
function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  render(qi);
}

function calcScore() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  return { ok:ok, total: QQ.length, pct: Math.round(ok/QQ.length*100) };
}

  var r = calcScore();

  document.getElementById("view").innerHTML =

    var ua = ans[i];
    if (!ua || ua.ok) continue;

      if (ci===q.a) { cls="report-choice correct"; icon="✓ "; }
      else if (ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }
      choicesHtml += "<div class='"+cls+"'><strong>"+labels[ci]+".</strong> "+icon+esc(q.c[ci])+"</div>";
    }
    var tContent = hlText(q.t, q.k);
    html +=
      "<div class='report-item'>" +
        "<div class='qnum'>Question "+(i+1)+"</div>" +
        "<div class='passage-box' style='margin-bottom:.6rem'>"+tContent+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.6rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
      "</div>";
  }
  if (!html) html = "<div style='text-align:center;padding:2rem;color:#2E8B62;font-weight:600'>🎉 Aucune erreur ! Bravo !</div>";
  document.getElementById("view").innerHTML =
    "<div class='report-header no-print'>" +
      "<strong style='font-size:16px'>📋 Rapport des erreurs ("+wrongItems.length+" question"+(wrongItems.length!==1?"s":"")+")</strong>" +
      "<button class='btn btn-results' onclick='summary()'>← Retour aux résultats</button>" +
    "</div>" +
    html;
}

function printPDF() {
  var r = calcScore();
  var labels = ["A","B","C","D"];
  var allQHtml = "";
  for (var i=0; i<QQ.length; i++) {
    var q = QQ[i];
    var ua = ans[i];
    var done = ua !== undefined;
    var choicesHtml = "";
    for (var ci=0; ci<q.c.length; ci++) {
      var cls = "report-choice neutral";
      var icon = "";
      if (done) {
        if (ci===q.a) { cls="report-choice correct"; icon="✓ "; }
        else if (ua && ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }
      }
      choicesHtml += "<div class='"+cls+"'><strong>"+labels[ci]+".</strong> "+icon+esc(q.c[ci])+"</div>";
    }
    var tContent = hlText(q.t, q.k);
    var statusBadge = done ? (ua.ok ? " ✅" : " ❌ (→"+labels[q.a]+")") : " —";
    allQHtml +=
      "<div class='report-item'>" +
        "<div class='qnum'>Q"+(i+1)+statusBadge+"</div>" +
        "<div class='passage-box' style='margin-bottom:.5rem'>"+tContent+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.5rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
      "</div>";
  }
