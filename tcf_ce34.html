<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCF-CE Série 34</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:#f4f3ef;min-height:100vh;padding:1rem;color:#1a1a1a}
.wrap{max-width:860px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.header img{height:48px}
.hdr-right{text-align:right}
.hdr-title{font-size:16px;font-weight:700;color:#1a1a1a}
.hdr-sub{font-size:12px;color:#888;margin-top:2px}
.prog-wrap{margin-bottom:.6rem}
.prog-bar{height:5px;background:#e0ddd5;border-radius:3px}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width .35s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:4px}
.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.85rem}
.nav button{border:1px solid #d0cdc5;background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:#333;transition:background .15s}
.nav button:hover:not(:disabled){background:#f0ede5}
.nav button:disabled{opacity:.4;cursor:default}
.btn-res{border-color:#0F6E56!important;color:#0F6E56!important;font-weight:600!important;margin-left:auto}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.5rem 1.5rem 1.25rem;margin-bottom:1rem}
.textbox{background:#f8f7f3;border-left:3px solid #1D9E75;border-radius:0 8px 8px 0;padding:1rem 1.25rem;margin-bottom:1.1rem;font-size:15px;line-height:1.85;color:#1a1a1a;width:100%;box-sizing:border-box}
.textbox mark{background:#FAC775;color:#412402;border-radius:3px;padding:1px 3px;font-style:normal}
.key-label{display:inline-block;background:#FEF3DC;color:#7A4F00;border:1px solid #FAC775;border-radius:6px;font-size:12px;padding:3px 9px;margin-bottom:.75rem}
.question{font-size:16px;font-weight:600;margin-bottom:.9rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:11px 15px;border:1px solid #d0cdc5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;background:#fff;width:100%;box-sizing:border-box;text-align:left;transition:background .15s,border-color .15s}
.choice:hover:not([disabled]){background:#f8f7f3}
.choice[disabled]{cursor:default}
.badge{font-weight:700;min-width:22px;font-size:13px}
.choice.correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.choice.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.feedback{margin-top:1rem;border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.55}
.feedback.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.feedback.ko{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}
/* Summary */
#summary,#report{display:none}
.sum-card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:2rem 1.5rem;text-align:center;margin-bottom:1rem}
.sum-ok{font-size:48px;font-weight:800;color:#1D9E75}
.sum-score{font-size:32px;font-weight:700;color:#1a1a1a;margin:.25rem 0}
.sum-nclc{font-size:36px;font-weight:800;color:#BA7517;margin:.25rem 0}
.sum-msg{font-size:15px;color:#555;margin:.5rem 0 1.5rem}
.grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:1.5rem}
.gc{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.gc:hover{opacity:.8}
.gc-ok{background:#1D9E75;color:#fff}
.gc-ko{background:#E0553A;color:#fff}
.gc-na{background:#e0ddd5;color:#888;cursor:default}
.sum-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:1rem}
.btn-main{padding:11px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:background .15s}
.btn-green{background:#1D9E75;color:#fff}
.btn-green:hover{background:#17865f}
.btn-outline{background:#fff;color:#1D9E75;border:2px solid #1D9E75}
.btn-outline:hover{background:#E1F5EE}
.sum-note{font-size:11px;color:#999;margin-top:.5rem}
/* Report */
.rep-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.rep-title{font-size:18px;font-weight:700}
.btn-back{border:1px solid #d0cdc5;background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.rep-item{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.rep-qnum{font-size:11px;font-weight:600;color:#888;margin-bottom:.5rem}
.rep-q{font-size:15px;font-weight:600;margin-bottom:.75rem}
.rep-choice{padding:8px 12px;border-radius:7px;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:6px;border:1px solid #e0ddd5}
.rep-choice.rc-correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.rep-choice.rc-wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
</style>
</head>

<script>
var QQ = JSON.parse(document.getElementById("qdata").textContent);
var ans = {}, cur = 0;

function getPoints(i) {
  var n = i + 1;
  if (n <= 4)  return 3;
  if (n <= 10) return 9;
  if (n <= 19) return 15;
  if (n <= 29) return 21;
  if (n <= 35) return 26;
  return 33;
}

function getNclc(score) {
  if (score >= 549) return { level: "NCLC 10+", msg: "Excellent ! Niveau NCLC 10 et plus." };
  if (score >= 524) return { level: "NCLC 9",   msg: "Très bien ! Niveau NCLC 9." };
  if (score >= 499) return { level: "NCLC 8",   msg: "Très bien ! Niveau NCLC 8." };
  if (score >= 453) return { level: "NCLC 7",   msg: "Objectif immigration atteint ! Niveau NCLC 7." };
  if (score >= 406) return { level: "NCLC 6",   msg: "Encore un peu d'effort pour atteindre le NCLC 7 !" };
  if (score >= 375) return { level: "NCLC 5",   msg: "Continuez à pratiquer, niveau NCLC 5." };
  if (score >= 342) return { level: "NCLC 4",   msg: "Continuez à pratiquer, niveau NCLC 4." };
  return { level: "< NCLC 4", msg: "Continuez à pratiquer !" };
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function hl(text, key) {
  var h = esc(text).split("\n").join("<br>");
  try {
    var ek = esc(key);
    var idx = h.toLowerCase().indexOf(ek.toLowerCase());
    if (idx >= 0) {
      h = h.substring(0, idx) + "<mark>" + h.substring(idx, idx + ek.length) + "</mark>" + h.substring(idx + ek.length);
    }
  } catch(e) {}
  return h;
}

function updateHeader() {
  var score = 0;
  for (var k in ans) { if (ans[k].ok) score += getPoints(parseInt(k)); }
  document.getElementById("hdr-sub").innerHTML = "Série 34 &nbsp;·&nbsp; " + score + " point" + (score > 1 ? "s" : "");
}

function updateProgress() {
  var done = Object.keys(ans).length;
  var pct = Math.round(done / QQ.length * 100);
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-q").textContent = "Question " + (cur + 1) + " / " + QQ.length;
  document.getElementById("prog-pct").textContent = pct + "% complété";
}

function render(i) {
  cur = i;
  document.getElementById("summary").style.display = "none";
  document.getElementById("report").style.display = "none";
  document.getElementById("view").style.display = "block";

  var q = QQ[i], ua = ans[i], done = (ua !== undefined);
  var textHtml = done ? hl(q.t, q.k) : esc(q.t).split("\n").join("<br>");
  var keyLabel = done ? "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>" : "";

  var labels = ["A","B","C","D"];
  var choicesHtml = "";
  for (var ci = 0; ci < q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      if (ci === q.a) cls += " correct";
      else if (ua && ci === ua.choice && !ua.ok) cls += " wrong";
    }
    choicesHtml += "<button class=\"" + cls + "\" onclick=\"pick(" + i + "," + ci + ")\"" + (done ? " disabled" : "") + ">"
      + "<span class=\"badge\">" + labels[ci] + "</span>"
      + esc(q.c[ci])
      + "</button>";
  }

  var feedHtml = "";
  if (done) {
    if (ua.ok) {
      feedHtml = "<div class=\"feedback ok\">✅ Bonne réponse !</div>";
    } else {
      feedHtml = "<div class=\"feedback ko\">❌ Incorrect. La bonne réponse est : <strong>" + labels[q.a] + ") " + esc(q.c[q.a]) + "</strong></div>";
    }
  }

  document.getElementById("view").innerHTML =
    "<div class=\"card\">"
    + "<div class=\"textbox\">" + textHtml + "</div>"
    + keyLabel
    + "<div class=\"question\">" + esc(q.q) + "</div>"
    + "<div class=\"choices\">" + choicesHtml + "</div>"
    + feedHtml
    + "</div>";

  document.getElementById("btn-prev").disabled = (i === 0);
  document.getElementById("btn-next").disabled = (i === QQ.length - 1);
  updateProgress();
  updateHeader();
}

function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  render(qi);
}

function go(i) {
  if (i < 0 || i >= QQ.length) return;
  render(i);
}

function summary() {
  document.getElementById("view").style.display = "none";
  document.getElementById("report").style.display = "none";
  document.getElementById("summary").style.display = "block";

  var ok = 0, score = 0;
  for (var k in ans) { if (ans[k].ok) { ok++; score += getPoints(parseInt(k)); } }
  var nclc = getNclc(score);

  var gridHtml = "";
  for (var j = 0; j < QQ.length; j++) {
    var gcls = "gc gc-na";
    var title = "Q" + (j+1) + " — non répondu";
    if (ans[j] !== undefined) {
      if (ans[j].ok) { gcls = "gc gc-ok"; title = "Q" + (j+1) + " — correct"; }
      else { gcls = "gc gc-ko"; title = "Q" + (j+1) + " — incorrect"; }
    }
    var onclick = (ans[j] !== undefined) ? " onclick=\"go(" + j + ")\"" : "";
    gridHtml += "<button class=\"" + gcls + "\" title=\"" + title + "\"" + onclick + ">" + (j+1) + "</button>";
  }

  document.getElementById("summary").innerHTML =
    "<div class=\"sum-card\">"
    + "<div class=\"sum-ok\">" + ok + " / " + QQ.length + "</div>"
    + "<div class=\"sum-score\">Score TCF : " + score + " / 699</div>"
    + "<div class=\"sum-nclc\">" + nclc.level + "</div>"
    + "<div class=\"sum-msg\">" + nclc.msg + "</div>"
    + "<div class=\"grid\">" + gridHtml + "</div>"
    + "<div class=\"sum-btns\">"
    + "<button class=\"btn-main btn-outline\" onclick=\"showReport()\">📋 Voir le rapport des erreurs</button>"
    + "<button class=\"btn-main btn-green\" onclick=\"reset()\">↺ Recommencer</button>"
    + "</div>"
    + "<div class=\"sum-note\">* Score estimatif à titre indicatif</div>"
    + "</div>";
}

function showReport() {
  document.getElementById("summary").style.display = "none";
  document.getElementById("view").style.display = "none";
  document.getElementById("report").style.display = "block";

  var labels = ["A","B","C","D"];
  var itemsHtml = "";
  var errCount = 0;

  for (var j = 0; j < QQ.length; j++) {
    var ua = ans[j];
    if (!ua || ua.ok) continue;
    errCount++;
    var q = QQ[j];
    var textHtml = hl(q.t, q.k);

    var choicesHtml = "";
    for (var ci = 0; ci < q.c.length; ci++) {
      var rcls = "rep-choice";
      var icon = "";
      if (ci === q.a) { rcls += " rc-correct"; icon = "✓ "; }
      else if (ci === ua.choice) { rcls += " rc-wrong"; icon = "✗ "; }
      choicesHtml += "<div class=\"" + rcls + "\"><span class=\"badge\">" + labels[ci] + "</span>" + icon + esc(q.c[ci]) + "</div>";
    }

    itemsHtml += "<div class=\"rep-item\">"
      + "<div class=\"rep-qnum\">Question " + (j+1) + "</div>"
      + "<div class=\"textbox\">" + textHtml + "</div>"
      + "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>"
      + "<div class=\"rep-q\">" + esc(q.q) + "</div>"
      + choicesHtml
      + "</div>";
  }

  if (errCount === 0) {
    itemsHtml = "<div class=\"sum-card\"><div style=\"font-size:48px\">🎉</div><div class=\"sum-msg\">Aucune erreur ! Félicitations !</div></div>";
  }

  document.getElementById("report").innerHTML =
    "<div class=\"rep-header\">"
    + "<div class=\"rep-title\">📋 Rapport des erreurs (" + errCount + ")</div>"
    + "<button class=\"btn-back\" onclick=\"summary()\">← Retour aux résultats</button>"
    + "</div>"
    + itemsHtml;
}

function reset() {
  ans = {};
  render(0);
}

window.onload = function() { render(0); };
</script>
