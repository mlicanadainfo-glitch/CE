<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF – Compréhension Écrite – Série 36</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; padding: 1.25rem; }
#app { max-width: 860px; margin: 0 auto; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
.header img { height: 48px; width: auto; object-fit: contain; }
.header-right { text-align: right; }
.header-title { font-size: 16px; font-weight: 700; color: #1a1a1a; }
.header-sub { font-size: 12px; color: #888; margin-top: 3px; }

/* Progress */
.prog-wrap { margin-bottom: 1.25rem; }
.prog-bar { height: 5px; background: #e0ddd5; border-radius: 3px; }
.prog-fill { height: 100%; background: #1D9E75; border-radius: 3px; transition: width .35s; }
.prog-labels { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; color: #888; }

/* Nav */
.nav { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: .85rem; }
.nav-btn { border: 1px solid #d0cdc5; background: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #333; transition: background .15s; }
.nav-btn:hover { background: #f5f4f0; }
.nav-btn:disabled { opacity: .4; cursor: default; }
.nav-results { border: 1.5px solid #0F6E56; background: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #0F6E56; font-weight: 600; margin-left: auto; transition: background .15s; }
.nav-results:hover { background: #E1F5EE; }

/* Card */
.card { background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 1.5rem 1.5rem 1.25rem; }
.qnum { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #aaa; margin-bottom: .6rem; }

/* Textbox */
.textbox { background: #f8f7f3; border-left: 3px solid #1D9E75; border-radius: 0 8px 8px 0; padding: 1rem 1.25rem; margin-bottom: 1.1rem; font-size: 15px; line-height: 1.85; color: #1a1a1a; width: 100%; }
.textbox mark { background: #FAC775; color: #412402; border-radius: 3px; padding: 1px 3px; font-style: normal; }

/* Key label */
.key-label { display: inline-flex; align-items: center; gap: 5px; background: #FEF3CD; color: #7A4B00; border: 1px solid #F5C842; border-radius: 6px; font-size: 11px; font-weight: 600; padding: 4px 9px; margin-bottom: .75rem; }

/* Question & Choices */
.question { font-size: 16px; font-weight: 600; margin-bottom: .9rem; line-height: 1.5; }
.choices { display: flex; flex-direction: column; gap: 9px; margin-top: .1rem; }
.choice { padding: 11px 15px; border: 1px solid #d0cdc5; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; background: #fff; width: 100%; text-align: left; transition: background .15s, border-color .15s; }
.choice:hover:not([disabled]) { background: #f5f4f0; }
.choice .badge { font-weight: 600; min-width: 22px; color: #888; }
.choice.correct { border-color: #0F6E56; background: #E1F5EE; color: #085041; }
.choice.correct .badge { color: #0F6E56; }
.choice.wrong { border-color: #993C1D; background: #FAECE7; color: #4A1B0C; }
.choice.wrong .badge { color: #993C1D; }

/* Feedback */
.feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.55; }
.feedback.ok { background: #E1F5EE; color: #085041; border: 1px solid #5DCAA5; }
.feedback.ko { background: #FAECE7; color: #4A1B0C; border: 1px solid #F0997B; }

/* Summary */
.summary { background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 2rem 1.75rem; }
.sum-score-line { font-size: 44px; font-weight: 800; color: #1D9E75; line-height: 1; }
.sum-tcf { font-size: 22px; font-weight: 700; color: #333; margin-top: .4rem; }
.sum-nclc { font-size: 28px; font-weight: 800; color: #BA7517; margin-top: .3rem; }
.sum-msg { font-size: 14px; color: #555; margin-top: .5rem; margin-bottom: 1.25rem; }
.sum-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
.sg-item { width: 36px; height: 36px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; border: none; }
.sg-item:hover { opacity: .8; }
.sg-correct { background: #1D9E75; color: #fff; }
.sg-wrong { background: #D0432A; color: #fff; }
.sg-skip { background: #e0ddd5; color: #888; }
.sum-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: .75rem; }
.btn-report { background: #fff; border: 1.5px solid #0F6E56; color: #0F6E56; font-weight: 600; font-size: 14px; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
.btn-report:hover { background: #E1F5EE; }
.btn-restart { background: #1D9E75; border: none; color: #fff; font-weight: 700; font-size: 14px; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
.btn-restart:hover { background: #178a63; }
.sum-note { font-size: 11px; color: #aaa; }

/* Report */
.report { background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 1.5rem 1.5rem; }
.report-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.report-title { font-size: 16px; font-weight: 700; }
.btn-back { border: 1px solid #d0cdc5; background: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #333; }
.btn-back:hover { background: #f5f4f0; }
.report-item { border: 1px solid #e0ddd5; border-radius: 10px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
.report-qnum { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #aaa; margin-bottom: .4rem; }
.report-q { font-size: 15px; font-weight: 600; margin-bottom: .75rem; }
.report-choice { display: flex; align-items: center; gap: 9px; font-size: 13px; padding: 7px 10px; border-radius: 7px; margin-bottom: 5px; }
.rc-correct { background: #E1F5EE; color: #085041; }
.rc-wrong { background: #FAECE7; color: #4A1B0C; }
.rc-other { color: #888; }
.rc-badge { font-weight: 700; min-width: 20px; }
</style>
</head>

<script type="application/json" id="qdata">[{"t":"Marion,\n\nTu veux passer à la maison ce soir pour boire un verre?\nOn peut aussi dîner ensemble et regarder un film\nBisous, Stéphane","q":"Où Marion est-elle invitée ?","c":["Au cinéma.","Au restaurant.","Chez son ami.","Dans un bar."],"a":2,"k":"Tu veux passer à la maison ce soir pour boire un verre?"},{"t":"De : standard@entreprise.fr\nÀ : duvaljulie@entreprise.fr\nObjet : message urgent\n\nRappelez monsieur Durand au 01 47 38 91 88","q":"Que doit faire la destinataire de ce message ?","c":["Téléphoner au numéro donné.","Écrire un courriel de réponse.","Écouter le répondeur.","Contacter le standard."],"a":0,"k":"Rappelez monsieur Durand au 01 47 38 91 88"},{"t":"Cours de cuisine au restaurant Chez nous !\nOuverts aux petits et grands\nPour réserver, appelez le 04 25 69 35 14.\nRendez-vous tous les mercredis de 16h30 à 18h, au 25 rue de la Grange, Bagneux.","q":"Comment est-ce qu'on peut s'inscrire à cette activité ?","c":["Par courrier.","Par téléphone.","Sur Internet.","Sur place."],"a":1,"k":"Pour réserver, appelez le 04 25 69 35 14."},{"t":"Des élèves français ont envoyé un message sur internet afin de recevoir des cartes postales du monde entier. Ils ont reçu 8000 réponses. L'instituteur explique : « En classe, les élèves cherchent d'où viennent les cartes et ils découvrent des capitales et des pays. »","q":"Qu'est-ce que ces élèves font avec les cartes postales ?","c":["Ils apprennent la géographie.","Ils invitent des amis à l'école.","Ils pratiquent des langues étrangères.","Ils préparent un voyage de classe."],"a":0,"k":"les élèves cherchent d'où viennent les cartes et ils découvrent des capitales et des pays."},{"t":"VISITE DU CHÂTEAU\nGratuit pour les moins de 12 ans.","q":"Quelle est l'information affichée sur ce panneau ?","c":["Une adresse.","Une date.","Un horaire.","Un tarif."],"a":3,"k":"Gratuit pour les moins de 12 ans."},{"t":"Le 21 mars prochain, l'événement Goût de France sera organisé dans des restaurants du monde entier. 2000 chefs préparent un dîner avec les meilleures spécialités de la cuisine française.\nChoisissez vite votre table sur :\nhttp://france.fr/fr/gout-france-good-france","q":"Qu'est-ce qui est proposé aux lecteurs de cette annonce ?","c":["De cuisiner avec des professionnels.","De faire une réservation par Internet.","De gagner un repas gratuit pour deux.","De recevoir des recettes typiques."],"a":1,"k":"Choisissez vite votre table sur : http://france.fr/fr/gout-france-good-france"},{"t":"Je propose un 3 pièces en colocation à partir du 1er septembre. Proche de la gare Montparnasse, chauffage au gaz, un salon et 2 chambres. Je recherche une personne sérieuse, de préférence en école de commerce pour préparer les examens ensemble. Si vous êtes intéressé(e), appelez Rémi au 01.56.84.92.37.","q":"À qui s'adresse cette annonce ?","c":["À un commerçant.","À un étudiant.","À un professeur.","À un propriétaire."],"a":1,"k":"Je recherche une personne sérieuse, de préférence en école de commerce pour préparer les examens ensemble."},{"t":"Chers étudiants,\n\nNous avons le plaisir de vous informer que notre centre vous offre moins de 10% sur le prix de ses cours de français. Vous pouvez bénéficier de cette offre spéciale pour un stage d'une ou plusieurs semaines de juin à septembre.\nVous trouverez le calendrier et le programme des formations sur notre site :\nwww.coursdefrançais.org\n\nCordialement,\nLa responsable des cours","q":"Dans ce message, que propose-t-on aux étudiants ?","c":["Une formation adaptée pendant les vacances.","Une grande variété de cours intensifs.","Une promotion spéciale pour un voyage.","Une réduction sur des stages pendant les vacances."],"a":3,"k":"notre centre vous offre moins de 10% sur le prix de ses cours de français. Vous pouvez bénéficier de cette offre spéciale pour un stage d'une ou plusieurs semaines de juin à septembre."},{"t":"Studio Céline\n\nL'école de danse « Studio Céline » ouvre ses portes au public le 16 septembre.\nC'EST GRATUIT : venez essayer nos cours toute la journée. Au programme : salsa, tango, danse moderne et un goûter (boissons et gâteaux) !","q":"Qu'est-ce que cette école de danse propose ?","c":["De participer à un concours.","De s'inscrire à un stage.","De tester des activités.","Voir un spectacle."],"a":2,"k":"C'EST GRATUIT : venez essayer nos cours toute la journée."},{"t":"L'Union européenne va offrir « une Carte Jeunes » aux étudiants du continent qui ont vingt ans cette année. Pendant un mois maximum, les jeunes pourront prendre le train gratuitement pour visiter plus de quinze pays.","q":"Qu'est-ce qui est proposé aux jeunes Européens ?","c":["Des visites de musées.","Des voyages en Europe.","Un mois de vacances.","Un semestre d'études."],"a":1,"k":"les jeunes pourront prendre le train gratuitement pour visiter plus de quinze pays."},{"t":"Vous souhaitez vivre une expérience qui sort de l'ordinaire ? Réservez une nuit dans l'une de nos maisons dans les arbres ! Intérieur confortable, sensation d'aventure, réveil aux bruits de la nature, tout est prévu pour un séjour inoubliable !","q":"Qu'est-ce que cette annonce propose ?","c":["De dormir au milieu de la nature.","Faire un parcours dans les arbres.","De participer à une aventure sportive.","De passer une nuit sous la tente."],"a":0,"k":"Réservez une nuit dans l'une de nos maisons dans les arbres !"},{"t":"Selon les résultats d'un sondage, 7 Français sur 10 déclarent acheter régulièrement des produits bio. Avec, par ordre de préférence, les fruits et légumes, le lait et les produits laitiers, les œufs, l'épicerie puis la viande. Pour les deux tiers des personnes interrogées, la santé est l'argument prioritaire, devant les considérations écologiques.\n\nCe bond de la vente des produits bio doit beaucoup à l'intérêt des grandes surfaces pour ce marché qui rapporte, mais aussi au développement des enseignes spécialisées.\n\nCet appétit des Français a de quoi rassurer tous ceux qui pouvaient s'inquiéter des débouchés de la filière bio, suite aux nombreuses reconversions agricoles.","q":"D'après ce texte, pourquoi les Français consomment-ils des produits bio ?","c":["Pour éviter de tomber malade.","Pour profiter de tarifs avantageux.","Pour protéger l'environnement.","Pour soutenir les paysans locaux."],"a":0,"k":"Pour les deux tiers des personnes interrogées, la santé est l'argument prioritaire, devant les considérations écologiques."},{"t":"Vous travaillez à la mairie de Rouen, vous êtes musicien et vous jouez d'un instrument depuis plusieurs années ? Rejoignez l'orchestre des agents de la ville de Rouen ! Les répétitions reprennent en septembre (à la fin des congés d'été) et ont lieu les jeudis entre 12h et 13h30 au conservatoire de la ville.","q":"Qu'est-ce qui est proposé aux agents de la mairie ?","c":["D'assister à un concert à Rouen.","De devenir membre de l'orchestre municipal.","De suivre des cours de musique à la rentrée.","De visiter le conservatoire."],"a":1,"k":"Rejoignez l'orchestre des agents de la ville de Rouen !"},{"t":"Après les cartes de cinéma illimitées, la carte Scène+ ! Paris est la première ville à tester cette formule : des places à tarifs réduits à utiliser quand on veut, dans quarante théâtres environ, pour aller voir plus de 150 pièces.\nOn achète la carte, valable un mois ou un semestre et on peut aller dans les petites scènes de théâtre parisiennes qui accueillent surtout des comédies populaires plutôt que des pièces classiques.","q":"Que peut-on faire avec la carte Scène+ ?","c":["Assister à des spectacles.","Obtenir de meilleures places.","Rencontrer des comédiens.","Suivre des visites guidées."],"a":0,"k":"des places à tarifs réduits à utiliser quand on veut, dans quarante théâtres environ, pour aller voir plus de 150 pièces."},{"t":"Vous voulez aller à la montagne en hiver mais vous n'aimez pas skier ? Ce n'est pas un problème : il y a d'autres possibilités ! Venez chez nous à Seillac : paysages magnifiques, marches dans la neige, piscine et installations sportives disponibles.","q":"Qu'est-ce que cette publicité propose ?","c":["Des activités de loisir.","Des vacances à la campagne.","Un cours de natation.","Une promenade avec un guide."],"a":0,"k":"paysages magnifiques, marches dans la neige, piscine et installations sportives disponibles."},{"t":"Amélie,\n\nPour le concert de ce soir, on se retrouve à 19 h 30 devant le bar rue Daunou. Il y a un grand restaurant à côté, tout près du théâtre de l'Odéon. Le concert commence à 20 h 30.\n\nSarah","q":"Que vont faire les deux femmes ce soir ?","c":["Aller dans un bar.","Assister à un spectacle.","Dîner au restaurant.","Voir une pièce de théâtre."],"a":1,"k":"Pour le concert de ce soir, on se retrouve à 19 h 30 devant le bar rue Daunou."},{"t":"En hiver et à l'extérieur, pour piloter n'importe quel appareil à écran tactile, il faut enlever ses gants, au risque d'attraper des engelures par les temps de grand froid. Plus de risque de se geler les mains désormais avec ce modèle de gants en chevreau doublé de soie. Les perforations au niveau de l'index permettent un meilleur contact avec l'écran tactile. On pourra être à la pointe de la technologie et de la mode. Mais être à la page à un prix, la paire de gants est plus chère que l'appareil à écran tactile 370 euros.","q":"Quelle est la particularité de ces gants ?","c":["Ils évitent de rayer les appareils à écran tactile.","Ils permettent un contact direct avec un écran tactile.","Ils sont équipés de capteurs reliés à un écran tactile.","Ils sont offerts lors de l'achat d'un écran tactile."],"a":1,"k":"Les perforations au niveau de l'index permettent un meilleur contact avec l'écran tactile."},{"t":"La question de l'orientation est fondamentale et se pose inévitablement au moment de commencer des études universitaires. Comment faire le bon choix ? Sur quelles bases ? Quel parcours sera le mieux adapté à la personnalité scolaire et psychologique, aux capacités de l'étudiant ? Un livre, édité par le magazine L'Étudiant, propose une démarche progressive qui aide à définir un projet en fonction des goûts et d'un objectif professionnel.","q":"Que peut-on trouver dans ce livre ?","c":["Des idées de stages en entreprise.","Un guide des démarches d'inscription.","Une méthode pour choisir une formation.","Une sélection des meilleures universités."],"a":2,"k":"propose une démarche progressive qui aide à définir un projet en fonction des goûts et d'un objectif professionnel."},{"t":"Des études de marché récentes\n\nmontrent que les frites signent leur grand retour. Leur cote de popularité ne se dément pas mais elles doivent être préparées dans les règles de l'art pour des frites dorées, moelleuses dedans, croquantes dehors, il faut les cuire, puis les frire en deux temps.\n\nSi la Belgique et la France s'en disputent la paternité, on n'en a toujours pas trouvé l'origine. Avec le bond spectaculaire du burger dont elles sont l'accompagnement idéal, les frites sont fortement consommées au restaurant.","q":"Que révèle cet article sur les frites ?","c":["L'origine historique de la recette.","Le secret d'une bonne préparation.","Les adresses où les consommer.","Les raisons de leur popularité."],"a":1,"k":"elles doivent être préparées dans les règles de l'art pour des frites dorées, moelleuses dedans, croquantes dehors, il faut les cuire, puis les frire en deux temps."},{"t":"Les jours rallongent, la température monte, les arbres sont en fleurs, bref... l'été approche, et les grandes vacances aussi. Mais savez-vous déjà comment vos enfants vont passer ces deux mois ? Ils ont un besoin vital de se détendre et ils sont curieux de tout. De votre côté, vous cherchez des solutions pratiques et des vacances intelligentes et sûres. Nous vous proposons des ateliers scientifiques passionnants dans des centres de vacances rigoureusement sélectionnés.\n\nAlors, appelez-nous vite!","q":"Qu'offrent ces centres de vacances ?","c":["Des cours de rattrapage scolaire en sciences.","Des activités de découverte de la nature.","Des stages de travail en laboratoire.","Des séjours alliant détente et découvertes."],"a":3,"k":"Ils ont un besoin vital de se détendre et ils sont curieux de tout."},{"t":"Les bons vieux bancs verts sur les trottoirs parisiens ont de la concurrence. Depuis le mois de décembre, sur certains boulevards, un nouveau mobilier urbain a fait son apparition, avec 12 modèles de banquettes, chaises et tabourets. Pour la première fois, la Ville de Paris recueille l'avis des usagers et des riverains. Le traditionnel banc en fonte et bois a-t-il encore de l'avenir au milieu de ce mobilier futuriste ?","q":"Quelle est l'originalité de ce projet ?","c":["La priorité donnée à l'aspect écologique.","La prise en compte de l'opinion publique.","Le caractère provisoire de l'installation.","Le choix des matériaux de fabrication."],"a":1,"k":"Pour la première fois, la Ville de Paris recueille l'avis des usagers et des riverains."},{"t":"Pendant un an, la journaliste allemande Greta Taubert a décidé de quitter la société de consommation sans quitter son appartement berlinois. Pendant cette expérience, elle a bu, mangé, s'est habillée sans payer : elle a échangé jupes et pantalons avec ses voisines, planté des légumes dans un jardin collectif. Pour ses vacances, elle est allée chez des amis en faisant de l'auto-stop. « Aujourd'hui, je suis contente de ne plus vivre aussi radicalement, c'était difficile mais je cherche à intégrer dans mon quotidien ce que j'ai appris », explique-t-elle.","q":"Quel est le constat de Greta Taubert après cette expérience ?","c":["C'est possible à la campagne.","C'est possible avec du temps.","C'est possible mais pénible.","C'est possible pour tous."],"a":2,"k":"c'était difficile mais je cherche à intégrer dans mon quotidien ce que j'ai appris"},{"t":"Un salarié qui avale un sandwich devant l'écran en guise de pause déjeuner offre à son employeur 128 heures de travail non rémunéré, soit seize jours pleins, ont calculé des chercheurs britanniques.\nInterrogés sur leurs motivations, ces salariés expliquent se sentir trop coupables de s'arrêter de travailler. En ces temps de compétition exacerbée entre les salariés, ce serait interprété comme un manque d'efficacité. Un médecin rappelle pourtant que « faire des pauses régulières, se lever et marcher aide à s'aérer l'esprit » pendant sa journée de travail. « Prendre une pause déjeuner préparé à une après-midi productive », poursuit-il.\n\nD'après lexpress.fr","q":"Pourquoi certains salariés travaillent-ils pendant la pause déjeuner ?","c":["Pour améliorer leur situation financière.","Pour donner une bonne image d'eux.","Pour exécuter les ordres de la direction.","Pour quitter leur entreprise plus tôt."],"a":1,"k":"ces salariés expliquent se sentir trop coupables de s'arrêter de travailler. En ces temps de compétition exacerbée entre les salariés, ce serait interprété comme un manque d'efficacité."},{"t":"Journée « Portes Ouvertes » à Polytech Tours.\nVenez rencontrer les étudiants, enseignants et associations de Polytech Tours le samedi 12 février, de 9h à 16h sans interruption.\n■ Espaces d'information présents sur les trois sites de l'école.\n■ Présentation des études et des métiers d'ingénieur par les responsables des spécialités sur chaque site.\n■ Visites guidées des salles de travaux pratiques, des centres de documentation, des laboratoires de recherche et de langues.\n■ Démonstrations de projets réalisés dans nos cursus.\nPrésentation des associations étudiantes.","q":"Quel est l'objectif de cette journée ?","c":["Découvrir le travail de recherche en laboratoire.","Faire découvrir les formations pour devenir ingénieur.","Inaugurer l'ouverture d'un campus universitaire.","Obtenir des conseils afin de créer une association."],"a":1,"k":"Présentation des études et des métiers d'ingénieur par les responsables des spécialités sur chaque site."},{"t":"Le syndrome d'épuisement professionnel est-il uniquement lié au monde du travail ? Si l'on considère la sphère privée, certains médecins préfèrent utiliser le terme de surcharge mentale. Pour le docteur Marie-Pierre Guilho-Bailly, médecin-psychiatre spécialisée en pathologie professionnelle, il est indispensable de ne pas étendre le concept de ce syndrome à toutes les situations d'épuisement engendrées par la vie personnelle, familiale ou sociale.\nÀ son sens, le seul syndrome d'épuisement professionnel qui puisse être retenu concernant le milieu familial renvoie au travail des aidants familiaux. Toutefois, des études tendent à montrer que les symptômes peuvent survenir également dans la vie personnelle, notamment chez certains parents particulièrement épuisés.","q":"Qu'apprend-on à propos du syndrome d'épuisement professionnel ?","c":["Il demande une prise charge médicale.","Il peut s'étendre au domaine personnel.","Il suscite un consensus parmi les spécialistes.","Il touche surtout les aides-soignants."],"a":1,"k":"des études tendent à montrer que les symptômes peuvent survenir également dans la vie personnelle, notamment chez certains parents particulièrement épuisés."},{"t":"FILM DOCUMENTAIRE « TISSEUSES DE RÊVES »\n\nMères, filles, grand-mères, une poignée de femme berbères travaillent dur aux tâches domestiques comme à la fabrication de tapis traditionnels. Dans une économie autarcique, elles restent sans autonomie financière, ni reconnaissance de leur talent. Elles veulent farouchement s'arracher à leur condition et offrir études et avenir à leurs enfants. D'Essaouira, sur la côte atlantique, leur parviennent les nouvelles de femmes, semblables à celles, qui ont créé des coopératives de production d'huile d'Argan et changé leurs vies. Taaborth et Erkia partent en exploratrices et, éblouies, rapportent à leurs sœurs les images de ce premier voyage hors de leurs montagnes et un espoir.\n\nD'après amc2-production","q":"De quoi traite le documentaire sur les femmes berbères ?","c":["De l'éducation des plus jeunes.","De la transmission d'un savoir-faire.","De la volonté d'émancipation.","Du rapport entre les générations."],"a":2,"k":"Elles veulent farouchement s'arracher à leur condition et offrir études et avenir à leurs enfants."},{"t":"Quand on choisit une voiture, on compare les prix et les performances avant de faire son choix. Mais quand il s'agit d'une prothèse de hanche ou de sein, on prend ce que le spécialiste impose. On ne se sent souvent ni le droit, ni le courage, ni la capacité de vérifier si le matériel proposé est le plus adapté ou si le médecin est sous influence des fabricants. Ce qui explique cette confiance totale accordée au médecin. Cet abandon du patient à son médecin ou à l'hôpital exigent donc en retour une éthique et un professionnalisme sans faille de l'univers médical qui doit notamment se protéger du marketing très agressif des fabricants du matériel.\n\nD'après Le Soir","q":"Que souligne l'article au sujet des prothèses ?","c":["Le coût des dispositifs pose un problème d'éthique.","Le respect de la déontologie médicale est primordial.","Les fabricants d'implants doivent signer une charte.","Les patients ont le devoir de s'informer davantage."],"a":1,"k":"Cet abandon du patient à son médecin ou à l'hôpital exigent donc en retour une éthique et un professionnalisme sans faille de l'univers médical"},{"t":"Est-on plus heureux\nquand on est riche?\nquand on croit en Dieu?\nquand on vit en couple?\nDepuis quelques décennies, de nombreuses recherches concernant le bien-être sont menées sur les facteurs sociaux et psychologiques qui favorisent ou non le bonheur. On pourrait penser que le bien-être est un phénomène subjectif, inaccessible donc à l'investigation scientifique et à la mesure. Or, grâce à des instruments divers mis en place depuis plus de trente ans pour mesurer le niveau de satisfaction de vie des individus et des populations, des méthodologies diverses ont été mises au point pour permettre de mesurer la qualité de vie telle qu'elle est perçue.","q":"Qu'apprend-on sur le bien-être dans cet article ?","c":["C'est un état difficile à évaluer chez une personne.","Des outils ont été élaborés pour en estimer l'intensité.","Les enquêtes dont le sujet sont innombrables.","Malgré des études sérieuses, l'analyse est impossible."],"a":1,"k":"grâce à des instruments divers mis en place depuis plus de trente ans pour mesurer le niveau de satisfaction de vie des individus et des populations"},{"t":"Parcourir les routes d'Europe l'été, beaucoup de touristes le font sans forcément connaître les règles en vigueur dans chacun des pays. Ce qu'il faut savoir, c'est qu'il existe des différences qui peuvent être notables selon les législations. Alors que la vitesse maximale sur autoroute est de 130 km/h en France, elle n'est que de 120 km/h en Belgique, en Espagne ou au Portugal. Quant au taux d'alcoolémie toléré, il varie de 0,8 g/l en Irlande à zéro en République tchèque.","q":"Que fait l'auteur de cet article ?","c":["Il commente une loi.","Il donne un conseil.","Il formule une plainte.","Il raconte une anecdote."],"a":1,"k":"Ce qu'il faut savoir, c'est qu'il existe des différences qui peuvent être notables selon les législations."},{"t":"Quelques astuces pour optimiser les révisions.\n\nLors des révisions pour un examen, l'acquisition des connaissances s'opère plus facilement en jonglant avec la mémoire visuelle et la mémoire auditive. Comme la part des deux peut varier d'une personne à l'autre, c'est à chacun de mesurer la méthode qui lui paraît la plus efficace. Il est inutile d'intégrer des notions par cœur : mieux vaut se détacher des termes employés, pour s'approprier les connaissances et les exprimer différemment. Enfin, une bonne hygiène de vie et des activités variées constituent un gage de réussite et permettent de limiter le stress : il est indispensable de s'aérer l'esprit et de faire des pauses.","q":"D'après cette personne, que faut-il éviter de faire lorsque l'on révise ?","c":["Mémoriser des concepts sans les comprendre.","Multiplier les méthodes d'apprentissage.","S'autoriser des pauses fréquemment.","Se disperser dans de nombreuses activités."],"a":0,"k":"Il est inutile d'intégrer des notions par cœur : mieux vaut se détacher des termes employés, pour s'approprier les connaissances et les exprimer différemment."},{"t":"Là où leurs prédécesseurs rêvaient d'un contrat à durée indéterminée, les Millennials (génération née entre 1980 et 2000) sont en quête d'expériences diversifiées. Beaucoup ont déjà connu le chômage et ont conscience de l'obsolescence de leurs compétences et de leur diplôme, d'où leur sentiment de n'avoir rien à perdre. L'heure n'est plus à la relation de subordination, mais à la coopération. Au quotidien, il y a de quoi déconcerter les managers... Un Millennial accepte qu'on lui explique le sens du travail mais pas la manière de le faire. Face à ces collaborateurs qui font rimer bien-être professionnel avec connexion, confiance, autonomie et flexibilité, il faut en finir avec le syndrome de la hiérarchie pyramidale.\n\nD'après lesechos.fr","q":"Qu'apprend-on sur les Millennials dans le monde du travail ?","c":["Ils bouleversent les rapports d'autorité.","Ils évitent les postes à responsabilité.","Ils sont moins motivés que leurs aînés.","Ils tiennent à la stabilité de l'emploi."],"a":0,"k":"L'heure n'est plus à la relation de subordination, mais à la coopération."},{"t":"Le numérique bouleverse profondément l'enseignement mais, d'après le philosophe Marcel Gauchet, on aura plus que jamais besoin de professeurs et d'écoles.\nExcellent moyen de stimuler la curiosité, le numérique pousse à chercher, à creuser encore. Surtout, il enseigne une chose essentielle : personne ne sait et, nulle part, il n'existe de détenteur ultime du savoir. Ainsi, les élèves sont de plus en plus en contact avec des sources hétéroclites et cela constitue un changement majeur en termes pédagogiques. L'enseignant est alors celui qui va expliquer qu'il existe plusieurs versions d'une même chose et que savoir, c'est se confronter à l'incertitude et non réciter bêtement des connaissances.","q":"Selon Marcel Gauchet, quel va être le rôle de l'enseignant auprès des élèves ?","c":["Développer leur esprit critique.","Encourager les débats entre eux.","Enrichir leur capacité mémorielle.","Évaluer régulièrement leurs acquis."],"a":0,"k":"L'enseignant est alors celui qui va expliquer qu'il existe plusieurs versions d'une même chose et que savoir, c'est se confronter à l'incertitude"},{"t":"Certains économistes spécialisés dans la politique en matière de mobilité estiment que la gratuité des transports en commun n'est pas souhaitable. Pour eux, la question de savoir qui va les financer est un peu simpliste :\n« La gratuité existe déjà dans notre pays. Il y a une quinzaine de réseaux en dehors de l'île-de-France qui le font déjà totalement. Le problème actuel est celui des ressources. En effet, les réseaux des grandes métropoles ne sont pas formatés pour pouvoir absorber ce supplément de fréquentation.\nEt donc de ce point de vue, il n'est pas possible de se poser la question de la gratuité, avant de savoir quelle offre sera proposée aux usagers qui voyagent sur le réseau. »","q":"D'après ces spécialistes, quel est le fond du problème de la gratuité des transports ?","c":["L'absence de modèle comparatif de mobilité.","La déresponsabilisation des usagers.","Le déficit provoqué par son financement.","Le risque de saturation des réseaux."],"a":3,"k":"les réseaux des grandes métropoles ne sont pas formatés pour pouvoir absorber ce supplément de fréquentation."},{"t":"SUR LE CHEMIN DE LA BIO-CONSTRUCTION\n\nDepuis quelque temps, la conscience écologique s'est considérablement aiguisée. Les particuliers ont même une idée précise de ce qu'ils veulent comme habitat. En conséquence, les projets de logements 100% écologiques deviennent l'obsession de tous les cabinets d'architectes : construction basse consommation, rénovation énergétique, maison passive... Il s'agit maintenant d'adapter l'offre du marché et d'élargir les domaines de compétences des professionnels, notamment au sein des entreprises de construction. D'autant plus selon un grand nombre de spécialistes, la construction - quand elle est mise en œuvre - représente un gain pour tout le monde, pour le promoteur comme pour l'acheteur.","q":"Selon l'auteur, quel est le défi de la bio-construction ?","c":["Convaincre la clientèle cible.","Former les spécialistes du secteur.","Rentabiliser les projets à venir.","Restaurer d'anciens bâtiments."],"a":1,"k":"Il s'agit maintenant d'adapter l'offre du marché et d'élargir les domaines de compétences des professionnels, notamment au sein des entreprises de construction."},{"t":"L'homme est de noir vêtu. Son crâne, nu, joue avec la lumière. Tout est dit, tout est là, dans ce jeu d'ombre et de clarté qui fait d'un bâtisseur un poète. Jean Nouvel façonne le mystère pour insuffler du vivant aux édifices au cœur de pierre et bâtit sans dénaturer. Cet architecte éclairé n'exige rien, il convie cette émotion, suscite une apparition. Pour sa dernière création, l'œil découvre une ville-musée aux formes douces, un dôme qui semble né des mains d'une dentellière. Le dôme repose sur quatre piliers pour gagner en légèreté et s'allier au paysage, trait d'union avec les nuages.","q":"Quelle particularité de Jean Nouvel est louée dans cet article ?","c":["Sa technique puise dans divers mouvements artistiques.","Ses œuvres se fondent dans leur environnement.","Son inspiration provient de ses nombreuses lectures.","Son savoir-faire met en valeur des procédés connus."],"a":1,"k":"Le dôme repose sur quatre piliers pour gagner en légèreté et s'allier au paysage, trait d'union avec les nuages."},{"t":"Imaginez un instant que nos espaces de travail soient inadaptés à la moitié des salariés : vous trouverez cela pour le moins troublant, voire inacceptable. C'est pourtant le cas pour les personnes introverties qui, selon des recherches, représentent entre un tiers et la moitié de la population mondiale. Travail de groupe, réseaux sociaux, « open space » l'économie moderne exige d'interagir, faisant de l'aisance en public un avantage non négligeable dans le milieu professionnel. Les cultures d'entreprises qui mettent constamment en avant les échanges avec autrui finissent par dévaloriser l'identité des introvertis dont les capacités ne sont pas suffisamment sollicitées.\n\nD'après actualites du jour.eu","q":"Que dénonce l'auteur de l'article ?","c":["La primauté de l'apparence sur les compétences.","Le corporatisme poussé de certaines sociétés.","Le manque de formation aux nouvelles technologies.","Les principes actuels d'organisation du travail."],"a":3,"k":"Les cultures d'entreprises qui mettent constamment en avant les échanges avec autrui finissent par dévaloriser l'identité des introvertis dont les capacités ne sont pas suffisamment sollicitées."},{"t":"Les champs de mise en œuvre des robots sont légion : production, services, gestion des données, vie urbaine, sécurité, loisirs, domotique... Leur arrivée donne lieu à des transformations inédites et à des problématiques nouvelles, souvent mythiques. Un univers professionnel où tout serait régi par des robots ? Voilà qui est encore loin de la réalité. Si l'automatisation a fait disparaître des emplois, elle en a aussi créé d'autres. Surtout, elle a bouleversé le fonctionnement de l'entreprise, faisant peser une forte pression sur les salariés, tenus de maintenir la continuité de la production dans des processus toujours plus complexes.","q":"Quelle est la conséquence de la robotisation dans le monde professionnel ?","c":["Elle a accru la compétitivité industrielle.","Elle a amélioré les conditions de travail.","Elle a enrayé la hausse du chômage.","Elle a modifié l'organisation du travail."],"a":3,"k":"elle a bouleversé le fonctionnement de l'entreprise, faisant peser une forte pression sur les salariés, tenus de maintenir la continuité de la production dans des processus toujours plus complexes."},{"t":"Utiliser la comédie, le mime ou la danse pour sensibiliser les riverains, les responsables des établissements, les usagers de la nuit aux nuisances sonores ?\nTelle est la mission novatrice des Pierrots de la nuit, ces nouvelles « brigades d'intervention artistiques nocturnes » qui sensibilisent le public de nuit. L'originalité de la méthode interpelle, les noctambules s'interrogent : qui sont les Pierrots de la nuit ? Que font-ils et pourquoi ? L'art de rue n'est pas ressenti comme une agression, en revanche il force l'écoute et le respect. Le silence n'est pas une répression mais une forme de partage.","q":"Quel est l'objectif poursuivi par les pierrots de la nuit ?","c":["Améliorer la cohabitation entre les habitants et les noctambules.","Attirer les spectateurs parisiens vers les spectacles de rue.","Développer un nouveau concept de lieux silencieux.","Relancer la fréquentation nocturne des quartiers réservés."],"a":0,"k":"sensibiliser les riverains, les responsables des établissements, les usagers de la nuit aux nuisances sonores"},{"t":"Le nombre de travailleurs indépendants progresse. Il devient simple d'être à son compte, avec pour unique outil un ordinateur. Mais le risque est de se retrouver coupé des autres. Or, notre créativité et notre productivité sont dépendantes des rencontres que nous faisons. Conserver un lien social est indispensable à notre bien-être, donc à notre travail. L'espace partagé de travail se présente comme une solution : il favorise les moments de détente et les contacts professionnels. D'ailleurs, les travailleurs utilisant ces espaces s'associent souvent temporairement pour répondre à une mission. Ces aménagements pourraient donc devenir essentiels à de nombreux jeunes diplômés.","q":"Sur quoi cet article insiste-t-il ?","c":["L'importance de la gestion des ressources humaines.","L'intérêt d'éviter les inconvénients liés à l'isolement.","La facilité de réaliser des projets communs à distance.","La nécessité de souder les équipes dans une entreprise."],"a":1,"k":"le risque est de se retrouver coupé des autres. Or, notre créativité et notre productivité sont dépendantes des rencontres que nous faisons."}]</script>

}

function getPoints(i) {
  var n = i + 1;
  if (n <= 4)  return 3;
  if (n <= 10) return 9;
  if (n <= 19) return 15;
  if (n <= 29) return 21;
  if (n <= 35) return 26;
  return 33;
}

function calcScore() {
  var ok = 0, pts = 0;
  for (var k in ans) { if (ans[k].ok) { ok++; pts += getPoints(parseInt(k)); } }
  return { ok: ok, pts: pts };
}

function getNclc(score) {
  if (score >= 549) return { level: "NCLC 10+", msg: "Excellent ! Niveau NCLC 10 et plus." };
  if (score >= 524) return { level: "NCLC 9",   msg: "Très bien ! Niveau NCLC 9." };
  if (score >= 499) return { level: "NCLC 8",   msg: "Très bien ! Niveau NCLC 8." };
  if (score >= 453) return { level: "NCLC 7",   msg: "Objectif immigration atteint ! Niveau NCLC 7." };
  if (score >= 406) return { level: "NCLC 6",   msg: "Encore un peu d'effort pour atteindre le NCLC 7 !" };
  if (score >= 375) return { level: "NCLC 5",   msg: "Continuez à pratiquer, niveau NCLC 5." };
  if (score >= 342) return { level: "NCLC 4",   msg: "Continuez à pratiquer, niveau NCLC 4." };
  return { level: "En dessous de NCLC 4", msg: "Continuez à pratiquer !" };
}

function esc(s) {
  var t = String(s);
  t = t.replace(/&/g, "&amp;");
  t = t.replace(/</g, "&lt;");
  t = t.replace(/>/g, "&gt;");
  return t;
}

function hl(text, key) {
  var h = esc(text).split("\n").join("<br>");
  try {
    var ek = esc(key);
    var idx = h.toLowerCase().indexOf(ek.toLowerCase());
    if (idx >= 0) {
      h = h.substring(0, idx) + "<mark>" + h.substring(idx, idx + ek.length) + "</mark>" + h.substring(idx + ek.length);
    }
  } catch(e) {}
  return h;
}

function updateHeader() {
  var s = calcScore();
  var answered = Object.keys(ans).length;
  var pct = Math.round(answered / QQ.length * 100);
  document.getElementById("hdr-sub").textContent = "Question " + (cur + 1) + " / " + QQ.length + "  ·  " + s.pts + " pts";
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-l").textContent = "Question " + (cur + 1) + " / " + QQ.length;
  document.getElementById("prog-r").textContent = pct + "% complété";
}

function render(i) {
  cur = i;
  save();
  updateHeader();
  var q = QQ[i], ua = ans[i], done = ua !== undefined;
  var textHtml = done ? hl(q.t, q.k) : esc(q.t).split("\n").join("<br>");
  var keyLabel = done ? "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>" : "";

  var choicesHtml = "";
  for (var ci = 0; ci < q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    var dis = done ? "disabled" : "";
    choicesHtml += "<button class=\"" + cls + "\" " + dis + " onclick=\"pick(" + i + "," + ci + ")\"><span class=\"badge\">" + LABELS[ci] + "</span>" + esc(q.c[ci]) + "</button>";
  }

  var feedbackHtml = "";
  if (done) {
    if (ua.ok) {
      feedbackHtml = "<div class=\"feedback ok\">✓ Bonne réponse ! <strong>" + LABELS[q.a] + ") " + esc(q.c[q.a]) + "</strong></div>";
    } else {
      feedbackHtml = "<div class=\"feedback ko\">✗ Mauvaise réponse. La bonne réponse était : <strong>" + LABELS[q.a] + ") " + esc(q.c[q.a]) + "</strong></div>";
    }
  }

  var prevDis = i === 0 ? "disabled" : "";
  var nextLabel = i === QQ.length - 1 ? "Résultats →" : "Suivante →";
  var nextAction = i === QQ.length - 1 ? "summary()" : "render(" + (i + 1) + ")";

  document.getElementById("view").innerHTML =
    "<div class=\"nav\">" +
      "<button class=\"nav-btn\" " + prevDis + " onclick=\"render(" + (i - 1) + ")\">← Précédente</button>" +
      "<button class=\"nav-btn\" onclick=\"" + nextAction + "\">" + nextLabel + "</button>" +
      "<button class=\"nav-results\" onclick=\"summary()\">Résultats</button>" +
    "</div>" +
    "<div class=\"card\">" +
      "<div class=\"qnum\">Question " + (i + 1) + " / " + QQ.length + "</div>" +
      "<div class=\"textbox\">" + textHtml + "</div>" +
      keyLabel +
      "<div class=\"question\">" + esc(q.q) + "</div>" +
      "<div class=\"choices\">" + choicesHtml + "</div>" +
      feedbackHtml +
    "</div>";
}

function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  save();
  render(qi);
}

function summary() {
  var s = calcScore();
  var nclc = getNclc(s.pts);
  var answered = Object.keys(ans).length;
  var pct = Math.round(answered / QQ.length * 100);

  document.getElementById("prog-fill").style.width = "100%";
  document.getElementById("prog-l").textContent = "Terminé !";
  document.getElementById("prog-r").textContent = pct + "% complété";
  document.getElementById("hdr-sub").textContent = "Score final : " + s.pts + " pts  ·  " + s.ok + " / " + QQ.length + " correctes";

  var gridHtml = "";
  for (var i = 0; i < QQ.length; i++) {
    var ua = ans[i];
    var cls, lbl = i + 1;
    if (ua === undefined) cls = "sg-item sg-skip";
    else if (ua.ok) cls = "sg-item sg-correct";
    else cls = "sg-item sg-wrong";
    gridHtml += "<button class=\"" + cls + "\" onclick=\"render(" + i + ")\" title=\"Q" + lbl + "\">" + lbl + "</button>";
  }

  document.getElementById("view").innerHTML =
    "<div class=\"summary\">" +
      "<div class=\"sum-score-line\">" + s.ok + " / " + QQ.length + "</div>" +
      "<div class=\"sum-tcf\">Score TCF estimatif : <strong>" + s.pts + " / 699</strong></div>" +
      "<div class=\"sum-nclc\">" + nclc.level + "</div>" +
      "<div class=\"sum-msg\">" + nclc.msg + "</div>" +
      "<div class=\"sum-grid\">" + gridHtml + "</div>" +
      "<div class=\"sum-actions\">" +
        "<button class=\"btn-report\" onclick=\"showReport()\">📋 Voir le rapport des erreurs</button>" +
        "<button class=\"btn-restart\" onclick=\"reset()\">↺ Recommencer</button>" +
      "</div>" +
      "<div class=\"sum-note\">* Score estimatif à titre indicatif</div>" +
    "</div>";
}

function showReport() {
  var errHtml = "";
  var count = 0;
  for (var i = 0; i < QQ.length; i++) {
    var ua = ans[i];
    if (!ua || ua.ok) continue;
    count++;
    var q = QQ[i];
    var choicesHtml = "";
    for (var ci = 0; ci < q.c.length; ci++) {
      var cls, icon;
      if (ci === q.a) { cls = "report-choice rc-correct"; icon = "✓ "; }
      else if (ci === ua.choice) { cls = "report-choice rc-wrong"; icon = "✗ "; }
      else { cls = "report-choice rc-other"; icon = ""; }
      choicesHtml += "<div class=\"" + cls + "\"><span class=\"rc-badge\">" + LABELS[ci] + "</span>" + icon + esc(q.c[ci]) + "</div>";
    }
    errHtml +=
      "<div class=\"report-item\">" +
        "<div class=\"report-qnum\">Question " + (i + 1) + "</div>" +
        "<div class=\"textbox\">" + hl(q.t, q.k) + "</div>" +
        "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>" +
        "<div class=\"report-q\">" + esc(q.q) + "</div>" +
        choicesHtml +
      "</div>";
  }

  if (count === 0) {
    errHtml = "<p style=\"color:#1D9E75;font-weight:600;padding:1rem 0;\">🎉 Aucune erreur ! Félicitations !</p>";
  }

  document.getElementById("view").innerHTML =
    "<div class=\"report\">" +
      "<div class=\"report-header\">" +
        "<div class=\"report-title\">📋 Rapport des erreurs (" + count + " faute" + (count > 1 ? "s" : "") + ")</div>" +
        "<button class=\"btn-back\" onclick=\"summary()\">← Retour aux résultats</button>" +
      "</div>" +
      errHtml +
    "</div>";
}

function reset() {
  ans = {};
  cur = 0;
  save();
  render(0);
}

window.onload = function() { render(cur); };
</script>
</body>
</html>
