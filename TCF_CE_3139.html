son épingle du jeu. L'entreprise peut espérer le séduire en lui proposant un vrai métier et une stratégie d'accroissement de ses compétences mais il sera de toute façon difficile de compter sur sa fidélité : le jour où vous ne lui proposez plus d'évoluer rapidement, il n'hésitera pas à vérifier si l'herbe n'est pas plus verte chez le voisin. Il a l'image de l'entreprise qui dans un contexte économiques difficile ne s'engage plus envers le salarié. Il s'approprie cette logique de rentabilité et d'efficacité en la retournant à son avantage. Désormais il ne compte plus sur une entreprise pour mener sa carrière. Son objectif sera de développer ses compétences en multipliant ses expériences afin de se valoriser sur le marché du travail. Profitant de toutes les opportunités, il quittera une entreprise sans aucun remords.", "q": "Quel est le comportement des jeunes dans le monde de l'entreprise ?", "c": ["Ils apprennent à être patients.", "Ils évoluent selon l'ancienneté.", "Ils saisissent toutes les occasions.", "Ils tâchent de conserver leur emploi."], "a": 2, "k": "Profitant de toutes les opportunités, il quittera une entreprise sans aucun remords", "_sources": ["test12#32"]}, {"t": "Dans le monde de l'entreprise, les jeunes et les seniors éprouvent des sentiments analogues d'éviction et de dévalorisation. Pourtant, des actions de mentorat, menées par des seniors pour guider les jeunes sur le marché du travail ou lors de la création de leur entreprise, existent depuis de nombreuses années. Plus étonnant, est apparu récemment le mentorat renversé, où les jeunes habitués aux outils numériques initient les seniors à leur usage. Les seniors y gagnent de nouvelles compétences, et les jeunes élargissent leur réseau. En période de crise, cette coopération peut constituer un moyen de désamorcer les tensions sociales. Favoriser les échanges intergénérationnels, c'est contribuer à établir des relations où chacun prend conscience qu'il peut apporter quelque chose à l'autre.", "q": "Quel est l'intérêt des mentorats décrits ?", "c": ["Créer de nouvelles sources d'emploi.", "Éviter la solitude des personnes âgées.", "Instaurer des rapports de réciprocité.", "Répondre à l'allongement de la durée de vie."], "a": 2, "k": "c'est contribuer à établir des relations où chacun prend conscience qu'il peut apporter quelque chose à l'autre", "_sources": ["test12#33"]}, {"t": "Paul Bocuse n'était pas le plus créatif, ni le meilleur technicien de cette génération de chefs d'exception qui vu éclore des cuisiniers de renommée internationale. Mais il avait une vision, du culot et un véritable talent de meneur. Histoire de donner une stature plus importante aux cuisiniers, il a lancé la mode de la fameuse veste blanche « grand chef », avec le nom brodé sur la poitrine et le port de la toque démesurée qui évoque la coiffe des pharaons. Dès ses débuts, sa personnalité et son sens de la formule ont fait mouche auprès de la presse, qui a publié de nombreux portraits flatteurs, faisant affluer les clients dans son restaurant.", "q": "D'après ce journaliste, quelle a été la clé du succès de Paul Bocuse ?", "c": ["Sur l'industrie des bois rares.", "Sa connaissance des médias", "Ses recettes originales", "Son charisme incroyable"], "a": 3, "k": "sa personnalité et son sens de la formule ont fait mouche auprès de la presse", "_sources": ["test17#30"]}, {"t": "Les néo-nomades ont souvent moins de 30 ans et vivent dans leur camion ou d'anciens cars scolaires transformés en caravane ou camping-car. Ces nouveaux voyageurs intermittents vont d'un lieu à l'autre, au gré des impératifs de leur travail, souvent saisonnier et forment une population hétérogène.\nIls résolvent la difficulté d'accéder à un logement lorsque l'on n'a pas de travail permanent en se posant en marge de notre paysage contemporain : aux abords des routes secondaires, dans la périphérie des villes, le long des rails, sur des friches ou des terrains privés. Les néo-nomades forment de fait une entité structurée au cœur de notre société individualiste.", "q": "Selon le journaliste, quelle est l'origine du néonomadisme ?", "c": ["L'attirance pour les espaces naturels", "L'insécurité des zones urbaines", "La précarité du monde professionnel", "Le désir de vivre en communauté"], "a": 2, "k": "la difficulté d'accéder à un logement lorsque l'on n'a pas de travail permanent", "_sources": ["test22#33", "test25#32", "test33#32"]}, {"t": "Que pensent les français de la mobilité territoriale ?\nSi la mobilité n'est ni bonne, ni mauvaise en soi, elle peut être perçue de manière radicalement différente en fonction des circonstances dans lesquelles elle se réalise et surtout au fait d'être choisie ou non. Des mobilités personnelles, professionnelles et spatiales, voulues et recherchées, peuvent être un facteur d'épanouissement individuel et professionnel pour certains groupes favorisés, alors qu'elles peuvent être un facteur de précarité pour les groupes défavorisés, notamment si elles sont subies.", "q": "Quand est-ce qu'une mobilité territoriale est-elle bien vécue ?", "c": ["Si c'est une occasion d'élargir son réseau social", "Si c'est une opportunité de changer de mode de vie", "Si c'est la possibilité de trouver un emploi", "Si c'est le fruit d'une décision personnelle"], "a": 3, "k": "au fait d'être choisie ou non", "_sources": ["test22#35"]}, {"t": "Là où leurs prédécesseurs rêvaient d'un contrat à durée indéterminée, les Millénial (génération née entre 1980 et 2000) sont en quête d'expériences diversifiées. Beaucoup ont déjà connu le chômage et ont conscience de l'obsolescence de leurs compétences et de leur diplôme d'où leur sentiment de n'avoir rien à perdre. L'heure n'est plus à la relation de subordination, mais à la coopération. Au quotidien, il y a de quoi déconcerter les managers... Un Millénial accepte qu'on lui explique le sens du travail mais pas la manière de le faire. Face à ces collaborateurs qui font rimer bien-être professionnel avec connexion, confiance, autonomie et flexibilité, il faut en finir avec le syndrome de la hiérarchie pyramidale.", "q": "Qu'apprend-on sur les Millénial dans le monde du travail ?", "c": ["Ils bouleversent les rapports d'autorité.", "Ils évitent les postes à responsabilité.", "Ils sont moins motivés que leurs aînés.", "Ils tiennent à la stabilité de l'emploi."], "a": 0, "k": "L'heure n'est plus à la relation de subordination, mais à la coopération", "_sources": ["test23#31"]}, {"t": "Les néo-nomades ont souvent moins de 30 ans et vivent dans leur camion ou d'anciens cars scolaires transformés en caravane ou camping-car. Ces nouveaux voyageurs intermittents vont d'un lieu à l'autre, au gré des impératifs de leur travail, souvent saisonnier et forment une population hétérogène. Ils résolvent la difficulté d'accéder à un logement lorsque l'on n'a pas de travail permanent en se posant en marge de notre paysage contemporain : aux abords des routes secondaires, dans la périphérie des villes, le long des rails, sur des friches ou des terrains privés.", "q": "Selon le journaliste, quelle est l'origine du néo-nomadisme ?", "c": ["L'attirance pour les espaces naturels.", "L'insécurité des zones urbaines.", "La précarité du monde professionnel.", "Le désir de vivre en communauté."], "a": 2, "k": "la difficulté d'accéder à un logement lorsque l'on n'a pas de travail permanent", "_sources": ["test23#33"]}, {"t": "Que pensent les français de la mobilité territoriale ? Si la mobilité n'est ni bonne, ni mauvaise en soi, elle peut être perçue de manière radicalement différente en fonction des circonstances dans lesquelles elle se réalise et surtout du fait d'être choisie ou non. Des mobilités personnelles, professionnelles et spatiales, voulues et recherchées, peuvent être un facteur d'épanouissement individuel et professionnel pour certains groupes favorisés. Alors qu'elles peuvent être un facteur de précarité pour les groupes défavorisés notamment si elles sont subies.", "q": "Quand une mobilité territoriale est-elle vécue ?", "c": ["Si c'est une occasion d'élargir son réseau social.", "Si c'est une opportunité de changer de mode de vie.", "Si c'est la possibilité de trouver un emploi.", "Si c'est le fruit d'une décision personnelle."], "a": 3, "k": "voulues et recherchées, peuvent être un facteur d'épanouissement", "_sources": ["test23#35"]}, {"t": "L'association Bois & Cie est pensée au départ comme un atelier de partage de savoir-faire autour du bois. Pendant plus d'une décennie, des passionnés se réunissaient pour fabriquer meubles et autres objets en réutilisant des rebuts de bois. Il y a quelques années, l'association a pris un tournant : créer des habitats démontables en bois pour des publics précaires. En effet, Bois & Cie accueille des salariés en contrat d'insérer professionnellement et à trouver un toit sont liées. L'association décide alors de faire de la construction d'habitations son cœur d'activité et lance le projet Toits & Cie.", "q": "Quelle décision cette association a-t-elle prise ?", "c": ["Abandonner le travail du bois.", "Aider les plus démunis à se loger.", "Bâtir des locaux commerciaux.", "Développer l'activité de recyclage."], "a": 1, "k": "créer des habitats démontables en bois pour des publics précaires", "_sources": ["test25#31"]}, {"t": "Là où leurs prédécesseurs rêvaient d'un contrat à durée indéterminée, les Milléniaux (génération née entre 1980 et 2000) sont en quête d'expériences diversifiées. Beaucoup ont déjà connu le chômage et ont conscience de l'obsolescence de leurs compétences. L'heure n'est plus à la relation de subordination, mais à la coopération. Un Millénial accepte qu'on lui explique le sens du travail, mais pas la manière de le faire. Il faut en finir avec le syndrome de la hiérarchie pyramidale.", "q": "Qu'apprend-on sur les Milléniaux dans le monde du travail ?", "c": ["Ils bouleversent les rapports d'autorité.", "Ils évitent les postes à responsabilité.", "Ils sont moins motivés que leurs ainés.", "Ils tiennent à la stabilité de l'emploi."], "a": 0, "k": "L'heure n'est plus à la relation de subordination, mais à la coopération", "_sources": ["test31#31"]}, {"t": "Que pensent les Français de la mobilité territoriale ?\nSi la mobilité n'est ni bonne, ni mauvaise en soit, elle peut être perçue de manière radicalement différente en fonction des circonstances dans lesquelles elle se réalise et surtout du fait d'être choisie ou non. Des mobilités personnelles, professionnelles et spatiales, voulues et recherchées, peuvent être un facteur d'épanouissement individuel et professionnel pour certains groupes favorisés. Alors qu'elles peuvent être un facteur de précarité pour les groupes défavorisés, notamment si elles sont subies.", "q": "Quand une mobilité territoriale est-elle bien vécue ?", "c": ["Si c'est une occasion d'élargir son réseau social.", "Si c'est une opportunité de changer de mode de vie.", "Si c'est une possibilité de trouver un emploi.", "Si c'est le fruit d'une décision personnelle."], "a": 3, "k": "du fait d'être choisie ou non", "_sources": ["test31#35"]}, {"t": "On estime que grâce au développement des technologies, 55% des salariés qui travaillent aujourd'hui devant un écran pourraient devenir des télétravailleurs. Les avantages ? Une meilleure productivité individuelle car les télétravailleurs se focalisent avant tout sur les résultats. Autre intérêt : réduire les déplacements et diminuer le stress. C'est le cas d'Emmanuel Denner, 40 ans, directeur d'une ligne de produits dans une grande entreprise. « Les jeudis et les vendredis, je suis à mon bureau... mais à la maison. J'économise 70 kilomètres de trajets par jour. Cette solution apporte confort et plaisir, et cela se ressent dans la qualité du travail ». Mais le principal frein au développement du télétravail se rencontre dans l'esprit du management traditionnel. Le chef d'entreprise aime bien avoir l'œil sur ses salariés et ceux-ci ont également besoin de se sentir intégrés à une équipe", "q": "Selon ce texte, qu'est-ce qui empêche le développement du télétravail ?", "c": ["Un manque de volontaires au sein des entreprises.", "Un risque pour l'entreprise de voir son rendement baisser.", "Une absence d'équipements modernes adéquats.", "Une crainte de la hiérarchie quant à la qualité du travail fourni."], "a": 3, "k": "le principal frein au développement du télétravail se rencontre dans l'esprit du management traditionnel", "_sources": ["test32#35"]}, {"t": "Là où leurs prédécesseurs rêvaient d'un contrat à durée indéterminée, les Millennials (génération née entre 1980 et 2000) sont en quête d'expériences diversifiées. Beaucoup ont déjà connu le chômage et ont conscience de l'obsolescence de leurs compétences et de leur diplôme, d'où leur sentiment de n'avoir rien à perdre. L'heure n'est plus à la relation de subordination, mais à la coopération. Au quotidien, il y a de quoi déconcerter les managers... Un Millennial accepte qu'on lui explique le sens du travail mais pas la manière de le faire. Face à ces collaborateurs qui font rimer bien-être professionnel avec connexion, confiance, autonomie et flexibilité, il faut en finir avec le syndrome de la hiérarchie pyramidale.\n\nD'après lesechos.fr", "q": "Qu'apprend-on sur les Millennials dans le monde du travail ?", "c": ["Ils bouleversent les rapports d'autorité.", "Ils évitent les postes à responsabilité.", "Ils sont moins motivés que leurs aînés.", "Ils tiennent à la stabilité de l'emploi."], "a": 0, "k": "L'heure n'est plus à la relation de subordination, mais à la coopération.", "_sources": ["test36#31"]}, {"t": "Ils sont dix et ils sont \"dys\". Comme dyslexique, dysphasiques...âgés de 11 à 13 ans, ces enfants souffrants de troubles du langage sont accueillis depuis la rentrée au collègue Petite-Lande dans une classe intégrée, entourée d'une équipe de professionnels, « Les enfants ne suivent pas une formation classique, mais, durant quatre ans, ils vont donc acquérir les bases scolaires, de l'autonomie au quotidien, et choisir une orientation professionnelle grâce à des stages en entreprise ». Au sein du collègue, ils peuvent fréquenter des jeunes de leur âge, participer à certaines activités et projets en commun (cours de sport,sorties...)", "q": "Que peuvent faire ces jeunes grâce à ce projet ?", "c": ["Guérir de leurs troubles du langage.", "Intégrer une classe traditionnelle.", "Préparer leur entrée au collège.", "Profiter d'un encadrement spécifique."], "a": 3, "k": "entourée d'une équipe de professionnels", "_sources": ["test39#30"]}], "devoirs": [{"t": "En France, entre 200 000 et 500 000 cas troubles psychiques sont liés au monde du travail. L'apparition de nouvelles méthodes de travail, plus intenses et contraignantes, serait à l'origine de l'augmentation professionnelle : c'est le mal du siècle et pourtant, il n'est pas encore reconnu. Les salariés, prisonniers de l'idéologie ambiante, s'imaginent trop souvent, quand ils craquent, qu'un collègue plus solide qu'eux saurait été capable de résister. Mais cela s'avère faux la plupart du temps. Une reconnaissance de la maladie obligerait les entreprises à réfléchir à leur fonctionnement et représenterait une réelle mesure d'utilité publique.\n\nD'après capital.fr", "q": "Quel constat est dressé à propos de ce syndrome ?", "c": ["Il inquiète les patrons de sociétés.", "Il touche les employés les plus faibles.", "Son existence doit être officialisée.", "Son traitement est peu efficace."], "a": 2, "k": "c'est le mal du siècle et pourtant, il n'est pas encore reconnu", "_sources": ["test39#33"]}, {"t": "Travailler avec son mari ou son petit ami, sa sœur ou sa mère n'est pas une punition pour tout le monde ! Pour certains, c'est même la condition du bien être professionnel. Si cette idée évoquait jadis une petite entreprise conservatrice, transmise de père en fils, aujourd'hui, travailler en famille relève de réalités très différentes. Critères retenus : confiance, valeurs et goûts communs ; et surtout, besoin de réaliser ses projets plutôt que ceux des autres. Depuis toujours, la majorité des entreprises en France, toutes tailles confondues, sont familiales et de plus en plus de créations sont le fait de femmes. Ce sont d'ailleurs des entreprises où l'on vit mieux et qui durent plus longtemps que les autres. Aujourd'hui la création d'une entreprise est plus souvent motivée par le désir d'assurer un travail à ses enfants ou d'échapper à des structures jugées déshumanisation.", "q": "Que permet la structure d'entreprise présentée ?", "c": ["De concrétiser des objectifs personnels", "De fonctionner dans un cadre innovant", "De limiter la répartition des gains", "De renforcer les liens entre les générations"], "a": 0, "k": "besoin de réaliser ses projets plutôt que ceux des autres.", "_sources": ["test1#38"]}, {"t": "Aliocha – Blog [S'abonner +]\nQuand j'ai ouvert ce blog il y a bientôt trois ans, je lisais partout sur Internet que le journalisme professionnel était mort dès lors que chacun pouvait devenir journaliste, au sens de diffuseur d'informations. Ce point de vue, à mon sens erroné, tend à disparaître. Il disparait à mesure que se dessine sur Internet la différence entre faits et opinions, entre travail professionnel et amateur, entre capacité à aller chercher l'information et simple possibilité technique de la diffuser. Tout le monde n'est pas devenu journaliste avec Internet, en revanche, nous sommes de plus en plus nombreux à accéder au statut de membres actifs du système médiatique", "q": "Quelle est l'opinion de cette personne sur l'évolution du métier de journaliste ?", "c": ["La formation au métier de journaliste est devenue tout à fait inutile", "Une frontière est apparue entre les journalistes confirmés et les autres", "L'évolution d'Internet a affaibli le respect porté au statut de journaliste", "Des internautes publiant sur le net se prennent pour des journalistes"], "a": 1, "k": "la différence entre faits et opinions, entre travail professionnel et amateur", "_sources": ["test6#37"]}, {"t": "Dans le Val d'Oise, une grande entreprise immobilière envisage de bâtir un complexe commercial sur des terres agricoles parmi les plus fertiles de la région parisienne. Ce serait ainsi 80 hectares de champs qui disparaîtraient sous le béton pour laisser place à un grand temple de la consommation : locaux destinés à la culture (salle de spectacle. etc.), aux loisirs (manèges. etc) et aux magasins en tout genre. L'ouvrage pharaonique ne devra son succès qu'à son gigantisme : les promoteurs expliquent en effet qu'ils pensent attirer les clients du fait que ce centre commercial sera encore plus grand que ses cousins...\nCe n'est pas avec ce genre de raisonnement que le rythme d'artificialisation des terres va baisser, ni que la France diminuera ses émissions de CO2.", "q": "Que déplore l'auteur ?", "c": ["La démesure du complexe imaginé.", "La flambée des prix de l'immobilier.", "La lenteur de la construction du centre.", "L'obtention de diplômes cesse d'assurer l'avenir professionnel des jeunes."], "a": 0, "k": "Ce n'est pas avec ce genre de raisonnement que le rythme d'artificialisation des terres va baisser", "_sources": ["test10#37"]}, {"t": "Les entreprises dans les secteurs scientifiques, techniques et numériques ont un besoin crucial de se développer et d'embaucher, et redoublent notamment d'attention envers les femmes. Problème : les femmes, qui furent les premières à programmer, se détournent désormais de ces métiers. Non seulement le nombre de filles s'engageant dans des études scientifiques décroît fortement, mais en plus la grogne s'accroît chez leurs collègues masculins, affolés par le discours sur la parité et la concurrence potentielle. Si les jeunes femmes, un temps attirées par ces métiers, ne les convoitent plus aujourd'hui, c'est bien parce qu'elles trouvent des opportunités dans des secteurs où elles sont mieux acceptées.", "q": "Qu'apprend-on dans ce texte au sujet des femmes ?", "c": ["Elles ont été pionnières en informatique.", "Elles sont victimes d'inégalités salariales.", "Les sociétés craignent de les engager.", "Leurs compétences sont méconnues."], "a": 0, "k": "les femmes, qui furent les premières à programmer", "_sources": ["test12#39"]}, {"t": "Non, tous les salariés ne sont pas faits pour télétravailler.\nLe rapport Oberg le prouve à travers soixante-quinze entretiens approfondis avec des télétravailleurs.\nEn effet, tous les métiers et les personnalités ne sont pas adaptés au télétravail.\nLa réussite du télétravail exige des profils de salariés très spécifiques.", "q": "Qu'est-ce qui ressort du rapport Obergo concernant le télétravail ?", "c": ["Il donne satisfaction aux employés interrogés.", "Il est délicat à mettre en œuvre", "Il impose une restructuration des services", "Il nuit à la performance des cadres"], "a": 1, "k": "tous les métiers et les personnalités ne sont pas adaptés au télétravail", "_sources": ["test16#38"]}, {"t": "Inexorablement, la cravate perd de sa superbe. Un abandon progressif constaté par Serge Carriera, maitre de conférences à Sciences Po Paris et spécialiste du luxe et de la mode : on l'impose de moins en moins de manière systématique à tout le monde au sein d'une entreprise. Toutefois, il existe des secteurs qui résistent à la tendance. Dans le monde de la finance, dans la haute administration, la cravate reste quelque chose de statutaire, estime Serge Carriera. C'est un symbole d'autorité, et de respect vis-à-vis de ses interlocuteurs, de ses clients … un formalisme qui n'est pas toujours très bien compris par les principaux intéressés : Josselin travaille pour une banque d'entreprise, il n'est pas en contact avec les clients et pourtant il doit se plier à la règle.", "q": "Pourquoi certains continuent-ils à porter la cravate au travail ?", "c": ["C'est un accessoire d'élégance masculine", "C'est un signe de reconnaissance entre pairs", "C'est une coutume en réunion", "C'est une marque de courtoisie"], "a": 3, "k": "un symbole d'autorité, et de respect vis-à-vis de ses interlocuteurs", "_sources": ["test17#38"]}, {"t": "Le redémarrage de l'économie passera-t-il par l'hydrogène « vert » ? C'est ce que réclame l'Association française pour l'hydrogène et les piles à combustible (Afhypac), dans un courrier au Premier ministre cosigné par Air Liquide, EDF, Engie, Faurecia, Michelin, Plastic Omnium, Total, Vinci… Tous demandent que l'État « investisse massivement jusqu'en 2023 » afin de « donner à la France une position industrielle stratégique dans l'économie bas carbone de demain ». Mais, alors que la Commission européenne publie sa stratégie hydrogène, aujourd'hui, celle de la France se fait attendre. L'Allemagne, elle, fonce : 9 des 130 milliards d'euros de son plan de relance annoncé en juin y seront consacrés. Les véhicules routiers et le train en absorberont une bonne part. Logique : l'hydrogène y a ses meilleures applications. Utilisé comme réactif dans une pile à combustible (Pac), il offre une autonomie double de celles des batteries. Même si son rendement global est moins bon (du fait de la dépense d'énergie nécessaire à la production de l'hydrogène lui-même), c'est un avantage décisif sur les batteries dès qu'il faut déplacer marchandises ou passagers", "q": "Quel est le principal argument en faveur de l'hydrogène « vert » selon le texte ?", "c": ["Il permet de réduire les émissions de carbone", "Il offre une meilleure autonomie que les batteries", "Il crée des emplois dans l'industrie", "Il profite du soutien de l'Europe"], "a": 1, "k": "il offre une autonomie double de celles des batteries", "_sources": ["test18#37"]}, {"t": "À Julien, qui nous interroge sur l'emploi du franglais dans notre magazine, nous pouvons assurer que nous cherchons à éviter les anglicismes, sans toutefois pouvoir les éradiquer. Les réactions de nos lecteurs nous confortent dans notre vigilance, mais nous considérons aussi qu'il est important de s'exprimer dans un langage commun. Or, dans ce langage commun, des mots étrangers ont trouvé leur place. Pour être compris de tous, il est parfois plus logique parler de check-list que d'une liste d'actions à cocher... Et, en comparaison à bien d'autres publications, la présence de si peu d'anglicismes dans nos colonnes devrait réjouir.", "q": "Quel est le point de vue de l'équipe de rédaction du magazine ?", "c": ["Il faut accepter l'évolution d'une langue.", "Il faut bannir les termes anglais.", "Il faut plaire à l'ensemble des lecteurs.", "Il faut utiliser des mots basiques."], "a": 0, "k": "des mots étrangers ont trouvé leur place", "_sources": ["test19#38"]}, {"t": "Les études montrent : loin de disparaître, la pause-déjeuner reste un moment sacré pour une très grande majorité du personnel, et pas seulement pour se restaurer et recharger ses batteries.\nCette coupure rituelle est aussi l'occasion de partager un moment avec ses collègues, d'échanger, de nouer des liens de convivialité. Immuable, la pause-déjeuner connaît pourtant depuis quelques années d'importantes mutations. La crise économique a évidemment eu ses effets, en pesant sur le budget du consommateur. Mais les bouleversements vont au-delà de ces aspects purement financiers et s'étendent au domaine alimentaire. Autrefois prépondérant, le souci de quantité a laissé la place à la sélection, gage selon les consommateurs de plus de qualité. Dans les restaurants d'entreprises, les salariés vont privilégier une offre moins large mais mieux choisie.", "q": "Qu'apprend-on sur la pause-déjeuner au travail ?", "c": ["Elle engendre une baisse du rendement du personnel.", "Elle est en partie prise en charge par les entreprises.", "Les employés sont attachés à l'origine des aliments.", "Les salariés ont tendance à la prendre à l'extérieur."], "a": 2, "k": "le souci de quantité a laissé la place à la sélection", "_sources": ["test21#38"]}, {"t": "Le recul est considérable : les accidents de travail ont diminué de plus de 7 % cette année. Cette chute est due en partie aux campagnes médicales menées auprès du public. Mais elle révèle aussi une situation économique, avec la baisse d'activité, notamment dans les secteurs industriels - bâtiment et travaux publics. Mais si les accidents sont moins nombreux, les maladies professionnelles, elles, ne cessent de progresser, avec une hausse de 5% en 2009. Et les troubles des muscles et des os sont particulièrement concernés : leur fréquence a ainsi augmenté de plus de 7 % en un an : En cause, le stress, mais aussi les activités physiques à répétition.", "q": "Qu'apprend-on sur les accidents du travail ?", "c": ["Ils ont une influence très préoccupante sur l'économie.", "Ils se produisent dans les entreprises industrielles.", "Ils sont remplacés par des pathologies professionnelles.", "Ils sont source de traumatismes musculaires."], "a": 2, "k": "les maladies professionnelles, elles, ne cessent de progresser", "_sources": ["test25#38"]}, {"t": "Imaginez un instant que nos espaces de travail soient inadaptés à la moitié des salariés : vous trouveriez cela pour le moins troublant, voire inacceptable. C'est pourtant le cas pour les personnes introverties qui, selon des recherches, représentent entre un tiers et la moitié de la population mondiale. Travail de groupe, réseaux sociaux, « Open space » : l'économie moderne exige d'interagir, faisant de l'aisance en public un avantage non négligeable dans le milieu professionnel. Les cultures d'entreprises qui mettent constamment en avant les échanges avec autrui finissent par dévaloriser l'identité des introvertis dont les capacités ne sont pas suffisamment sollicitées.", "q": "Que dénonce l'auteur de cet article ?", "c": ["La primauté de l'apparence sur les compétences.", "Le corporatisme pousse de certaines sociétés.", "Le manque de formation aux nouvelles technologies.", "Les principes actuels d'organisation du travail."], "a": 3, "k": "dévaloriser l'identité des introvertis", "_sources": ["test26#36"]}, {"t": "Quand j'ai ouvert ce blog il y a bientôt trois ans, je lisais partout sur Internet que le journalisme professionnel était mort dès lors que chacun pouvait devenir journaliste, au sens de diffuseur d'informations. Ce point de vue, à mon sens erroné, tend à disparaître. Il disparaît à mesure que se dessine sur Internet la différence entre faits et opinions, entre travail professionnel et amateur, entre capacité à aller chercher l'information et simple possibilité technique de la diffuser. Tout le monde n'est pas devenu journaliste avec Internet, en revanche, nous sommes de plus en plus nombreux à accéder au statut de membres actifs du système médiatique.", "q": "Quelle est l'opinion de cette personne sur l'évolution du métier de journaliste ?", "c": ["La formation au métier de journaliste est devenue tout à fait inutile.", "Une frontière est apparue entre les journalistes confirmés et les autres.", "L'évolution d'Internet a affaibli le respect porté au statut de journaliste.", "Des internautes publiant sur le net se prennent pour des journalistes."], "a": 1, "k": "la différence entre faits et opinions, entre travail professionnel et amateur", "_sources": ["test28#38"]}, {"t": "L'expression management des savoirs peut paraître paradoxale. Tout d'abord, les savoirs semblent moins contrôlables que les ressources matérielles parce que plus évanescents. Comment parvenir à gérer une chose aussi insaisissable que le savoir ? Le management évoque des règles et procédés organisationnels alors que les savoirs refuseraient d'être dirigés et contraints dans des règles standard. Pourtant, il est de plus en plus communément admis que les savoirs doivent être gérés comme les ressources matérielles : c'est même là que réside désormais la clé de la compétitivité des entreprises.", "q": "Quelle est la particularité de l'expression : management des savoirs ?", "c": ["Elle évoque la facilité de contrôle des savoirs comparativement aux ressources matérielles.", "Elle suggère que les savoirs peuvent être facilement dirigés et contraints dans des règles standard.", "Elle souligne la complexité de gérer une chose aussi insaisissable que le savoir tout en reconnaissant son importance pour la compétitivité des entreprises.", "Elle affirme que les savoirs sont moins importants pour la compétitivité des entreprises que les ressources matérielles."], "a": 2, "k": "il est de plus en plus communément admis que les savoirs doivent être gérés comme les ressources matérielles", "_sources": ["test31#39"]}, {"t": "Le nombre de travailleurs indépendants progresse : il devient simple d'être à son compte, avec pour unique outil un ordinateur. Mais le risque est de se retrouver coupé des autres. Or, notre créativité et notre productivité sont dépendantes des rencontres que nous faisons. Conserver un lien social est indispensable à notre bien-être, donc à notre travail. L'espace partagé de travail se présente comme une solution : il favorise les moments de détente et les contacts professionnels. D'ailleurs, les travailleurs utilisant ces espaces s'associent souvent temporairement pour répondre à une mission. Ces aménagements pourraient donc devenir essentiels à de nombreux jeunes diplômés.", "q": "Sur quoi cet article insiste-t-il ?", "c": ["L'importance de la gestion des ressources humaines.", "L'intérêt d'éviter les inconvénients liés à l'isolement.", "La facilité de réaliser des projets communs à distance.", "La nécessité de souder les équipes dans une entreprise."], "a": 1, "k": "Conserver un lien social est indispensable à notre bien-être", "_sources": ["test32#38"]}, {"t": "Imaginez un instant que nos espaces de travail soient inadaptés à la moitié des salariés : vous trouverez cela pour le moins troublant, voire inacceptable. C'est pourtant le cas pour les personnes introverties qui, selon des recherches, représentent entre un tiers et la moitié de la population mondiale. Travail de groupe, réseaux sociaux, « open space » l'économie moderne exige d'interagir, faisant de l'aisance en public un avantage non négligeable dans le milieu professionnel. Les cultures d'entreprises qui mettent constamment en avant les échanges avec autrui finissent par dévaloriser l'identité des introvertis dont les capacités ne sont pas suffisamment sollicitées.\n\nD'après actualites du jour.eu", "q": "Que dénonce l'auteur de l'article ?", "c": ["La primauté de l'apparence sur les compétences.", "Le corporatisme poussé de certaines sociétés.", "Le manque de formation aux nouvelles technologies.", "Les principes actuels d'organisation du travail."], "a": 3, "k": "Les cultures d'entreprises qui mettent constamment en avant les échanges avec autrui finissent par dévaloriser l'identité des introvertis dont les capacités ne sont pas suffisamment sollicitées.", "_sources": ["test36#36"]}, {"t": "Le nombre de travailleurs indépendants progresse. Il devient simple d'être à son compte, avec pour unique outil un ordinateur. Mais le risque est de se retrouver coupé des autres. Or, notre créativité et notre productivité sont dépendantes des rencontres que nous faisons. Conserver un lien social est indispensable à notre bien-être, donc à notre travail. L'espace partagé de travail se présente comme une solution : il favorise les moments de détente et les contacts professionnels. D'ailleurs, les travailleurs utilisant ces espaces s'associent souvent temporairement pour répondre à une mission. Ces aménagements pourraient donc devenir essentiels à de nombreux jeunes diplômés.", "q": "Sur quoi cet article insiste-t-il ?", "c": ["L'importance de la gestion des ressources humaines.", "L'intérêt d'éviter les inconvénients liés à l'isolement.", "La facilité de réaliser des projets communs à distance.", "La nécessité de souder les équipes dans une entreprise."], "a": 1, "k": "le risque est de se retrouver coupé des autres. Or, notre créativité et notre productivité sont dépendantes des rencontres que nous faisons.", "_sources": ["test36#39"]}, {"t": "A Julien, qui nous interroge sur l'emploi du franglais dans notre magazine, nous pouvons assurer que nous cherchons à éviter les anglicismes, sans toutefois pouvoir les éradiquer. Les réactions de nos lecteurs nous confortent dans notre vigilance, mais nous considérons aussi qu'il est important de s'exprimer dans un langage commun. Or, dans ce langage commun, des mots étrangers ont trouvé leur place.\n\nPour être compris de tous, il est parfois plus logique parler de check-list que d'une liste d'actions à cocher... Et, en comparaison à bien d'autres publications, la présence de si peu d'anglicismes dans nos colonnes devrait réjouir nos lecteurs.", "q": "Quel est le point de vue de l'équipe de rédaction du magazine ?", "c": ["Il faut accepter l'évolution d'une langue.", "Il faut bannir les termes anglais.", "Il faut plaire à l'ensemble des lecteurs.", "Il faut utiliser des mots basiques."], "a": 0, "k": "dans ce langage commun, des mots étrangers ont trouvé leur place.", "_sources": ["test37#38"]}, {"t": "Les études le montrent : loin de disparaître, la pause-déjeuner reste un moment sacré pour une très grande majorité du personnel. Et pas seulement pour se restaurer et recharger ses batteries. Cette coupure rituelle est aussi l'occasion de partager un moment avec ses collègues, d'échanger, de nouer des liens de convivialité. Immuable, la pause-déjeuner connaît pourtant depuis quelques années d'importantes mutations. La crise économique a évidemment eu ses effets, en pesant sur le budget du consommateur. Mais les bouleversements vont au-delà de ces aspects purement financiers et s'étendent au domaine alimentaire. Autrefois prépondérant, le souci de quantité a laissé la place à la sélection, gage selon les consommateurs de plus de qualité. Dans les restaurants d'entreprises, les salariés vont privilégier une offre moins large, mais mieux choisie.", "q": "Qu'apprend-on sur la pause-déjeuner au travail ?", "c": ["Elle engendre une baisse du rendement du personnel.", "Elle est en partie prise en charge par les entreprises.", "Les employés sont attachés à l'origine des aliments.", "Les salariés ont tendance à la prendre à l'extérieur."], "a": 2, "k": "le souci de quantité a laissé la place à la sélection, gage selon les consommateurs de plus de qualité.", "_sources": ["test40#38"]}]}, "Education": {"cours": [{"t": "Monsieur et Madame Martin n'ont pas un emploi du temps également captivant. Quand Monsieur se rend au travail, Madame manie l'aspirateur. Quand il est au bureau, elle achète des surgelés au supermarché. Quand il se cale devant la télé, l'épouse modèle se colle aux fourneaux. Une illustration exhumée d'un manuel des années 1950 ? non, les images d'un exercice pour une classe de CP afin de « comprendre la simultanéité » en étudiant les moments de la « journée d'une famille ». Quand Virginie Sassoon est tombée sur ce document ultra-stéréotypé dans le classeur de sa fille, cette maman est tombée des nues. « Cette fiche dévoile une forme de violences symbolique qui persiste dans notre société et qui relève, selon moi, de la responsabilité collective. »", "q": "Pourquoi Virginie Sassoon est-elle choquée par les exercices proposés dans la classe de sa fille ?", "c": ["Ils correspondent à des programmes scolaires obsolètes.", "Ils méconnaissent l'existence des familles recomposées.", "Ils présentent un partage sexiste des tâches dans le couple.", "Ils se moquent du quotidien des personnes sans emploi."], "a": 2, "k": "Quand Monsieur se rend au travail, Madame manie l'aspirateur.", "_sources": ["test1#34"]}, {"t": "Très controversée, la semaine de quatre jours à l'école est dénoncée dans un rapport parlementaire. Les députés proposent de revenir à la semaine de quatre journées et demie et de réduire la période des vacances estivales. La mission parlementaire livre des conclusions sévères à l'encontre du rythme scolaire actuel, qui serait « aberrant » et « délirant » pour les écoliers. Selon un député, on peut dire, a priori, que c'est une erreur, « on a privilégié le rythme des parents et des enseignants au détriment de celui des enfants », dit-il. En France, la scolarisation annuelle est de 144 jours, contre une moyenne de 180 pour les pays développés, « il faut laisser le temps scolaire », estime une experte.", "q": "Que reprochent les députés à la semaine de quatre jours ?", "c": ["De laisser trop de temps à l'oisiveté", "De s'écarter du modèle éducatif légal", "De satisfaire avant tout les adultes", "D'être à l'origine de l'échec scolaire"], "a": 2, "k": "on a privilégié le rythme des parents et des enseignants au détriment de celui des enfants", "_sources": ["test3#35", "test13#35"]}, {"t": "Plancher sur la réforme des rythmes scolaires, comme le fera la « conférence » installée aujourd'hui par le ministre de l'éducation, c'est prendre en compte toute une série de paramètres qui n'ont rien à voir, ou si peu, avec l'école primaire. C'est s'intéresser aux évolutions de la famille et à la multiplication des horaires de travail dits « atypiques ». C'est examiner, du point de vue des collectivités locales, les conséquences financières et pratiques (transport scolaire, cantine, centres de loisirs) de tout changement éventuel dans l'organisation de la semaine. C'est encore recueillir l'avis des experts de la circulation routière et entendre les préoccupations des professionnels du tourisme... Autant dire que l'intérêt de l'enfant se trouve plus ou moins sacrifié sur l'autel du compromis.", "q": "Quel constat dresse le journaliste à propos de la réforme des rythmes scolaire ?", "c": ["Les familles sont opposées à toute modification.", "Les impacts financiers demeurent insurmontables.", "Les intérêts en jeu sont difficilement compatibles.", "Les opinions des experts sont en total désaccord."], "a": 2, "k": "l'intérêt de l'enfant se trouve plus ou moins sacrifié sur l'autel du compromis", "_sources": ["test4#33"]}, {"t": "L'opération « Voile à l'école » permet chaque année à des centaines d'enfants d'apprendre à faire du bateau pendant l'école. Au départ, la voile fait peur. Pour rassurer les élèves débutants, les leçons sont très progressives. Les enseignants reçoivent des cahiers avec des explications et des informations techniques. Ils peuvent ainsi développer en classe un programme de prévention pour identifier et éviter Les dangers.", "q": "Quel est le but de l'opération « voile à l'école » ?", "c": ["Expérimenter une nouvelle pédagogie par le sport", "Former les maîtres à la pratique du sport sur l'eau", "Permettre aux jeunes de découvrir un sport difficile", "Réduire les risques en éducation physique et sportive"], "a": 3, "k": "développer en classe un programme de prévention pour identifier et éviter Les dangers", "_sources": ["test5#31"]}, {"t": "L'apprentissage en Europe\nÀ l'heure actuelle, l'utilisation des nouvelles technologies de l'information et de la communication (TIC) dans les salles de classe est rare. Les établissements travaillent encore selon un modèle ancien de l'éducation. Cela signifie que les établissements n'ont pas pu se détacher d'une structure trop rigide : ils fondent leurs ressources d'enseignement sur des manuels, ont peu recours aux connaissances mises à leur portée grâce à la mondialisation et travaillent au sein d'espaces d'apprentissage très spécifiques. Les établissements appliquent toujours une philosophie plus caractéristique du XIXe siècle (industriel) que du XXIe siècle (informationnel).\nL'enseignement se caractérise actuellement par des établissements du XIXe siècle dans lesquels des enseignants du XXe siècle travaillent auprès d'étudiants du XXI siècle.", "q": "Que présente l'auteur de l'article ?", "c": ["Des méthodes innovantes sur l'usage des TIC", "Des pistes de recherche sur l'apprentissage", "Un état des lieux des ressources pédagogiques", "Une analyse du contexte socio-éducatif actuel"], "a": 2, "k": "Les établissements appliquent toujours une philosophie plus caractéristique du XIXe siècle", "_sources": ["test6#34"]}, {"t": "Ils sont dix et ils sont dys, comme dyslexiques, dysphasiques. Âgés de 11 à 13 ans, ces enfants souffrant de troubles du langage sont accueillis depuis la rentrée au collège Petite-Lande dans une classe intégrée, entourés d'une équipe de professionnels. Les enfants ne suivent pas une formation classique mais, durant quatre ans, ils vont acquérir les bases scolaires, l'autonomie au quotidien, et choisir une orientation professionnelle grâce à des stages en entreprise. Au sein du collège, ils peuvent fréquenter des jeunes de leur âge, participer à certaines activités et projets en commun (cours de sport, sorties...).", "q": "Que peuvent faire ces jeunes grâce à ce projet ?", "c": ["Guérir de leurs troubles du langage.", "Intégrer une classe traditionnelle.", "Préparer leur entrée au collège.", "Profiter d'un encadrement spécifique."], "a": 3, "k": "entourés d'une équipe de professionnels", "_sources": ["test8#30"]}, {"t": "Le linguiste Alain Rey explique le sentiment de honte à l'idée de faire une faute par le fait qu'avoir une bonne orthographe fait partie des comportements attendus : la mauvaise orthographe est devenue problématique à partir du moment où tout le monde est allé à l'école. On peut tolérer une orthographe incertaine dans les lettres privées ou dans les SMS, mais une faute dans le milieu professionnel a plus de conséquences : on risque de donner une mauvaise image de soi et donc d'être mal jugé.", "q": "Comment Alain Rey explique-t-il l'importance d'avoir une bonne orthographe ?", "c": ["C'est un indice de savoir-vivre.", "C'est un marqueur social.", "C'est un signe de respect.", "C'est une preuve d'éducation."], "a": 1, "k": "une faute dans le milieu professionnel a plus de conséquences : on risque de donner une mauvaise image", "_sources": ["test9#33"]}, {"t": "Les recherches actuelles sur la motivation indiquent que la confiance en ses capacités permet d'agir efficacement et joue un rôle crucial dans l'engagement et les performances d'un élève. Cette confiance peut varier d'un domaine à l'autre ainsi que d'une matière scolaire à l'autre. Tout comme on peut se sentir très à l'aise avec des instruments de musique mais maladroit sur un terrain de basket, on peut se sentir très compétent en français mais peu brillant en mathématiques. Les recherches ont montré que les élèves confiants en leurs capacités dans une matière choisissent de préférence des activités présentant pour eux un défi et leur donnant l'occasion de développer leurs habiletés. Inversement, ils ont tendance à se désintéresser des activités dans lesquelles ils se sentent peu efficaces.", "q": "Comment réagissent les élèves qui sont à l'aise dans certaines disciplines ?", "c": ["Ils finissent par maîtriser l'ensemble des matières.", "Ils font des efforts dans les autres matières étudiées.", "Ils négligent les matières trop faciles pour eux.", "Ils se fixent des objectifs élevés dans ces matières."], "a": 3, "k": "choisissent de préférence des activités présentant pour eux un défi", "_sources": ["test10#30", "test20#30"]}, {"t": "Ils sont dix et ils sont \"dys\". Comme dyslexiques, dysphasiques... Agés de 11 à 13 ans, ces enfants souffrant de troubles du langage sont accueillis depuis la rentrée au collège Petite-Lande dans une classe intégrée, entourés d'une équipe de professionnels. « Les enfants ne suivent pas une formation classique mais, durant quatre ans, ils vont donc acquérir les bases scolaires, de l'autonomie au quotidien, et choisir une orientation professionnelle grâce à des stages en entreprise ». Au sein du collège, ils peuvent fréquenter des jeunes de leur âge, participer à certaines activités et projets en commun (cours de sport, sorties...).", "q": "Que peuvent faire ces jeunes grâce à ce projet ?", "c": ["A) Guérir de leurs troubles du langage", "B) Intégrer une classe traditionnelle", "C) Préparer leur entrée au collège", "D) Profiter d'un encadrement spécifique"], "a": 3, "k": "entourés d'une équipe de professionnels", "_sources": ["test13#30"]}, {"t": "La langue française n'a pas besoin de se défendre. Elle a surtout besoin de se détendre. Aimons-la et laissons-la flâner, adopter des mots d'argot ou étrangers. Laissons-la respirer et s'inspirer comme elle veut. Avec elle, essayons juste d'être … cool ! En utilisant ce mot, j'imagine déjà l'indignation de ceux qui considèrent l'anglais comme un adversaire. Pour nous, la langue anglaise est peut-être une rivale, mais sûrement pas une ennemie. Elle nous a emprunté nos « rendez-vous », notre « savoir-faire », « déshabillé », « bureau de change », « maitre d'hôtel ». Il n'y a aucune contradiction entre, d'une part, encourager la pratique de l'anglais et, d'autre part, adopter la une stratégie volontariste en faveur de la francophonie.", "q": "Selon ce journaliste, comment la langue française pourrait-elle évoluer?", "c": ["En diversifiant sa politique linguistique", "En modernisant son enseignement", "En s'enrichissant de tous types d'apports", "En valorisant les particularités régionales"], "a": 2, "k": "laissons-la flâner, adopter des mots d'argot ou étrangers", "_sources": ["test14#31"]}, {"t": "Les anomalies ne doivent pas masquer le degré de cohérence qui fonde le code graphique. S'il y a plusieurs graphies pour un même son, leur distribution n'est pas aléatoire : le choix est souvent corrélé à des critères de position ou à des correspondances morphologiques. Les lettres muettes, à l'occasion, soulignent les flexions ou les dérivations. Certaines consonnes doubles sont clairement interprétables. De plus, certaines graphies étymologiques ne sont pas dépourvues de toute signification. Et bien d'autres observations iraient dans le même sens. Dès lors, pourquoi renoncer à enseigner ce noyau intelligible de notre écriture ? L'orthographe, dans ses fondements, peut faire l'objet d'un apprentissage raisonné. Une pédagogie fondée sur la réflexion est plus valorisante qu'une acquisition basée sur le « par cœur » et la répétition, en même temps qu'elle assure des connaissances plus solides.", "q": "Que pense l'auteur de l'orthographe française ?", "c": ["Elle devrait être réformée de fond en comble", "Elle est parsemée de prescriptions irrationnelles", "Elle répond à certaines règles compréhensibles", "Elle se maîtrise par des exercices de mémorisation"], "a": 2, "k": "le choix est souvent corrélé à des critères de position ou à des correspondances morphologiques", "_sources": ["test14#33"]}, {"t": "Très controversé, la semaine de quatre jours à l'école st dénoncée dans un rapport parlementaire. Les députés proposent de revenir à la semaine de quatre journées et demie et de réduire la période des vacances estivales. La mission parlementaire livre des conclusions sévères à l'encontre du rythme scolaire actuel, qui serait « aberrant » et « délirant » pour les écoliers. Selon un député, on peut dire, a posteriori, que c'est une erreur, « on a privilégié le rythme des parents et des enseignants au détriment de celui des enfants », dit-il. En France, la scolarisation annuelle est de 144 jours, contre une moyenne de 180 pour les pays développés. « Il faut laisser le temps scolaire », estime une experte.", "q": "Que reprochent les députés à la semaine de quatre jours ?", "c": ["De laisser trop de temps à l'oisiveté.", "De s'écarter du modèle éducatif légal.", "De satisfaire avant tout les adultes.", "D'être à l'origine de l'échec scolaire."], "a": 2, "k": "on a privilégié le rythme des parents et des enseignants au détriment de celui des enfants", "_sources": ["test14#35"]}, {"t": "Bonjour,\nVous parlez dans votre article du risque de coupure générale d'électricité pour la Bretagne du fait d'une surconsommation. Or, cette région ne possède pas de source de production locale, ce qui implique une dépendance vis-à-vis du réseau et des lignes à haute tension ! La pression est forte à chaque épisode de grand froid... Le risque est réel, cependant les Bretons se serrent la ceinture ! La Bretagne s'est toujours montrée en avance dans l'action, comme un village d'irréductibles Gaulois entouré par les Romains ! Ce qui est agaçant, c'est que, pendant qu'ils jettent la pierre aux particuliers, les médias ne dénoncent pas l'absence d'efforts des milieux industriels ! C'est même écœurant de le constater, ils ne subissent aucune restriction à ce jour ! Qui consomme réellement plus ?\nAndré, fidèle lecteur", "q": "Quelle est la réaction dont ce lecteur fait part ?", "c": ["Il aimerait que sa région soit plus combative et engagée face aux problèmes locaux.", "Il réclame de nouvelles dispositions tarifaires pour que les factures soient moins élevées.", "Il s'indigne en estimant que les reproches faits aux consommateurs sont injustifiés.", "Il trouve inquiétantes les conséquences de la mauvaise gestion des sources d'énergie."], "a": 2, "k": "les médias ne dénoncent pas l'absence d'efforts des milieux industriels", "_sources": ["test15#35"]}, {"t": "Plancher sur la réforme des rythmes scolaires, comme le fera la « conférence » installée aujourd'hui par le ministre de l'éducation, c'est prendre en compte toute une série de paramètres qui n'ont rien à voir, ou si peu, avec l'école primaire.\nC'est encore recueillir l'avis des experts de la circulation routière et entendre les préoccupations des professionnels du tourisme.", "q": "Quel constat dresse le journaliste à propos de la réforme des rythmes scolaires ?", "c": ["Les familles sont opposées à toute modification", "Les impacts financiers demeurent insurmontables", "Les intérêts en jeu sont difficilement compatibles", "Les opinions des experts sont en total désaccord"], "a": 2, "k": "toute une série de paramètres qui n'ont rien à voir… avec l'école primaire", "_sources": ["test16#33"]}, {"t": "Je suis persuadée que tous les enfants possèdent en eux la volonté de mettre en route leur imaginaire vers la littérature.\nC'est la mission de l'école que de sensibiliser les élèves aux grands textes classiques.", "q": "Selon l'auteur de ce texte, quelle ambition devraient avoir les enseignants ?", "c": ["Aborder des œuvres réputées difficiles avec leurs élèves.", "Encourager leurs élèves à écrire des textes littéraires.", "Inviter régulièrement des écrivains célèbres dans leur classe.", "Monter des pièces de théâtre d'auteurs classiques."], "a": 0, "k": "la mission de l'école que de sensibiliser les élèves aux grands textes classiques", "_sources": ["test16#35"]}, {"t": "Ma chère Amélie\nMerci pour ta lettre. Je suis contente que tu te plaises dans ta nouvelle résidence. Il faut dire que le soleil et la proximité de la mer rendent la vie plus agréable. Ta proposition me fait plaisir et je pense pouvoir te rejoindre bientôt. Cela ne me gêne pas que les travaux ne soient pas terminés dans la maison et je me réjouis de pouvoir profiter de la plage et de ton jardin.\nEncore mille mercis,\nFlorence", "q": "Quelle information est absente de la lettre ?", "c": ["Amélie a déménagé récemment", "Amélie a invité Florence", "Florence a beaucoup de travail", "Florence aime le bord de mer"], "a": 2, "k": "Ta proposition me fait plaisir et je pense pouvoir te rejoindre bientôt", "_sources": ["test17#31"]}, {"t": "L'apprentissage en Europe\nA l'heure actuelle, l'utilisation des nouvelles technologies de l'information et de la communication (TIC) dans les salles de classe est rare. Les établissements travaillent encore selon un modèle ancien de l'éducation. Cela signifie que les établissements n'ont pas pu se détacher d'une structure trop rigide : ils fondent leurs ressources d'enseignement sur des manuels, ont peu recours aux connaissances mises à leur portée grâce à la mondialisation et travaillent au sein d'espaces d'apprentissage très spécifiques. Les établissements appliquent toujours une philosophie plus caractéristique du XIXe siècle (industriel) que du XXIe siècle (informationnel). L'enseignement se caractérise actuellement par des établissements du XIXe siècle dans lesquels des enseignants du XXe siècle travaillent auprès d'étudiants du XXIe siècle.", "q": "Que présente l'auteur de l'article ?", "c": ["Des méthodes innovantes sur l'usage des TIC", "Des pistes de recherche sur l'apprentissage", "Un état des lieux des ressources pédagogiques", "Une analyse du contexte socio-éducatif actuel"], "a": 2, "k": "fondent leurs ressources d'enseignement sur des manuels", "_sources": ["test18#31"]}, {"t": "Le numérique bouleverse profondément l'enseignement, mais, d'après le philosophe Marcel Gauchet, on aura plus que jamais besoin de professeurs et d'écoles. Excellent moyen de stimuler la curiosité, le numérique pousse à chercher, à creuser encore. Surtout, il enseigne une chose essentielle : personne ne sait et, nulle part, il n'existe de détenteur ultime du savoir. Ainsi, les élèves sont de plus en plus en contact avec des sources hétéroclites et cela constitue un changement majeur en termes pédagogiques.\nL'enseignant est alors celui qui va expliquer qu'il existe plusieurs versions d'une même chose et que savoir, c'est se confronter à l'incertitude et non reciter bêtement des connaissances.", "q": "Selon Marcel Gauchet, quel va être le rôle de l'enseignant auprès des élèves ?", "c": ["Développer leur esprit critique.", "Encourager les débats entre eux.", "Enrichir leur capacité mémorielle.", "Évaluer régulièrement leurs acquis."], "a": 0, "k": "savoir, c'est se confronter à l'incertitude et non reciter bêtement des connaissances", "_sources": ["test19#32"]}, {"t": "Un nouveau mot se banalise sur les campus américains : « microagression ». Qualifiant les blessures subtiles qui affectent les individus exposés à une forme de dévalorisation par le langage, il alimente le débat sur la liberté d'expression. Forgé dans les années 1970, le terme a été développé à partir de 2007 par Derald Wing Sue qui le définit ainsi : des insultes ou attitudes intentionnelles ou non qui communiquent des messages hostiles ou méprisants envers des personnes sur la seule base de leur appartenance à un groupe marginalisé. Des universités ont mis en place des mécanismes de prévention et de dénonciation de ces microagressions mais certains redoutent que l'excès de précaution ne vienne tuer le débat d'idées.", "q": "Qu'apprend-on sur les microagressions ?", "c": ["Ce sont des blessures corporelles superficielles.", "Elles sont commises par des groupes minoritaires.", "Les autorités universitaires s'en préoccupent peu.", "Lutter contre elles peut nuire à certaines libertés."], "a": 3, "k": "certains redoutent que l'excès de précaution ne vienne tuer le débat d'idées.", "_sources": ["test20#34", "test23#34", "test25#34"]}, {"t": "Je suis persuadée que tous les enfants possèdent en eux la volonté de mettre en route leur imaginaire qui les pousse naturellement vers la littérature. Mais si elle n'est pas stimulée, cette force peut s'éteindre. C'est la mission de l'école que de sensibiliser les élèves aux grands textes classiques. Malheureusement, elle y a renoncé. Trop souvent, les enseignants ont tendance à penser qu'ils sont réservés à l'élite. Alors qu'au contraire, l'école devrait donner un accès à la haute culture aux élèves qui arrivent avec un bagage moins fourni que les autres.", "q": "Selon l'auteur de ce texte, quelle ambition devraient avoir les enseignants ?", "c": ["Aborder des œuvres réputées difficiles avec leurs élèves.", "Encourager leurs élèves à écrire des textes littéraires.", "Inviter régulièrement des écrivains célèbres dans leur classe.", "Monter des pièces de théâtre d'auteurs classiques."], "a": 0, "k": "l'école devrait donner un accès à la haute culture aux élèves qui arrivent avec un bagage moins fourni", "_sources": ["test20#35"]}], "devoirs": [{"t": "Le numérique bouleverse profondément l'enseignement, mais d'après le philosophe Marcel Gauchet, on aura plus que jamais besoin de professeurs et d'écoles. Excellent moyen de stimuler la curiosité, le numérique pousse à chercher, à creuser encore. Surtout, il enseigne une chose essentielle : personne ne sait et, nulle part, il n'existe de détenteur ultime du savoir. Ainsi, les élèves sont de plus en plus en contact avec des sources hétéroclites et cela constitue un changement majeur en termes pédagogiques. L'enseignant est alors celui qui va expliquer qu'il existe plusieurs versions d'une même chose et que savoir, c'est se confronter à l'incertitude et non inciter bêtement des connaissances.", "q": "Selon Marcel Gauchet, que va être le rôle de l'enseignant auprès des élèves ?", "c": ["Développer leur esprit critique", "Encourager les débats entre eux", "Enrichir leur capacité mémorielle", "Evaluer régulièrement leurs acquis"], "a": 0, "k": "expliquer qu'il existe plusieurs versions d'une même chose", "_sources": ["test22#32"]}, {"t": "A l'ère de l'écran généralisé, les images on prit une place déterminante dans notre culture visuelle. En quelques années, elles ont connu une double évolution : d'une part, leur multiplication industrielle ; d'autre part leur cumul et leur circulation planétaire grâce à internet. Cette réalité pose des questions de plus en plus importantes. En termes d'éducation à l'image et plus généralement aux médias. En effet, malgré un nombre presque illimité d'informations disponibles, seules quelques-unes nous sont diffusées en boucle. Il est donc absolument nécessaire de développer des médias relais et d'éclairer le public par une pédagogie visant à savoir choisir et interpréter les médias et leurs images.", "q": "Quel problème évoque le journaliste ?", "c": ["L'information est trop rarement contrôlée à sa source.", "La population est insuffisamment formée aux médias.", "Les fausses nouvelles facilement diffusées en ligne.", "Les images influencent en permanence les consommateurs."], "a": 1, "k": "une pédagogie visant à savoir choisir et interpréter les médias", "_sources": ["test23#30"]}, {"t": "Les chaînes d'information en continu nous montrent la vie en temps réel, comme si nous y étions. Les informations y sont plus vraies que nature, elles palpitent et nous prennent aux tripes, analyse le journaliste Hubert Huertas. Avec le direct, nous pouvons imaginer qu'il peut toujours se passer quelque chose. C'est plus fort que le différé et plus fort que la fiction : nous sommes dans le concret, en contact avec le monde, et cela devient addictif, ajoute Virginie Spies, spécialiste des médias. À cela s'ajoute une impression d'insécurité. Le direct présente dans ces moments un côté hypnotique et tient le téléspectateur en haleine.", "q": "Qu'explique cet article à propos des chaines d'informations en continu ?", "c": ["Elles captivent l'instantanéité.", "Elles exigent un sens du discernement.", "Elles modifient le rapport au temps.", "Elles nourrissent une curiosité naissante."], "a": 0, "k": "cela devient addictif", "_sources": ["test24#30"]}, {"t": "Dans les écoles, le mode d'évaluation classique est en passe d'être remplacé par une évaluation comporte des dizaines d'items, considérés comme « acquis », « pas acquis » ou « en cours d'acquisition » par l'enseignant. Cependant, certains items qui manquent de précision. Ils pensent qu'il est très difficile d'évaluer des compétences sur le savoir-être et que cela n'a aucun intérêt. En outre, le système demande trois fois plus de temps en correction. D'autres professeurs que certains élèves se sentent plus encouragés et valorisés. Ils progressent, car ils savent après chaque évaluation quelle est la compétence à retravailler, car cela est plus précis qu'une note. La suppression du mode traditionnel d'évaluation suscite des réactions fortes, aussi bien chez les parents et enseignants que chez les simples citoyens : réactions qui traduisent à la fois le sentiment de ne plus comprendre les objectifs de l'école, de ne plus maîtriser les attentes de l'institution envers les enfants.", "q": "En quoi ce nouveau système d'évaluation peut-il être déstabilisant ?", "c": ["Il est imposé sans explications aux enseignants.", "Il manque de finesse dans l'analyse des résultats.", "Il propose des questions inadaptées aux enfants.", "Il remet en question des traditions profondément ancrées."], "a": 3, "k": "La suppression du mode traditionnel d'évaluation suscite des réactions fortes", "_sources": ["test25#33"]}, {"t": "« Le programme de mobilité Erasmus n'est plus réservé aux étudiants », explique Sophie Roque, enseignante. Peu répandu, le programme Erasmus+ pour les enseignants bénéficie depuis quelques années d'un grand appel d'air. La demande progresse, et l'offre de mobilité aussi : Le système éducatif finlandais et les formations en anglais attirent beaucoup. Si le programme Erasmus+ pour les enseignants semble très apprécié de ceux qui y participent, il souffre néanmoins d'un vrai déficit de notoriété. On le découvre souvent par hasard ou à la faveur d'une rencontre. Franck Le Cars, délégué académique, confirme que le bouche-à-oreille entre enseignants est le meilleur moyen de développer le dispositif. Il souligne également que ces mobilités à l'étranger restent complexes à mettre en œuvre car très chronophages.", "q": "Qu'apprend-on sur le programme Erasmus+ ?", "c": ["Il est méconnu du public visé.", "Il est restreint à quelques pays.", "Il favorise certains établissements.", "Il souffre d'une image négative."], "a": 0, "k": "il souffre néanmoins d'un vrai déficit de notoriété", "_sources": ["test27#33"]}, {"t": "La question environnementale est au cœur des débats contemporains ; elle doit donc, à ce titre, trouver dans l'école un écho à la mesure de son importance. Il faut toutefois adapter la question à l'espace scolaire. La première condition pour un transfert réussi, utile et pédagogique, est d'ordre terminologique : il faudrait reformuler la problématique dans des mots ordinaires. Pourquoi, en effet, ne pas parler directement de l'environnement et du rapport que les hommes entretiennent avec lui, de la variété précieuse des êtres vivants qui le composent, de sa protection en vue de sa conservation ? Nous nous placerions ainsi dans un registre linguistique moins abstrait que celui de la transition écologique par exemple.", "q": "D'après l'auteur, que faut-il faire pour sensibiliser les élèves aux questions environnementales ?", "c": ["Améliorer la formation des enseignants.", "Instaurer des discussions en classe.", "Programmer des sorties dans la nature.", "Simplifier le vocabulaire employé."], "a": 3, "k": "il faudrait reformuler la problématique dans des mots ordinaires.", "_sources": ["test28#35"]}, {"t": "Le programme de mobilité Erasmus n'est plus réservé aux étudiants, explique Sophie Roque, enseignante. Peu répandu, le programme Erasmus+ pour les enseignants bénéficie depuis quelques années d'un grand appel d'air. La demande progresse, et l'offre de mobilité aussi. Le système éducatif finlandais et les formations en anglais attirent beaucoup. Si le programme Erasmus+ pour les enseignants semble très apprécié de ceux qui y participent, il souffre néanmoins d'un vrai déficit de notoriété. On le découvre souvent par hasard ou à la faveur d'une rencontre. Franck Le Cars, délégué académique, confirme que le bouche-à-oreille entre enseignants est le meilleur moyen de développer le dispositif. Il souligne également que Ces mobilités à l'étranger restent complexes à mettre en œuvre, car très chronophages.", "q": "Qu'apprend-on sur le programme Erasmus+ ?", "c": ["Il est méconnu du public visé.", "Il est restreint à quelques pays.", "Il favorise certains établissements.", "Il souffre d'une image négative."], "a": 0, "k": "il souffre néanmoins d'un vrai déficit de notoriété", "_sources": ["test29#33"]}, {"t": "Mon souci a toujours été d'inciter mes étudiants à ne pas s'enfermer dans une seule vision du monde. Parce que finalement chacun vit dans sa prison. C'est à la fin de mon livre : « Il faut parler deux langues au moins pour savoir qu'on en parle une, que c'est une langue que l'on parle ». J'ai toujours dit à mes étudiants que le monde ne se limitait pas à notre manière de vivre. Accepter de n'exister qu'avec une langue, qu'avec une culture, c'est se priver de liberté. En choisissant d'étudier une autre langue, on se donne une chance inouïe : tout d'un coup, on voit apparaitre cette prison dans laquelle on vivait sans forcément s'en rendre compte.", "q": "Qu'explique cette personne sur l'apprentissage d'une langue étrangère ?", "c": ["Il favorise un enrichissement lexical", "Il incite à entreprendre des voyages", "Il met à jour un enfermement ignoré", "Il permet d'élargir son réseau social"], "a": 2, "k": "on voit apparaitre cette prison dans laquelle on vivait sans forcément s'en rendre compte", "_sources": ["test34#32"]}, {"t": "Le numérique bouleverse profondément l'enseignement mais, d'après le philosophe Marcel Gauchet, on aura plus que jamais besoin de professeurs et d'écoles.\nExcellent moyen de stimuler la curiosité, le numérique pousse à chercher, à creuser encore. Surtout, il enseigne une chose essentielle : personne ne sait et, nulle part, il n'existe de détenteur ultime du savoir. Ainsi, les élèves sont de plus en plus en contact avec des sources hétéroclites et cela constitue un changement majeur en termes pédagogiques. L'enseignant est alors celui qui va expliquer qu'il existe plusieurs versions d'une même chose et que savoir, c'est se confronter à l'incertitude et non réciter bêtement des connaissances.", "q": "Selon Marcel Gauchet, quel va être le rôle de l'enseignant auprès des élèves ?", "c": ["Développer leur esprit critique.", "Encourager les débats entre eux.", "Enrichir leur capacité mémorielle.", "Évaluer régulièrement leurs acquis."], "a": 0, "k": "L'enseignant est alors celui qui va expliquer qu'il existe plusieurs versions d'une même chose et que savoir, c'est se confronter à l'incertitude", "_sources": ["test36#32"]}, {"t": "« Le programme de mobilité Erasmus n'est plus réservé aux étudiants, explique Sophie Roque, enseignante. Peu répandu, le programme Erasmus+ pour les enseignants bénéficie depuis quelques années d'un grand appel d'air. La demande progresse, et l'offre de mobilité aussi. Le système éducatif finlandais et les formations en anglais attirent beaucoup. Si le programme Erasmus+ pour les enseignants semble très apprécié de ceux qui y participent, il souffre néanmoins d'un vrai déficit de notoriété. On le découvre souvent par hasard ou à la faveur d'une rencontre. Franck Le Cars, délégué académique, confirme que le bouche-à-oreille entre enseignants est le meilleur moyen de développer le dispositif. Il souligne également que ces mobilités à l'étranger restent complexes à mettre en œuvre, car très chronophages.", "q": "Qu'apprend-on sur le programme Erasmus+ ?", "c": ["Il est méconnu du public visé.", "Il est restreint à quelques pays.", "Il favorise certains établissements.", "Il souffre d'une image négative."], "a": 0, "k": "il souffre néanmoins d'un vrai déficit de notoriété.", "_sources": ["test38#33"]}, {"t": "Les technologies de l'information et de la communication (TIC) sont de plus en plus utilisées et adoptées de façon variable par les établissements d'enseignement supérieur à travers le monde. Les TIC apparaissent autant comme une prestation en présence sur le campus que comme un enseignement ouvert et à distance. Les actions de l'UNESCO se concentrent sur l'aide aux Etats membres afin de développer des politiques durables dans le domaine des TIC dans l'enseignement supérieur. Les plans d'action et les investissements positifs en matière de TIC sont clairement bénéfiques pour les institutions d'enseignement supérieur (IES), meute si les TIC n'ont pas remplacé les modes d'apprentissage ou d'enseignement classiques tels que les salles de classe.", "q": "Pourquoi peut-on dire que l'UNESCO est active dans le domaine des TIC ?", "c": ["Parce qu'elle finance les programmes de développement des TIC", "Parce qu'elle organise des débats entre Etats membres sur les TIC", "Parce qu'elle sensibilise les établissements d'enseignement aux TIC", "Parce qu'elle habilite des formateurs à l'utilisation des TIC"], "a": 2, "k": "Les actions de l'UNESCO se concentrent sur l'aide aux Etats membres afin de développer des politiques durables dans le domaine des TIC", "_sources": ["test1#37"]}, {"t": "Le contrôle, en toute matière, aboutit à pervertir l'action. Dès qu'une action est soumise à un contrôle, le but profond de celui qui agit n'est plus l'action, mais la prévision du contrôle, la mise en échec des moyens de contrôle. Le contrôle des études n'est qu'un cas particulier et une démonstration éclatante de cette observation très générale. Le diplôme donne à la société un fantôme de garantie, et aux diplômés des fantômes de droits. Le diplômé passe officiellement pour détenir un savoir : il garde toute sa vie ce brevet d'une science momentanée. C'est pour accéder au diplôme qu'on a vu se substituer à la lecture des auteurs, l'usage des résumés, des manuels, des recueils de questions et de réponses toutes faites et autres abominations.", "q": "Que soutient l'auteur de ce texte à propos du contrôle ?", "c": ["Il contribue à améliorer les méthodes d'apprentissage", "Il est indispensable pour accéder au monde professionnel", "Il permet de certifier les compétences réelles d'un candidat", "Il perturbe le processus d'acquisition des connaissances"], "a": 3, "k": "le but profond de celui qui agit n'est plus l'action, mais la prévision du contrôle.", "_sources": ["test1#39"]}, {"t": "Depuis l'adolescence, je fréquente assidûment les dictionnaires. Chaque fois que je bute sur un mot, que je suis dans le flou culturel, ils m'apportent la réponse et ouvrent de nouveaux horizons à ma curiosité et me renvoyant souvent à d'autres ouvrages. J'en possède une centaine et chacun est une bibliothèque à lui seul. Tous sont autant de béquilles de ma culture. Par exemple, quand vous cherchez le mot juste, rien de tel qu'un dictionnaire des synonymes ! On ouvre un dictionnaire pour se renseigner sur une question précise comme on lirait la notice d'un produit pharmaceutique destiné à soigner ceci ou cela.\nC'est le self-service de la pensée !\nJean-Claude Simöen, éditeur", "q": "Pourquoi Jean-Claude Siméon aime-t-il les dictionnaires ?", "c": ["Pour découvrir de nouvelles références", "Pour posséder une bibliothèque fournie", "Pour s'évader vers des horizons lointains", "Pour trouver des remèdes à ses maux"], "a": 0, "k": "ils m'apportent la réponse et ouvrent de nouveaux horizons à ma curiosité", "_sources": ["test2#39"]}, {"t": "Le Monde de l'éducation a atteint son ambition : devenir la référence nationale en matière d'enseignement. Un succès confirmé par une récente enquête qui nous crédite d'un taux de satisfaction exceptionnellement élevé. Mais nos abonnés ont souvent des établissements scolaires … où Le Monde de l'éducation est le magazine français le plus « photocopillé » : environ 40 000 exemplaires vendus pour plus d'in million cent mille lecteurs ! un écart ventes-lectorat devenu insupportable depuis 1974. Le Monde de l'éducation a accompli de nombreuses transformations. Après trente quatre ans au service de l'éducation, votre magazine va vivre sa mue la plus importante. De mensuel payant vendu en kiosque par abonnement, il va devenir un supplément gratuit proposé avec le quotidien Le Monde.", "q": "Qu'est-ce qui a justifié la transformation du monde de l'éducation ?", "c": ["Une adéquation avec l'attente des lecteurs", "Une diffusion abusive de copies illégales", "Une offre promotionnelle provisoire", "Une perte croissante du nombre d'abonnés"], "a": 1, "k": "le magazine français le plus « photocopillé »", "_sources": ["test3#37"]}, {"t": "Une scolarisation précoce permet une meilleure adaptation à l'univers scolaire et peut donc être le gage d'une réussite scolaire ultérieure. « La scolarisation avant 3 ans, écrit Agnès Florin (professeure de psychologie), trouve des justifications dans les résultats de plusieurs recherches, au moins pour les enfants des milieux défavorisés et sur certains aspects de leur développement cognitif et langagier ». Par ailleurs, l'entrée précoce à l'école permet d'éviter l'apparition de troubles ou de perturbations et joue donc un rôle préventif. On trouve en effet de nombreux exemples de jeunes enfants dont on a pu détecter certains problèmes psychologiques ou physiologiques grâce à leur entrée à l'école.", "q": "Selon l'auteur, que permet la scolarité précoce des enfants ?", "c": ["Développer leurs capacités de socialisation", "Diagnostiquer d'éventuels déséquilibres", "Faciliter l'apprentissage d'une seconde langue", "Lutter contre les inégalités sociales"], "a": 1, "k": "l'entrée précoce à l'école permet d'éviter l'apparition de troubles ou de perturbations et joue donc un rôle préventif", "_sources": ["test5#37"]}, {"t": "La bioéthique fait l'objet d'une polémique qui confronte deux écoles.\nPour la première, composée de chercheurs et de rationalistes, le progrès scientifique ne saurait être limité. La recherche entraînera l'éradication des maladies génétiques et permettra même de les prévoir. On en viendra à un eugénisme contrôlé qui améliorera l'espèce humaine et les dépenses de santé publique seront allégées. La seconde école, des philosophes ou des ecclésiastiques, affirme ses craintes en ce qui concerne la pratique d'un eugénisme scientifique : il permettra la sélection efficace des embryons et ouvrira de plus en plus largement ses critères de choix à des exigences non pathologiques. Pour eux, il est impossible de déterminer les tares inconciliables avec l'humain, puisque certains individus en ont fait l'origine même de leur génie.", "q": "Sur quoi portent les réserves des partisans de la seconde école ?", "c": ["Le coût social élevé de prise en charge des maladies génétiques.", "Le développement de traitements curatifs de pathologies génétiques.", "Le mode de financement de la recherche génétique fondamentale.", "Les dérives induites par l'amélioration du patrimoine génétique."], "a": 3, "k": "ils affirment leurs craintes en ce qui concerne la pratique d'un eugénisme scientifique", "_sources": ["test7#36", "test35#37"]}, {"t": "Mozart est le compositeur le plus joué, le plus aimé et le plus exploité. Ainsi, en 1993, la psychologue américaine Frances Rauscher annonçait que l'écoute de la Sonate pour deux pianos en ré majeur développait l'intelligence. En effet, après avoir écouté ce morceau, 36 étudiants avaient obtenu de meilleurs résultats à un test de localisation spatiale. L'étude eut un retentissement fracassant. On examina la teneur en haute fréquence de la sonate. On la fit écouter à des rats de laboratoire avant de les perdre dans un labyrinthe. On évoqua l'influence des gènes. En 1999, une nouvelle étude venait contredire les conclusions de Frances Rauscher", "q": "A quelle conclusion est arrivée Frances Raucher concernant l'écoute de la sonate de Mozart ?", "c": ["Elle a un effet négligeable sur l'intellect.", "Elle accroît la capacité de concentration.", "Elle facilite le repérage dans l'espace.", "Elle perturbe le raisonnement logique."], "a": 2, "k": "36 étudiants avaient obtenu de meilleurs résultats à un test de localisation spatiale", "_sources": ["test7#37"]}, {"t": "Treize jeunes cinéastes, achevant leur formation dans les plus prestigieuses écoles d'animation, ont planché sur quelques vers de Paul Éluard, livrant leur vision originale de son univers poétique. S'inscrivant dans la suite des programmes de courts-métrages dédiés à Prévert et Apollinaire, ce nouveau florilège de la série En sortant de l'école met en lumière l'oeuvre d'un apparenté surréaliste dont la notoriété est souvent, hélas, réduite au seul et incontournable poème Liberté. Sa délicatesse, un combustible merveilleux pour de jeunes cinéastes.", "q": "Selon cette critique, quel est l'apport de ce dernier ensemble de courts-métrages ?", "c": ["Il constitue une création artistique novatrice.", "Il établit des ponts avec d'autres auteurs.", "Il fait connaître les travaux d'un écrivain.", "Il ouvre la voie à de prochaines réalisations."], "a": 2, "k": "met en lumière l'oeuvre d'un apparenté surréaliste", "_sources": ["test8#39"]}, {"t": "Le contrôle, en toute matière, aboutit à pervertir l'action … Dès qu'une action est soumise à un contrôle, le but profond de celui qui agit n'est plus l'action, mais la prévision du contrôle, la mise en échec des moyens de contrôle. Le contrôle des études n'est qu'un cas particulier et une démonstration éclatante de cette observation très générale. Le diplôme donne à la société un fantôme de garantie, et aux diplômés des fantômes de droits. Le diplômé passe officiellement pour détenir un savoir : il garde toute sa vie ce brevet d'une science momentanée. C'est pour accéder au diplôme qu'on a vu se substituer à la lecture des auteurs, l'usage des résumés, des manuels, des recueils de questions et de réponses toutes faites et autres abominations.", "q": "Que soutient l'auteur de ce texte à propos du contrôle ?", "c": ["Il contribue à améliorer les méthodes d'apprentissage.", "Il est indispensable pour accéder au monde professionnel.", "Il permet de certifier les compétences réelles d'un candidat.", "Il perturbe le processus d'acquisition des connaissances."], "a": 3, "k": "le contrôle, en toute matière, aboutit à pervertir l'action", "_sources": ["test9#38"]}, {"t": "Depuis l'adolescence, je fréquente assidûment les dictionnaires.\n\nChaque fois que je bute sur un mot, que je suis dans le flou culturel, ils m'apportent la réponse et ouvrent de nouveaux horizons à ma curiosité en me renvoyant souvent à d'autres ouvrages. J'en possède une centaine et chacun est une bibliothèque à lui seul. Tous sont autant de béquilles de ma culture. Par exemple, quand vous cherchez le mot juste, rien de tel qu'un dictionnaire des synonymes ! On ouvre un dictionnaire pour se renseigner sur une question précise comme on lirait la notice d'un produit pharmaceutique destiné à soigner ceci ou cela.\nC'est le self-service de la pensée !\nJean-Claude Simon, éditeur", "q": "Pourquoi Jean-Claude Simon aime-t-il les dictionnaires ?", "c": ["Pour décou
