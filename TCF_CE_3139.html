<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF CE · NCLC 7 (31–39) · 9 thèmes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;padding:1rem}
#app{max-width:860px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.header img{height:52px;object-fit:contain}
.header-right{text-align:right}
.header-title{font-size:16px;font-weight:700;color:#1a1a1a}
.header-sub{font-size:12px;color:#888;margin-top:2px}
.prog-bar{height:5px;background:#e0ddd5;border-radius:3px;margin-bottom:4px}
.prog-fill{height:100%;background:#4DB88A;border-radius:3px;transition:width .35s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:1rem}
.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.85rem}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#444}
.btn:hover{background:#f5f4f0}
.btn-results{margin-left:auto;border-color:#2E8B62;color:#2E8B62;font-weight:600;background:#fff}
.btn-results:hover{background:#e8f6ef}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.q-type-label{display:inline-block;background:#E8F6EF;color:#0F5C3E;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.75rem;font-weight:500}
.src-label{display:inline-block;background:#f0f0f0;color:#666;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px}
.passage-box{background:#f5faf7;border:1px solid #BFE6D3;border-radius:8px;padding:.9rem 1.1rem;font-size:14px;line-height:1.75;color:#1a1a1a;margin-bottom:1rem;white-space:normal}
.passage-box mark{background:#FAC775;color:#412402;border-radius:3px;padding:1px 3px}
.key-label{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.5rem}
.question{font-size:16px;font-weight:600;margin-bottom:.9rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:11px 15px;border:1px solid #d0cdc5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;background:#fff;width:100%;box-sizing:border-box;text-align:left;transition:background .15s,border-color .15s}
.choice:hover:not(.correct):not(.wrong):not(.disabled){background:#f5f4f0}
.choice.disabled{cursor:default}
.choice .badge{font-weight:700;min-width:22px;flex-shrink:0;color:#2E8B62;font-size:15px}
.choice.correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.choice.correct .badge{color:#085041}
.choice.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.choice.wrong .badge{color:#4A1B0C}
.feedback{border-radius:8px;padding:10px 14px;margin-top:.85rem;font-size:14px}
.feedback.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.feedback.ko{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}
.summary{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.5rem}
.summary h2{font-size:20px;font-weight:700;margin-bottom:1.25rem;text-align:center}
.score-block{text-align:center;margin-bottom:1.5rem}
.score-correct{font-size:32px;font-weight:700;color:#2E8B62}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:1.25rem 0}
.grid-btn{width:36px;height:36px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;color:#fff}
.grid-btn.ok{background:#1D9E75}
.grid-btn.ko{background:#993C1D}
.grid-btn.na{background:#bbb}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem}
.sum-btn{padding:8px 18px;border-radius:8px;border:1px solid #BFE6D3;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#2E8B62}
.sum-btn:hover{background:#e8f6ef}
.sum-btn.red{border-color:#F0997B;color:#993C1D}
.sum-btn.red:hover{background:#FAECE7}
.sum-btn.pdf{border-color:#639922;color:#3B6D11;background:#EAF3DE}
.sum-btn.pdf:hover{background:#c0dd97}
.sum-note{font-size:11px;color:#aaa;margin-top:.75rem}
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.report-item{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.1rem;margin-bottom:.85rem}
.qnum{font-size:13px;font-weight:700;color:#2E8B62;margin-bottom:.6rem}
.report-choice{padding:8px 12px;border-radius:7px;font-size:13px;margin-bottom:5px}
.report-choice.neutral{background:#f5f4f0}
.report-choice.correct{background:#E1F5EE;color:#085041;font-weight:600}
.report-choice.wrong{background:#FAECE7;color:#4A1B0C}
.level-select{display:flex;flex-direction:column;gap:10px}
.level-card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .15s,background .15s}
.level-card:hover{border-color:#2E8B62;background:#f5faf7}
.level-name{font-size:20px;font-weight:700;color:#2E8B62;min-width:70px}
.level-desc{flex:1;font-size:13px;color:#555;padding:0 10px}
.level-count{font-size:12px;color:#888;white-space:nowrap}
@media print {
  body{background:#fff;padding:0}
  #app{max-width:100%}
  .nav,.sum-actions,.prog-bar,.prog-labels{display:none!important}
  .card{border:1px solid #ccc;border-radius:0;page-break-inside:avoid;margin-bottom:.5rem;padding:.75rem}
  .summary{border:none}
  .grid-btn{width:28px;height:28px;font-size:10px}
  .print-section{display:block!important}
  .no-print{display:none!important}
}
.print-section{display:none}
.fs-btn{position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:9px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;color:#444;box-shadow:0 1px 4px rgba(0,0,0,.10);transition:background .15s,border-color .15s}
.fs-btn:hover{background:#f5f4f0;border-color:#2E8B62}
@media print{.fs-btn{display:none!important}}

/* ── ZOOM BAR (added) ── */
.zoombar{display:flex;align-items:center;justify-content:center;gap:.55rem;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:.55rem 1rem;margin-bottom:1rem;flex-wrap:wrap}
.zoombar .zlabel{font-size:12px;font-weight:600;color:#2E8B62}
.zoombar input[type=range]{-webkit-appearance:none;appearance:none;width:180px;max-width:55vw;height:4px;border-radius:2px;background:#dfe6ec;outline:none;cursor:pointer;accent-color:#4DB88A}
.zoombar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#4DB88A;cursor:pointer}
.zoombar input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#4DB88A;border:none;cursor:pointer}
.zoombar .zval{font-size:12px;font-weight:700;color:#2E8B62;min-width:42px;text-align:center}
.zoombar .zbtn{width:26px;height:26px;border-radius:6px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:14px;font-weight:700;color:#2E8B62;line-height:1;display:flex;align-items:center;justify-content:center}
.zoombar .zbtn:hover{background:#f5f4f0}
#zoomStage{transform-origin:top center;transition:transform .12s ease}
/* ── QUESTION JUMP BUTTONS (added) ── */
.qjump{display:flex;flex-wrap:wrap;gap:5px;background:#fff;border:1px solid #e0ddd5;border-radius:10px;padding:.55rem .7rem;margin-bottom:.85rem}
.qjump .qjlabel{width:100%;font-size:11px;color:#888;margin-bottom:2px}
.qjump .qj{min-width:30px;height:30px;padding:0 4px;border-radius:6px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555}
.qjump .qj:hover{background:#f5f4f0}
.qjump .qj.current{background:#2E8B62;border-color:#2E8B62;color:#fff}
.qjump .qj.answered{border-color:#4DB88A;color:#2E8B62}
.qjump .qj.answered.current{color:#fff}
@media print{.zoombar,.qjump{display:none!important}}

.theme-select{display:flex;flex-direction:column;gap:12px}
.theme-card{background:#fff;border:1px solid #e0ddd5;border-left:5px solid var(--tc,#2E8B62);border-radius:12px;padding:1rem 1.1rem}
.theme-head{display:flex;align-items:center;gap:12px;margin-bottom:.7rem}
.theme-emo{font-size:26px;line-height:1}
.theme-name{font-size:18px;font-weight:700;color:var(--tc,#2E8B62)}
.theme-desc{font-size:12.5px;color:#666;margin-top:2px}
.theme-actions{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{flex:1;min-width:130px;padding:9px 12px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#444}
.tbtn:hover{background:#f5f4f0;border-color:var(--tc,#2E8B62)}
.tbtn-cours{border-color:#BFE6D3;color:#0F5C3E;background:#F0FAF5}
.tbtn-cours:hover{background:#dcf3e8}
.tbtn-voc{border-color:#FCD34D;color:#92400E;background:#FEF9EC}
.tbtn-voc:hover{background:#fdf0cf}
.lvl-banner{background:linear-gradient(90deg,#0F5C3E,#2E8B62);color:#fff;border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;font-size:13.5px;font-weight:600;letter-spacing:.3px}
.voc-intro{background:#fff;border:1px solid #e0ddd5;border-left:5px solid var(--tc,#2E8B62);border-radius:10px;padding:.8rem 1rem;font-size:13.5px;color:#333;margin-bottom:1rem;line-height:1.6}
.voc-list{display:flex;flex-direction:column;gap:9px}
.voc-item{background:#fff;border:1px solid #e0ddd5;border-left:4px solid var(--tc,#2E8B62);border-radius:10px;padding:.75rem .95rem}
.voc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.voc-term{font-size:15.5px;font-weight:700;color:#1a1a1a}
.voc-en{font-size:13px;color:#777;margin:3px 0 6px;font-style:italic}
.voc-ex{font-size:14px;color:#0F5C3E;background:#F5FAF7;border-radius:7px;padding:7px 10px;line-height:1.55}
.voc-tag{font-size:11px;font-weight:600;border-radius:20px;padding:3px 9px;white-space:nowrap}
.voc-tag.ee{background:#E8EEFF;color:#274690}
.voc-tag.eo{background:#FDE8EF;color:#9B1B47}
.voc-tag.both{background:#E1F5EE;color:#0F6E56}
@media print{.voc-ex,.voc-tag,.lvl-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<button class="fs-btn" id="fsBtn" title="Plein écran" aria-label="Plein écran">⛶</button>
<script>
(function(){
  var b=document.getElementById('fsBtn');
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
  b.addEventListener('click',function(){
    if(!fsEl()){
      var el=document.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }
  });
  function upd(){
    var on=!!fsEl();
    b.textContent=on?'✕':'⛶';
    b.title=on?'Quitter le plein écran':'Plein écran';
  }
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
})();
</script>

<script id="qdata" type="application/json">{"Culture": {"cours": [{"t": "« Le fait du roi »\nUn roman d'A. Thonon\nC'est l'histoire d'un homme qui prend l'identité d'un autre, mort, en se glissant dans sa peau, dans sa vie, dans sa maison … Rien ne sert de raconter l'intrigue de ce roman tant elle est simple et sans surprise. L'écriture de l'auteur reste cependant toujours aussi piquante et agréable à lire. Le héros principal, quant à lui, est dépeint avec une certaine profondeur.", "q": "Sur quel point porte la critique négative faite à ce livre ?", "c": ["La description du personnage", "La longueur du texte", "La qualité de l'écriture", "Le déroulement des évènements"], "a": 3, "k": "Rien ne sert de raconter l'intrigue de ce roman tant elle est simple et sans surprise.", "_sources": ["test1#33"]}, {"t": "Après avoir été fermée au public pendant douze ans, la grotte préhistorique d'Altamira, située en Espagne, doit rouvrir ses portes mais de manière expérimentale. Il s'agit d'une expérience réservée à un groupe de cinq personnes tirées au hasard parmi les visiteurs du musée du site, qui vont pouvoir contempler les peintures rupestres originales. Cette expérience se déroulera une fois par semaine pendant huit mois afin de permettre à une équipe de scientifiques d'évaluer l'impact des visites sur l'ensemble du site et de donner son avis sur une réouverture complète.", "q": "Qu'évoque-t-on dans cet article ?", "c": ["L'inauguration d'une exposition temporaire", "L'inscription d'une œuvre au patrimoine mondial", "L'ouverture au public d'une zone dangereuse", "L'accès réglementé à un emplacement protégé"], "a": 3, "k": "Il s'agit d'une expérience réservée à un groupe de cinq personnes tirées au hasard parmi les visiteurs du musée du site", "_sources": ["test2#31", "test10#32"]}, {"t": "Théâtre\nJoël Pommerat nous offre un très court spectacle dont à la fois la pureté formelle et le sens nous ont conquis. Le matériau en est constitué par une série de rencontres, auxquelles lui-même et son équipe assistèrent, entre des travailleurs sociaux et des femmes d'origine simple, vivant en cité, et en proie à des problèmes familiaux. De ces confidences relatives aux tensions qu'elles connaissent dans leurs rapports, soit avec leurs parents, soit avec leurs enfants, Pommerat a tiré une suite de brèves séquences qui composent une tragédie intense de la souffrance familiale, et particulièrement de la souffrance de la femme. Son regard sur la détresse humaine est d'une bienveillance et d'une tendresse infinies. Il ne nous livre aucun message moral et à peine un message social ; il fait simplement appel à notre sensibilité.", "q": "Dans quel objectif Joël Pommerat a-t-il créé son spectacle ?", "c": ["Aider les femmes à se battre pour améliorer leur situation familiale.", "Amener les spectateurs à s'émouvoir d'un quotidien douloureux.", "Démontrer que la condition de la femme dans les cités est désastreuse.", "Informer des difficultés que peuvent rencontrer les enfants des cités"], "a": 1, "k": "il fait simplement appel à notre sensibilité", "_sources": ["test4#32"]}, {"t": "L'éclairage événementiel est une discipline artistique récente qui consiste à créer des décors et des ambiances par un jeu de lumières projetées sur des monuments et des sites remarquables.\nL'intérêt de cet art est double : il permet, sans toucher au site qui accueille l'événement, de modifier littéralement l'aspect d'une façade ou d'un intérieur et de personnaliser un lieu en rapport avec le thème abordé. Ainsi une grande ville comme Paris peut façonner ses monuments et ses bâtiments publics grâce aux éclairages conçus et réalisés par de véritables artistes.", "q": "Quel est l'atout principal de cette discipline artistique ?", "c": ["Donner une dimension nouvelle aux lieux mis en scène.", "Permettre la réhabilitation des monuments historiques.", "Transformer de manière durable les bâtiments illuminés.", "Valoriser culturellement des zones urbaines délaissées."], "a": 0, "k": "il permet, sans toucher au site qui accueille l'événement, de modifier littéralement l'aspect d'une façade ou d'un intérieur", "_sources": ["test4#34"]}, {"t": "Christian Hincker, dessinateur consacré, né en 1967 à Strasbourg, est devenu « Blutch» très tôt, et pas seulement parce que dans la cour de récréation il était le portrait craché du caporal du même nom, l'un des héros de la célèbre bande dessinée «Les Tuniques Bleues»... C'est aussi grâce au dessin que « le petit Christian» se protégeait. «Je me coupais du monde, ça m'arrangeait bien car je fuyais le sport, j'avais la terreur de devenir un souffre-douleur. Le dessin m'a donné une stature au sein de la classe et m'a aidé à survivre ...». Doué, il puise dans ses lectures d'enfant de quoi développer le don : «J'étais tellement emballé par les BD que je lisais que j'essayais de perpétuer le plaisir en reproduisant les ambiances de Tartine, Picsou ou Lucky Luke»", "q": "Comment s'explique l'engouement de Christian Hincker pour le dessin ?", "c": ["Il dessinait sans relâche", "Il se réfugiait dans le dessin pour échapper à ses camardes", "Il vendait ses dessins pour se faire de l'argent de poche", "Il voulait ressembler à un personnage de bande dessinée"], "a": 1, "k": "je fuyais le sport, j'avais la terreur de devenir un souffre-douleur", "_sources": ["test5#32"]}, {"t": "C'est un joli coup de peinture ...\navant fermeture !\n\nLe vieil hôpital psychiatrique du Mans, construit en 1828 et classé aux Monuments historiques depuis 2004, a vu l'arrivée de drôles de troupes. Promis à la destruction et à la rénovation, le bâtiment a été investi par des artistes. L'occasion était belle pour le collectif associatif « Espace provisoire » d'envahir les salles et de leur redonner une seconde vie. Plus de 1000 m2 ont été occupés par une soixantaine d'artistes : musiciens, peintres, sculpteurs, photographes.., tous prêts à accueillir des visiteurs, des curieux. L'objectif, non avoué, est de prouver que la culture est à sa place partout.", "q": "Que cherche à faire le collectif « Espace provisoire » ?", "c": ["Convertir les lieux en maison de culture", "Diffuser l'art dans des endroits inattendus", "Ouvrir un centre de formation artistique", "Rénover les anciens locaux en les décorant"], "a": 1, "k": "L'objectif, non avoué, est de prouver que la culture est à sa place partout.", "_sources": ["test5#33"]}, {"t": "« Le fait du roi »\nC'est l'histoire d'un homme qui prend l'identité d'un autre, mort, en se glissant dans sa peau, dans sa vie, dans sa maison... Rien ne sert de raconter l'intrigue de ce roman tant elle est simple et sans surprise. L'écriture de l'auteur reste cependant toujours aussi piquante et agréable à lire. Le héros principal, quant à lui, est dépeint avec une certaine profondeur.", "q": "Sur quel point porte la critique négative faites à ce livre ?", "c": ["La description du personnage", "La longueur de texte", "La qualité de l'écriture", "Le déroulement des évènements"], "a": 3, "k": "Rien ne sert de raconter l'intrigue de ce roman tant elle est simple et sans surprise.", "_sources": ["test5#34"]}, {"t": "L'ambition de cet auteur :\nChanger l'art d'écrire, rien de moins. Mais cela est dit sans emphase, d'un ton dubitatif, fataliste presque « changer l'art d'écrire, chaque écrivain le fait à sa façon. Je voudrais le faire de façon absolue, radicale, en abolissant totalement les histoires, l'intrigue, bien qu'il y ait toujours, en fait, des sortes de micro-narrations dans mes livres. J'ai l'idée qu'il est encore trop tôt pour savoir ce que j'ai apporté ou pas. Cela dit, lorsque vous écrivez, vous êtes tellement occupé à essayer de résoudre les problèmes techniques qui se posent à chaque instant que vous n'avez pas le temps d'avoir beaucoup d'idées générales»", "q": "De quelle manière cet auteur veut-il réaliser son ambition ?", "c": ["En abandonnant les codes traditionnels du roman", "En cherchant des sources d'inscription médités", "En proposant de nouveaux concepts universels", "En se jouant des difficultés liées à l'écriture"], "a": 0, "k": "en abolissant totalement les histoires, l'intrigue", "_sources": ["test5#35"]}, {"t": "On connait Cézanne surtout pour ses paysages, mais le Musée d'Orsay montre, pour la première fois, une partie méconnue de l'œuvre de l'artiste. On y croisera ainsi le visage de son épouse, seul motif autant étudié par le peintre que la montagne Sainte-Victoire. Au fil des versions, Hortense Fiquet devient l'objet d'une recherche plastique, de mise en scène et de géométrisation des formes. Mais Cézanne peut aussi avoir le pinceau cruel. Dès ses débuts. les figures de son père et de sa mère sont tourmentées. Lui-même se représente à 27 ans, patibulaire et le regard injecté de sang. À la fin de sa vie, Cézanne choisit des anonymes du monde rural. Ses tableaux ne sont alors qu'une autre forme de paysage.", "q": "Que souligne cette exposition sur Paul Cézanne ?", "c": ["L'influence de ses contemporains", "La singularité de ses portraits", "Son engouement pour la nature", "Son travail postimpressionniste"], "a": 1, "k": "le visage de son épouse, seul motif autant étudié par le peintre que la montagne Sainte-Victoire", "_sources": ["test6#35"]}, {"t": "Elle s'appelait Sarah\nLe cinéaste n'arrive pas à éviter - mais le pouvait-il ? - l'artifice du scénario : pingpong incessant et artificiel entre le passé et le présent. Néanmoins, chaque fois qu'il change d'époque, le cinéaste repart à la recherche de l'émotion perdue qu'il retrouve, d'ailleurs, à force de pudeur et de retenue. Aucun débordement lacrymal. Les acteurs restent jusqu'au bout étonnamment sobres. Le film est un mélo, un vrai, puisqu'il repose sur une faute dont chacun ne peut ou ne veut se défaire. C'est aussi un « film du samedi soir », avec ses drames, ses sacrifices, parfois même ses outrances... Bref, on est dans le cinéma humaniste à l'ancienne (et, peut-être, éternel). À la frontière exacte, en tout cas, entre bons et grands sentiments…", "q": "Sur quel élément du film porte la réserve du critique ?", "c": ["L'atmosphère lourde et pathétique.", "L'utilisation abusive de flashbacks.", "La caricature du film de genre.", "Le jeu sans conviction des comédiens."], "a": 1, "k": "l'artifice du scénario : pingpong incessant et artificiel entre le passé et le présent", "_sources": ["test7#30"]}, {"t": "Ceux qui l'ont vu cet été aux Francofolies n'en sont pas revenus. Trente ans après ses débuts, le chanteur Joseph Many a subjugué l'assistance. Il lui a fallu du temps pour se convaincre que monter sur scène pour y pousser la chansonnette était encore à son âge. Les ritournelles des années 1970 l'avaient propulsé à son époque sur le devant de la scène, avec l'image d'un artiste terriblement proche de la jeunesse d'alors. Puis sa brillante carrière d'écrivain l'avait convaincu de se consacrer à l'écriture, jusqu'à ce que l'inspiration musicale revienne. Preuve en est son nouvel album. Une ode à la vie, à l'amour, aux femmes. Les atmosphères sont délicieuses. Au fil des ballades, on redevient, pour quelques minutes, adolescent.", "q": "Pourquoi Joseph Many a-t-il tardé à revenir sur scène ?", "c": ["Il se sentait trop vieux pour les tournées", "Il voulait fuir son image d'idole des jeunes", "Le public préférait l'écrivain au chanteur", "Ses chansons étaient passées de mode"], "a": 0, "k": "Il lui a fallu du temps pour se convaincre que monter sur scène pour y pousser la chansonnette était encore à son âge", "_sources": ["test7#35"]}, {"t": "C'est un joli coup de peinture... avant fermeture !\nLe vieil hôpital psychiatrique du Mans, construit en 1828 et classé aux Monuments historiques depuis 2004, a vu l'arrivée de drôles de troupes. Promis à la destruction et à la rénovation, le bâtiment a été investi par des artistes. L'occasion était belle pour le collectif associatif espace provisoire d'envahir les salles et de leur redonner une seconde vie. Plus de 1000 m2 ont été occupés par une soixantaine d'artistes : musiciens, peintres, sculpteurs, photographes... tous prêts à accueillir des visiteurs, des curieux. L'objectif, non avoué, est de prouver que la culture est à sa place partout.", "q": "Que cherche à faire le collectif Espace provisoire ?", "c": ["Convertir les lieux en maison de la culture.", "Diffuser l'art dans des endroits inattendus.", "Ouvrir un centre de formation artistique.", "Rénover les anciens locaux en les décorant."], "a": 1, "k": "prouver que la culture est à sa place partout", "_sources": ["test8#33"]}, {"t": "Je ne connais pas son prénom, mais il y a dans les Alpes, une personne à la verve savoureuse. Elle émaille la visite des gravures rupestres, dont les plus anciennes datent du Néolithique, de remises en perspective sur les prémices préhistoriques du capitalisme et de la domination masculine. Elle chantera peut-être, à condition que vous ne l'applaudissiez pas, pour vous permettre de ressentir l'acoustique d'un cirque rocheux. Elle vous proposera aussi de vous allonger et de fermer les yeux pour percevoir les vibrations du sol, riche en uranium. Bref, elle guidera les êtres minuscules que vous êtes à travers les plis grandioses de l'écorce terrestre.", "q": "Où exerce la personne décrite ?", "c": ["Dans un centre de relaxation.", "Dans un laboratoire.", "Dans un musée archéologique.", "Dans un parc naturel."], "a": 3, "k": "les gravures rupestres, dont les plus anciennes datent du Néolithique", "_sources": ["test8#34"]}, {"t": "Vincent Van Gogh, un illuminé miséreux à l'oreille coupée et méconnu de son vivant ? Ce mythe tenace s'est construit autour du peintre à partir d'une histoire romancée. Or, une étude approfondie de l'ensemble de la correspondance de Vincent Van Gogh – échangée essentiellement avec son frère Théo, mais aussi avec Gauguin – donne une impression beaucoup plus nuancée. Van Gogh n'était pas si pauvre, il n'était pas si fou et il a bénéficié d'une certaine notoriété de son vivant, même si ce n'était pas auprès du grand public. Forte personnalité, dans ses lettres, il savait raconter merveilleusement et de façon captivante ce qui l'occupait et pourquoi il peignait un sujet de telle ou telle manière.", "q": "Que révèle la correspondance de Van Gogh ?", "c": ["Il appréciait de lire les récits d'écrivains de sa génération.", "Il était déjà, en son temps, un artiste reconnu par ses pairs.", "Il se plaisait à véhiculer une fausse image de lui-même.", "Il souffrait beaucoup à cause de son état mental fragile."], "a": 1, "k": "il a bénéficié d'une certaine notoriété de son vivant", "_sources": ["test9#32"]}, {"t": "Il me semble pertinent de ne confondre, même si le fait d'être un intellectuel renvoie banalement à une certaine aptitude au maniement des idées, les intellectuels avec les catégories proches. Les écrivains, notamment les romanciers, ne constituent pas naturellement des « intellectuels » dans la mesure où précisément le genre romanesque, pour être parfaitement réussi, a toujours exigé une distance par rapport à l'univers théorique. La qualité fondamentale de la fiction est l'imagination, alors que le brassage d'idées et de concepts s'oppose à la liberté et à l'imprévisibilité du roman. Ainsi, si dans telle ou telle œuvre de fiction, un auteur peut apparaître plus « intellectuel » que romancier, c'est parce que le second a capitulé devant le premier ou n'est jamais parvenu à s'en libérer. Cela ne fait pas forcément de mauvais livres mais empêche qu'ils soient à mon sens de grands romans. Ils font penser, mais je ne suis pas persuadé qu'ils fassent rêver le lecteur.", "q": "Quelle est la thèse défendue par cet auteur ?", "c": ["L'écriture requiert les mêmes qualités pour une fiction ou un essai.", "Le raisonnement du penseur représente une entrave à la création.", "Les grands romans sont issus des réflexions théoriques d'un auteur.", "Les modes d'écritures du romancier et de l'intellectuel sont identiques."], "a": 1, "k": "le brassage d'idées et de concepts s'oppose à la liberté et à l'imprévisibilité du roman", "_sources": ["test9#35"]}, {"t": "Les séances de matinée, au cinéma, me comblaient. Elles me donnaient le courage d'affronter la curiosité des uns et des autres. Elles ne m'éloignaient pas longtemps de mes enfants. Je m'asseyais à ma place, avec de moins en moins de gêne, au fil des mois. Le cinéma, quel dérivatif puissant à l'angoisse ! Films intellectuels, à thèse, films sentimentaux, films policiers, films drôles, films à suspense furent mes compagnons. Je puisais en eux des leçons de grandeur, de courage et de persévérance. Ils approfondissaient et élargissaient ma vision du monde, grâce à leur apport culturel. J'oubliais mes tourments en partageant ceux d'autrui. Le cinéma, distraction peu onéreuse, peut donc procurer une joie saine.", "q": "Que ressent cette personne quand elle va au cinéma ?", "c": ["Elle éprouve un sentiment d'invulnérabilité.", "Elle s'imagine vivre une vie meilleure.", "Elle savoure le bonheur d'avoir une famille.", "Elle s'abstrait un temps de ses soucis."], "a": 3, "k": "J'oubliais mes tourments en partageant ceux d'autrui.", "_sources": ["test11#32"]}, {"t": "Une exposition de l'Institut d'Art Contemporain de Villeurbanne est consacrée à l'Américain Jimmie Durham et la Brésilienne Maria Theraza Alvez. Depuis vingt ans, ils parcourent, au fil de leurs déplacements, le territoire méditerranéen et sont réunis au sein de cette exposition à la forme inédite. Le parcours se veut éloigné de tout didactisme, laissant assez d'espace au spectateur pour construire son propre récit autour d'une mer connue pour être le berceau fertile des civilisations. Dans un jeu de matières, de couleurs et d'objets, tous tangibles, Durham et Alvez tentent de décrypter une certaine pensée historique et mythologique notamment en déjouant les codes classiques utilisés dans les musées.", "q": "Qu'est ce qui fait la singularité de cette exposition ?", "c": ["La liberté accordée aux visiteurs.", "La simplicité des moyens artistiques.", "Le classicisme de sa présentation.", "Le discours politique des plasticiens."], "a": 0, "k": "laissant assez d'espace au spectateur pour construire son propre récit", "_sources": ["test12#34"]}, {"t": "L'amour à la retraite\nAu théâtre du Splendid\n\nClaire Nadeau, très drôle, et Gérard Rinaldi, très inattendu dans le rôle d'un petit retraité maltraité par sa femme, jouent « Après l'amour ». Cette comédie, créée il y a dix ans, est reprise au Splendid. L'auteur met en scène un couple de petites gens qui sont passées à côté de belles choses. Leur amour est à la retraite. Le paradoxe, c'est qu'on rit beaucoup des mésaventures de Jeanne et Henri dans cette comédie grinçante.", "q": "Quel est le sujet de la pièce ?", "c": ["Une histoire d'amour splendide", "Un amour entre deux retraités", "Un homme mal aimé par sa femme", "Un couple qui ne s'aime plus"], "a": 3, "k": "Leur amour est à la retraite", "_sources": ["test14#30"]}, {"t": "« Le fait du roi »,\nun roman d'A. Thonon.\nC'est l'histoire d'un homme qui prend l'identité d'un autre, mort, en se glissant dans sa peau, dans sa vie, dans sa maison. Rien ne sert de raconter l'intrigue de ce roman tant elle est simple et sans surprise. L'écriture de l'auteur reste cependant toujours aussi piquante et agréable à lire. Le héros principal, quant à lui, est dépeint avec une certaine profondeur.", "q": "Sur quel point porte la critique négative faite à ce livre ?", "c": ["La description du personnage.", "La longueur du texte.", "La qualité de l'écriture.", "Le déroulement des événements."], "a": 3, "k": "Rien ne sert de raconter l'intrigue de ce roman tant elle est simple et sans surprise", "_sources": ["test14#34"]}, {"t": "Il ne viendrait à personne l'idée d'entrer dans un cinéma ou un théâtre sans payer sa place, ni à ces industries de ne pas rémunérer leurs auteurs. De nombreux festivals ou lieux dédiés à la photographie se targuent pourtant de la gratuité de leurs expositions. D'autant plus que dans la majorité des cas, il est admis qu'aucun budget ni aucun droit d'auteurs ne soient prévus pour le photographe. Même si le motif initial de rendre la photographie accessible à tous est plus que légitime, ce qui choquerait pour tout autre secteur ou corps de métier n'offusque personne dès lors qu'il s'agit du photographe, pourtant producteur de la matière première de ces activités.", "q": "Que constate l'auteur de l'article ?", "c": ["C'est la photographie qui est la forme d'art la moins valorisée.", "Il y a peu d'événements culturels consacrés à la photographie.", "Les photographies sont commercialisées à bas prix.", "N'importe qui peut s'improviser photographe."], "a": 0, "k": "n'offusque personne dès lors qu'il s'agit du photographe", "_sources": ["test15#31"]}], "devoirs": [{"t": "Depuis un an, l'association du théâtre de la poudrerie, située à Sevran, à quelques kilomètres de Paris, organise des représentations gratuites à domicile d'une pièce inédite. Pour cela, l'association a convié une auteure professionnelle à venir en résidence pour l'écrire. Elle a recueilli le témoignage d'une trentaine d'habitantes sur le thème du pouvoir féminin, puis écrit son texte à partir de cette matière première. L'enjeu pour cette association est que les spectateurs s'approprient la pièce : quand il y a un phénomène d'identification, la parole se libère lors de la rencontre qui suit la représentation. Ce phénomène est amplifié par ce cadre intimiste qui favorise le rapprochement des spectateurs et des comédiens.", "q": "Quel objectif poursuit cette association avec ce projet ?", "c": ["Encourager le dialogue avec le public.", "Former des acteurs en banlieue.", "Réaliser une œuvre à plusieurs mains.", "Sensibiliser à l'égalité des sexes."], "a": 0, "k": "la parole se libère lors de la rencontre qui suit la représentation", "_sources": ["test15#32"]}, {"t": "Une exposition de l'Institut d'Art Contemporain de Villeurbanne est consacrée à l'Américain Jimmie Durham et la Brésilienne Maria Theraza Alvez.\nLe parcours se veut éloigné de tout didactisme laissant assez d'espace au spectateur pour construire son propre récit.", "q": "Qu'est-ce qui fait la singularité de cette exposition ?", "c": ["La liberté accordée aux visiteurs", "La simplicité des moyens artistiques", "Le classicisme de sa présentation", "Le discours politique des plasticiens"], "a": 0, "k": "laissant assez d'espace au spectateur pour construire son propre récit", "_sources": ["test16#34"]}, {"t": "Dans le monde de la littérature jeunesse, Michèle Moreau est une référence. Les bénévoles de l'association Lire et faire lire, l'ont écoutée raconter son parcours et son engagement au service de cette littérature, au cours d'un « atelier comptines ». Michèle Moreau a montré les constantes, l'universalité des comptines et histoires qu'elle a éditées. Elle a aussi défendu l'idée que la littérature jeunesse n'était pas « une sous-culture » : « l'idée qu'il existerait un répertoire réservé aux enfants m'est inconnue. Si l'on n'est pas d'abord ému en tant qu'adulte, les enfants ne le seront pas non plus. Un livre ou un livre-disque doit savoir parler autant aux enfants qu'aux adultes, c'est pour cela que musiques, textes et illustrations sont particulièrement soignés »", "q": "Selon Michèle Moreau, à quoi reconnaît-on un bon livre jeunesse ?", "c": ["Il a plus d'illustrations que d'écrit", "Il préserve l'imaginaire des enfants", "Il touche également les adultes", "Il valorise le patrimoine littéraire"], "a": 2, "k": "Un livre ou un livre-disque doit savoir parler autant aux enfants qu'aux adultes", "_sources": ["test17#32"]}, {"t": "Cette année encore, les adeptes de la culture ne savent plus où donner de la tête et du porte-monnaie. En nombre sans cesse croissant – notamment depuis que les collectivités territoriales (régions, départements …) ont compris le parti qu'elles pouvaient tirer de leur investissement en matière de communication – les festivals de musique foisonnent et les indicateurs sont au beau fixe, avec des rendez-vous emblématiques comme les Francofolies de la Rochelle et les Vieilles Charrues. L'année dernière, ils assuraient avoir battu des records de fréquentation.", "q": "Dans cet article, qu'apprend-on sur les festivals ?", "c": ["D'anciens artistes ont l'occasion de monter sur scène", "Les financements publics contribuent à leur expansion", "Les organisateurs s'adaptent aux nouvelles tendances", "Les tarifs proposés dépendent de la programmation"], "a": 1, "k": "les collectivités territoriales ont compris le parti qu'elles pouvaient tirer de leur investissement", "_sources": ["test17#33"]}, {"t": "Sur la côte est de la Tanzanie, la petite bourgade de Pangani s'organise autour de son fleuve éponyme sont l'eau est plus en plus vidée, même s'il participe à lui donner des allures d'Éden. Le fleuve a pourtant été depuis des décennies la principale raison de vivre dans la région, fournissant eau fraiche et travail aux pêcheurs. Dans son reportage Federico Romano dévoile son ambivalence. Alors que Pangani est paradisiaque, calme et bordée de palmiers, il y a comme un ennemi invisible : les gens y boivent tous l'eau du fleuve, parce qu'ils n'ont tout simplement pas d'autre solution, alors que celle-ci n'a plus rien à voir avec de l'eau douce.", "q": "Que révèle-t-on sur ce fleuve ?", "c": ["Il constitue un bienfait autant qu'un problème", "Il est menacé d'assèchement", "Il pollue les terres avoisinantes", "Il représente un attrait touristique essentiel"], "a": 0, "k": "Federico Romano dévoile son ambivalence", "_sources": ["test17#34"]}, {"t": "Les organisateurs du festival Rock Werchter envisagent de le déplacer dans la région de Limbourg. Cette perspective inquiète le maire de la ville de Rotselaar, où le festival se tient depuis 1975. « la question d'un déménagement pèse sur la plaine du festival, comme un nuage sombre, a affirmé le maire. Toutes les personnes impliquées dans le festival s'interrogent sur leur avenir. C'est très ennuyeux pour les professionnels du spectacle de la région qui s'investissent depuis des années et qui risquent d'être renvoyés. J'espère que la clarté sera faite rapidement. Moi-même, je ne vois pas pourquoi le festival devrait déménager, cela se passe très bien ici. Il est même prévu de réviser le plan d'aménagement du territoire pour permettre d'accueillir plus de podiums et plus de monde. »", "q": "Qu'est-ce qui inquiète le maire dans le projet d'évolution du festival ?", "c": ["La multiplication des nuisances sonores sur la commune", "L'accroissement du taux de chômage de ses administrés", "L'agrandissement de l'espace consacré aux spectacles", "L'augmentation du prix des entrées pour les spectateurs"], "a": 1, "k": "risquent d'être renvoyés", "_sources": ["test18#30"]}, {"t": "Côté (BD)\nAdaptée d'un polar de Pierre Siniac, la bande dessinée « Le secret de l'étrangleur » de Jacques Tardi est un succès : sa version en feuilleton, cet été, sous la forme de cinq journaux, tirés de 50.000 exemplaires chacun, avait intrigué les premiers lecteurs, âgés de 15 à 35 ans. L'album, déjà vendu à 130.000 exemplaires, est remarquable par son originalité. En effet, il faut découper les dernières pages du livre pour en connaitre la fin sachant que plusieurs dénouements sont possibles.", "q": "Quelle est la particularité de cette BD ?", "c": ["Elle a été adaptée pour la télévision", "Elle s'inspire de la vie des jeunes", "La clé de l'énigme sera éditée plus tard", "L'auteur a imaginé différents scénarios"], "a": 3, "k": "plusieurs dénouements sont possibles", "_sources": ["test18#32"]}, {"t": "LE CERCLE DES ILLUSIONNISTES\nD'Alexis Michalik\n\nCompagnie du Théâtre du Roi\n\nPlongez dans l'univers fascinant de la magie et du cinéma à travers les destins croisés de trois personnages : Jean-Eugène Robert-Houdin, horloger et prestidigitateur du XIXe siècle, Georges Méliès, pionnier du cinématographe, et Décembre, un jeune homme passionné par l'illusion. Leur point commun : une quête incessante de l'émerveillement et de la poésie. Avec une mise en scène inventive et rythmée, le metteur en scène Alexis Michalik nous fait voyager dans le temps et l'espace, mêlant humour, émotion et suspense. Le cercle des illusionnistes est une pièce qui célèbre l'art de raconter des histoires et de faire rêver les spectateurs.", "q": "Quel est, selon le texte, le thème principal de la pièce ?", "c": ["L'histoire de la magie et du cinéma", "La relation entre les trois personnages", "L'envie de susciter l'admiration et l'imaginaire", "Le voyage dans le temps et l'espace"], "a": 2, "k": "quête incessante de l'émerveillement et de la poésie", "_sources": ["test18#35"]}, {"t": "Je ne connais pas son prénom mais il y a, dans les Alpes une personne à la verve savoureuse. Elle émaille la visite des gravures rupestres, dont les plus anciennes datent du Néolithique, de remises en perspective sur les prémices préhistoriques du capitalisme et de la domination masculine. Elle chantera peut-être, à condition que vous ne l'applaudissiez pas, pour vous permettre de ressentir l'acoustique d'un cirque rocheux. Elle vous proposera aussi de vous allonger et de fermer les yeux pour percevoir les vibrations du sol, riche en uranium. Bref, elle guidera les êtres minuscules que vous êtes à travers les plis grandioses de l'écorce terrestre.", "q": "Où se trouve la personne décrite ?", "c": ["Dans un centre de relaxation.", "Dans un laboratoire.", "Dans un musée archéologique.", "Dans un parc naturel."], "a": 3, "k": "la visite des gravures rupestres, dont les plus anciennes datent du Néolithique", "_sources": ["test19#34", "test37#34"]}, {"t": "Depuis un an, l'association du théâtre de la Pouderie, situé à Sevran, à quelques kilomètres de Paris, organise des représentations gratuites à domicile d'une pièce inédite. Pour cela, l'association a convié une auteure professionnelle à venir en résidence pour l'écrire. Elle a recueilli le témoignage d'une trentaine d'habitantes sur le thème du pouvoir féminin, puis écrit son texte à partir de cette matière première. L'enjeu pour cette association est que les spectateurs s'approprient la pièce : quand il y a un phénomène d'identification, la parole se libère lors de la rencontre qui suit la représentation. Ce phénomène est amplifié par ce cadre intimiste qui favorise le rapprochement des spectateurs et des comédiens.", "q": "Quel objectif poursuit cette association avec ce projet ?", "c": ["Encourager le dialogue avec le public.", "Former des acteurs en banlieue.", "Réaliser une œuvre à plusieurs mains.", "Sensibiliser à l'égalité des sexes."], "a": 0, "k": "la parole se libère lors de la rencontre", "_sources": ["test21#32"]}, {"t": "Une exposition de l'Institut d'Art Contemporain de Villeurbanne est consacrée à l'Américain Jimi Durham et la brésilienne Maria Telisa. Depuis 20 ans, ils parcourent, au fil de leurs déplacements, le territoire méditerranéen et sont réunis au sein de cette exposition à la forme inédite. Le parcours se veut éloigner de tout didactisme, laissant assez d'espace au spectateur pour construire son propre récit autour d'une mer connue pour être le berceau fertile des civilisations. Dans un jeu de matières de couleurs et d'objets, tous tangibles, Durham et Telisa tentent de décrypter une certaine pensée historique et mythologique notamment en déjouant les codes classiques utilisés dans les musées.", "q": "Qu'est-ce qui fait la singularité de cette exposition ?", "c": ["La liberté accordée aux visiteurs", "La simplicité des moyens artistiques", "Le classicisme de sa présentation", "Le discours politique des plasticiens"], "a": 0, "k": "laissant assez d'espace au spectateur pour construire son propre récit", "_sources": ["test22#34"]}, {"t": "Depuis un an, l'association du théâtre de la poudrerie, située à vivre à Sevran, à quelques kilomètres de Paris, organise des représentations gratuites à domicile d'une pièce inédite. Pour cela, l'association a convié une auteure professionnelle à venir en résidence pour l'écrire. Elle a recueilli le témoignage d'une trentaine d'habitantes sur le thème du pouvoir féminin, puis écrit son texte à partir de cette matière première. L'enjeu pour cette association est que les spectateurs s'approprient la pièce : quand il y a un phénomène d'identification, la parole se libère lors de la rencontre qui suit la représentation.", "q": "Quel objectif poursuit cette association avec ce projet ?", "c": ["Encourager le dialogue avec le public.", "Former des acteurs en banlieue.", "Réaliser une œuvre à plusieurs mains.", "Sensibiliser à l'égalité des sexes."], "a": 0, "k": "la parole se libère lors de la rencontre qui suit la représentation", "_sources": ["test23#32"]}, {"t": "Nouvelle arrestation de pilleurs\nAprès l'arrestation de pilleurs en France, l'UNESCO lance un cri d'alarme pour la protection du patrimoine sous-marin. Au total, selon UNESCO, ce serait plus de trois millions d'épaves non explorées qui seraient menacées par les exactions des chasseurs de trésors. Le patrimoine subaquatique est de plus en plus menacé du fait des progrès techniques qui permettent aux chasseurs de trésors de sortir des objets protégés depuis des siècles par les eaux.", "q": "Que dit ce texte ?", "c": ["La faune aquatique est en danger.", "La technologie facilite le pillage des mers.", "Le nombre de voleurs dépaves augmente.", "Les bateaux en détresse sont laissés à leur sort."], "a": 1, "k": "progrès techniques qui permettent aux chasseurs de trésors", "_sources": ["test26#30"]}, {"t": "Théâtre\nJoel Pommerat nous offre un très court spectacle dont à la fois la pureté formelle et le sens nous ont conquis. Le matériau en est constitué par une série de rencontres. Auxquelles lui-même et son équipe assistèrent, entre des travailleurs sociaux et des femmes d'origine simple, vivant en cité, et en proie à des problèmes familiaux. De ces confidences relatives aux tensions qu'elles connaissent dans leurs enfants. Pommerat a tiré une suite de brèves séquences qui composent une tragédie intense de la souffrance familiale, et particulièrement de la souffrance de la femme. Son regard sur la détresse humaine est d'une bienveillance et d'une tendresse infinies. Il ne nous livre aucun message moral et à peine un message social : il fait simplement appel à notre sensibilité.", "q": "Dans quel objectif Joël Pommerat a-t-il créé son spectacle ?", "c": ["Aider les femmes à se battre pour améliorer leur situation familiale.", "Amener les spectateurs à s'émouvoir d'un quotidien douloureux.", "Démontrer que la condition de la femme dans les cités est désastreuse.", "Informer des difficultés que peuvent rencontrer les enfants des cités."], "a": 1, "k": "il fait simplement appel à notre sensibilité", "_sources": ["test26#32"]}, {"t": "Lors des premiers pas de l'art urbain (connu aussi sous le nom de street art), il y a plus de cinquante ans, personne ne portait vraiment intérêt à cette expression artistique éphémère. Les tags étaient destinés à disparaître, mais avec le temps, cela a changé : désormais on va jusqu'à découper les murs pour les vendre aux enchères et en garder une trace, car la conservation des œuvres d'art urbain dans l'espace public pose de sérieux défis. Il faut les protéger des agressions du temps, de la température, des dégradations humaines. On peut mettre une protection en plexiglas, mais un jour le mur finira aussi peut-être par tomber.", "q": "Qu'explique l'auteur à propos des œuvres d'art urbain ?", "c": ["Des musées sont prêts à les accueillir.", "Le marché voit leur cote grimper.", "Leurs auteurs sont devenus célèbres.", "On veut les préserver durablement."], "a": 3, "k": "la conservation des œuvres d'art urbain dans l'espace public pose de sérieux défis.", "_sources": ["test28#31"]}, {"t": "Théâtre\nJoël Pommerat nous offre un très court spectacle, dont à la fois, la pureté formelle et le sens nous ont conquis. Le matériau en est constitué par une série de rencontres, auxquelles lui-même et son équipe assistèrent, entre des travailleurs sociaux et des femmes d'origine simple, vivant en cité, et en proie à des problèmes familiaux. De ces confidences relatives aux tensions qu'elles connaissent dans leurs rapports, soit avec leurs parents, soit avec leurs enfants, Pommerat a tiré une suite de brèves séquences qui composent une tragédie intense de la souffrance familiale, et particulièrement de la souffrance de la femme. Son regard sur la détresse humaine est d'une bienveillance et d'une tendresse infinies. Il ne nous livre aucun message moral et à peine un message social ; il fait simplement appel à notre sensibilité.", "q": "Dans quel objectif Joël Pommerat a-t-il créé son spectacle ?", "c": ["Aider les femmes à se battre pour améliorer leur situation familiale.", "Amener les spectateurs à s'émouvoir d'un quotidien douloureux.", "Démontrer que la condition de la femme dans les cités est désastreuse.", "Informer des difficultés que peuvent rencontrer les enfants des cités."], "a": 1, "k": "il fait simplement appel à notre sensibilité.", "_sources": ["test28#34"]}, {"t": "Je ne connais pas son prénom, mais il y a, dans les Alpes, une personne à la verve savoureuse. Elle émaille la visite des gravures rupestres, dont les plus anciennes datent du Néolithique, de remises en perspective sur les prémices préhistoriques du capitalisme et de la domination masculine. Elle chantera peut-être, à condition que vous ne l'applaudissiez pas, pour vous permettre de ressentir l'acoustique d'un cirque rocheux. Elle vous proposera aussi de vous allonger et de fermer les yeux pour percevoir les vibrations du sol, riche en uranium. Bref, elle guidera les êtres minuscules que vous êtes à travers les plis grandioses de l'écorce terrestre.", "q": "Où exerce la personne décrite ?", "c": ["Dans un centre de relaxation.", "Dans un laboratoire.", "Dans un musée archéologique.", "Dans un parc naturel."], "a": 3, "k": "dans les Alpes", "_sources": ["test29#34", "test38#34"]}, {"t": "Depuis un an, l'association du Théâtre de l les dit pudiquement « différents » : autistes, trisomiques, atteints de troubles d'humeur. Dans des ateliers ou seuls, ils récupèrent, collent et inventent de leurs mains un monde proche de l'enfance. À la fois tendre et étrange, débordante de couleurs, de signes, d'images, cette exposition est spontanée et inventive.", "q": "Qu'apprend-on sur les œuvres exposées?", "c": ["Elles peuvent être touchées par le public.", "Elles répondent à une thématique unique.", "Elles sont destinées à être recyclées.", "Elles sont issues de techniques variées."], "a": 3, "k": "sculptures, dessins, tableaux, tissus brodés composent ce savant mélange artistique sans style précis.", "_sources": ["test35#30"]}, {"t": "Théâtre\nJoël Pommera nous offre un très court spectacle dont à la fois la pureté formelle et le sens nous ont conquis. Le matériau en est constitué par une série de rencontres, auxquelles lui-même et son équipe assistèrent, entre des travailleurs sociaux et des femmes d'origine simple, vivant en cité, et en proie à des problèmes familiaux. De ces confidences relatives aux tensions qu'elles connaissent dans leurs rapports, soit avec leurs parents, soit avec leurs enfants, Pommera a tiré une suite de brèves séquences qui composent une tragédie intense de la souffrance familiale, et particulièrement de la souffrance de la femme. Son regard sur la détresse humaine est d'une bienveillance et d'une tendresse infinies. Il ne nous livre aucun message moral et à peine un message social ; il fait simplement appel à notre sensibilité.", "q": "Dans quel objectif Joël Pommera a-t-il créé son spectacle ?", "c": ["Aider les femmes à se battre pour améliorer leur situation familiale.", "Amener les spectateurs à s'émouvoir d'un quotidien douloureux.", "Démontrer que la condition de la femme dans les cités est désastreuse.", "Informer des difficultés que peuvent rencontrer les enfants des cités."], "a": 1, "k": "il fait simplement appel à notre sensibilité.", "_sources": ["test35#32"]}, {"t": "Si la télévision est souvent critiquée pour sa distribution d'informations un peu floues, elle est aussi un remarquable éveilleur d'intérêt, quand, en plus d'un embryon de connaissances, elle donne le goût de le développer. Il en est ainsi par exemple de la lecture, dont elle est la plupart du temps un incomparable promoteur. Contrairement à trop d'idées reçues, la concurrence est très rare entre le petit écran et le livre, ne serait-ce que parce que leurs clientèles respectives sont différentes. Ceux qui aiment lire ne sacrifient pas ce vice impuni à l'uniformité des habituels spectacles télévisés. Au contraire, après chaque émission littéraire, les chiffres de la vente des livres évoqués, ou ayant inspiré le spectacle, comblent toujours d'aise les éditeurs.", "q": "Que soutient l'auteur de ce texte concernant la télévision ?", "c": ["C'est un vecteur de diffusion des œuvres littéraires.", "C'est une source de connaissances sûre et fiable.", "L'audience des émissions culturelles est en hausse.", "La concurrence qu'elle mène à la lecture est acharnée."], "a": 0, "k": "elle est la plupart du temps un incomparable promoteur", "_sources": ["test39#35"]}, {"t": "Depuis un an, l'association du Théâtre de la poudrerie, située à Sevran, à quelques kilomètres de Paris, a organisé des représentations gratuites à domicile d'une pièce inédite. Pour cela, l'association a convié une auteure professionnelle à venir en résidence pour l'écrire. Elle a recueilli le témoignage d'une trentaine d'habitantes sur le thème du pouvoir féminin, puis écrit son texte à partir de cette matière première. L'enjeu pour cette association est que les spectateurs s'approprient la pièce : quand il y a un phénomène d'identification, la parole se libère lors de la rencontre qui suit la représentation. Ce phénomène est amplifié par ce cadre intimiste qui favorise le rapprochement des spectateurs et des comédiens.", "q": "Quel objectif poursuit cette association avec ce projet ?", "c": ["Encourager le dialogue avec le public.", "Former des acteurs en banlieue.", "Réaliser une œuvre à plusieurs mains.", "Sensibiliser à l'égalité des sexes."], "a": 0, "k": "L'enjeu pour cette association est que les spectateurs s'approprient la pièce", "_sources": ["test40#32"]}, {"t": "J'a commencé ma vie comme je la finirai sans doute : au milieu des livres. Dans le bureau de mon grand-père, il y en avait partout ; défense était faite de les épousseter sauf une fois l'an, avant la rentrée d'octobre. Je ne savais pas encore lire que, déjà, je les révérais. Je les touchais en cachette pour honorer mes mains de leur poussière mais je ne savais trop qu'en faire. Mon grand-père maniait ces objets culturels avec une dextérité d'officiant. Je l'ai vu mille fois se lever d'un air absent, faire le tour de sa table, traverser la pièce en deux enjambées, prendre un volume sans hésiter, le feuilleter en regagnant son fauteuil puis, à peine assis, l'ouvrir d'un coup sec à la bonne page.", "q": "Que fait l'écrivain dans cet extrait ?", "c": ["Il revit des souvenirs lointains dans le bureau de la maison familiale", "Il se rappelle une pièce de travail poussiéreuse interdite aux enfants", "Il raconte son apprentissage de la lecture auprès de son grand-père", "Il évoque ses rentrées scolaires alors qu'il ne savait pas encore lire"], "a": 0, "k": "Dans le bureau de mon grand-père, il y en avait partout", "_sources": ["test3#36"]}, {"t": "Utiliser la comédie, le mime ou la danse pour sensibiliser les riverains, les responsables des établissements, les usagers de la nuit aux nuisances sonores ?\nTelle est la mission novatrice de Pierrots de la nuit, ces nouvelles « brigades d'intervention artistiques nocturnes » qui sensibilisent le public de nuit. L'originalité de la méthode interpelle les noctambules s'interrogeant : qui sont les Pierrots de la nuit ? Que font-ils et pourquoi ? L'art de rue n'est pas ressenti comme une agression, en revanche il force l'écoute et le respect. Le silence n'est pas une répression mais une forme de partage.", "q": "Quel est l'objectif poursuivi par les Pierrots de la nuit ?", "c": ["Améliorer la cohabitation entre habitants et noctambules", "Attirer les spectateurs parisiens vers le spectacle de rue", "Développer un nouveau concept de lieux silencieux", "Relancer la fréquentation nocturne de quartiers délaissés"], "a": 0, "k": "sensibiliser les riverains, les responsables des établissements, les usagers de la nuit aux nuisances sonores", "_sources": ["test3#38", "test13#38"]}, {"t": "Le Bon Usage est un gros livre, parce que son auteur n'a voulu éluder aucune des chausse-trapes de cette langue française dont Colette disait : « C'est une langue bien difficile que le français. À peine écrit-on depuis quarante-cinq ans qu'on commence à s'en apercevoir ». J'avais craint, jadis, que la masse même du volume n'en rebutât plus d'un.\nAppréhension vaine: l'ouvrage s'est étoffé à chaque réédition, la typographie (tout en restant d'une parfaite lisibilité) se présente dans une composition beaucoup plus serrée, et le succès du livre va croissant, à mesure que le lecteur a davantage le sentiment qu'il est aimablement conduit par la main grâce surtout à un index infiniment précieux, et que les explications qu'on lui propose ne sont pas de sommaires ukases, mais le reflet patient, probe jusqu'à l'aveu d'incertitudes, d'une actualité aussi mouvante que la vie.", "q": "D'après cet extrait, quelle est la plus grande qualité du Bon usage ?", "c": ["Il est complet.", "Il est concis.", "Il est innovant.", "Il est irréfutable."], "a": 0, "k": "son auteur n'a voulu éluder aucune des chausse-trapes de cette langue française", "_sources": ["test4#37"]}, {"t": "Il est incroyable que la perspective d'avoir à lire son propre livre en public n'ait jamais fait renoncer un écrivain à l'écrire. Rien n'est extravagant comme ces émissions littéraires où ils sont régulièrement requis de sacrifier à ce rituel qui suppose tout de même une habitude, une habileté, pour ne pas dire une technique, qui ne sont pas donné à tous les romanciers. La plupart n'osent pas refuser, en qui ils ont tort. Pour les convaincre de renoncer à ce dernier avatar de leur vanité, Il suffirait de les emmener, un soir, écouter des comédiens lire leur livre. En principe, si l'on est lucide et de bonne foi, on ne se remet pas d'une telle épreuve.", "q": "Que pense cet écrivain de la lecture publique d'un roman par son auteur ?", "c": ["Elle demande de posséder des talents d'acteur.", "Elle dessert le travail d'écriture du romancier.", "Elle est particulièrement adaptée au petit écran.", "Elle rend les émissions littéraires prétentieuses"], "a": 1, "k": "Pour les convaincre de renoncer à ce dernier avatar de leur vanité", "_sources": ["test4#38"]}, {"t": "C'est au milieu des populations françaises du Canada que s'est développée, au dix-neuvième siècle, la littérature québécoise. Une littérature porte nécessairement l'empreinte de l'esprit qui l'a faite. L'esprit canadien-français est évidemment à base de qualités françaises.\nCependant, notre esprit a visiblement subi l'influence des conditions nouvelles de vie, historiques, géographiques et sociales. Bien que pendant deux siècles, les besognes utilitaires aient absorbé toutes nos énergies aux dépens de la culture de l'esprit, aujourd'hui, une conscience plus nette de nos déficiences, une ambition plus vive d'accroître notre vie intellectuelle et artistique, un souci plus grand des pouvoirs publics de coopérer avec les initiatives privées, ont déterminé des progrès, promesses d'un meilleur avenir.", "q": "Selon ce spécialiste, qu'est-ce qui caractérise la littérature québécoise contemporaine ?", "c": ["L'absence d'attirance pour les thèmes traditionnels", "L'affirmation d'un style distinct de celui des Français", "L'effervescence créatrice contrastant avec le passé", "Le projet national de produire des œuvres majeures"], "a": 2, "k": "une ambition plus vive d'accroître notre vie intellectuelle et artistique", "_sources": ["test6#38"]}, {"t": "Pluie d'enfer\nPièce de théâtre de K. Hufr\nUn face-à-face entre deux flics, deux hommes forts, durs mais terriblement humains, dont les destins vont basculer. Ce qui fait courir les foules, ce sont les deux acteurs : O. Marchal et B. Wolkowitch. La Pièce est habilement stylisée, ne joue jamais les effets réalistes : plateau noir, pluie monotone en fond sonore qui s'inscrit dans l'atmosphère d'un monde violent. Sans doute cette tension fait-elle la force de Pluie d'enfer et son intense pouvoir d'attraction. Cependant, l'interprétation sur scène n'atteint jamais la présence fascinante des deux personnages fictifs de l'œuvre dramatique.", "q": "Pour ce journaliste, quel est le point négatif de cette pièce ?", "c": ["L'intrigue déçoit par son invraisemblance", "La mise en scène est simplifiée à l'extrême", "La tension dramatique demeure inexistante", "Le jeu des comédiens manque de puissance."], "a": 3, "k": "l'interprétation sur scène n'atteint jamais la présence fascinante des deux personnages fictifs de l'œuvre dramatique", "_sources": ["test6#39"]}, {"t": "Panache et arrogance, élégance et futilité, galanterie et gauloiserie : s'il existe, et à condition que cette notion ait encore un sens à l'ère de la mondialisation, l'esprit français tire son essence particulière du fragile équilibre entre ces oppositions. Amateur de grands principes, de coups de sang et de bons mots, c'est l'esprit français. Quoi que nous en disions il nous obsède. Que nous exaltions le génie national ou l'exception culturelle, les racines ou l'universel, le particularisme local ou l'intérêt général, il ne s'agit toujours, au fond, que de lui.\nLa mondialisation va-t-elle le dissoudre, et nous renvoyer au triste rang de pays ordinaire ?", "q": "Selon l'auteur, qu'est-ce que l'esprit français ?", "c": ["Des attitudes contradictoires forgeant une identité.", "Un égocentrisme désuet au temps de la mondialisation.", "Un ensemble de valeurs partagées par une élite.", "Une aptitude à l'ouverture qui tend à disparaître."], "a": 0, "k": "l'esprit français tire son essence particulière du fragile équilibre entre ces oppositions", "_sources": ["test7#39"]}, {"t": "J'ai commencé ma vie comme je la finirai sans doute : au milieu des livres. Dans le bureau de mon grand-père, il y en avait partout ; défense était faite de les épousseter sauf une fois l'an, avant la rentrée d'octobre. Je ne savais pas encore lire que, déjà, je les révérais. Je les touchais en cachette pour honorer mes mains de leur poussière mais je ne savais trop qu'en faire. Mon grand-père maniait ces objets culturels avec une dextérité d'officiant. Je l'ai vu mille fois se lever d'un air absent, faire le tour de sa table, traverser la pièce en deux enjambées, prendre un volume sans hésiter, le feuilleter en regagnant son fauteuil puis, à peine assis, l'ouvrir d'un coup sec à la bonne page.", "q": "Que fait l'écrivain dans cet extrait ?", "c": ["Il revit des souvenirs lointains dans le bureau de la maison familiale.", "Il se rappelle une pièce de travail poussiéreuse interdite aux enfants.", "Il raconte son apprentissage de la lecture auprès de son grand-père.", "Il évoque ses rentrées scolaires alors qu'il ne savait pas encore lire."], "a": 0, "k": "Dans le bureau de mon grand-père, il y en avait partout", "_sources": ["test9#36", "test13#36"]}, {"t": "NOVECENTO\nD'Alessandro Baricco\nCompagnie vertigo\nDécouvrez la vie de Lemon Novecento, un pianiste extraordinaire abandonné à sa naissance sur un paquebot qui fait la liaison entre l'Europe et l'Amérique. Il passera son existence à jouer pour les voyageurs se nourrissant de leurs récits et de sa musique. Sans trouver le courage de descendre à terre. Porté par l'écriture riche, fluide et musicale du texte de Baricco. Le comédien principal nous entraîne avec une étonnante facilité dans un extraordinaire voyage ou résonnent les notes de jazz. (...)", "q": "Quelle est, selon le texte, la qualité principale de ce spectacle ?", "c": ["L'aisance de l'acteur qui tient le rôle principal.", "La finesse de l'humour présent dans la pièce.", "Le mystère qui entoure le personnage.", "Le talent de l'ensemble des musiciens."], "a": 0, "k": "Le comédien principal nous entraîne avec une étonnante facilité", "_sources": ["test12#38"]}, {"t": "On connaît Cézanne surtout pour ses paysages, mais le Musée d'Orsay montre, pour la première fois, une partie méconnue de l'œuvre de l'artiste. On y croisera le visage de son épouse, seul motif autant étudié par le peintre que la montagne Sainte-Victoire. Au fil des versions, Hortense Fiquet devient l'objet d'une recherche plastique, de mise en scène et de géométrisation des formes. Mais Cézanne peut aussi avoir le pinceau cruel. Dès ses débuts, les figures de son père et de sa mère sont tourmentées. Lui-même se représente à 27 ans, patibulaire et le regard injecté de sang. À la fin de sa vie, Cézanne choisit des anonymes du monde rural. Ses tableaux ne sont alors qu'une autre forme de paysage.", "q": "Que souligne cette exposition sur Paul Cézanne ?", "c": ["L'influence de ses contemporains", "La singularité de ses portraits", "Son engouement pour la nature", "Son travail postimpressionniste"], "a": 1, "k": "une partie méconnue de l'œuvre de l'artiste", "_sources": ["test17#36"]}, {"t": "Ça pourrait être une tragédie, avec les meilleurs ingrédients du genre : rencontres hasardeuses de personnages abîmés par un lourd passé, malheurs successifs et révélations inattendus … sauf qu'entre le jeune pompier Roméo et l'infirmière Juliette, victime de la cruauté de son compagnon, le chemin tracé par Agnès Ledig dans son roman Paro avec lui est plein de pudeur, riche de personnages ordinaires, mais surprenants, vrais, mais imprévisibles, dans une France provinciale qu'on décrit trop peu. Il y a chez eux une envie de dire, d'avouer ce qui fut trop longtemps caché. Ainsi, l'histoire se fait-elle peu à peu libération et rédemption. Avec un art direct et familier de conteuse, l'auteure offre à ses personnages un espoir, un bonheur encore possible.", "q": "D'après la critique, quel est l'atout principal du roman d'Agnès Ledig ?", "c": ["L'alternance entre le comique et le drame", "L'atmosphère énigmatique et inquiétante", "La présentation des particularités régionales", "L'émancipation des héros au cours du récit"], "a": 3, "k": "l'histoire se fait-elle peu à peu libération et rédemption", "_sources": ["test18#39"]}, {"t": "Maintenant elles étaient là. Non plus en éveil, en méfiance, et rassemblées sous l'influence de la crainte par troupes, hardes, files et bandes, selon la race, la tribu, la famille, mais confondues et mêlées au sein d'une sécurité ineffable dans la trêve de l'eau, en paix avec la brousse, elles-mêmes et l'aurore. À la distance où je me trouvais, il n'était pas possible de distinguer l'inflexion des mouvements, ou l'harmonie des couleurs, mais cette distance ne m'empêchait pas de voir que les bêtes se comptaient par centaines et centaines, que toutes les espèces voisinaient, et que cet instant de leur vie ne connaissait pas la peur ou la hâte. Gazelles, antilopes, girafes, gnous, zèbres, rhinocéros, buffles, éléphants… les animaux s'arrêtaient ou se déplaçaient au pas du loisir, au gré de la soif, au goût du hasard.", "q": "Quelle phrase résume exactement cet extrait de roman ?", "c": ["Je ressentais pleinement l'anxiété des bêtes.", "Je percevais parfaitement la quiétude de cet instant.", "Je découvrais inopinément un spectacle effrayant et inquiétant.", "J'éprouvais un sentiment de crainte face à ces troupeaux d'animaux sauvages."], "a": 1, "k": "cet instant de leur vie ne connaissait pas la peur ou la hâte", "_sources": ["test19#37"]}, {"t": "La bataille de Bouvines, remportée le 27 juillet 1214 par le roi de France Philippe Auguste sur un empereur allemand, est l'un des actes fondateurs de la dynastie capétienne et l'un des épisodes les plus célèbres du « roman national » français. Du XIIIe siècle à nos jours, elle a été à l'origine de multiples légendes que le spécialiste du monde médiéval, Dominique Barthélemy, confronte à la réalité des faits. À l'issue d'une enquête approfondie, il décrit un affrontement plus modeste et moins épique que celui construit et enrichi au gré des nécessités politiques. Ainsi, il nous invite à poursuivre la réflexion sur l'idée que les Français se font d'eux-mêmes.", "q": "Selon article, que fait Dominique Barthélemy ?", "c": ["Il analyse l'établissement d'une dynastie royale.", "Il explique l'origine d'une légende médiévale.", "Il explore la construction identitaire des Français.", "Il renforce le mythe de la bataille de Bouvines."], "a": 2, "k": "il nous invite à poursuivre la réflexion sur l'idée que les Français se font d'eux-mêmes.", "_sources": ["test20#37", "test27#37"]}, {"t": "Ça pourrait être une tragédie, avec les meilleurs ingrédients du genre: rencontres hasardeuses de personnages abîmés par un lourd passé, malheurs successifs et révélations inattendues... Sauf qu'entre le jeune pompier Roméo et l'infirmière Juliette victime de la cruauté de son compagnon, le chemin tracé par Agnès Ledig dans son roman « Pars avec lui » est plein de pudeur, riche de personnages ordinaires, mais surprenants, vrais, mais imprévisibles, dans une France provinciale qu'on décrit trop peu. Il y a chez eux une envie de dire, d'avouer ce qui fut trop longtemps caché. Ainsi l'histoire se fait-elle peu à peu libération et rédemption. Avec un art direct et familier de conteuse, l'auteure offre à ses personnages un espoir, un bonheur encore possible.", "q": "D'après la critique, quel est l'atout principal du roman d'Agnès Ledig ?", "c": ["L'alternance entre le comique et le drame.", "L'atmosphère énigmatique et inquiétante.", "La présentation de particularités régionales.", "L'émancipation des héros au cours du récit."], "a": 3, "k": "l'histoire se fait-elle peu à peu libération et rédemption", "_sources": ["test24#38"]}, {"t": "Jadis pourchassées pour hérésie ou cantonnées aux seconds rôles dans les contes de fées, les sorcières, ces figures de pouvoir et de liberté, reprennent du service, notamment dans les fictions, essais et ouvrages historiques. Après le best-seller de Mona Chollet, écoulé à plus de 136 000 exemplaires depuis sa sortie, en 2018, les éditeurs ont su s'emparer du filon. Si ce succès est indéniablement lié au féminisme, le déclencheur vient d'abord d'un petit sorcier, Harry Potter. Il a marqué le retour en grâce de la magie, estime Mickaël Palvin, directeur marketing d'Albin Michel. Pendant des années, on a cantonné la sorcellerie au rayon ésotérisme. Mais, depuis quelques mois, on assiste à sa consécration dans la littérature que les éditeurs mettent en avant à la rentrée littéraire.", "q": "Qu'explique ce journaliste sur les sorcières dans la littérature ?", "c": ["Elles bénéficient d'un effet de mode.", "Elles inquiètent les jeunes enfants.", "Elles relèvent d'un genre spécifique.", "Elles symbolisent la peur de l'inconnu."], "a": 0, "k": "les éditeurs ont su s'emparer du filon.", "_sources": ["test28#37"]}, {"t": "Ça pourra être une tragédie, avec les meilleurs ingrédients du genre : rencontres hasardeuses de personnages abimés par un lourd passé, malheurs successifs et révélations inattendues... Sauf qu'entre le jeune pompier Roméo et l'infirmière Juliette victime de la cruauté de son compagnon, le chemin tracé par Agnès Ledig dans son roman « Pars avec lui » est plein de pudeur, riche de personnages ordinaires, mais surprenants, vrais, mais imprévisibles, dans une France provinciale qu'on décrit trop peu. Il y a chez eux une envie de dire, d'avouer ce qui fut trop longtemps caché. Ainsi l'histoire se fait-elle peu à peu libération et rédemption. Avec un art direct et familier de conteuse, l'auteure offre à ses personnages un espoir, un bonheur encore possible.", "q": "D'après la critique, quel est l'atout principal du roman d'Agnès Ledig ?", "c": ["L'alternance entre le comique et le drame.", "L'atmosphère énigmatique et inquiétante.", "La présentation de particularités régionales.", "L'émancipation des héros au cours du récit."], "a": 3, "k": "l'histoire se fait-elle peu à peu libération et rédemption", "_sources": ["test30#38"]}, {"t": "La bataille de Bouvines, remportée le 27 juillet 1214 par le roi de France Philippe Auguste sur un empereur allemand, est l'un des actes fondateurs de la dynastie capétienne et l'un des épisodes les plus célèbres du Roman national français. Du XIII siècle à nos jours, elle a été à l'origine de multiples légendes que le spécialiste du monde médiéval, Dominique Barthélemy, confronte à la réalité des faits. Il nous invite à poursuivre la réflexion sur l'idée que les Français se font d'eux-mêmes.", "q": "Selon l'article, que fait Dominique Barthélemy ?", "c": ["Il analyse l'établissement d'une dynastie royale.", "Il explique l'origine d'une légende médiévale.", "Il explore la construction identitaire des Français.", "Il renforce le mythe de la bataille de Bouvines."], "a": 2, "k": "la réflexion sur l'idée que les Français se font d'eux-mêmes", "_sources": ["test31#37"]}, {"t": "Ce pourra être une tragédie, avec les meilleurs ingrédients du genre : rencontres hasardeuses de personnages abimés par un lourd passé, malheurs successifs et révélations inattendues. Sauf qu'entre le jeune pompier Roméo et l'infirmière Juliette, le chemin tracé par Agnès Ledig dans son roman est plein de pudeur, riche de personnages ordinaires mais surprenants, dans une France provinciale. Il y a chez eux une envie de dire, d'avouer ce qui fut trop longtemps caché. Ainsi l'histoire se fait-elle peu à peu libération et rédemption.", "q": "D'après la critique, quel est l'atout principal du roman d'Agnès Ledig ?", "c": ["L'alternance entre le comique et le drame.", "L'atmosphère énigmatique et inquiétante.", "La présentation de particularités régionales.", "L'émancipation des héros au cours du récit."], "a": 3, "k": "l'histoire se fait-elle peu à peu libération et rédemption", "_sources": ["test31#38"]}]}, "Profession": {"cours": [{"t": "Pas de clash ni de portes qui claquent. A l'issue de la deuxième conférence sociale, le gouvernement peut au moins se réjouir de ce résultat. Les représentant du patronat et des syndicats n'ont pas applaudi à tout rompre l'intervention du premier ministre, mais il n'y a pas non plus eu de fâcherie comme celle qui avait marqué la première conférence.\nLà certains se sont dits déçus par la minceur des annonces que le premier ministre a dévoilées ou par les zones de flou qui règnent sur plusieurs dossiers brûlants - es retraites en tête – personne n'a non plus eu vent de colères. Il faut dire que pendant deux jours, ministres et conseillers se sont échinés à repousser les points qui fâchent à plus tard", "q": "Quel a été l'aboutissement de la conférence ?", "c": ["L'affrontement entre partenaires sociaux", "L'avancée majeure en termes de fiscalité", "La proclamation de réformes importantes", "L'absence de prise de décisions effectives"], "a": 3, "k": "ministres et conseillers se sont échinés à repousser les points qui fâchent à plus tard", "_sources": ["test2#32"]}, {"t": "Plutôt que de multiplier les tests et les mises en situation, certaines entreprises choisissent de déléguer la responsabilité du recrutement... à leurs salariés ! « Personnellement, je suis très favorable à la cooptation, affirme ce responsable. Si vous avez un bon élément dans votre équipe, vous avez une excellente chance qu'il vous amène un autre bon élément, ça permet de limiter les risques.» Signe des temps, la « cooptation » est aujourd'hui acceptée et revendiquée par tous. Dans certaines entreprises, elle est même encouragée par une prime : 4 000 euros sont versés à tout employé ayant recommandé un candidat recruté à son tour.", "q": "En adoptant la cooptation pour le recrutement, que recherchent les entreprises ?", "c": ["À gagner du temps.", "À minimiser les aléas.", "À réduire les frais.", "À Simplifier les procédures."], "a": 1, "k": "ça permet de limiter les risques", "_sources": ["test4#35"]}, {"t": "En France, entre 200 000 et 500 000 cas de troubles psychiques sont liés au monde du travail. L'apparition de nouvelles méthodes de travail, plus intenses et contraignantes, serait à l'origine de l'augmentation des cas de syndrome d'épuisement professionnel : c'est le mal du siècle et pourtant, il n'est pas encore reconnu.\nLes salariés, prisonniers de l'idéologie ambiante, s'imaginent trop souvent, quand ils craquent, qu'un collègue plus solide qu'eux aurait été capable de résister. Mais cela s'avère faux la plupart du temps. Une reconnaissance de la maladie obligerait les entreprises à réfléchir à leur fonctionnement et représenterait une réelle mesure d'utilité publique.\nD'après capital.fr", "q": "Quel constat est dressé à propos de ce syndrome ?", "c": ["Il inquiète les patrons de sociétés", "Il touche les employés les plus faibles", "Son existence doit être officialisée", "Son traitement est peu efficace"], "a": 2, "k": "c'est le mal du siècle et pourtant, il n'est pas encore reconnu", "_sources": ["test6#33", "test37#33"]}, {"t": "De : Pascale@radioair.fr\nObjet : Remerciements\n\nCher tous,\nAmis, techniciens, auditeurs, animateurs, président de notre radio, vous qui avez toujours été là pour Des Airs, je voulais dire un très grand merci ! je le répéterai le 1er juillet pour la dernière fois sur les ondes à l'occasion de la 200° : notre radio a été pour moi un merveilleux espace de liberté ! Laissez-moi remercier encore notre président qui continue à la faire vivre. Quel bonheur de vous avoir eu tous autour de moi samedi !\nMerci encore,\nPascale", "q": "Qu'ont-ils tous fêté samedi ?", "c": ["L'anniversaire d'une radio", "La 200ème édition d'une émission", "Le départ d'une animatrice", "Le travail d'un directeur"], "a": 1, "k": "à l'occasion de la 200°", "_sources": ["test7#31"]}, {"t": "Paul Bocuse n'était pas le plus créatif, ni le meilleur technicien de cette génération de chefs d'exception qui a vu éclore des cuisiniers de renommée internationale. Mais il avait une vision, du culot et un véritable talent de meneur.\nPour donner une stature plus imposante aux cuisiniers, il a lancé la mode de la fameuse veste blanche grand chef, avec le nom brodé sur la poitrine et le port de la toque démesurée qui évoque la coiffe des pharaons.\nDès ses débuts, sa personnalité et son sens de la formule ont fait mouche auprès de la presse, qui a publié de nombreux portraits flatteurs, faisant affluer les clients dans son restaurant.", "q": "D'après ce journaliste, quelle a été la clé du succès de Paul Bocuse ?", "c": ["Sa connaissance des médias.", "Ses méthodes ancestrales.", "Ses recettes originales.", "Son charisme incroyable."], "a": 3, "k": "sa personnalité et son sens de la formule ont fait mouche", "_sources": ["test8#31"]}, {"t": "De: pascale@radioair.fr\nObjet : Remerciements\n\nCher tous,\nAmis, techniciens, auditeurs, animateurs, président de notre radio, vous qui avez toujours été là pour Des Airs, je voulais vous dire un très grand merci !\nJe le répéterai le 1er juillet pour la dernière fois sur les ondes à l'occasion de la 200° : notre radio a été pour moi un merveilleux espace de liberté ! Laissez-moi remercier encore notre président qui continue à la faire vivre.\nQuel bonheur de vous avoir eu tous autour de moi samedi !\nMerci encore,\nPascale.", "q": "Qu'ont-ils tous fêté samedi ?", "c": ["L'anniversaire d'une radio.", "La 200e édition d'une émission.", "Le départ d'une animatrice.", "Le travail d'un directeur."], "a": 1, "k": "à l'occasion de la 200°", "_sources": ["test11#31"]}, {"t": "Désormais, c'est soi, son plaisir et les relations avec son environnement qui comptent. Tel est le nouveau schéma de pensée des jeunes vis-à-vis de la société et de l'entreprise en particulier. Un jeune a appris d'abord, à miser sur lui. Ce n'est qu'en accumulant des compétences et des expériences qu'il pense pouvoir tirer
