s au sommet des immeubles", "La création de jardins communs pour planter des légumes"], "a": 0, "k": "l'idée d'une centrale hydrothermique pour chauffer et refroidir tout un quartier", "_sources": ["test2#34"]}, {"t": "Le discours écologique actuel est très factuel, pratico-pratique, comme si on n'osait pas parler de cette beauté dont nous avons pourtant besoin pour nous épanouir. C'est peut-être l'une des raisons pour laquelle l'écologie politique ne rallie pas tant que ça. Si on n'est pas sensible à la terre, aux végétaux, on devient un technicien de l'écologie, on emploie un langage neutre et rassurant, fait d'environnement et de développement durable. Mais il faut pouvoir parler de la beauté spécifique de la nature qui nous enchante, qui nous fait vibrer.", "q": "Selon l'intervenant, qu'est-ce qui caractérise le discours écologique actuel ?", "c": ["Il apaise les tensions de la société.", "Il insiste sur le point de vue matériel.", "Il propose des programmes utopiques.", "Il traite les problèmes liés aux sols."], "a": 1, "k": "langage neutre et rassurant", "_sources": ["test8#35"]}, {"t": "Le discours écologique actuel est très factuel, « pratico-pratique », comme si on n'osait pas parler de cette beauté dont nous avons pourtant besoin pour nous épanouir. C'est peut-être l'une des raisons pour laquelle l'écologie politique ne rallie pas tant que ça. Si on n'est pas sensible à la terre, aux végétaux. On devient un technicien de l'écologie, on emploie un langage neutre et rassurant, fait d'«environnement » et de « développement durable ». Mais il faut pouvoir parler de la beauté spécifique de la nature qui nous enchante, qui nous fait vibrer. Nous avons besoin de nous nourrir de sa splendeur, de son mystère, et pas seulement de ses aspects matériels, pratiques, biologiques.", "q": "Selon l'intervenant, qu'est-ce qui caractérise le discours écologique actuel ?", "c": ["Il apaise les tensions de la société.", "Il insiste sur le point de vue matériel.", "Il propose des programmes utopiques.", "Il traite les problèmes liés aux sols."], "a": 1, "k": "on emploie un langage neutre et rassurant, fait d'«environnement » et de « développement durable »", "_sources": ["test12#35"]}, {"t": "Quel visage Paris pourrait-il prendre en 2100 ? C'est ce que le collectif d'architectes « Et alors...» a imaginé au travers de vingt cartes postales géantes, exposées à Paris. Ce qui donne un résultat surprenant, parfois utopique, parfois réaliste. Ainsi l'idée d'une centrale hydrothermique pour chauffer et refroidir tout un quartier, projet de la Compagnie Parisienne du Chauffage Urbain. Des potagers « partagés » au pied des immeubles en plein centre-ville, cela ressemble plus à un clin d'œil malicieux... Le vélo a également la part belle : les architectes imaginent des voies rapides sur les toits de Paris, au milieu de toitures végétalisées et de jardins.", "q": "Quel projet est présenté comme réaliste ?", "c": ["L'extension d'un système de climatisation à tout un quartier.", "L'installation de parcs sur les toits des bâtiments parisiens.", "La construction de pistes cyclables au sommet des immeubles.", "La création de jardins communs pour planter des légumes."], "a": 0, "k": "centrale hydrothermique pour chauffer et refroidir tout un quartier", "_sources": ["test15#34"]}, {"t": "Quarante terrains de football.\nC'est la superficie que les forêts perdent chaque minute à travers le monde.\nLa destruction de la forêt tropicale provoque chaque année plus de rejet dans l'atmosphère que l'ensemble du secteur des transports.", "q": "Selon cet article, sur quoi la déforestation a-t-elle un impact ?", "c": ["Sur l'industrie des bois rares.", "Sur la démographie dans ces zones.", "Sur la pollution atmosphérique.", "Sur la progression des cultures tropicales."], "a": 2, "k": "La destruction de la forêt tropicale provoque… plus de rejet dans l'atmosphère", "_sources": ["test16#30"]}, {"t": "L'homme est de noir vêtu. Son crâne, nu, joue avec la lumière. Tout est dit, tout est là, dans ce jeu d'ombre et de clarté qui fait d'un bâtisseur un poète. Jean Nouvel façonne le mystère pour insuffler du vivant aux édifices au cœur de pierre et bâtit sans dénaturer. Cet architecte éclairé n'érige rien, il convie cette émotion, suscite une apparition. Pour sa dernière création, l'œil découvre une ville-musée aux formes douces, un dôme qui semble né des mains d'une dentellière. Le dôme repose sur quatre piliers pour gagner en légèreté et s'allier au paysage, trait d'union avec les nuages.", "q": "Quelle particularité de Jean Nouvel est louée dans cet article ?", "c": ["Sa technique puise dans divers mouvements artistiques", "Ses œuvres se fondent dans leur environnement", "Son inspiration provient de ses nombreuses lectures", "Son savoir-faire met en valeur des procédés connus"], "a": 1, "k": "bâtit sans dénaturer", "_sources": ["test17#35"]}, {"t": "Deux mondes s'affrontent : ceux de l'ancienne agriculture et de la nouvelle. Le productivisme soutenu par la chimie a fait progresser comme jamais les rendements agricoles, nourri la planète et abaissé le prix des denrées. Mais il a fait son temps. Tes tenants du passé, dont on peut comprendre les motivations, tant les agriculteurs travaillent sous la pression éreintante de la compétitivité, soutiennent qu'il n'existe pas d'autre solution. Notre enquête montre le contraire : l'alliance de la technologie et de l'écologie pour remplacer des substances nocives par une panoplie de techniques inédites offre une alternative originale, crédible et soutenable à la dispersion incontrôlée de composants chimiques nuisibles à tous. C'est la voie de la sagesse autant que de la modernité.", "q": "Que défend le journaliste ?", "c": ["L'accès universel à des aliments bon marché.", "L'innovation des procédés de production.", "Le développement du commerce équitable.", "Le partage d'expériences traditionnelles."], "a": 1, "k": "l'alliance de la technologie et de l'écologie", "_sources": ["test21#30"]}, {"t": "« Un produit qui ne s'userait pas serait une tragédie pour les affaires », lisait-on sur une ancienne revue américaine. Des années plus tard, le concept d'obsolescence programmée n'a pas pris une ride !\nIl s'agit pour les fabricants de réduire volontairement la durée de vie ou d'emploi d'un produit afin d'en augmenter le taux de remplacement. Ici se cache le cœur de la course à la consommation. Le bilan écologique est également sans appel : les matières que contiennent nos appareils finissent en grande partie en déchets incinérés ou enfouis. L'exemple du téléphone portable en dit long : dans un rapport, une sénatrice souligne que « la conception des téléphones est délibérément défavorable au réemploi et au recyclage »", "q": "Que constate ce journaliste à propos des articles proposés par les fabricants ?", "c": ["Ils se détériorent après un certain temps.", "Ils sont dangereux pour la santé.", "Ils sont nuisibles pour l'environnement.", "Ils sont vendus à des prix élevés."], "a": 2, "k": "les matières que contiennent nos appareils finissent en grande partie en déchets", "_sources": ["test21#35"]}, {"t": "Le discours écologique actuel est très factuel, « pratico-pratique », comme si on n'osait pas parler de cette beauté dont nous avons pourtant besoin pour nous épanouir. C'est peut-être l'une des raisons pour laquelle l'écologie politique ne rallie pas tant que ça. Si on n'est pas sensible à la terre, aux végétaux, on devient un technicien de l'écologie, on emploie un langage neutre et rassurant, fait « d'environnement » et de « développement durable ». Mais il faut pouvoir parler de la beauté spécifique de la nature qui nous enchante, qui nous fait vibrer. Nous avons besoin de nous nourrir e sa splendeur, de son mystère, et pas seulement de ses aspects matériels, pratiques, biologiques.", "q": "Selon l'intervenant, qu'est-ce que qui caractérise le discours écologique ?", "c": ["Il apaise les tensions de la société.", "Il insiste sur le pont de vue matériel.", "Il propose des programmes utopiques.", "Il traite les problèmes liés aux sols"], "a": 1, "k": "le discours écologique actuel est très factuel, « pratico-pratique »", "_sources": ["test25#35"]}, {"t": "Selon la conception de Descartes, le corps est perçu comme séparé de l'esprit à éduquer. Cette idée selon laquelle le corps ne serait que naturel et biologique a été déconstruite par le sociologue Marcel Mauss en 1934. Dans ses travaux, il montre que le corps est le résultat d'une construction sociale, un matériau dans lequel s'impriment les marques d'une culture donnée dans une société donnée. Il n'existerait pas de manière « naturelle » de se développer, de bouger, de se comporter pour le corps humain. La marche ou la nage, qui paraissent ordinaires ou allant de soi, sont en réalité le reflet d'une éducation qui institue les manières dont les êtres humains apprennent à se servir de leur corps.", "q": "Qu'ont montré les travaux de Marcel Mauss sur la façon de se mouvoir ?", "c": ["Elle représenterait l'influence de l'inconscient.", "Elle résulterait de l'observation de normes.", "Elle serait issue du patrimoine génétique.", "Elle résulterait de la part de l'acquis due au groupe."], "a": 3, "k": "une éducation qui institue les manières dont les êtres humains apprennent à se servir de leur corps.", "_sources": ["test26#39", "test28#30"]}, {"t": "Selon plusieurs scientifiques, les nouvelles solutions « écologiques », comme la voiture électrique, tendent en fait à accroître l'activité économique et ne pourront pas préserver notre modèle de développement. Au-delà du double écueil de la fabrication des voitures électriques qui est énergivore et génère beaucoup de déchets, le problème des technologies dites « vertes » est principalement dû à l'effet rebond, c'est-à-dire l'augmentation de l'activité globale qu'entraîne toute découverte ou amélioration technologique. Ainsi, une véritable approche écologique devrait obligatoirement comporter une part de sobriété, grâce à laquelle le progrès technique servirait une réduction de la consommation.", "q": "Que pense l'auteur des nouvelles solutions écologiques ?", "c": ["Il déconseille au grand public de les adopter.", "Il estime qu'elles sont insuffisamment promues.", "Il remet en question leurs retombées positives.", "Il révèle qu'elles contribuent au déclin industriel."], "a": 2, "k": "les nouvelles solutions « écologiques »… tendent en fait à accroître l'activité économique", "_sources": ["test28#32", "test38#26"]}, {"t": "C'est un étonnant phénomène, appelé couronne de timidité : le feuillage de certains arbres n'entre jamais en contact avec celui des autres, créant des frontières entre les feuilles. Dans certaines forêts, un labyrinthe de lumière se dessine entre les feuillages, comme si les arbres laissaient volontairement une barrière d'une trentaine de centimètres pour éviter d'entrer en contact. Une même espèce d'arbres s'entendait donc pour créer un environnement propice à la survie du groupe dans son ensemble.", "q": "Que constate l'auteur du texte à propos des arbres ?", "c": ["Ils sont aptes à coloniser un territoire vierge.", "Ils sont capables de communiquer entre eux.", "Ils sont en compétition pour leur croissance.", "Ils sont susceptibles de ressentir des émotions."], "a": 1, "k": "une même espèce d'arbres s'entendait donc pour créer un environnement propice", "_sources": ["test31#33"]}, {"t": "SUR LE CHEMIN DE LA BIO-CONSTRUCTION\n\nDepuis quelque temps, la conscience écologique s'est considérablement aiguisée. Les particuliers ont même une idée précise de ce qu'ils veulent comme habitat. Les projets de logement 100% écologiques deviennent l'obsession de tous les cabinets d'architectes : construction basse consommation, rénovation énergétique, maison passive... Il s'agit maintenant d'adapter l'offre du marché et d'élargir les domaines de compétences des professionnels notamment au sein des entreprises de construction.", "q": "Selon l'auteur, quel est le défi de la bioconstruction ?", "c": ["Convaincre la clientèle ciblée.", "Former les spécialistes du secteur.", "Rentabiliser les projets à venir.", "Restaurer d'anciens bâtiments."], "a": 1, "k": "d'élargir les domaines de compétences des professionnels", "_sources": ["test31#34"]}, {"t": "Deux mondes s'affrontent ceux de l'ancienne agriculture et de la nouvelle. Le productivisme soutenu par la chimie a fait progresser comme jamais les rendements agricoles, nourri la planète et abaissé le prix des denrées. Mais il a fait son temps. Les tenants du passé, dont on peut comprendre les motivations, tant les agriculteurs travaillent sous la pression éreintante de la compétitivité, soutiennent qu'il n'existe pas d'autre solution. Notre enquête montre le contraire : l'alliance de la technologie et de l'écologie pour remplacer des substances nocives par une panoplie de techniques inédites offre une alternative originale, crédible et soutenable à la dispersion incontrôlée de composants chimiques nuisibles à tous. C'est la voie de la sagesse autant que de la modernité.", "q": "Que défend le journaliste ?", "c": ["L'accès universel à des aliments bon marché.", "L'innovation des procédés de production.", "Le développement du commerce équitable.", "Le partage d'expériences traditionnelles."], "a": 1, "k": "l'alliance de la technologie et de l'écologie", "_sources": ["test33#30"]}, {"t": "« Un produit qui ne s'userait pas serait une tragédie pour les affaires », lisait-on dans une ancienne revue américaine. Des années plus tard, le concept d'obsolescence programmée n'a pas pris une ride ! Il s'agit pour les fabricants de réduire volontairement la durée de vie ou d'emploi d'un produit afin d'en augmenter le taux de remplacement. Ici se cache le cœur de la course à la consommation. Le bilan écologique est également sans appel : les matières que contiennent nos appareils finissent en grande partie en déchets incinérés ou enfouis. L'exemple du téléphone portable en dit long : dans un rapport, une sénatrice souligne que « la conception des téléphones est délibérément défavorable au réemploi et au recyclage ».", "q": "Que constate ce journaliste à propos des articles proposés par les fabricants ?", "c": ["Ils se détériorent après un certain temps.", "Ils sont dangereux pour la santé.", "Ils sont nuisibles pour l'environnement.", "Ils sont vendus à des prix élevés."], "a": 2, "k": "bilan écologique est également sans appel", "_sources": ["test33#35"]}, {"t": "SUR LE CHEMIN DE LA BIO-CONSTRUCTION\n\nDepuis quelque temps, la conscience écologique s'est considérablement aiguisée. Les particuliers ont même une idée précise de ce qu'ils veulent comme habitat. En conséquence, les projets de logements 100% écologiques deviennent l'obsession de tous les cabinets d'architectes : construction basse consommation, rénovation énergétique, maison passive... Il s'agit maintenant d'adapter l'offre du marché et d'élargir les domaines de compétences des professionnels, notamment au sein des entreprises de construction. D'autant plus selon un grand nombre de spécialistes, la construction - quand elle est mise en œuvre - représente un gain pour tout le monde, pour le promoteur comme pour l'acheteur.", "q": "Selon l'auteur, quel est le défi de la bio-construction ?", "c": ["Convaincre la clientèle cible.", "Former les spécialistes du secteur.", "Rentabiliser les projets à venir.", "Restaurer d'anciens bâtiments."], "a": 1, "k": "Il s'agit maintenant d'adapter l'offre du marché et d'élargir les domaines de compétences des professionnels, notamment au sein des entreprises de construction.", "_sources": ["test36#34"]}, {"t": "Le discours écologique actuel est très factuel, « pratico-pratique » comme si on n'osait pas parler de cette beauté dont nous avons pourtant besoin pour nous épanouir. C'est peut-être l'une des raisons pour laquelle l'écologie politique ne rallie pas tant que ça. Si on n'est pas sensible à la terre, aux végétaux, on devient un technicien de l'écologie, on emploie un langage neutre et rassurant, fait d'« environnement » et de « développement durable ». Mais il faut pouvoir parler de la beauté spécifique de la nature qui nous enchante, qui nous fait vibrer. Nous avons besoin de nous nourrir de sa splendeur, de son mystère, et pas seulement de ses aspects matériels, pratiques, biologiques.", "q": "Selon l'intervenant, qu'est-ce qui caractérise le discours écologique actuel ?", "c": ["Il apaise les tensions de la société", "Il insiste sur le point de vue matériel", "Il propose des programmes utopiques", "Il traite les problèmes liés au sol"], "a": 1, "k": "Le discours écologique actuel est très factuel, « pratico-pratique »", "_sources": ["test4#36"]}, {"t": "Le trois-mâts d'exploration La Boudeuse va reprendre le large pour une nouvelle mission à caractère scientifique.\nLe voiler va mettre le cap en septembre prochain sur l'Amérique du sud et ses grands fleuves. Il se consacrera « aux études scientifiques et humaines concernant la biosphère, le réchauffement climatique et le développement durable », selon la « lettre de mission » adressée à son commandant, signée du ministre d'Etat aux Transports et l'Ecologie. Cette « lettre de mission » de la République assigne à l'équipage un audacieux programme concernant la protection de l'environnement.", "q": "Selon l'article, que va faire l'équipage du voilier La Boudeuse ?", "c": ["Former des scientifiques à la prévention des risques écologiques", "Innover dans les moyens de lutter contre les pollutions fluviales", "Observer l'écosystème dans une région de grands fleuves", "Représerver le gouvernement français lors d'une rencontre"], "a": 2, "k": "Le voiler va mettre le cap en septembre prochain sur l'Amérique du sud et ses grands fleuves.", "_sources": ["test4#39"]}, {"t": "Suite à un accident chimique sur un site minier, les pouvoirs publics ont décidé d'obliger les sociétés minières à financer des programmes de recherche et à replanter les surfaces exploitées. Et de fait, les compagnies minières jouent très bien le jeu. Comme il serait bien naïf de penser que leurs dirigeants soient tout à coup devenus philanthropes. Il faut chercher la raison de cet intérêt ailleurs. Il se trouve qu'un scientifique, Anthony Van der Hent, a prouvé que des « super-plantes » avaient la faculté d'extraire du sol des métaux économiquement exploitables. C'est donc la possibilité d'allier la régénération de sites industriels à des assurances de gains financiers supplémentaires qui motive tant les industriels.\nD'après fruits et abeilles.", "q": "Sur quel point porte le scepticisme du journaliste ?", "c": ["La capacité des plantes à nettoyer les sols", "La rentabilité d'un nouveau système d'extraction", "Le résultat des recherches de M. Van der Hent", "Les préoccupations écologistes des industriels"], "a": 3, "k": "il serait bien naïf de penser que leurs dirigeants soient tout à coup devenus philanthropes", "_sources": ["test6#36"]}, {"t": "La biodiversité est souvent considérée comme un simple indicateur de la richesse du vivant. C'est méconnaître la complexité des interactions entre les espèces, les écosystèmes et les sociétés humaines. Si la biodiversité a une valeur intrinsèque, elle a aussi une valeur fonctionnelle, économique, sociale et culturelle. Aujourd'hui, on prend conscience de ces multiples dimensions et services. La préservation de la biodiversité est un enjeu majeur pour le développement durable et la lutte contre le changement climatique. Elle contribue à la régulation des cycles biogéochimiques, à la production de ressources naturelles, à la protection contre les risques naturels, à la santé humaine et animale, à la diversité culturelle et au bien-être des populations. Avec le temps, les logiques sectorielles ont cédé la place à des approches intégrées. Le dialogue entre les acteurs de la biodiversité et ceux des autres domaines devient un outil essentiel de la transition écologique.", "q": "Qu'affirme cet article au sujet de la biodiversité ?", "c": ["Elle représente seulement la diversité du vivant", "Elle dépend entièrement des activités humaines", "Elle fournit de nombreux bénéfices aux sociétés", "Elle s'oppose aux autres objectifs du développement"], "a": 2, "k": "elle a aussi une valeur fonctionnelle, économique, sociale et culturelle", "_sources": ["test18#38"]}], "devoirs": [{"t": "Dans l'intérêt de leurs peuples, les gouvernements doivent répondre à la fois à des enjeux de court et de long terme. Cet exercice est si difficile que l'on peut comprendre qu'une certaine cacophonie règne au niveau politique. Pourtant, face aux périls, le mot « ensemble » est une arme souvent victorieuse. Les stratégies de développement durable ont ainsi plus de chances de succès si elles sont harmonisées. Pour commencer, cherchons à nous rapprocher, en tant qu'Européens, pour mener de front la transition économique et la transition environnementale, afin de mettre un bémol au dérèglement climatique et à la perte de biodiversité.", "q": "Quel point de vue défend l'auteur ?", "c": ["L'écologie est avant tout une affaire d'État.", "La concertation est la clé d'une action réussie.", "Les mesures protectionnistes sont dépassées.", "L'influence des lobbies est à prendre en compte."], "a": 1, "k": "Les stratégies de développement durable ont ainsi plus de chances de succès si elles sont harmonisées", "_sources": ["test19#36"]}, {"t": "De plus en plus d'agriculteurs sont la cible d'accusations sévères de la part de leur voisinage ou d'organisations de défense des animaux. La plupart reconnaissent que la critique est légitime et que leurs modes d'exploitation sont perfectibles. Mais, ils sont mis en cause de manière massive et généralisée, ce qui revient à contester en bloc la leurs façons de travailler, leur utilité Sociale et leur existence. Les jeunes comme les vieux, les prospères comme les plus fragiles, ceux qui ont choisis l'agriculture biologique comme ceux qui sont restés en conventionnel : tous disent souffrir, à des degrés divers, de ce discrédit qui s'ajoute à leurs difficultés habituelles, financières notamment.", "q": "Que répondent les agriculteurs face aux critiques ?", "c": ["Ils défendent les pratiques traditionnelles.", "Ils éprouvent le sentiment d'être incompris.", "Ils réfutent les reproches qui leur sont faits.", "Ils sont fiers de leurs apports à l'économie."], "a": 1, "k": "tous disent souffrir, à des degrés divers, de ce discrédit", "_sources": ["test27#39"]}, {"t": "Le conseil suédois de la mode a annoncé ne plus vouloir cautionner les pratiques particulièrement polluantes de l'industrie textile et a donc décidé de ne plus organiser de semaine de la mode cette année dans sa forme traditionnelle. L'industrie suédoise de la mode étant en pleine expansion, il lui semble crucial d'encourager le développement de marques qui façonneront respectueusement le monde de demain. Il s'agit de cette façon de s'adapter aux nouvelles demandes, d'atteindre des objectifs écologiques et d'instaurer de nouveaux modèles de développement durable au sein de cette industrie.", "q": "Qu'a décidé le conseil suédois de la mode ?", "c": ["D'arrêter les présentations de collections.", "De diminuer la production de vêtements.", "De sensibiliser les jeunes consommateurs.", "De soutenir les entreprises responsables."], "a": 3, "k": "encourager le développement de marques qui façonneront respectueusement le monde de demain", "_sources": ["test32#39"]}, {"t": "En imposant de nouveaux comportements, la société civile a en partie réorganisé la distribution et amorcé une transition vers des modes de vie plus économiques et plus écologiques. Les classes moyennes des pays industrialisés ont largement adopté la « consommation collaborative », qui consiste à acheter moins, mais mieux, et entre soi : on achète d'occasion, on partage, on loue, on troque, on répare au sein d'ateliers participatifs, on échange des services sans argent. On se tourne aussi vers le local et le bio, pour connaître l'origine de ce que l'on mange et soutenir les petits producteurs.", "q": "Sur quoi s'appuie ce mode de consommation ?", "c": ["Des associations de consommateurs.", "Des techniques de production nouvelles.", "Des valeurs et des intentions claires.", "Une population citadine et fortunée."], "a": 2, "k": "consommation collaborative", "_sources": ["test33#38"]}, {"t": "VENT DE CONTROVERSE SUR LES ÉOLIENNES\nD'après un article récent, l'argument écologique serait le principal prétexte pour la construction de parcs d'éoliennes. Cependant, leur installation supposerait le bétonnage des sols, la construction de routes et de centrales permettant de combler à la production d'électricité en cas d'absence de vent. De plus, les éoliennes seraient à l'origine de désastres esthétiques, sonores et un danger pour la faune. Pourtant, les projets éoliens foisonnent. L'intérêt serait avant tout financier puisque les producteurs éoliens ne seraient pas à la recherche de zones venteuses mais plutôt de terrains peu chers dans des communes qui ont besoin d'accroître leurs revenus.", "q": "Comment l'auteur de l'article explique-t-il la multiplication des parcs éoliens ?", "c": ["Ils augmentent les ressources des municipalités.", "Ils contribuent à la protection de l'environnement.", "Ils garantissent la fourniture continue d'énergie.", "Ils participent à l'élimination des animaux nuisibles."], "a": 0, "k": "terrains peu chers dans des communes qui ont besoin d'accroître leurs revenus", "_sources": ["test33#39"]}, {"t": "Les sons [v] et [f] produits avec la lèvre inférieure qui va vers les dents supérieures seraient apparus suite à l'invention de l'agriculture au néolithique. Une étude récente semble confirmer la théorie élaborée il y a 50 ans par le linguiste Charles Hockett, selon laquelle les pratiques agricoles et l'alimentation influencent la manière dont on produit les sons. Cette étude fait débat dans la communauté scientifique. En effet, en linguistique, on a coutume d'expliquer les évolutions langagières par des changements culturels et non biologiques. En outre, cette recherche contredit l'hypothèse bien ancrée selon laquelle la diversité phonétique du langage humain existe depuis l'apparition de notre espèce.", "q": "Pourquoi cette étude est-elle critiquée ?", "c": ["Elle plagie la doctrine d'un célèbre linguiste.", "Elle remet en cause les théories habituelles.", "Elle soutient des hypothèses indémontrables.", "Elle utilise des outils scientifiques peu fiables"], "a": 1, "k": "cette recherche contredit l'hypothèse bien ancrée selon laquelle la diversité phonétique du langage humain existe depuis l'apparition de notre espèce.", "_sources": ["test35#38"]}]}, "Sante": {"cours": [{"t": "Ne pas assez dormir\nPlusieurs nuits de suite perturbent, tout le monde s'en rend compte. Ce qui est moins visible, c'est comment cela affecte notre santé. (…) Des scientifiques ont montré que le manque de sommeil modifiait l'intensité de l'activité de 700 gènes, parmi eux ceux liés au stress et à la lutte contre les maladies. Mais ils ne peuvent encore dire si ces modifications des gènes sont une réponse de court terme et sans danger à un sommeil de mauvaise qualité, un signe d'adaptation du corps à la privatisation de sommeil, ou un danger potentiel pour la santé.", "q": "Qu'est-ce que les scientifiques ont découvert concernant le manque de sommeil ?", "c": ["La gestion du stress est difficile", "La santé est mise en péril", "Le corps est moins réactif", "Le système génétique est affecté"], "a": 3, "k": "le manque de sommeil modifiait l'intensité de l'activité de 700 gènes", "_sources": ["test1#30"]}, {"t": "Méthode originale, la psychologie narrative propose les clés d'un nouvel art de vivre pour renoncer définitivement aux comportements susceptibles de brider notre propension au bonheur !\nCette pratique, loin de vanter le bienfait de vaines chimères, repose sur prise de conscience : celle que le monde tel que je le pense n'est pas tel que je le vis. Le travestissement de la réalité est incessant. « Il y a d'un côté la réalité des faits, et de l'autre, ma représentation », explique Yves-Alexandre Thalmann. Avec notre cerveau, nous passons notre temps à organiser les liens de cause à effet de façon à ce que ça prenne une signification à nos yeux. Or, selon le psychologue, la manière dont nous appréhendons les choses détermine davantage notre qualité de vie que les événements eux-mêmes. A ce titre, nos représentations mentales ont donc la capacité de nous procurer une vie plus agréable.", "q": "Comment la perception des évènements permet-elle d'accéder au bonheur ?", "c": ["Si on les prend en compte avec lucidité", "Si on les remodèle à travers l'imagination", "Si on modifie la façon dont on les perçoit", "Si on recherche leur signification profonde"], "a": 2, "k": "la manière dont nous appréhendons les choses détermine davantage notre qualité de vie que les événements eux-mêmes.", "_sources": ["test1#32"]}, {"t": "La démocratie semble, dans son principe, une façon séduisante d'organiser le pouvoir dans une société. Le peuple se gouverne lui-même ou par ses représentants et chacun, étant à la fois gouverné et gouvernant, apprend à tenir compte de l'intérêt général aussi bien que de ses intérêts individuels. Un tel apprentissage n'a pas été facile : il a fallu beaucoup d'approximations et d'échecs avant de parvenir aux démocraties actuelles. Face aux difficultés, ces constructions complexes et fragiles se sont montrées incroyablement résilientes, peut-être parce que leur légitimité s'enracine au plus profond des « passions du cœur de l'homme ». «Structurellement inachevée», la démocratie surprend par sa capacité à se transformer tout en restant fidèle à son ambition première. En dépit des critiques et des attaques, elle a su évoluer au gré des siècles et affronte aujourd'hui de nouveaux défis. Polymorphe, elle diffère également selon les pays, chaque expérience nationale ou régionale étant le fruit d'une histoire qui dépend avant tout des peuples qui l'écrivent.", "q": "Quelle est l'idée principale de cet article ?", "c": ["L'idée de démocratie est aujourd'hui plus controversée qu'avant.", "La démocratie est affaiblie par la diversité de ses formes.", "La mise en place de la démocratie résulte d'un long processus.", "Les fondements théoriques de la démocratie sont utopiques."], "a": 2, "k": "il a fallu beaucoup d'approximations et d'échecs avant de parvenir aux démocraties actuelles.", "_sources": ["test11#34"]}, {"t": "On sait depuis longtemps que la musique a des effets bénéfiques sur le cerveau et le corps. Mais les recherches récentes ont permis de mieux comprendre ces mécanismes et de les exploiter à des fins thérapeutiques. La musicothérapie est une discipline qui utilise la musique comme outil de soin, de prévention ou de rééducation. Elle s'adresse à des personnes souffrant de troubles physiques, psychiques ou sociaux. Par exemple, la musique peut aider à soulager la douleur, à stimuler la mémoire, à réduire le stress ou à favoriser la communication. D'ailleurs, de nombreux hôpitaux, maisons de retraite ou centres spécialisés proposent des séances de musicothérapie à leurs patients. La musique est donc bien plus qu'un divertissement : c'est un véritable médicament.", "q": "Quel objectif poursuit la musicothérapie ?", "c": ["Former les personnes à la pratique musicale", "Améliorer la qualité de vie des personnes", "Développer le goût artistique des personnes", "Analyser les émotions suscitées par la musique"], "a": 1, "k": "utilise la musique comme outil de soin", "_sources": ["test18#33"]}, {"t": "Le stress est l'ennemi numéro 1 du bien-être. Quand il prend le dessus, on perd sa motivation et on manque continuellement d'énergie.\nLes médecins sont formels : le stress est souvent à l'origine de dysfonctionnements physiques. C'est aussi une cause directe du vieillissement prématuré. Une personne stressée se replie sur elle-même et renonce progressivement à profiter de certaines de ses capacités mentales. Voici comment canaliser ce stress pour le transformer en énergie positive : apprendre à bien respirer, ne plus gaspiller ses forces à réfléchir aux actions du passé, changer les mauvaises habitudes et finalement, savoir ménager au quotidien.", "q": "Qu'apprend-on sur le stress dans cet article ?", "c": ["C'est un handicap qui peut se transformer en atout.", "Il décuple l'ensemble des aptitudes cérébrales.", "Il est officiellement reconnu comme une maladie.", "Ses effets touchent plus particulièrement les seniors."], "a": 0, "k": "canaliser ce stress pour le transformer en énergie positive", "_sources": ["test21#33"]}, {"t": "De plus en plus de scientifiques s'intéressent au fonctionnement du cerveau des tout-petits. En effet, comprendre le développement normal du cerveau permettra d'aider les bébés touchés par des troubles. Au-delà, l'ambition est de découvrir les racines de l'intelligence humaine : pourquoi l'homme, à la différence des autres espèces animales, peut parler, compter et même envoyer des fusées dans l'espace. Pendant longtemps, ces capacités uniques ont été attribuées à la taille de notre encéphale. Une idée finalement battue en brèche : le cerveau du bébé est bien moins gros que le nôtre ou que celui de nombreux animaux. Et pourtant, les tout-petits apprennent beaucoup de choses, bien plus vite et bien plus facilement que n'importe quel animal ou même que les adultes.", "q": "Qu'apprend-on sur le cerveau humain ?", "c": ["Sa structure est identique chez l'homme et l'animal.", "Sa taille influe sur les compétences cognitives.", "Son développement est ralenti les premiers mois.", "Son fonctionnement est encore mystérieux."], "a": 3, "k": "les tout-petits apprennent beaucoup de choses, bien plus vite et bien plus facilement", "_sources": ["test24#34", "test26#34"]}, {"t": "Les chutes d'attention et le relâchement musculaire signalent un besoin des plus naturels : dormir. Interrompe sa journée pour ce moment réparateur, c'est compenser les nuits trop courtes et éviter que ce manque de sommeil ne grignote la santé physique et mentale. Mais pourquoi ce remède ancestral est-il à ce point sous-estimé ? En fait, la sieste n'est pas tant incomprise que redoutée. En effet, travailler exige de répondre à des impératifs extérieurs parfois au détriment des besoins intérieurs ou physiologiques et faire la sieste devient une transgression. Rituel de l'été, la petite somme reste inacceptable au travail où le maitre mot est la productivité et pourtant, en aidant à rétablir l'équilibre physique, ne pourrait-il pas y contribuer ?", "q": "Que suggère l'auteur au sujet de la sieste ?", "c": ["Elle devrait être réservée aux périodes de congés.", "Elle est préconisée par la médecine.", "Elle peine d se répandre en milieu professionnel.", "Elle serait néfaste pour le rendement."], "a": 2, "k": "la petite somme reste inacceptable au travail", "_sources": ["test26#31"]}, {"t": "Selon une ancienne théorie sur la différence entre cerveau gauche et cerveau droit, les individus pourraient être classés selon leur dominance hémisphérique. Les « plus à gauche » seraient ainsi plus logiques et analytiques tandis que les « plus à droite » seraient créatifs et intuitifs. S'il existe bel et bien une forme de dominance hémisphérique, elle dépend non pas de la personne, mais du type d'activité en cours. Par exemple, chez 99% des droitiers et plus de 70% des gauchers, le langage fait appel le plus souvent à des neurones situés dans l'hémisphère gauche.", "q": "Qu'apprend-on sur le cerveau ?", "c": ["Il est stimulé en phase d'apprentissage du langage.", "À chaque activité correspond une région précise.", "Les neurones sont concentrés dans quelques zones.", "Son développement est lié au caractère d'un individu."], "a": 1, "k": "elle dépend non pas de la personne, mais du type d'activité en cours", "_sources": ["test29#30", "test38#30"]}, {"t": "Ne pas assez dormir plusieurs nuits de suite perturbe, tout le monde s'en rend compte. Ce qui est moins visible, c'est comment cela affecte notre santé. Des scientifiques ont montré que le manque de sommeil modifiait l'intensité de l'activité de plus de 700 gènes, parmi eux ceux liés au stress et à la lutte contre les maladies. Mais ils ne peuvent encore dire si ces modifications des gènes sont une réponse de court terme et sans danger à un sommeil de mauvaise qualité, un signe d'adaptation du corps à la privation de sommeil, ou un danger potentiel pour la santé.", "q": "Qu'est-ce que les scientifiques ont découvert concernant le manque de sommeil ?", "c": ["La gestion du stress est difficile.", "La santé est mise en péril.", "Le corps est moins réactif.", "Le système génétique est affecté."], "a": 3, "k": "le manque de sommeil modifiait l'intensité de l'activité de plus de 700 gènes", "_sources": ["test30#30"]}, {"t": "C'est un étonnant phénomène, appelé couronne de timidité. Le feuillage de certains arbres n'entre jamais en contact avec celui des autres, créant des frontières entre les feuilles et des chemins de lumière. Dans certaines forêts, en observant les cimes des arbres, un labyrinthe de lumière se dessine entre les feuillages, comme si les arbres laissaient volontairement une barrière polie d'une trentaine de centimètres pour éviter d'entrer en contact. Cet espace laisserait filtrer la lumière, essentielle à la photosynthèse et à la survie des sous-bois et permettrait également d'éviter des contagions, qu'il s'agisse de maladies ou d'insectes non volants. Une même espèce d'arbres s'entendrait donc pour créer un environnement propice à la survie du groupe dans son ensemble.", "q": "Que constate l'auteur du texte à propos des arbres ?", "c": ["Ils sont aptes à coloniser un territoire vierge.", "Ils sont capables de communiquer entre eux.", "Ils sont en compétition pour leur croissance.", "Ils sont susceptibles de ressentir des émotions."], "a": 1, "k": "Une même espèce d'arbres s'entendrait donc pour créer un environnement propice à la survie du groupe dans son ensemble.", "_sources": ["test35#33"]}, {"t": "Quelques astuces pour optimiser les révisions.\n\nLors des révisions pour un examen, l'acquisition des connaissances s'opère plus facilement en jonglant avec la mémoire visuelle et la mémoire auditive. Comme la part des deux peut varier d'une personne à l'autre, c'est à chacun de mesurer la méthode qui lui paraît la plus efficace. Il est inutile d'intégrer des notions par cœur : mieux vaut se détacher des termes employés, pour s'approprier les connaissances et les exprimer différemment. Enfin, une bonne hygiène de vie et des activités variées constituent un gage de réussite et permettent de limiter le stress : il est indispensable de s'aérer l'esprit et de faire des pauses.", "q": "D'après cette personne, que faut-il éviter de faire lorsque l'on révise ?", "c": ["Mémoriser des concepts sans les comprendre.", "Multiplier les méthodes d'apprentissage.", "S'autoriser des pauses fréquemment.", "Se disperser dans de nombreuses activités."], "a": 0, "k": "Il est inutile d'intégrer des notions par cœur : mieux vaut se détacher des termes employés, pour s'approprier les connaissances et les exprimer différemment.", "_sources": ["test36#30"]}, {"t": "La créativité instinctive, qui serait naturelle, est souvent opposée à la créativité plus rationalisée, cérébrale, éduquée, notamment en musique. Les musiciens ont tendance à surestimer la première, avec l'idée que moins on en sait, mieux c'est. Comme si la connaissance risquait de mettre des œillères et d'enfermer la créativité dans un cadre, à la manière d'un adulte qui s'autoriserait moins à imaginer des choses fantaisistes qu'un enfant. Ce n'est pas impossible, mais la créativité est la capacité du cerveau à faire des associations mentales originales et cohérentes. Une éducation musicale, associée à l'intelligence, peut faciliter ces associations puisqu'elle nourrit le cerveau d'expériences, notamment esthétiques pour les artistes, et d'idées que l'on peut ensuite lier.", "q": "Que souligne ce journaliste à propos du processus de création musicale ?", "c": ["Il mobilise une zone spécifique du cerveau.", "Il s'avère plus spontané chez les enfants.", "Il s'enrichit des connaissances théoriques.", "Il semble réservé aux esprits imaginatifs."], "a": 2, "k": "Une éducation musicale, associée à l'intelligence, peut faciliter ces associations", "_sources": ["test21#39"]}, {"t": "Le stress, la fatigue, les troubles du sommeil : voilà ce qui menace notre organisme à la suite d'une exposition excessive à une lumière artificielle. Au contraire, la lumière naturelle influence notre comportement et régit nos processus physiologiques, notre efficacité au quotidien, nos humeurs, jouant donc un rôle fondamental sur notre métabolisme. Ainsi, par une diminution des effets de fatigue, de stress et par un accroissement de la concentration, nous sommes alors plus réceptifs et attentifs aux différents stimuli que notre organisme pourra plus facilement assimiler. En entreprise, un aménagement adéquat des bureaux, de préférence dans un environnement préservant au maximum la lumière naturelle, est donc un atout pour nos performances journalières.", "q": "Sur quoi insiste l'auteur de cet article ?", "c": ["L'importance des agencements intérieurs", "L'insuffisance des plages de repos", "Les bienfaits d'un éclairage électrique optimal", "Les effets du surmenage sur la santé"], "a": 0, "k": "un aménagement adéquat des bureaux, de préférence dans un environnement préservant au maximum la lumière naturelle", "_sources": ["test22#38"]}, {"t": "Il est rare que les journalistes de notre mensuel ou moi-même rentrons de reportage en renonçant à rédiger un article. La plupart du temps, les découvertes que nous faisons sont comme de grands bols d'air : elles annihilent tout défaitisme, font disparaitre la fatalité ambiante et ouvrent de nouveaux horizons. Nous rencontrons des hommes et des femmes qui nous expliquent leurs envies, leurs rêves, leur utopie, et comment ils s'y prennent pour, à leur échelle, faire évoluer le monde. C'est simple, c'est lent, c'est « proprement humain ». Il est tellement jouissif de pouvoir se dire que nous allons pouvoir partager tous ces « petits riens » avec nos abonnés !", "q": "Quel est le parti pris de ces journalistes ?", "c": ["Être au plus près de l'actualité.", "Présenter des histoires positives.", "Proposer des anecdotes amusantes.", "Recenser des dérives de la société."], "a": 1, "k": "elles annihilent tout défaitisme, font disparaitre la fatalité", "_sources": ["test23#36", "test24#36"]}, {"t": "Les chutes d'attention et le relâchement musculaire signalent un besoin des plus naturels : dormir. Interrompre sa journée pour ce moment réparateur, c'est compenser les nuits trop courtes et éviter que ce manque de sommeil ne grignote la santé physique et mentale. Mais pourquoi ce remède ancestral est-il à ce point sous-estimé ? En fait, la sieste n'est pas tant incomprise que redoutée. En effet, travailler exige de répondre à des impératifs extérieurs parfois au détriment des besoins intérieurs ou physiologiques et faire la sieste devient une transgression. Rituel de l'été, le petit somme reste inacceptable au travail où le maître mot est la productivité et pourtant, en aidant à rétablir l'équilibre physique, ne pourrait-il pas y contribuer ?", "q": "Que suggère l'auteur au sujet de la sieste ?", "c": ["Elle devrait être réservée aux périodes de congés.", "Elle est préconisée par la médecine.", "Elle peine à se répandre en milieu professionnel.", "Elle serait néfaste pour le rendement."], "a": 2, "k": "le petit somme reste inacceptable au travail", "_sources": ["test28#36"]}, {"t": "Il est rare que les journalistes de notre mensuel ou moi-même rentrions et de reportage en renonçant à rédiger un article. La plupart du temps, les découvertes que nous faisons sont comme de grands bols d'air : elles annihilent tout défaitisme, font disparaître la fatalité ambiante et ouvrent de nouveaux horizons. Nous rencontrons des hommes et des femmes qui nous expliquent leurs envies, leurs rêves, leur utopie, et comment ils s'y prennent pour, à leur échelle, faire évoluer le monde. C'est simple, c'est lent, c'est « proprement humain ». Il est tellement jouissif de pouvoir se dire que nous allons pouvoir partager tous ces « petits riens » avec nos abonnés !", "q": "Quel est le parti pris de ces journalistes ?", "c": ["Être au plus près de l'actualité.", "Présenter des histoires positives.", "Proposer des anecdotes amusantes.", "Recenser les dérives de la société."], "a": 1, "k": "elles annihilent tout défaitisme", "_sources": ["test33#36"]}, {"t": "La créativité instinctive, qui serait naturelle, est souvent opposée à la créativité plus rationalisée, cérébrale éduquée, notamment en musique. Les musiciens ont tendance à surestimer la première, avec l'idée que moins on en sait, mieux c'est. Comme si la connaissance risquait de mettre des œillères et d'enfermer la créativité dans un cadre, à la manière d'un adulte qui s'autoriserait moins à imaginer des choses fantaisistes qu'on enfant. Ce n'est pas impossible, mais la créativité est la capacité du cerveau à faire des associations mentales originales et cohérentes. Une éducation musicale, associée à l'intelligence, peut faciliter ces associations puisqu'elle nourrit le cerveau d'expériences, notamment esthétiques pour les artistes, et d'idées que l'on peut ensuite lier.", "q": "Que souligne ce journaliste à propos du processus de création musicale ?", "c": ["Il mobilise une zone spécifique du cerveau.", "Il s'avère plus spontané chez les enfants.", "Il s'enrichit des connaissances théoriques.", "Il semble réservé aux esprits imaginatifs."], "a": 2, "k": "Une éducation musicale, associée à l'intelligence, peut faciliter ces associations puisqu'elle nourrit le cerveau d'expériences", "_sources": ["test40#39"]}], "devoirs": []}, "Technologie": {"cours": [{"t": "Il faut se rendre à l'évidence : le « jour » n'est plus l'unité de temps d'un journal. Un quotidien papier ne peut pas rivaliser avec la vitesse à laquelle les sites web, les blogs, les réseaux sociaux, les journaux en ligne, les radios et télés, les « news » des grands serveurs diffusent les nouvelles du jour. Aussi, au moment où il est en kiosques, se condamne-t-il à apparaitre comme « le journal de la veille » - perdant progressivement ses lecteurs qui, bombardés de scoops tous azimuts, sont déçus de n'y trouver que ce qu'ils savent déjà.", "q": "Quelle est la position de l'auteur de l'article ?", "c": ["Il conteste la fiabilité des sources d'Internet", "Il critique la surabondance de l'information", "Il dénonce la médiocrité de la presse écrite", "Il doute de l'intérêt des médias traditionnels"], "a": 3, "k": "se condamne-t-il à apparaitre comme", "_sources": ["test2#35"]}, {"t": "Le jeunisme n'est certes pas un concept nouveau.\nIl y a toujours eu des adultes pour croire qu'ils pouvaient jouer en douce dans la cour des « jeunes ». On s'en moquait alors et ils ne trompaient personne, à commencer par eux-mêmes. La nouvelle donne est différente : les intéressés ne cherchent même pas à « faire jeune ». Ils le sont. Sans effort apparent ni ridicule particulier. Finies, les demandes humbles et ringardes aux enfants d'internet, pour se faire expliquer telle ou telle subtilité d'internet. Tout va bien, merci, les ex-vieux ont appris à se servir de leurs joujoux technos, tous seuls comme des grands ! Ils se tiennent d'ailleurs parfois aussi mal que des ados, envoyant des sms à table ou bondissant à la moindre sonnerie.", "q": "Dans quel sens évoluent les adultes d'après l'auteur?", "c": ["Ils résistent aux comportements de la société du tout numérique.", "Ils se remettent à niveau pour utiliser les téléphones portables.", "Ils se sentent désorientés face aux outils technologiques.", "Ils sont parfaitement à l'aise avec les derniers outils multimédias."], "a": 3, "k": "les ex-vieux ont appris à se servir de leurs joujoux technos, tous seuls comme des grands", "_sources": ["test10#31"]}, {"t": "Facebook et Twitter sont omniprésents au collège.\nNous pourrions détourner les yeux en prétendant qu'ils n'ont rien à voir avec les compétences et savoirs acquis à l'école. Mais, ces messageries instantanées doivent être prises au sérieux par les enseignants, au sens où elles ne sont pas une mode mais un mode de communication qui conditionne les relations sociales. Les réseaux sociaux appartiennent déjà à la cité et seront partie prenante de notre vie demain. Ainsi, des pétitions se signent sur Internet, les renseignements sur autrui se prennent aussi sur la Toile. Il s'agit alors pour l'enseignant d'apprendre aux jeunes des comportements responsables dans l'usage des modes de communication tels que Facebook et autres Twitter.", "q": "Que pense l'auteur des réseaux sociaux ?", "c": ["Il est indispensable de savoir s'en servir correctement", "Il faut éviter de les utiliser dans le cadre scolaire", "Ils représentent un danger pour les libertés individuelles", "Ils sont incontournables en tant qu'outils d'enseignement"], "a": 0, "k": "d'apprendre aux jeunes des comportements responsables dans l'usage des modes de communication", "_sources": ["test14#32"]}, {"t": "La génération Y\nCe sont les 20-30 ans qui ont grandi avec les nouvelles technologies. Phénomène de société, ils sont ultra-connectés et surfent sur les réseaux sociaux, disposant de compétences que ne détenaient pas leurs ainés. Une autre caractéristique les rassemble, la précarité au travail : 25% des jeunes sont au chômage, d'autres ont des emplois temporaires. Conséquence : on les présente comme sans illusions, peu impliqués au travail, individualistes et réfractaires à l'autorité. Pourtant, cette précarité aurait du bon : elle pousserait la génération Y à se prendre en charge plus que ses ainés, en créant ses propres entreprises.", "q": "D'après ce texte, de quelle qualité serait dotée la génération Y ?", "c": ["Un esprit créatif dans le secteur des technologies Internet.", "Une grande autonomie dans le domaine professionnel.", "Une aptitude étonnante à savoir se mettre en avant.", "Un esprit de solidarité avec les personnes sans emploi."], "a": 1, "k": "cette précarité aurait du bon : elle pousserait la génération Y à se prendre en charge", "_sources": ["test30#35"]}, {"t": "La Chine est championne du monde des transactions par mobile. Désormais, les Chinois privilégient le paiement par mobile pour la moindre course « même pour acheter une bouteille d'eau minérale » comme l'explique une kiosquière à Pékin.\nLe paiement mobile s'est invité partout dans l'économie, même dans les coutumes les plus ancrées. Aux anniversaires ou lors des festivités du nouvel an, on s'envoie des enveloppes remplies de pièces rouges dématérialisées, traditionnellement remplies de pièces ou de billets de banque. Mais l'utilisation du liquide perdure, notamment par les plus âgés, ce qui alimente le débat sur les laissés-pour-compte des avancées technologiques. Au Parc Zhongshan l'entrée de 3 yuans se fait uniquement en espèces. Une bonne nouvelle pour les nombreuses personnes âgées qui fréquentent le jardin.", "q": "Qu'apprend-on sur les nouveaux moyens de paiement en Chine ?", "c": ["Ils créent un climat de méfiance envers la technologie.", "Ils entraînent la disparition de pratiques traditionnelles.", "Ils facilitent la vie quotidienne des personnes âgées.", "Ils sont à l'origine de l'expansion économique du pays."], "a": 1, "k": "le paiement mobile s'est invité partout dans l'économie, même dans les coutumes les plus ancrées", "_sources": ["test33#33"]}, {"t": "Un vingt-sixième album de Françoise Hardy, La pluie sans parapluie, est forcément un événement. On sait que le public qui achète encore des disques passe volontiers à la caisse pour montrer sa fidélité, ou simplement son envie de vibrer avec cette voix unique et si familière, avec laquelle elle semble d'ailleurs plus en confiance que jamais. Elle module, appuie, interprète, joue avec souplesse de son phrasé. Alors que les aficionados se contenteraient juste de ce gain unique et révéré. C'est un album pour ceux qui ont le temps, qui ne consomment pas la musique en tant qu'application sonore de la vie actuelle. Il faut se retrancher pour en saisir la saveur et la gouter. Un disque comme autrefois, avec un son soigné et de l'émotion. Mais surtout une élégance comme on n'en fait plus.", "q": "Selon le journaliste, quel type de public pourrait s'intéresser au dernier album de F. Hardy ?", "c": ["Les acheteurs opposés au téléchargement illégal", "Les amateurs de subtilité et de raffinement musical", "Les admirateurs inconditionnels de l'interprète", "Les curieux en mal de musique expérimentale"], "a": 1, "k": "C'est un album pour ceux qui ont le temps, qui ne consomment pas la musique en tant qu'application sonore de la vie actuelle.", "_sources": ["test2#36"]}, {"t": "PRÉVOIR LE TEMPS\nL'énorme masse de données météorologiques collectées tous les jours par les satellites est traitée par les plus gros ordinateurs du monde. Le résultat de ces calculs est fourni sous forme de cartes des vents, des pluies ou des températures. Ces cartes peuvent être animées par l'ordinateur, ce qui donne l'impression de voir se dérouler en accéléré les mouvements de l'atmosphère.\nLes ordinateurs font des calculs que le météorologue doit compléter. Au vu des informations, il prépare un scénario sur le temps le plus probable dans un, deux ou trois, voire dix jours dans certains centres.", "q": "En quoi consiste la profession décrite ?", "c": ["Concevoir des prévisions à court terme.", "Élaborer des programmes de calcul.", "Finaliser des animations visuelles.", "Synthétiser les informations des satellites."], "a": 0, "k": "il prépare un scénario sur le temps le plus probable dans un, deux ou trois, voire dix jours", "_sources": ["test7#38"]}, {"t": "Une époque inimaginable pour un enfant d'aujourd'hui : ce temps où les parents n'avaient pas Internet et leur progéniture, pas de portable. Les parents les plus au fait s'informaient sur le monde une, voire deux fois par jour. Maintenant nous savons qu'il va mal tout le temps. Chaque seconde, une mauvaise nouvelle tombe de l'autre bout du globe dans notre smartphone. En quelques années, nous avons basculé dans un nouveau monde. Plus grand, immense même, tissé de rencontres improbables et d'opportunités fabuleuses, mais aussi surpeuplé de contrées hostiles et de tribus numériques agressives. Notre nouvelle vie est absolument excitante, vertigineuse même.", "q": "Que constate ce journaliste ?", "c": ["La dégradation des relations sociales à cause d'internet.", "La multiplication des sources d'information.", "La nocivité des écrans sur le développement des enfants.", "La recrudescence d'informations mensongères."], "a": 1, "k": "Chaque seconde, une mauvaise nouvelle tombe de l'autre bout du globe", "_sources": ["test8#38"]}, {"t": "J'ai la naïveté de penser qu'un peu d'imagination n'est pas totalement absurde lorsqu'on écrit des romans. Or, à mon avis, l'imagination est le fruit de deux choses fondamentales : l'ennui, à qui on donne trop souvent un mauvais rôle, et l'observation, qui n'est pas seulement un terme médical. Il s'avère que le téléphone intelligent, ce charmant objet, si nécessaire, si vital, fait peu à peu disparaître ces deux activités de fainéants du cerveau humain que sont l'ennui et l'observation. Pourquoi s'ennuyer quand on peut regarder des vidéos de chaton ou des notifications Facebook de la plus haute importance dans une salle d'attente ? en somme, grâce à ce téléphone intelligent, vous pouvez regarder en permanence le résultat de l'imagination brillante des autres (au détriment de la vôtre).", "q": "Quelle est l'attitude de l'auteur vis-à-vis du téléphone portable ?", "c": ["Il reconnaît ses aspects pratiques", "Il remet en cause ses bienfaits", "Il s'inquiète de son usage abusif", "Il s'émerveille de sa technologie"], "a": 2, "k": "fait peu à peu disparaître ces deux activités de fainéants du cerveau humain", "_sources": ["test17#39"]}, {"t": "Le sénat a adopté une proposition de loi visant à lutter contre l'exposition précoce des enfants aux écrans. Elle prévoit qu'un message avertissant des dangers des écrans chez les enfants de moins de 3 ans devra apparaître sur les emballages des outils et jeux numériques. Cette initiative salutaire n'a rien d'un gadget : de nombreux psychologues et pédopsychiatres considèrent que l'exposition aux écrans avant 3 ans peut être nocive pour un cerveau en construction, notamment parce qu'elle parasite l'interaction avec autrui. Verra-t-on bientôt un autocollant « à utiliser avec modération » sur les consoles de jeu et les tablettes ?", "q": "D'après cet article, quel l'objectif de cette loi ?", "c": ["Encadrer le marché du numérique.", "Prévenir l'addiction aux jeux vidéo.", "Protéger les enfants des ondes.", "Restreindre l'impact des écrans."], "a": 3, "k": "lutter contre l'exposition précoce des enfants aux écrans", "_sources": ["test21#36"]}, {"t": "La révolution numérique aura, selon le philosophe Michel Serres, des effets au moins aussi considérables qu'en leur temps, l'invention de l'écriture, puis celle de l'imprimerie. Les notions de temps et d'espace en sont transformées et les façons d'accéder à la connaissance profondément modifiées. À cet égard, chaque grande rupture dans l'histoire de l'humanité conduit à priver l'homme de facultés (« il perd »), mais chaque révolution lui en apporte de nouvelles (« il gagne »). Pour chaque perte d'une part de mémoire et de capacité de traitement de l'information liée à la diffusion des technologies numériques, l'homme gagne une possibilité nouvelle de mise en relation (entre les individus et entre les savoirs) ainsi qu'une faculté décuplée d'invention et de création.", "q": "Sur quoi Michel Serres attire-t-il l'attention ?", "c": ["L'évolution des aptitudes mentales.", "La mondialisation de la recherche scientifique.", "La transformation des savoirs fondamentaux.", "Le maintien du patrimoine culturel."], "a": 0, "k": "l'homme gagne une possibilité nouvelle de mise en relation", "_sources": ["test24#39"]}, {"t": "Peu à peu, les robots entrent dans notre vie de tous les jours, que ce soit sous forme de jouets pour enfants, pour faire le ménage, pour tenir compagnie aux personnes souffrant d'isolement ou pour combattre certaines pathologies. Cette problématique a interpellé des scientifiques qui se sont interrogés sur la perception que nous avions des rebots. Peut-on s'y attacher et en faire des compagnons ? Ou les considérons-nous comme de vulgaires objets ? Leur étude, plaçant robots puis humains en difficulté, montre que ces machines ne nous laissent pas insensibles, mais l'émotion semble malgré tout plus intense lorsqu'un humain rencontre un obstacle.", "q": "Que cherchent à faire ces scientifiques ?", "c": ["À établir un lien entre robotique et individualisme.", "À évaluer l'action des robots dans la lutte contre la solitude.", "À répéter les dérivés issus de la robotique dans le quotidien.", "À vérifier l'empathie ressentie envers les robots."], "a": 3, "k": "se sont interrogés sur la perception que nous avions des robots", "_sources": ["test25#39"]}, {"t": "Une entreprise japonaise a présenté une étude sur une gigantesque structure d'habitation immergée. Futuriste ? Oui, car certaines technologies restent à mettre au point. Mais la recherche a été poussée assez loin et d'après ses concepteurs, une telle cité de la mer pourrait devenir envisageable à partir de 2030. Une vaste sphère de 500 mètres de diamètre abriterait des appartements, des hôtels, des bureaux et des laboratoires pour 4000 personnes. Le projet ne consiste pas en un espace aménagé en surface. Il s'agit au contraire d'exploiter le potentiel de l'océan profond et d'assurer la pérennité de l'espèce humaine. L'océan est une source d'énergie, d'eau douce et de nourriture. C'est aussi un très bon endroit pour retraiter notre production de dioxyde de carbone.", "q": "Quel est l'objectif de ce projet ?", "c": ["Concevoir des lieux de vie alternatifs.", "Étudier de nouvelles technologies.", "Proposer des activités futuristes.", "Protéger des espaces marins menacés."], "a": 0, "k": "d'assurer la pérennité de l'espèce humaine", "_sources": ["test26#38"]}, {"t": "Les champs de mise en oeuvre des robots sont légion : production, services, gestion des données, vie urbaine, sécurité, loisirs, domotique... Leur arrivée donne lieu à des transformations inédites. Si l'automatisation a fait disparaitre des emplois, elle en a aussi créé d'autres. Surtout, elle a bouleversé le fonctionnement de l'entreprise, faisant peser une forte pression sur les salariés, tenus de maintenir la continuité de la production dans des processus toujours plus complexes.", "q": "Quelle est la conséquence de la robotisation dans le monde professionnel ?", "c": ["Elle a accru la compétitivité industrielle.", "Elle a amélioré les conditions de travail.", "Elle a enrayé la hausse du chômage.", "Elle a modifié l'organisation du travail."], "a": 3, "k": "elle a bouleversé le fonctionnement de l'entreprise", "_sources": ["test31#36"]}, {"t": "De nombreuses théories du complot circulent sur Internet. Plutôt que de purement les contredire, la première saison de « Mécaniques du complotisme » - nouveau podcast de France Culture - en décortique l'origine et les ramifications. Le présentateur, Roman Bornstein, nous explique : « Nous avons voulu autopsier un délire collectif et montrer qu'il ne s'agissait pas simplement de délires d'adolescents passionnés d'informatique dans une cave. Le complotisme n'est jamais innocent et son histoire explique beaucoup de notre époque ». En s'appuyant sur un site Internet de surveillance des théories du complot, il raconte leur propagation, dans un discours efficace, mené à la manière d'un roman d'espionnage.", "q": "Quel est le but de cette émission sur les théories du complot ?", "c": ["Elle cherche à les identifier sur Internet", "Elle en explique les origines historiques", "Elle interviewe les personnes qui les propagent", "Elle montre leur importance chez les adolescents"], "a": 1, "k": "en décortique l'origine et les ramifications", "_sources": ["test34#36"]}, {"t": "Les champs de mise en œuvre des robots sont légion : production, services, gestion des données, vie urbaine, sécurité, loisirs, domotique... Leur arrivée donne lieu à des transformations inédites et à des problématiques nouvelles, souvent mythifiées. Un univers professionnel où tout serait régi par des robots ? Voilà qui est encore loin de la réalité. Si l'automatisation a fait disparaître des emplois, elle en a aussi créé d'autres. Surtout, elle a bouleversé le fonctionnement de l'entreprise, faisant peser une forte pression sur les salariés, tenus de maintenir la continuité de la production dans des processus toujours plus complexes.", "q": "Quelle est la conséquence de la robotisation dans le monde professionnel ?", "c": ["Elle a accru la compétitivité industrielle.", "Elle a amélioré les conditions de travail.", "Elle a enrayé la hausse du chômage.", "Elle a modifié l'organisation du travail."], "a": 3, "k": "elle a bouleversé le fonctionnement de l'entreprise", "_sources": ["test35#36"]}, {"t": "J'ai la naïveté de penser qu'un peu d'imagination n'est pas totalement absurde lorsqu'on écrit des romans. Or, à mon sens, l'imagination est le fruit de deux choses fondamentales : l'ennui, à qui on donne trop souvent un mauvais rôle, et l'observation, qui n'est pas seulement un terme médical. Il s'avère que le téléphone intelligent, ce charmant objet, si nécessaire, si vital, fait peu à peu disparaître ces deux activités de fainéants du cerveau humain que sont l'ennui et l'observation. Pourquoi s'ennuyer quand on peut regarder des vidéos de chaton ou des notifications Facebook de la plus haute importance dans une salle d'attente ? En somme, grâce à ce téléphone intelligent, vous pouvez regarder en permanence le résultat de l'imagination brillante des autres (au détriment de la vôtre).", "q": "Quelle est l'attitude de l'auteur vis-à-vis du téléphone intelligent ?", "c": ["Il reconnaît ses aspects pratiques.", "Il remet en cause ses bienfaits.", "Il s'inquiète de son usage abusif.", "Il s'émerveille de sa technologie."], "a": 1, "k": "fait peu à peu disparaître ces deux activités de fainéants du cerveau humain que sont l'ennui et l'observation.", "_sources": ["test35#39"]}, {"t": "Le Sénat a adopté une proposition de loi visant à lutter contre l'exposition précoce des enfants aux écrans. Elle prévoit qu'un message avertissant des dangers des écrans chez les enfants de moins de 3 ans devra apparaître sur les emballages des outils et jeux numériques. Cette initiative salutaire n'a rien d'un gadget : de nombreux psychologues et pédopsychiatres ne considèrent que l'exposition aux écrans avant 3 ans peut être nocive pour un cerveau en construction, notamment parce qu'elle parasite l'interaction avec autrui. Verra-t-on bientôt un autocollant « à utiliser avec modération » ? Sur les consoles de jeu et les tablettes ?", "q": "D'après cet article, quel est l'objectif de cette loi ?", "c": ["Encadrer le marché du numérique.", "Prévenir l'addiction aux jeux vidéo.", "Protéger les enfants des ondes.", "Restreindre l'impact des écrans."], "a": 3, "k": "lutter contre l'exposition précoce des enfants aux écrans.", "_sources": ["test40#36"]}], "devoirs": []}}</script>

var ZOOM_MIN = 60, ZOOM_MAX = 200, curZoom = 100;
function applyZoom(v){
  v = parseInt(v,10); if(isNaN(v)) v = 100;
  v = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, v));
  curZoom = v;
  var stage = document.getElementById("zoomStage");
  if(stage) stage.style.transform = "scale(" + (v/100) + ")";
  var val = document.getElementById("zoomVal");
  if(val) val.textContent = v + "%";
  var r = document.getElementById("zoomRange");
  if(r && parseInt(r.value,10) !== v) r.value = v;
}
function zoomStep(d){ applyZoom(curZoom + d); }
var PROGRESS_KEY = "tcf_ce_nclc7_all9";
function loadProgress(){
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}") || {}; }
  catch(e){ return {}; }
}
function saveProgress(lv, idx){
  try {
    var p = loadProgress();
    p[lv] = idx;
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
  } catch(e){}
}
function getSavedIndex(lv){
  var p = loadProgress();
  var v = p[lv];
  if (typeof v === "number" && v >= 0 && QQ && v < QQ.length) return v;
  return 0;
}


function esc(s) {
  var t = String(s);
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function hlText(text, key) {
  var h = esc(text).replace(/\n/g,"<br>");
  if (!key) return h;
  try {
    var ek = esc(key);
    var idx = h.toLowerCase().indexOf(ek.toLowerCase());
    if (idx >= 0) {
      h = h.substring(0,idx) + "<mark>" + h.substring(idx, idx+ek.length) + "</mark>" + h.substring(idx+ek.length);
    }
  } catch(e) {}
  return h;
}

function startLevel(lv) {
  CUR_LEVEL = lv;
  QQ = ALL[lv];
  ans = {};

  document.getElementById("progbar-wrap").style.display = "";

function updateHeader() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  document.getElementById("hdr-sub").textContent = QQ.length + " questions · " + ok + " correcte(s)";
  var pct = Math.round((Object.keys(ans).length / QQ.length) * 100);
  document.getElementById("prog").style.width = pct + "%";
  document.getElementById("pleft").textContent = "Question " + (cur+1) + " / " + QQ.length;
  document.getElementById("pright").textContent = pct + "% complété";
}

function render(i) {
  cur = i;
  if (CUR_LEVEL) saveProgress(CUR_LEVEL, i);
  var q = QQ[i];
  var ua = ans[i];
  var done = ua !== undefined;
  var labels = ["A","B","C","D"];

  var textHtml = done ? hlText(q.t, q.k) : esc(q.t).replace(/\n/g,"<br>");
  var keyLabel = done ? "<div class='key-label'>🔑 Phrase-clé surlignée</div>" : "";

  var choicesHtml = "";
  for (var ci=0; ci<q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      cls += " disabled";
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    choicesHtml += "<button class='"+cls+"' onclick='pick("+i+","+ci+")'><span class='badge'>"+labels[ci]+"</span><span>"+esc(q.c[ci])+"</span></button>";
  }

  var feedbackHtml = "";
  if (done) {
    feedbackHtml = ua.ok
      ? "<div class='feedback ok'>✅ Bonne réponse !</div>"
      : "<div class='feedback ko'>❌ Réponse incorrecte. La bonne réponse est <strong>"+labels[q.a]+". "+esc(q.c[q.a])+"</strong></div>";
  }

  var prevDis = i===0 ? " disabled" : "";
  var nextDis = i===QQ.length-1 ? " disabled" : "";
  var srcLabel = (q._sources && q._sources.length) ? "<span class='src-label'>Présent dans : "+q._sources.join(" · ")+"</span>" : "";

  document.getElementById("view").innerHTML =
    "<div class='nav'>" +
      "<button class='btn' onclick='showLevelSelect()'>🏠 Thèmes</button>" +
      "<button class='btn'"+prevDis+" onclick='render("+(i-1)+")'>← Précédente</button>" +
      "<button class='btn'"+nextDis+" onclick='render("+(i+1)+")'>Suivante →</button>" +
      "<button class='btn btn-results' onclick='summary()'>Résultats</button>" +
    "</div>" +
    buildJumpBar(i) +
    "<div class='card'>" +
      "<div class='q-type-label'>📄 Compréhension écrite</div>" + srcLabel +
      keyLabel +
      "<div class='passage-box'>" + textHtml + "</div>" +
      "<div class='question'>Q"+(i+1)+". " + esc(q.q) + "</div>" +
      "<div class='choices'>"+choicesHtml+"</div>" +
      feedbackHtml +
    "</div>";

  updateHeader();
}

function buildJumpBar(cur_i) {
  if (!QQ || !QQ.length) return "";
  var h = "<div class='qjump'><span class='qjlabel'>Aller à la question :</span>";
  for (var j = 0; j < QQ.length; j++) {
    var cls = "qj";
    if (ans[j] !== undefined) cls += " answered";
    if (j === cur_i) cls += " current";
    h += "<button class='" + cls + "' onclick='render(" + j + ")'>" + (j + 1) + "</button>";
  }
  h += "</div>";
  return h;
}
function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  render(qi);
}

function calcScore() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  return { ok:ok, total: QQ.length, pct: Math.round(ok/QQ.length*100) };
}

function summary() {
  var r = calcScore();
  var gridHtml = "";
  for (var i=0; i<QQ.length; i++) {
    var cls = "grid-btn na";
    var ua = ans[i];
    if (ua) cls = ua.ok ? "grid-btn ok" : "grid-btn ko";
    gridHtml += "<button class='"+cls+"' onclick='render("+i+")' title='Q"+(i+1)+"'>"+(i+1)+"</button>";
  }
  document.getElementById("view").innerHTML =
    "<div class='summary'>" +
      "<h2>📊 Résultats – Niveau "+LEVEL_LABEL[CUR_LEVEL]+"</h2>" +
      "<div class='score-block'>" +
        "<div class='score-correct'>"+r.ok+" / "+r.total+" ✓ ("+r.pct+"%)</div>" +

      "<div class='grid'>"+gridHtml+"</div>" +
      "<div class='sum-actions'>" +

    "</div>";
  updateHeader();
}

function showReport() {
  var labels = ["A","B","C","D"];
  var wrongItems = [];
  var html = "";
  for (var i=0; i<QQ.length; i++) {
    var ua = ans[i];
    if (!ua || ua.ok) continue;
    wrongItems.push(i);
    var q = QQ[i];
    var choicesHtml = "";
    for (var ci=0; ci<q.c.length; ci++) {
      var cls = "report-choice neutral";
      var icon = "";
      if (ci===q.a) { cls="report-choice correct"; icon="✓ "; }
      else if (ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }
      choicesHtml += "<div class='"+cls+"'><strong>"+labels[ci]+".</strong> "+icon+esc(q.c[ci])+"</div>";
    }
    var tContent = hlText(q.t, q.k);
    html +=
      "<div class='report-item'>" +
        "<div class='qnum'>Question "+(i+1)+"</div>" +
        "<div class='passage-box' style='margin-bottom:.6rem'>"+tContent+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.6rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
      "</div>";
  }
  if (!html) html = "<div style='text-align:center;padding:2rem;color:#2E8B62;font-weight:600'>🎉 Aucune erreur ! Bravo !</div>";
  document.getElementById("view").innerHTML =
    "<div class='report-header no-print'>" +
      "<strong style='font-size:16px'>📋 Rapport des erreurs ("+wrongItems.length+" question"+(wrongItems.length!==1?"s":"")+")</strong>" +
      "<button class='btn btn-results' onclick='summary()'>← Retour aux résultats</button>" +
    "</div>" +
    html;
}
