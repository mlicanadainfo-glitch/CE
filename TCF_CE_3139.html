vrir de nouvelles références.", "Pour posséder une bibliothèque fournie.", "Pour s'évader vers des horizons lointains.", "Pour trouver des remèdes à ses maux."], "a": 0, "k": "ouvrent de nouveaux horizons à ma curiosité", "_sources": ["test9#39"]}, {"t": "Histoires d'école\nBernard Martin\nLongtemps, l'auteur de ce livre fut un objet de stupeur pour sa famille : incapable d'apprendre l'alphabet, détestant les majuscules, les noms propres et les listes de vocabulaire à retenir. « D'où venait mon ânerie ? », se demande-t-il dans cet ouvrage qui en réconfortera plus d'un. Car ce romancier jubilatoire fut un mauvais élève, terrassé par l'école. Il fut aussi professeur de français, histoire de contredire le destin. Ce récit est à la fois un manuel de pédagogie et un recueil de souvenirs. Un beau témoignage à offrir à tous ceux qui n'ont pas la science infuse. À tout le monde, donc.", "q": "Selon l'auteur de cette critique, en quoi ce livre est-il réjouissant ?", "c": ["Il permet d'apprendre à lire et à écrire de façon ludique.", "Il raconte les aventures d'un professeur d'histoire.", "Il ravive l'intérêt des littéraires pour les matières scientifiques.", "Il retrace l'improbable parcours de vie d'un ancien cancre."], "a": 3, "k": "ce romancier jubilatoire fut un mauvais élève, terrassé par l'école. Il fut aussi professeur de français", "_sources": ["test10#36"]}, {"t": "Stella Baruk est une fée des chiffres\nUne magicienne aux pouvoirs d'autant plus étonnants qu'ils donnent vie la matière la plus redoutée - ou la plus détestée - par beaucoup d'entre nous : les mathématiques. Haut fait de cette enseignante : l'invention d'une méthode simple qui donne aux enfants le goût de cette discipline réputée austère et leur permet de réussir. Principe de base : si les maths, comme tout savoir, font appel à une langue spécifique, il faut aider les enfants qui n'entendent pas ce que dit le prof ou entendent autre chose - sans comprendre souvent l'énoncé du problème - à entrer dans le sens de cette langue, en multipliant les ponts avec le langage ordinaire.\n(...) Car les mathématiques sont un langage spécifique. C'est l'incapacité à le comprendre qui fonde les raisons plausibles et logiques des erreurs des élèves.", "q": "Quelle est la solution à l'échec en mathématiques selon Stella Baruk ?", "c": ["Redonner un côté ludique aux mathématiques.", "Inventer un nouveau langage mathématique.", "Rendre intelligible le langage mathématique.", "Trouver une explication logique aux erreurs."], "a": 2, "k": "multipliant les ponts avec le langage ordinaire", "_sources": ["test10#38"]}, {"t": "Les technologies de l'information et de la communication (TIC) ont révolutionné presque tous les aspects de la vie privée et professionnelle. Si les élèves ne sont pas capables de naviguer dans un environnement numérique complexe, ils ne pourront pas participer pleinement à la vie économique, sociale et culturelle du monde qui les entoure. Les systèmes d'éducation doivent fournir aux professionnels de l'éducation de nouveaux environnements d'apprentissage. Ceux-ci permettront de développer les pédagogies du XXIe siècle et de doter les élèves des compétences dont ils auront besoin pour réussir dans le monde de demain. La technologie est le seul moyen d'élargir au maximum l'accès à la connaissance ; elle peut être utilisée au service des nouvelles pédagogies en plaçant les apprenants au cœur d'un apprentissage actif.", "q": "Selon l'auteur, quel est l'intérêt pour un professeur d'utiliser les TIC ?", "c": ["Disposer de ressources multiples.", "Employer les médias sociaux pour motiver les enfants.", "Pallier les défaillances des méthodes traditionnelles.", "Simplifier l'enseignement."], "a": 2, "k": "La technologie est le seul moyen d'élargir au maximum l'accès à la connaissance", "_sources": ["test11#39"]}, {"t": "L'avenir est dans la formation de la jeunesse, dans l'innovation, dans la recherche. Pour prendre pleinement ses responsabilités, l'université de Nantes propose un nouveau modèle universitaire en France, décloisonné, qui rassemble les acteurs de l'enseignement supérieur et de la recherche (grandes écoles, organismes de recherche, centre hospitalier universitaires …)\nCe nouveau modèle remet au centre des préoccupations la question de l'accès à un enseignement supérieur qualitatif pour le plus grand nombre. Il a l'ambition de créer les conditions de réussite et d'épanouissement pour tous ses étudiants et de permettre des innovations majeures.\nAu travers de ce projet de nouvelle université, le président et son équipe défendent une vision innovante et proposent un nouveau modèle qui conjugue exigence et main tendue, excellence et lien social.", "q": "Quel est l'objectif de cette université ?", "c": ["Attirer davantage d'étudiants brillants.", "Être à la pointe de la technologie.", "Ouvrir ses cours à un public élargi.", "Proposer des disciplines inédites."], "a": 2, "k": "l'accès à un enseignement supérieur qualitatif pour le plus grand nombre", "_sources": ["test14#37"]}, {"t": "La bioéthique fait l'objet d'une polémique qui confronte deux écoles.\nPour la première, composé de chercheurs et de rationalistes, le progrès scientifique ne saurait être limité. La recherche entraînera l'éradication des maladies génétique et permettra même de les prévoir. On en viendra à un eugénisme contrôlé qui améliorera l'espèce humaine et les dépenses de santé publique seront allégées. La seconde école, des philosophes ou des ecclésiastiques, affirme ses craintes en ce qui concerne la pratique d'un eugénisme scientifique : il permettra la sélection efficace des embryons et ouvrira de plus en plus largement ses critères de choix à des exigences non pathologiques. Pour eux, il est impossible de déterminer les tares inconciliables avec l'humain, puisque certains individus en ont fait l'origine même de leur génie.", "q": "Sur quoi portent les réserves des partisans de la seconde école ?", "c": ["Le coût social élevé de prise en charge des maladies génétiques.", "Le développement de traitements curatifs de pathologies génétiques.", "Le mode de financement de la recherche génétique fondamentale.", "Les dérives induites par l'amélioration du patrimoine génétique."], "a": 3, "k": "ouvrira de plus en plus largement ses critères de choix à des exigences non pathologiques", "_sources": ["test15#37"]}, {"t": "Depuis l'adolescence, je fréquente assidûment les dictionnaires.\nChaque fois que je bute sur un mot, que je suis dans le flou culturel, ils m'apportent la réponse et ouvrent de nouveaux horizons à ma curiosité en me renvoyant souvent à d'autres ouvrages. J'en possède une centaine et chacun est une bibliothèque à lui seul. Tous sont autant de béquilles de ma culture. Par exemple, quand vous cherchez le mot juste, rien de tel qu'un dictionnaire des synonymes ! On ouvre un dictionnaire pour se renseigner sur une question précise comme on lirait la notice d'un produit pharmaceutique destiné à soigner ceci ou cela. C'est le self-service de la pensée ! Jean-Claude Siméon, éditeur.", "q": "Pourquoi Jean-Claude Simeon aime-t-il les dictionnaires ?", "c": ["Pour découvrir de nouvelles références.", "Pour posséder une bibliothèque fournie.", "Pour s'évader vers des horizons lointains.", "Pour trouver des remèdes à ses maux."], "a": 0, "k": "ouvrent de nouveaux horizons à ma curiosité en me renvoyant souvent à d'autres ouvrages", "_sources": ["test15#39"]}, {"t": "Défenseur.e.s et détracteur.e.s de l'écriture inclusive, qui consiste à féminiser les mots en plaçant entre des points la terminaison du féminin, s'écharpent sur cet épineux sujet.\nPour Éliane Viennot, il est important de défendre l'écriture inclusive qui, en remaniant l'orthographe, vise à combattre les stéréotypes sexistes.", "q": "Que pense Eliane Viennot de l'écriture inclusive ?", "c": ["Elle favorise l'évolution des mentalités.", "Elle incarne une première historique.", "Elle permet de moderniser le lexique.", "Elle reflète les clivages de la société."], "a": 0, "k": "vise à combattre les stéréotypes sexistes", "_sources": ["test16#37"]}, {"t": "Le « Monde de l'éducation » a atteint son ambition : devenir la référence nationale en matière d'enseignement. Un succès confirmé par une récente enquête qui nous crédite d'un taux de satisfaction exceptionnellement élevé. Mais nos abonnés sont souvent des établissements scolaire … où « Le Monde de l'éducation » est le magazine français le plus « photocopillé » : environ 40000 exemplaires vendus pour plus d'un million cent mille lecteurs ! un écart ventes-lectorat devenu insupportable. Depuis 1974, « Le Monde de l'éducation » a accompli de nombreuses transformations. Après trente-quatre ans au service de l'éducation, votre magazine va vivre sa mue la plus importante. De mensuel payant vendu en kiosques ou par abonnement, il va devenir un supplément gratuit proposé avec le quotidien « Le Monde »", "q": "Qu'est-ce qui a justifié la transformation du monde de l'éducation ?", "c": ["Une adéquation avec l'attente des lecteurs", "Une diffusion abusive de copies illégales", "Une offre promotionnelle provisoire", "Une perte croissante du nombre d'abonnés"], "a": 1, "k": "le magazine français le plus « photocopillé »", "_sources": ["test17#37"]}, {"t": "Instaurer un grand oral pour réformer le baccalauréat est un nouveau défi à révéler pour le système éducatif français. L'oral a autant d'importance que l'écrit. Il a ses règles propres et ses méthodes d'apprentissage : selon moi, une quinzaine d'heures suffit avec douze élèves pour arriver à parler debout devant les autres de façon argumentée. Bien loin d'être discriminant social, l'oral peut être une formidable opportunité de réussite pour tous les élèves, à condition qu'il s'agisse bien d'une épreuve orale et non d'un écrit transposé à l'oral. Contrairement aux idées reçues, je pense que l'oral ne demande quasiment pas de prérequis ni un quelconque talent de naissance venu d'une fée - y compris social – qui serait penchée sur le berceau.", "q": "Selon l'auteur, quel est l'intérêt d'une épreuve orale au baccalauréat ?", "c": ["Elle favorise l'égalité des chances", "Elle prépare à la vie professionnelle", "Elle remplace l'évaluation continue", "Elle simplifie le travail des enseignants"], "a": 0, "k": "une formidable opportunité de réussite pour tous les élèves", "_sources": ["test22#36"]}, {"t": "Instaurer un grand oral pour réformer le baccalauréat est un nouveau défi à relever pour le système éducatif français. L'oral a autant d'importance que l'écrit. Il a ses règles propres a et ses méthodes d'apprentissage : selon moi, une quinzaine d'heures suffit avec douze élèves pour arriver à parler debout devant les autres de façon argumentée. Bien loin d'être un discriminant social, l'oral peut être une formidable opportunité de réussite pour tous les élèves, à condition qu'il s'agisse bien d'une épreuve orale et non d'un écrit transposé à l'oral. Contrairement aux idées reçues, je pense que l'oral ne demande quasiment pas de prérequis ni un quelconque talent de naissance venu d'une fée - y compris sociale - qui se serait penchée sur le berceau.", "q": "Selon l'auteur, quel est l'intérêt d'une épreuve orale au baccalauréat ?", "c": ["Elle favorise l'égalité des chances.", "Elle prépare à la vie professionnelle.", "Elle remplace l'évaluation continue.", "Elle simplifie le travail des enseignants."], "a": 0, "k": "une formidable opportunité de réussite pour tous les élèves", "_sources": ["test32#36"]}]}, "VieQuotidienne": {"cours": [{"t": "Des chercheurs mettent en doute l'idée répandue, que la langue que nous parlons influence notre façon de penser. Ils présentent une recherche sur l'ordre des mots dans la phrase Sujet Verbe Objet pour certaines langues Sujet, Objet, Verbe pour d'autres. Leurs 40 sujets, locuteurs d'anglais, d'espagnol, de mandarin, de turc, ont décrit des séquences vidéo dans leur langue d'abord, puis en utilisant des gestes. Si les descriptions verbales différaient dans l'ordre des mots selon les langues, les descriptions faites avec les mains reprenaient toutes le même ordre (sujet, objet, verbe) suivant celui des langues des signes inventées par des locuteurs sourds.", "q": "Quel est le résultat de l'expérience présentée dans cet article ?", "c": ["Les gestes révèleraient systématiquement la langue maternelle des locuteurs", "Il existerait un ordre universel de la pensée, indépendant de l'ordre linguistique", "Il y aurait autant de façons de penser que de structures de langue différentes", "Les structures des langues seraient dépendantes de notre expérience du monde"], "a": 1, "k": "les descriptions faites avec les mains reprenaient toutes le même ordre (sujet, objet, verbe)", "_sources": ["test1#35"]}, {"t": "Trouver un logement dans une ville étudiante est un parcours du combattant pour un grand nombre d'inscrits dans l'enseignement supérieur. La barrière est parfois infranchissable. Non seulement les loyers sont élevés mais la sélection des candidats par les propriétaires et très dure, souvent basée sur le niveau de revenus des garants. Pour lever ce frein, la caution locative étudiante (CLE) vient d'être généralisée à l'ensemble du territoire national après avoir été expérimentée dans quatre régions pendant un an. Avec ce dispositif, c'est l'Etat qui se porte garant du versement des loyers des étudiants en cas de non-paiement.", "q": "Quel est le principal obstacle à l'accès au logement des étudiants selon cette analyse ?", "c": ["La méfiance des propriétaires", "La rareté des offres de logement", "L'absence d'engagement de l'État", "Le montant de la caution exigée"], "a": 0, "k": "la sélection des candidats par les propriétaires et très dure, souvent basée sur le niveau de revenus des garants", "_sources": ["test2#30"]}, {"t": "Des taxes « vertes » où taxes carbones sont envisagées pour faire aux financements nécessaires d'énergie non polluante. Les mécanismes prévus dans le protocole de Kyoto concernent notamment un crédit carbone qui représente un volume d'émission de gaz à effet de serre (GES) évité et des permis d'émissions négociables. Le crédit carbone est doté d'une valeur marchande et s'échange entre pays industrialisés. Un pays n'arrivant pas à atteindre son objectif de réduction des GES pourrait acheter des crédits carbones à un autre qui aurait dépassé son objectif. Ce système a été parfois qualifié de « permis à polluer » car un pays riche pourrait « acheter » le droit de polluer à un autre ayant réellement réduit ses émissions.", "q": "Quel est le paradoxe de la taxe carbone ?", "c": ["Elle concerne uniquement les économies fortes", "Elle freine l'utilisation des ressources renouvelables", "Elle permet le dépassement des normes édictées", "Elle ralentit le progrès dans les États émergents"], "a": 2, "k": "Ce système a été parfois qualifié de « permis à polluer »", "_sources": ["test2#33"]}, {"t": "Des chercheurs mettent en doute l'idée répandue que la langue que nous parlons influence notre façon de penser. Ils présentent une recherche sur l'ordre des mots dans la phrase Sujet. Verbe, Objet pour certaines langues ; Sujet, Objet, Verbe pour d'autres. Leurs 40 sujets, locuteurs d'anglais, d'espagnol, de mandarin, de turc, ont décrit des séquences vidéo dans leur langue d'abord, puis en utilisant des gestes. Si les descriptions verbales différaient dans l'ordre des mots selon les langues, les descriptions faites avec les mains reprenaient toutes le même ordre (sujet, objet, verbe), suivant celui des langues des signes inventées par des locuteurs sourds.", "q": "Quel est le résultat de l'expérience présentée dans cet article ?", "c": ["Les gestes révèleraient systématiquement la langue maternelle des locuteurs", "Il existerait un ordre universel de la pensée, indépendant de l'ordre linguistique", "Il y aurait autant de façons de penser que de structures de langue différentes", "Les structures des langues seraient dépendantes de notre expérience du monde"], "a": 1, "k": "les descriptions faites avec les mains reprenaient toutes le même ordre", "_sources": ["test3#34"]}, {"t": "On s'est habitué depuis belle lurette à ne plus rencontrer de poinçonneurs dans le métro ni de pompistes dans les stations-service. Mais la liste des professions en voie de disparition ne cesse de s'allonger. Caissières dans les supermarchés, guichetiers dans les banques, hôtesses dans les cinémas … Tous remplacés par des machines ? Pas si simple. Comme l'analyse Thibault Carpentier, directeur du cabinet de conseil Obstand, la tentation industrielle de réduire les frais de personnel est grande mais cette logique se heurte à celle des consommateurs qui ont du mal à se passer d'une présence humaine. D'ailleurs, toutes les entreprises concernées l'ont bien compris : pas de suppression de postes mais des redéploiements avec élargissement des compétences", "q": "Quel obstacle rencontré l'automatisation des services ?", "c": ["Les coûts élevés des investissements", "Les faibles qualifications des employés", "Les réticences émises par la clientèle", "Les spécificités de certains métiers"], "a": 2, "k": "cette logique se heurte à celle des consommateurs qui ont du mal à se passer d'une présence humaine", "_sources": ["test4#31"]}, {"t": "La première difficulté, qu'il avait en réalité sous-estimée, fut de réussir à atteindre l'extrémité du trottoir, c'est-à-dire de franchir la masse mouvante et compacte des hommes et des femmes qui marchaient devant lui, frange large de deux ou trois mètres mais dont la texture était dense, mobile, paisiblement hostile. Il eut beau dans un premier temps prononcer à haute voix de nombreuses paroles d'excuse, expliquant avec des gestes modestes qu'il voulait passer, se montrer on ne peut plus poli et plus encore, personne ne s'arrêta, ni ne se poussa afin de lui permettre de se faufiler entre les corps. Les hommes et les femmes qui marchaient ne le regardaient pas et beaucoup avaient sur les oreilles des écouteurs.", "q": "Dans quelle situation se trouve le personnage principal ?", "c": ["Il a du mal à se déplacer dans la foule.", "Il est emporté par une foule pressée.", "Il est paralysé par l'hostilité de la foule.", "Il imagine les répliques impolies de la foule."], "a": 0, "k": "personne ne s'arrêta, ni ne se poussa afin de lui permettre de se faufiler", "_sources": ["test7#32"]}, {"t": "Mais qu'est-ce qu'être autonome ?\nL'autonomie a été un idéal de la fin des années 70 et, depuis, est devenue une norme. Mais qu'est-ce qu'être autonome ? Est-ce rechercher en soi les forces pour agir ? Cette représentation d'un sujet en relation avec lui-même est contestée par certains penseurs pour qui agir par soi-même, ce n'est pas s'inventer mais être capable de se diriger seul. Autrement dit, on peut être autonome en appliquant des règles que l'on a apprises et dont l'origine ne se trouve donc pas au fond de nous mais dans le contexte social où nous existons. Ces règles apparaissent alors comme des capacités et non plus comme une limitation des possibilités de l'action.", "q": "Qu'est-ce qu'être autonome, selon ce texte ?", "c": ["Devenir indifférent aux autres.", "Disposer de ressources intérieures.", "Exploiter les compétences acquises.", "S'éloigner de la vie en société."], "a": 1, "k": "on peut être autonome en appliquant des règles que l'on a apprises", "_sources": ["test7#33"]}, {"t": "Chère Madame,\nJe vous remercie de votre commande mais votre règlement ne couvre pas totalement le montant de votre achat. Plutôt que de vous faire supporter des frais supplémentaires, je vous expédie votre colis dès aujourd'hui et je vous demande de me faire parvenir un chèque de 20 euros, à réception.\nBien sincèrement.", "q": "Quel est l'objet de cette lettre ?", "c": ["Demander à une cliente de payer l'intégralité de sa commande.", "Prévenir une cliente que sa commande sera livrée en retard.", "Confirmer à une cliente que sa commande a bien été expédiée.", "Prévenir une cliente qu'elle devra payer 20 euros de frais d'envoi."], "a": 0, "k": "votre règlement ne couvre pas totalement le montant de votre achat", "_sources": ["test9#30", "test11#29"]}, {"t": "Sexistes, les jeux vidéo ? Peut-être que oui, peut-être que non. En tout cas, à parcourir les allées de la Paris Games Week, l'œil avisé aura lui-même bien du mal à trouver un personnage principal féminin de bien jeu vidéo. Il y a bien la célébrissime Lara Croft du jeu vidéo Tomb Raider, aux attributs particulièrement imposants, conçus presque sur mesure pour plaire à un certain nombre de joueurs masculins. Pour Le reste, circulez, il n'y a presque rien d'autre à voir, si l'on balaye d'un coup de manette de jeu, au mieux les princesses à sauver, au pire les calls girls de mafioso. Pourtant, l'industrie du jeu vidéo a pris conscience ces dernières années du potentiel du marché des joueuses.", "q": "Quel constat est dressé sur les jeux vidéo ?", "c": ["La quasi absence d'héroïnes.", "L'appel constant à la violence.", "L'atténuation des clichés.", "L'uniformité des scénarios."], "a": 0, "k": "l'œil avisé aura lui-même bien du mal à trouver un personnage principal féminin", "_sources": ["test10#35"]}, {"t": "On s'est habitué depuis belle lurette à ne plus rencontrer de poinçonneurs dans le métro ni de pompistes dans les stations-service. Mais la liste des professions en voie de disparition ne cesse de s'allonger. Caissières dans les supermarchés, guichetiers dans les banques, hôtesses dans les cinémas... Tous remplacés par des machines ? Pas si simple. Comme l'analyse Thibaut Carpentier, directeur du cabinet de conseil Obstand, la tentation industrielle de réduire les frais de personnel est grande mais cette logique se heurte à celle des consommateurs qui ont du mal à se passer d'une présence humaine. D'ailleurs, toutes les entreprises concernées l'ont bien compris : pas de suppression de postes mais des redéploiements avec élargissement des compétences.", "q": "Quel obstacle rencontre l'automatisation des services ?", "c": ["Les coûts élevés des investissements.", "Les faibles qualifications des employés.", "Les réticences émises par la clientèle.", "Les spécificités de certains métiers."], "a": 2, "k": "cette logique se heurte à celle des consommateurs qui ont du mal à se passer d'une présence humaine.", "_sources": ["test11#30"]}, {"t": "Ah ! Le bel été ! Par trente-cinq degrés à l'ombre, les enfants réclament le goûter après la baignade et coup de chance, le vendeur de beignets se profile à l'horizon. Résultat : visite aux urgences car les beignets à la crème avaient passé la journée au soleil. Des histoires comme celle-là circulent dans toutes les associations de consommateurs. La direction générale de la répression des fraudes dresse tout de même un bilan encourageant. Peu d'endroits publics échappent aux vérifications et les escroqueries ont diminué. Mais tout de même, en matière d'hygiène, le bon sens du consommateur doit prévaloir et lui permettre de prévenir tout incident.", "q": "Selon la direction générale de la répression des fraudes…", "c": ["les problèmes liés à l'hygiène sont insolubles.", "tout le monde doit dénoncer les tricheries.", "la sagesse doit l'emporter sur la tentation.", "l'honnêteté des vendeurs est indéniable."], "a": 2, "k": "en matière d'hygiène, le bon sens du consommateur doit prévaloir", "_sources": ["test12#31"]}, {"t": "Les additifs et conservateurs, ces poudres de perlimpinpin, rendent appétissant un produit médiocre afin de mieux le vendre. C'est le cas des colorants si la préparation est terne, des exhausteurs de goût de type glutamate si elle est fade, des agents de texture si elle est sans consistance, ou des arômes si elle est insipide ou a carrément mauvais goût. On vous dit que les conservateurs ou antioxydants (sorbates, nitrites, sulfites...) servent à vous protéger de possibles intoxications bactériennes, mais ils servent surtout à prolonger les dates limites de consommation, afin de laisser plus de temps aux industriels et aux supermarchés pour commercialiser leur marchandise.", "q": "Que critique cet article ?", "c": ["A) Le dosage des produits chimiques dans les aliments.", "B) Le manque de lisibilité des étiquettes.", "C) Les arguments hypocrites avancés par les fabricants.", "D) Les conséquences sanitaires des ajouts."], "a": 2, "k": "ils servent surtout à prolonger les dates limites de consommation", "_sources": ["test13#32", "test39#32"]}, {"t": "Des taxes « vertes » ou taxes carbone sont envisagées pour faire face aux financements nécessaires d'énergies non polluantes. Les mécanismes prévus dans le protocole de Kyoto concernent notamment un crédit carbone qui représente un volume d'émission de gaz à effet de Serre (GES) évité et des permis d'émission négociables. Le crédit carbone est doté d'une valeur marchande et s'échange entre pays industrialisés. Un pays n'arrivant pas à atteindre son objectif de réduction des GES pourrait acheter des crédits carbones à un autre qui aurait dépassé son objectif. Ce système a été parfois qualifié de « permis à polluer », car un pays riche pourrait « acheter » le droit de polluer à un autre ayant réellement réduit ses émissions.", "q": "Quel est le paradoxe de la taxe carbone ?", "c": ["Elle concerne uniquement les économies fortes.", "Elle freine l'utilisation de ressources renouvelables.", "Elle permet le dépassement des normes édictées.", "Elle ralentit le progrès dans les États émergents."], "a": 2, "k": "un pays riche pourrait « acheter » le droit de polluer", "_sources": ["test15#33"]}, {"t": "Salé, sucré, acide, amer quatre termes – tels les points cardinaux – qui définissent le territoire d'expression du goût.\nNous serions en droit de penser que c'est un peu court pour dépeindre toutes les nuances de la palette aromatique et les émotions qu'elle suscite.\nLes Japonais y ont d'ailleurs ajouté la notion d'umami, cette saveur qui littéralement signifie « goût délicieux », enrobante, qui tapisse le palais, très addictive.", "q": "Quel problème soulève cet article ?", "c": ["L'addiction liée à certains aliments.", "L'inévitable uniformisation du goût.", "La difficulté à décrire les saveurs.", "La multiplication des termes culinaires."], "a": 2, "k": "c'est un peu court pour dépeindre toutes les nuances", "_sources": ["test16#31"]}, {"t": "Souvent critiquée pour la qualité de son service, la société berlinoise des transports en commun a fait parler d'elle, en proposant 500 paires de « chaussures-billets » aux couleurs des banquettes du métro berlinois. Vendues 180 euros, ces baskets incluent un abonnement annuel métro-bus-tram (hors trains de banlieue), contre 761 euros pour un forfait classique. Les consommateurs séduits par ce concept commercial qui permet de voyager presque gratuitement sur une partie du réseau ont formé une longue file d'attente. Certains ont même tenté de revendre en ligne leur paire « collector » à un tarif de base quintuplé.", "q": "Quel est l'objectif de la société berlinoise des transports ?", "c": ["Attirer l'attention grâce à un coup de publicité.", "Concurrencer les autres moyens de locomotion.", "Multiplier le nombre de souscriptions par internet.", "Permettre de voyager extramuros à moindre frais."], "a": 0, "k": "a fait parler d'elle", "_sources": ["test21#34"]}, {"t": "Deux petites saisons et puis s'en vont. Sur les plates-formes de streaming par abonnement, les séries ont beau être reines, elles n'en sont pas moins soumises à rude concurrence. Et leur durée de vie peut se révéler bien plus courte que sur les chaines traditionnelles.\nCette stratégie ne doit rien au hasard. Dans leur objectif de conquête de nouveaux abonnées, les plates-formes accordent en effet plus de vertus à la nouveauté qu'à la longévité. Quitte à décevoir certains fans qui payent un service streaming spécialisé dont le baromètre de satisfaction devient en théorie plus important que celui de l'audimat.", "q": "D'après l'article, que privilégient les plates-formes de streaming?", "c": ["La longévité des programmes", "La qualité des services offerts", "Le changement régulier des séries", "Le contentement de leurs abonnés"], "a": 2, "k": "plus de vertus à la nouveauté qu'à la longévité", "_sources": ["test22#31"]}, {"t": "Deux petites saisons et puis s'en vont. Sur les plates-formes de streaming vidéo par abonnement, les séries ont beau être reines, elles n'en sont pas moins soumises à rude concurrence. Et leur durée de vie peut se révéler bien plus courte que sur les chaînes traditionnelles. Cette stratégie ne doit rien au hasard. Dans leur objectif de conquête de nouveaux abonnés, les plates-formes accordent en effet plus de vertus à la nouveauté qu'à la longévité. Quitte à décevoir certains fans qui payent un service de streaming spécialisé dont le baromètre de satisfaction devrait en théorie être plus important que celui de l'audimat.", "q": "D'après l'article, que privilégient les plates-formes de streaming ?", "c": ["La longévité des programmes.", "La qualité des services offerts.", "Le changement régulier des séries.", "Le contentement de leurs abonnés."], "a": 2, "k": "accordent en effet plus de vertus à la nouveauté qu'à la longévité", "_sources": ["test29#31", "test33#31", "test38#31"]}, {"t": "Certains économistes spécialisés dans la politique en matière de mobilité estiment que la gratuité des transports en commun n'est pas souhaitable. Pour eux, la question de savoir qui va les financer est un peu simpliste. La gratuité existe déjà dans notre pays. Il y a une quinzaine de réseaux en dehors de l'Île-de-France qui le font déjà totalement. Le problème actuel est celui des ressources. En effet, les réseaux des grandes métropoles ne sont pas formatés pour pouvoir absorber ce supplément de fréquentation. Et donc de ce point de vue, il n'est pas possible de se poser la question de la gratuité, avant de savoir quelle offre sera proposée aux usagers qui voyagent sur le réseau.", "q": "D'après ces spécialistes, quel est le fond du problème de la gratuité des transports ?", "c": ["L'absence de modèle comparatif de mobilité.", "La déresponsabilisation des usagers.", "Le déficit provoqué par son financement.", "Le risque de saturation des réseaux."], "a": 3, "k": "les réseaux des grandes métropoles ne sont pas formatés pour pouvoir absorber ce supplément", "_sources": ["test30#33"]}, {"t": "Les gens empilaient les objets dans les chariots de métal, avec frénésie. Ils avaient des visages sérieux, contractés, et leurs paupières battaient de façon anormalement lente. Les femmes tendaient les mains vers les étals. On aurait dit que les gens ne savaient plus ce qu'ils faisaient. Ce n'étaient pas eux qui saisissaient la marchandise. C'est la marchandise qui se collait d'elle-même à leurs mains, elle entrait directement dans les caddies.", "q": "Dans cet extrait, qu'apprend-on sur les acheteurs ?", "c": ["Ils donnent l'impression de vénérer les produits.", "Ils ont l'air éblouis par le gigantisme des magasins.", "Ils paraissent manipulés par une force supérieure.", "Ils semblent perdus dans le labyrinthe des rayons."], "a": 2, "k": "ce n'étaient pas eux qui saisissaient la marchandise", "_sources": ["test31#30"]}, {"t": "J'ai beau être un styliste très reconnu, je ne dirai jamais que j'ai créé la robe parfaite ! Je n'aime pas la perfection, ni les gens parfaits. Je hais qu'on me le dise : « Oui, tout va très bien ! », alors qu'il y a des problèmes. Quand je suis arrivé à Paris, le mot que j'ai le plus entendu était « non ». J'aime vivre avec ce « non » car j'ai peur de la perfection. Elle est synonyme de fin puisque c'est le doute et l'insatisfaction qui font revenir à l'atelier et tout recommencer, tout améliorer. Le « non » ne cache pas la réalité, et cela stimule.", "q": "Comment le styliste interprète-t-il le mot « non » ?", "c": ["Comme un défaut d'honnêteté", "Comme un manque de confiance", "Comme une appréciation déguisée", "Comme une incitation à l'action"], "a": 3, "k": "Le « non » ne cache pas la réalité, et cela stimule", "_sources": ["test32#30"]}], "devoirs": [{"t": "Des chercheurs mettent en doute l'idée répandue que la langue dont nous parlons influence notre façon de penser. Ils présentent une recherche sur l'ordre des mots dans la phrase : sujet, verbe, objet pour certaines langues sujet, objet et verbe pour d'autres. Leurs 40 sujets locuteurs d'anglais, d'espagnol, de mandarin, des trucs ont décrit des séquences vidéo dans leur langue d'abord, puis en utilisant des gestes. Si les descriptions verbales diffèrent dans l'ordre des mots selon la langue, les descriptions faites avec les mains reprenaient toutes le même ordre (sujet, objet, verbe), suivant celui des langues des signes inventés par des locuteurs sourds.", "q": "Quel est le résultat de l'article présenté par ce texte ?", "c": ["Les gestes révéleraient systématiquement la langue maternelle des locuteurs.", "Il existerait un ordre universel de la pensée, indépendant de l'ordre linguistique.", "Il y aurait autant de façons de penser que de structures de langue différentes.", "Les structures des langues seraient dépendantes de notre expérience du monde."], "a": 1, "k": "les descriptions faites avec les mains reprenaient toutes le même ordre (sujet, objet, verbe)", "_sources": ["test39#34"]}, {"t": "Sexistes, les jeux vidéo ? Peut-être que oui, peut être que non. En tout cas, à parcourir les allées de la Paris Games Week, l'œil avisé aura lui-même bien du mal à trouver un personnage principal féminin de jeu vidéo. Il y a bien la célébrissime Lara Croft du jeu vidéo Tomb Raider, aux attributs particulièrement imposants, conçus presque sur mesure plaire à masculins. Pour le reste, circulez, il n'y a presque rien d'autre à voir, si l'on balaye d'un coup de manette de jeu, au mieux, les princesses à sauver, au pire, les calls girls de mafioso. Pourtant, l'industrie du jeu vidéo a pris conscience ces dernières années du potentiel du marché des joueuses.", "q": "Quel constat est dressé sur les jeux vidéo ?", "c": ["La quasi absence d'héroïnes", "L'appel constant à la violence", "L'atténuation des clichés", "L'uniformité des scénarios"], "a": 0, "k": "l'œil avisé aura lui-même bien du mal à trouver un personnage principal féminin de jeu vidéo.", "_sources": ["test1#36"]}, {"t": "Les méfiances à l'égard de la gratuité des transports collectifs demeurent fortes, sans surprise, l'Union des Transports Publics affiche son hostilité. Trop onéreuse, ne facilitant pas le report de la voiture vers les transports collectifs, menaçant la qualité de service, la gratuité pour tous ne répondrait pas aux objectifs de développement d'un réseau de transport. Selon l'UTP, la gratuité est une « fausse bonne idée » qui « induit des déplacements inutiles, encourage l'étalement urbain et prive de ressources le système de transport au moment où la clientèle augmente et où les recettes fiscales des collectivités diminuent ». elle lui préfère le système de tarification spéciale pour les jeunes, les sans-emplois ou les familles nombreuses.", "q": "Pourquoi la gratuité des transports publics est-elle critiquée ?", "c": ["Ce choix creuse les inégalités sociales", "Ce projet omet des questions de sécurité", "Cette démarche déresponsabilise les usagers", "Cette initiative coûte beaucoup trop cher"], "a": 3, "k": "Trop onéreuse, ne facilitant pas le report de la voiture vers les transports collectifs, menaçant la qualité de service", "_sources": ["test2#38"]}, {"t": "Si vous pensez pouvoir comprendre un poème pourvu que l'on vous laisse le temps d'y réfléchir, ou que l'on vous laisse en paix pour vous y absorber, et si vous refusez de voir les choses autrement, alors vous pourriez bien vous priver d'un texte qui a peut-être été écrit expressément pour n'être lu ou récité que dans des circonstances bien précises, qui elles-mêmes peuvent réclamer l'absence des conditions que vous vous efforcez d'imposer. Ce qu'on appelle « l'usage », que vous l'ayez institué ou adopté par imitation, peu ainsi aller à l'encontre de l'efficacité. Il ne suffit pas d'affirmer que ces règles sont sacro-saintes ». Elles ne le sont pas, ne peuvent pas l'être – et personne n'apportera la preuve qu'elles le sont.", "q": "Quelles règles établies sont dénoncées dans ce texte ?", "c": ["Celles des critiques", "Celles des auteurs", "Celles des éditeurs", "Celles des lecteurs"], "a": 3, "k": "Ce qu'on appelle « l'usage », que vous l'ayez institué ou adopté par imitation", "_sources": ["test3#39"]}, {"t": "Prix Bas toute l'année\n\nDes voyages aux loisirs en passant par les voitures, plus question de rater la bonne affaire. Voilà pourquoi les fins de séries, les promotions, les soldes ne se sont jamais aussi bien portés. On achète surtout des vêtements, jusqu'à 14 articles pour un montant moyen de 186 euros, même si on doit dépenser moins le reste de l'année. Le gouvernement l'a bien compris: il vient d'octroyer deux semaines supplémentaires de soldes, à la convenance des commerçants, en dehors des mois de juillet et janvier, afin de redonner un peu de tonus aux ventes.", "q": "Quel est le thème de cet article ?", "c": ["La baisse des achats en boutique", "Le développement du commerce en ligne", "Les stratégies des consommateurs", "Un nouveau concept de magasin"], "a": 2, "k": "les fins de séries, les promotions, les soldes ne se sont jamais aussi bien portés", "_sources": ["test5#38"]}, {"t": "Les tagueurs (1) pourront en prendre de la graine. Ils n'ont rien inventé. Universelle, l'envie de laisser une trace de son passage ou d'apostropher l'autre à travers les siècles. Alix Barbet, fondatrice du Centre d'étude des peintures murales gallo-romaines, en apporte une preuve éclatante en explorant les tags (2) d'il y a ... deux mille ans. Ces témoignages fragiles constituent, selon l'auteur, un matériau archéologique d'autant plus exceptionnel qu'ils sont « tout ce qui nous reste de l'humeur de l'écriture et du langage quotidien, des petites gens pour la plupart, et qui contrebalance la vision que l'on pourrait avoir de la culture gallo-romaine dans les provinces à travers les documents officiels qui nous sont parvenus. »", "q": "Que dit cet article ?", "c": ["La pratique de la peinture murale a pris naissance à l'ère gallo-romaine.", "Les archéologues refusent de reconnaître la valeur des graffitis gallo-romains.", "Les tagueurs d'aujourd'hui se sont inspirés des œuvres gallo-romaines.", "L'expression picturale populaire existait durant l'époque gallo-romaine."], "a": 3, "k": "Ils n'ont rien inventé", "_sources": ["test15#38"]}, {"t": "L'histoire des sociétés humaines tourne autour de la recherche d'un monde plus juste. Les idéologies religieuses et politiques ont toujours visé une certaine forme de justice et d'égalité. Les êtres humains ont besoin de donner un sens à leur existence, notamment sociale : ils se soucient forcément de la vie des autres et veulent trouver une raison d'être à l'état de la société. Aucune élite ne peut se contenter de posséder davantage d'argent ou de pouvoir que les autres de façon explicitement arbitraire. De ce fait, l'organisation sociale est expliquée et justifiée par un discours sophistiqué Ce discours doit être un minimum plausible et repose souvent sur un mélange de sincérité et d'hypocrisie.", "q": "Qu'explique l'auteur sur les inégalités sociales ?", "c": ["Elles diminuent dans toutes les organisations.", "Elles résultent du fonctionnement d'une société.", "Elles se combattent mieux avec de la sincérité.", "Elles se justifient par des arguments fallacieux."], "a": 3, "k": "repose souvent sur un mélange de sincérité et d'hypocrisie", "_sources": ["test29#39"]}]}, "Famille": {"cours": [{"t": "Solitude, conflit avec les parents, difficultés scolaires … Les adolescents peuvent se confier sur des sites spécialisés où leur parole sera prise en compte. Fil Santé Jeunes a vu ses visites augmenter de 313% ces dernières années. De l'autre côté de l'écran, animateurs et psychologues s'efforcent de maintenir le contact et de prolonger la discussion. L'entreprise est délicate puisque les regards et les gestes ne peuvent être pris en compte par le professionnel. Le réconfort naît aussi, et peut-être avant tout, des autres internautes qui vivent une situation similaire.", "q": "À quelle difficulté se heurtent les spécialistes ?", "c": ["L'absence totale des signes visuels du langage", "L'opposition des familles à leurs interventions", "La nécessité de modérer le ton des échanges", "Les nombreuses remarques des participants"], "a": 0, "k": "les regards et les gestes ne peuvent être pris en compte par le professionnel.", "_sources": ["test1#31", "test3#31"]}, {"t": "Dans une éducation qui prône l'épanouissement de l'enfant, l'obéissance a mauvaise presse. En partie parce qu'elle est confondue avec la soumission, Mais ça n'en est pas une. C'est une construction culturelle qui demande aussi aux parents de se contrôler. C'est de ce mouvement de retenue que naît l'obéissance intelligente qui fait appel à la participation active de l'enfant et qui est basée sur le respect réciproque, contrairement à celle obtenue par la contrainte et la menace. L'obéissance intelligente demande aussi de réajuster en permanence ses exigences en fonction de l'âge de l'enfant. Car le rôle des parents est d'accompagner leur enfant jusqu'au point où il va conquérir sa liberté. Or, ce passage ne se fait jamais dans la soumission.", "q": "Qu'explique le texte au sujet de l'éducation des enfants ?", "c": ["Elle doit se fonder sur l'estime mutuelle", "Elle s'obtient par le recours à l'autorité", "Elle passe par le suivi de règles immuables", "Elle repose dur la quête du bonheur"], "a": 0, "k": "basée sur le respect réciproque", "_sources": ["test3#30"]}, {"t": "La Commission Européenne était penchée sur la demande d'adhésion à l'Union de l'Islande moins de deux semaines après la requête, preuve que le pays possédait des atouts indéniables, jusqu'alors, l'Islande avait été peu disposée à entrer dans l'Union. Toutefois, suite à l'effondrement de ses principaux établissements financiers et à la chute du cours de la couronne, la monnaie islandaise, le pays avait vu dans cette adhésion et dans l'adoption de l'euro un moyen de stabiliser son économie. Pour le président de l'Union, cette volonté d'intégrer l'espace européen renforçait la crédibilité du projet communautaire de l'ancien continent. L'Islande avait fini par retirer sa demande suite à un changement de gouvernement et pour éviter des sujets épineux comme les quotas de pêche.", "q": "Selon cet article, pourquoi l'Islande avait-elle souhaité entrer dans l'Union Européenne ?", "c": ["Pour bénéficier des aides financières de l'Union", "Pour mieux contrôler ses établissements financiers", "Pour redonner de la valeur à la monnaie nationale", "Pour sortir de la crise que son économie subissait"], "a": 3, "k": "l'adoption de l'euro un moyen de stabiliser son économie.", "_sources": ["test3#32"]}, {"t": "Le terme « famille monoparentale » évoque le plus souvent les mères qui élèvent seules leurs enfants, éludant la réalité des pères confrontés à cette situation. Le développement de la garde alternée a conduit les pères à faire face à des situations auxquelles ils n'étaient pas forcément préparés. De même que les femmes qui élèvent seules leurs enfants sont parfois démunies par l'absence du père, notamment pour exercer leur autorité, certains hommes ont du mal à trouver leur juste place. Ces hommes font encore l'objet d'un regard particulier de la société. Contrairement aux mères, ils doivent très souvent justifier leur statut. On considère encore qu'un enfant, dans les premières années de sa vie, ne peut grandir correctement qu'en présence d'une figure maternelle.", "q": "Quelle est l'idée abordée par le texte ?", "c": ["L'absence du père oblige les mères à mettre leur vie affective entre parenthèses", "La société actuelle accepte mal qu'un enfant soit élevé uniquement par son père", "Les pères considèrent que l'absence de la mère doit être absolument compensée", "Les pères seuls reconstruisent vite une vie de couple après une séparation"], "a": 1, "k": "Ces hommes font encore l'objet d'un regard particulier de la société.", "_sources": ["test3#33", "test9#34"]}, {"t": "\" faut te le dire en quelle langue ?\"\nCette question, que des milliers de mères posent à leur enfant lorsqu'elles veulent se faire écouter, est en fait très sensée (comme tout ce que disent les mères). Des travaux scientifiques récents ont en effet démontré une réalité étonnante : nous réfléchissons et prenons des décisions différemment lorsque nous traitons l'information dans une autre langue que notre langue maternelle. Nous comprenons tout aussi bien l'idée ou le problème mais, lorsque nous utilisons une autre langue, le résultat est plus réfléchi, moins dicté par les émotions, plus orienté vers l'utilité.", "q": "Que permet l'utilisation d'une langue autre que la langue maternelle ?", "c": ["D'attirer l'attention de l'interlocuteur", "D'imaginer des solutions originales", "De solliciter davantage la raison", "De trouver des réponses rapides"], "a": 2, "k": "le résultat est plus réfléchi, moins dicté par les émotions, plus orienté vers l'utilité", "_sources": ["test6#31"]}, {"t": "Au début de l'adolescence, vers 11-12 ans, les enfants aspirent à l'autonomie. C'est à cette période que les écrans jouent un rôle important au niveau de leur intégration sociale mais aussi que les risques d'excès se profilent. Les parents doivent abandonner leur position de prescription et passer à une position d'accompagnement. Le docteur Huerre leur recommande donc d'explorer avec leur enfant les jeux qui l'intéressent et la manière qu'il a de circuler sur la toile, afin de faciliter les échanges. Au lieu d'avoir peur des jeux vidéo, demandez-lui de vous les montrer et n'hésitez pas à jouer avec lui. Certains procurent un réel plaisir visuel et esthétique.", "q": "Que préconise le médecin aux parents ?", "c": ["De participer à l'exploration du monde numérique.", "De restreindre le temps consacré aux jeux vidéo.", "De sélectionner des contenus adaptés aux enfants.", "De surveiller la navigation des jeunes sur la toile."], "a": 0, "k": "d'explorer avec leur enfant les jeux qui l'intéressent", "_sources": ["test8#32"]}, {"t": "Un cabinet de conseil en énergie annonce que des coupures de courant sont à prévoir cet hiver dans l'Hexagone. En effet, l'Allemagne, qui approvisionne la France en électricité, ne sera plus capable de le faire face à la demande en raison de la fermeture de certains de ses réacteurs nucléaires. Le gouvernement pourrait appeler au « civisme » des Français, leur demandant de modérer la consommation électrique des foyers, qui atteint des pics quotidiens autour de 19h. pourtant, la France possède l'un des plus grands parcs nucléaires du monde, mais elle exporte la quasi-totalité de l'énergie produite.", "q": "Pourquoi y a-t-il des risques de coupures de courant ?", "c": ["Parce que des tests sur les réacteurs nucléaires sont en cours.", "Parce que l'approvisionnement en électricité est compromis.", "Parce que la production française couvre à peine les besoins nationaux.", "Parce que la régulation de la consommation d'énergie est inefficace."], "a": 1, "k": "l'Allemagne... ne sera plus capable de le faire face à la demande en raison de la fermeture de certains de ses réacteurs nucléaires", "_sources": ["test10#34"]}, {"t": "La Commission européenne s'était penchée sur la demande d'adhésion à l'Union de l'Islande moins de deux semaines après la requête, preuve que le pays possédait des atouts indéniables. Jusqu'alors, l'Islande avait été peu disposée à entrer dans l'Union. Toutefois, suite à l'effondrement de ses principaux établissements financiers et à la chute du cours de la couronne, la monnaie islandaise, le pays avait vu dans cette adhésion et dans l'adoption de l'euro un moyen de stabiliser son économie. Pour le président de l'Union, cette volonté d'intégrer l'espace européen renforçait la crédibilité du projet communautaire de l'ancien continent. L'Islande avait fini par retirer sa demande suite à un changement de gouvernement et pour éviter des sujets épineux comme les quotas de pêche.", "q": "Selon cet article, pourquoi l'Islande avait-elle souhaité entrer dans l'Union Européenne ?", "c": ["Pour bénéficier des aides financières de l'Union.", "Pour mieux contrôler ses établissements financiers.", "Pour redonner de la valeur à la monnaie nationale.", "Pour sortir de la crise que son économie subissait."], "a": 3, "k": "l'adoption de l'euro un moyen de stabiliser son économie.", "_sources": ["test11#33"]}, {"t": "\"Il faut te le dire en quelle langue ?\"\nCette question, que des milliers de mères posent à leur enfant lorsqu'elles veulent se faire écouter, est en fait très sensée (comme tout ce que disent les mères). Des travaux scientifiques récents ont en effet démontré une réalité étonnante : nous réfléchissons et prenons des décisions différemment lorsque nous traitons l'information dans une autre langue que notre langue maternelle. Nous comprenons tout aussi bien l'idée ou le problème mais, lorsque nous utilisons une autre langue, le résultat est plus réfléchi, moins dicté par les émotions, plus orienté vers l'utilité.", "q": "Que permet l'utilisation d'une langue autre que la langue maternelle ?", "c": ["A) D'attirer l'attention de l'interlocuteur.", "B) D'imaginer des solutions originales.", "C) De solliciter davantage la raison.", "D) De trouver des réponses rapides."], "a": 2, "k": "le résultat est plus réfléchi, moins dicté par les émotions", "_sources": ["test13#31"]}, {"t": "Il faut te le dire en quelle langue ?\nCette question, que des milliers de mères posent à leurs enfants lorsqu'elles veulent se faire écouter, est en fait très sensée (comme tout ce que disent les mères). Des travaux scientifiques récents ont en effet démontré une réalité étonnante : nous réfléchissons et prenons des décisions différemment lorsque nous traitons l'information dans une autre langue que notre langue maternelle. Nous comprenons tout aussi bien l'idée ou le problème mais, lorsque nous utilisons une autre langue, le résultat est plus réfléchi, moins dicté par les émotions, plus orienté vers l'utilité.", "q": "Que permet l'utilisation d'une langue autre que la langue maternelle ?", "c": ["D'attirer l'attention de l'interlocuteur.", "D'imaginer des solutions originales.", "De solliciter davantage la raison.", "De trouver des réponses rapides."], "a": 2, "k": "le résultat est plus réfléchi, moins dicté par les émotions", "_sources": ["test21#31"]}, {"t": "Le désintérêt pour la lecture chez un grand nombre d'enfants peut être expliqué par plusieurs facteurs. Tout d'abord, beaucoup d'enfants abandonnent la lecture lorsqu'ils réalisent que d'autres élèves sont plus avancés qu'eux. De plus, lorsqu'on demande à l'enfant non seulement de lire, mais aussi de comprendre, il peut perdre son intérêt. En général, l'absence de compréhension est associée à un manque de plaisir. Selon certains psychologues, les enfants ont du mal à comprendre parce qu'ils ont des lacunes en culture générale. Cependant, la culture générale s'acquiert justement en lisant. Cela crée un cercle vicieux difficile à briser. Pour sortir de ce cercle vicieux, les psychologues recommandent de mettre à la disposition des enfants des livres adaptés à leur niveau de compréhension et à leurs centres d'intérêt.", "q": "Selon ce texte, quelle est l'une des raisons qui découragent les enfants de lire ?", "c": ["La difficulté d'accéder au sens.", "La pression exercée par la famille.", "Les méthodes d'enseignement.", "Les moqueries de leurs camarades."], "a": 0, "k": "l'absence de compréhension est associée à un manque de plaisir", "_sources": ["test24#33"]}, {"t": "Il est important d'alimenter l'imagination des enfants. Dans cette perspective, les matériaux les moins finis sont plus intéressants que les jouets sophistiqués, car ils laissent à l'enfant l'espace nécessaire pour tenter de les transformer et pour développer ses capacités créatives. Il importe également de tenir compte du caractère de chaque enfant. Certains sont entreprenants, d'autres plus contemplatifs. Cela ne signifie pas qu'ils ont un monde intérieur moins riche, mais que leur créativité s'exprime davantage dans la rêverie que dans l'action. Alimenter l'imagination des enfants, c'est leur ménager des moments d'ennui où ils auront à se remplir de leur inspiration.", "q": "Selon cet article, que faut-il faire pour stimuler l'imagination des enfants ?", "c": ["Leur donner le gout de l'observation.", "Leur permettre d'inventer des activités.", "Leur procurer des jeux éducatifs.", "Leur proposer des énigmes à résoudre."], "a": 1, "k": "leur ménager des moments d'ennui", "_sources": ["test26#33"]}, {"t": "LES REQUINS N'ONT PAS FINI DE NOUS SURPRENDRE !\nTapis dans les fonds océaniques d'Amérique du Nord, les requins-houle possèdent une peau marron ou grisâtre à deux tons, l'un foncé et l'autre clair. Une équipe de chercheurs américains a découvert une molécule fabriquée exclusivement dans les zones claires de leur peau : elle absorbe la lumière bleue la seule à subsister à une telle profondeur - pour émettre du vert. Les requins se parent alors, dans le noir des profondeurs, de motifs vert fluorescent auxquels ils sont particulièrement sensibles. « Comme leur vision se limite précisément aux couleurs bleu et vert, ce phénomène pourrait aider les individus à s'identifier », présume Jason Crawford, de l'université de Yale.", "q": "Quelle hypothèse font les chercheurs sur les requins-houle ?", "c": ["Ils changent d'apparence en cas de danger", "Ils produisent une substance chimique nocive", "Ils se déplacent principalement en groupe", "Ils sont capables de se reconnaître entre eux"], "a": 3, "k": "ce phénomène pourrait aider les individus à s'identifier", "_sources": ["test34#30"]}, {"t": "Le désintérêt pour la lecture d'un grand nombre d'enfants a plusieurs facteurs d'explication. D'abord, beaucoup d'enfants délaissent la lecture quand ils s'aperçoivent que d'autres élèves sont meilleurs qu'eux. Ensuite, c'est lorsque l'on demande à l'enfant non seulement de déchiffrer mais aussi de comprendre, qu'il lâche prise. Absence de compréhension rime en général avec manque de plaisir. Selon certains psychologues, si les enfants peinent à comprendre, c'est parce qu'ils ont des lacunes de culture générale. Or, celle-ci s'acquiert justement en lisant. Comment sortir de ce cercle vicieux ? Les psychologues conseillent de mettre des livres en évidence à la maison et d'introduire, à l'école, des temps de lecture « plaisir », où chaque enfant peut se plonger dans l'ouvrage de son choix.", "q": "Selon ce texte, quelle est l'une des raisons qui découragent les enfants de lire ?", "c": ["La difficulté d'accéder au sens", "La pression exercée par la famille", "Les méthodes d'enseignement", "Les moqueries de leurs camarades"], "a": 0, "k": "Absence de compréhension rime en général avec manque de plaisir.", "_sources": ["test34#33"]}, {"t": "Le philosophe Glenn Albrecht a deux passions : observer les oiseaux et inventer des mots. Son goût de la langue lui vient de sa mère, « femme au foyer, qui adorait les mots croisés et le Scrabble ». Mais si l'homme, 67 ans ce mois-ci, se régale à créer des néologismes, il y voit aussi une stratégie politique. « Ce que nous faisons subir à la Terre est sans précédent dans l'histoire de l'humanité. Cela crée en nous des émotions pour lesquelles nous n'avons pas encore de mots. Or, si nous voulons agir, il faut pouvoir les décrire précisément », affirme-t-il. Une assertion que ne démentira pas le philosophe français Baptiste Morizot, pour qui « les néologismes sont des cartes pour explorer autrement le monde qui vient ».", "q": "Selon ce texte, à quoi s'attache Glenn Albrecht ?", "c": ["À la protection de la biodiversité.", "À la transmission de souvenirs.", "À l'abolition des frontières.", "À l'enrichissement du lexique."], "a": 3, "k": "inventer des mots", "_sources": ["test35#31"]}, {"t": "Un cabinet de conseil en énergie annonce que des coupures de courant sont à prévoir cet hiver dans l'Hexagone. En effet, l'Allemagne, qui approvisionne la France en électricité, ne sera plus capable de faire face à la demande en raison de la fermeture de certains de ses réacteurs nucléaires. Le gouvernement pourrait appeler au civisme des Français, leur demandant de modérer la consommation électrique des foyers, qui atteint des pics quotidiens autour de 19 h. Pourtant, la France possède l'un des plus grands parcs nucléaires du monde, mais elle exporte la quasi-totalité de l'énergie produite\n\nD'après www.gro.fr", "q": "Pourquoi y'a-t-il des risques de coupures de courant ?", "c": ["Parce que des tests sur les réacteurs nucléaires sont en cours.", "Parce que l'approvisionnement en électricité est compromis.", "Parce que la production française couvre à peine les besoins nationaux.", "Parce que la régulation de la consommation d'énergie est inefficace."], "a": 1, "k": "l'Allemagne, qui approvisionne la France en électricité, ne sera plus capable de faire face à la demande", "_sources": ["test37#35"]}, {"t": "« Il faut te le dire en quelle langue ? » Cette question, que des milliers de mères posent à leur enfant lorsqu'elles veulent se faire écouter, est en fait très sensée (comme tout ce que disent les mères). Des travaux scientifiques récents ont en effet démontré une réalité étonnante : nous réfléchissons et prenons des décisions différemment lorsque nous traitons l'information dans une autre langue que notre langue maternelle. Nous comprenons tout aussi bien l'idée ou le problème, mais, lorsque nous utilisons une autre langue, le résultat est plus réfléchi, moins dicté par les émotions, plus orienté vers l'utilité.", "q": "Que permet l'utilisation d'une langue autre que la langue maternelle ?", "c": ["D'attirer l'attention de l'interlocuteur.", "D'imaginer des solutions originales.", "De solliciter davantage la raison.", "De trouver des réponses rapides."], "a": 2, "k": "le résultat est plus réfléchi, moins dicté par les émotions, plus orienté vers l'utilité", "_sources": ["test39#31"]}, {"t": "Dans leur nouvelle collection, les éditions Nil invitent des auteurs à se livrer à un exercice épistolaire intime en écrivant une lettre pour dire l'indicible. Le modèle est celle que Kafka rédigea à l'intention de son père et qu'il préféra ranger dans un tiroir tant l'accusation portée était peu amène.\nAvec l'Autre fille, missive adressée à sa sœur ainée, morte avant sa naissance, Annie Ernaux inaugure brillamment le concept, fidèle à son écriture tranchante et analytique. Rejetant le terme d'autofiction, l'écrivain se dit fascinée par la réalité, partant à la recherche d'une vérité sur une mort que ses parents lui ont toujours cachée. En demandant à des auteurs de se libérer d'un vieux tourment, la collection souhaite réhabiliter un genre littéraire oublié.", "q": "À quel résultat la participation à cette collection conduit-elle Annie Ernaux ?", "c": ["À s'acquitter d'un engagement moral", "À s'affranchir d'une histoire ancienne", "À se défaire d'un sentiment de culpabilité", "À se justifier d'une action peu glorieuse"], "a": 1, "k": "partant à la recherche d'une vérité sur une mort que ses parents lui ont toujours cachée", "_sources": ["test2#37"]}, {"t": "Dans leur nouvelle collection, les éditions Nil invitent des auteurs à se livrer à un exercice Epistolaire intime en écrivant une lettre pour dire l'indicible. Le modèle est celle que Kafka rédigea à l'intention de son père et qu'il préféra ranger dans un tiroir tant l'accusation portée était peu amène.\nAvec L'Autre fille, missive adressée à sa sœur ainée, morte avant sa naissance, Annie Ernaux inaugure brillamment le concept, fidèle à son écriture tranchante et analytique. Rejetant le terme d'autofiction, l'écrivain se dit fascinée par la réalité, partant à la recherche d'une vérité sur une mort que ses parents lui ont toujours cachée. En demandant à des auteurs de se libérer d'un vieux tourment, la collection souhaite réhabiliter un genre littéraire oublié.", "q": "À quel résultat la participation à cette collection conduit-elle Annie Ernaux ?", "c": ["À s'acquitter d'un engagement moral.", "À s'affranchir d'une histoire ancienne.", "À se défaire d'un sentiment de culpabilité.", "À se justifier d'une action peu glorieuse."], "a": 1, "k": "partant à la recherche d'une vérité sur une mort que ses parents lui ont toujours cachée.", "_sources": ["test11#37"]}, {"t": "Qu'est-ce que la « banquise » ? Un amas de glace flottante, un peu comme un glaçon géant. D'ailleurs, ce mot nous fait spontanément penser à un banc de glace. On parle bien de banquette, alors pourquoi pas de banquise ? Hélas, l'origine du mot est tout autre.\nEn fait, on devrait plutôt dire « panquise », puisque le mot provient d'une vieille langue scandinave, le norrois, dans laquelle un « pakkis » est un bloc de glace. Le début du mot appartiendrait à la famille de « paquet » et le «-is » final signifie « glace » dans de nombreuses langues du Nord. Alors bien sûr, c'est la proximité du mot français « banc» qui a prêté à confusion.", "q": "Qu'apprend-on dans cet article ?", "c": ["«Banquise» est un bon exemple d'une traduction fidèle.", "Il est facile d'attribuer une étymologie erronée à un mot.", "Il y a des différences subtiles entre les dialectes nordiques.", "Les linguistes déplorent les mutations du lexique scandinave."], "a": 1, "k": "c'est la proximité du mot français « banc» qui a prêté à confusion.", "_sources": ["test11#38"]}], "devoirs": [{"t": "Mara Maudet, à son arrivée en France, constate que la politique d'insertion des foyers démunis et celle dédiée à la petite enfance sont déconnectées l'une de l'autre. Pour cette Brésilienne « un parent sans emploi doit être prioritaire pour obtenir une place de crèche. » Tout le contraire des critères actuels. Elle crée alors l'IRPC (Institut d'éducation et des pratiques citoyennes) et constitue un réseau de crèches associatives dont le principe est qu'en échange d'une place pour son enfant sur une plage de 13 heures, le parent célibataire – le plus souvent des mères – s'engage à trouver un emploi dans les mois suivants. Il bénéficie alors, dans les locaux de la crèche, d'un accompagnement professionnel personnalisé.", "q": "Quel est l'objectif de l'IEPC ?", "c": ["Embaucher des parents défavorisés", "Faciliter l'intégration professionnelle", "Proposer des tarifs préférentiels en crèche", "Trouver un accueil provisoire pour les enfants"], "a": 1, "k": "s'engage à trouver un emploi dans les mois suivants", "_sources": ["test14#38"]}, {"t": "Mara Maudet, à son arrivée en France, constate que la politique d'insertion des foyers démunis et celle dédiée à la petite enfance sont déconnectées l'une de l'autre.\nElle crée alors l'IEPC (Institut d'éducation et des pratiques citoyennes) et constitue un réseau de crèches associatives dont le principe est qu'en échange d'une place pour son enfant sur une plage horaire de 13 heures, le parent célibataire… s'engage à trouver un emploi dans les mois suivants.", "q": "Quel est l'objectif de l'EPC ?", "c": ["Embaucher des parents défavorisés.", "Faciliter l'intégration professionnelle.", "Proposer des tarifs préférentiels en crèche.", "Trouver un accueil provisoire pour les enfants."], "a": 1, "k": "le parent célibataire s'engage à trouver un emploi dans les mois suivants", "_sources": ["test16#39"]}, {"t": "Fille ou garçon ? L'attribution d'un genre à la naissance est ancrée dans le quotidien des maternités. Or, 1,7 % des nouveau-nés ne possèdent pas les caractéristiques sexuelles qui correspondent aux définitions classiques du « masculin » ou du « féminin » (anatomiques, génitales ou chromosomiques). À l'âge de 9 mois, en moyenne, on opère l'enfant pour le faire entrer dans la norme. Une pratique de plus en plus contestée. En Albanie, le ministère de la Santé a approuvé, le 26 juin, un protocole interdisant les interventions chirurgicales sur ces enfants nés intersexes sauf si l'opération est nécessaire pour des raisons médicales. Si le médecin refuse, il peut alors être radié et devoir rendre des comptes au pénal. L'Albanie devient ainsi le troisième pays européen à instaurer la mesure, après Malte et le Portugal.", "q": "Quelle est la position de l'Albanie par rapport aux autres pays européens sur la question des enfants intersexes ?", "c": ["Elle est en avance sur la protection de leurs droits", "Elle est en retard sur la prise en charge de leur santé", "Elle est en accord avec la majorité des pratiques médicales", "Elle est en conflit avec les recommandations internationales"], "a": 0, "k": "troisième pays européen à instaurer la mesure", "_sources": ["test18#36"]}, {"t": "Aujourd'hui, de nombreux enfants cumulent les activités en dehors des cours. Selon une étude, l'origine de cette tendance serait liée aux mutations sociales contemporaines. Ainsi, recourir à de telles activités serait un moyen pour les parents de pallier l'absence des mères - de plus en plus souvent actives - et de développer les compétences des enfants pour les armer face à la compétitivité du marché du travail. Ce pendant, coûteuses en temps et en énergie, ces activités empiètent sur le quotidien de la maison et épuisent les enfants. Elles n'en apparaissent pas moins aux parents comme des marqueurs de leur bonne parentalité. Un phénomène qui s'entretient par l'expansion constante de l'offre ainsi que par la surenchère qui s'instaure entre les foyers.", "q": "Que veulent faire les parents ?", "c": ["Améliorer les résultats scolaires.", "Avoir plus de temps pour eux.", "Resserrer les liens familiaux.", "Se donner bonne conscience."], "a": 3, "k": "apparaissent pas moins aux parents comme des marqueurs de leur bonne parentalité", "_sources": ["test19#39"]}]}, "Loisirs": {"cours": [{"t": "Parcourir les routes d'Europe l'été, beaucoup de touristes le font sans forcément connaitre les règles en vigueur dans chacun des pays. Ce qu'il faut savoir, c'est qu'il existe des différences qui peuvent être notables selon les législations. Alors que la vitesse maximale sur autoroute est de 130 km/h en France, elle n'est que de 120 km/h en Belgique, en Espagne, ou au Portugal. Quant aux taux d'alcoolémie toléré, il varie de 0.8g/l en Irlande à zéro en République Tchèque.", "q": "Que fait l'auteur de cet article ?", "c": ["Il commente une loi.", "Il donne un conseil.", "Il formule une plainte.", "Il raconte une anecdote."], "a": 1, "k": "Ce qu'il faut savoir, c'est qu'il existe des différences qui peuvent être notables selon les législations.", "_sources": ["test4#30"]}, {"t": "Chaque année, le 10 août, les cordons bleus de l'île de la Guadeloupe se retrouvent à Pointe-à-Pitre pour célébrer saint Laurent, leur patron. Après une grande messe donnée à l'église de Saint-Pierre-et-Saint-Paul, une procession de cuisinières vêtues de leurs plus beaux madras sillonne la ville avant de convier la population à un grand festin composé des meilleurs plats créoles. Située dans le village du Gosier, à proximité de Pointe-à-Pitre, l'Auberge de la Vieille Tour construite autour d'un moulin à vent du XVIIIe siècle, sera un lieu de séjour idéal pour assister à cette manifestation haute en couleur et pour goûter au vrai parfum des Antilles.", "q": "La fête Saint Laurent à Pointe-à-Pitre …", "c": ["Consiste en un grand événement religieux", "Permet de découvrir les saveurs antillaises", "Se réduit à une manifestation pour touristes", "Se déroule dans un ancien monument restauré"], "a": 1, "k": "convier la population à un grand festin composé des meilleurs plats créoles", "_sources": ["test6#30"]}, {"t": "Le partage d'expérience d'Adeline et de Jérôme\nAdeline et Jérôme ont créé Pyrénées-randonnées, qui propose un ensemble d'itinéraires dans ces montagnes, accompagnés de leurs photos personnelles et du tracé sur la carte. Animé depuis Bordeaux où ils étudient, le blog est étoffé à chacune de leurs vacances. On y trouve aussi des informations sur la météo, l'équipement nécessaire, comment s'orienter... Un blog destiné à partager, échanger, faire des rencontres, souvent virtuelles. Et se faire plaisir.", "q": "Qui sont Adeline et Jérôme ?", "c": ["Des blogueurs professionnels.", "Des étudiants en climatologie.", "Des guides de montagne.", "Des passionnés de randonnée."], "a": 3, "k": "le blog est étoffé à chacune de leurs vacances", "_sources": ["test9#31"]}, {"t": "\"Saccage du patrimoine italien\", \"Barbie\" des temps modernes. Depuis le lancement de la campagne publicitaire du ministère italien du Tourisme destinée à attirer les touristes étrangers le 20 avril dernier, de nombreux commentaires acerbes pullulent pour dénoncer le choix d'un des symboles du patrimoine transalpin : la Vénus de Sandro Botticelli transformée en influenceuse, indique le Daily Mail.", "q": "Quelle est la critique principale faite à la campagne publicitaire du ministère italien du Tourisme ?", "c": ["Elle utilise une image de la Vénus de Botticelli qui n'est pas fidèle à l'original.", "Elle fait d'une icône de l'art italien une vedette des réseaux sociaux.", "Elle ignore le contexte historique et culturel de la Vénus de Botticelli.", "Elle ne montre pas assez la diversité des paysages et des monuments italiens."], "a": 1, "k": "transformée en influenceuse", "_sources": ["test18#34"]}, {"t": "Chaque année, le 10 août, les habitants de l'île de la Guadeloupe se retrouvent à Pointe-à-Pitre pour célébrer Saint Laurent, leur patron. Après une grande messe donnée à l'église de Saint Laurent, une procession de cuisinières vêtues de leurs plus beaux madras sillonne la ville avant de convier la population à un grand festin composé des meilleurs plats créoles. Située dans le village du Gosier, à proximité de Pointe-à-Pitre, l'Auberge de la Vieille Tour, construite autour d'un moulin à vent du XVIIIe siècle, sera un lieu de séjour idéal pour assister à cette manifestation haute en couleur et pour goûter au vrai parfum des Antilles.", "q": "La célébration de saint Laurent à Pointe-à-Pitre…", "c": ["consiste en un grand évènement religieux.", "permet de découvrir les saveurs antillaises.", "se réduit à une manifestation pour touristes.", "se déroule dans un ancien monument restauré."], "a": 1, "k": "goûter au vrai parfum des Antilles", "_sources": ["test19#30", "test37#30"]}, {"t": "Une surenchère médiatique accable le tourisme d'activité sympathique, il devient une cible à abattre. Pourtant, depuis la généralisation des congés payés, le tourisme représente une expression positive de la société de consommation. Il a permis à des millions de personnes de visiter d'autres territoires. Il n'y a pas de « surtourisme ». il n'y a que des personnes qui ne savent pas gérer les équilibres de leurs territoires. La cause ? L'appât du gain. Tous les maillons de la chaîne sont concernés : élus qui votent des plans de développement massifs, professionnels qui veulent leur part du gâteau sans penser à la saturation, habitants qui profitent de la flambée immobilière pour vendre leur bien à prix d'or.", "q": "Que déplore l'auteur de cet article ?", "c": ["La pénurie de logement liée à la présence des touristes.", "L'avidité financière des acteurs du secteur touristique.", "Le mépris des touristes pour les considérations écologiques.", "L'exclusion des classes populaires des activités touristiques."], "a": 1, "k": "L'appât du gain", "_sources": ["test32#33"]}, {"t": "Une surenchère médiatique accable le tourisme : d'activité sympathique, il devient une cible à abattre. Pourtant, depuis la généralisation des congés payés, le tourisme représente une expression positive de la société de consommation. Il a permis à des millions de personnes de visiter d'autres territoires. Il n'y a pas de « surtourisme ». Il n'y a que des personnes qui ne savent pas gérer les équilibres de leurs territoires. La cause ? L'appât du gain. Tous les maillons de la chaîne sont concernés : élus qui votent des plans de développement massifs, professionnels qui veulent leur part du gâteau sans penser à la saturation, habitants qui profitent de la flambée immobilière pour vendre leur bien à prix d'or.", "q": "Que déplore l'auteur de cet article ?", "c": ["La pénurie de logement liée à la présence des touristes", "L'avidité financière des acteurs du secteur touristique", "Le mépris des touristes pour les considérations écologiques", "L'exclusion des classes populaires des activités touristiques"], "a": 1, "k": "La cause ? L'appât du gain.", "_sources": ["test34#34"]}, {"t": "C'est un fait : le football en France ne fait pas déplacer grand monde. Certains s'en étonnent ; or c'est l'inverse qui devrait étonner. Au fond, quel intérêt y a-t-il à aller au stade ? Pour de véritables supporters, c'est le désir de manifester son amour à une équipe soutenue, de se fondre dans une masse plus ou moins chaleureuse et grégaire. Mais pour les autres ? En fait, d'un point de vue strictement footballistique, on ne voit pas. Les tribunes font ressentir le drôle de paradoxe de se trouver très près de l'événement, plus près qu'on ne l'a jamais été au point d'entendre les joueurs s'exclamer contre une décision arbitrale, tout en se sentant complètement à l'écart de l'action, orphelin des plans serrés et des ralentis étoffés de commentaires parfois éclaircissants.", "q": "Selon cet article, qu'est-ce qui explique la baisse de fréquentation des stades ?", "c": ["La concurrence de reportages en direct.", "La finesse de l'humour présent dans la pièce.", "La diminution du nombre de fans.", "Le rajeunissement des spectateurs."], "a": 0, "k": "orphelin des plans serrés et des ralentis étoffés de commentaires parfois éclaircissants", "_sources": ["test10#39"]}, {"t": "On connaissait les vélos en acier, en alliage d'aluminium, en carbone ou même en titane. On peut désormais y ajouter le bambou. Le principal avantage de ce matériau c'est qu'il est léger, sa résistance à la traction serait même sensiblement supérieure à celle de l'acier. Il offre aussi une bonne élasticité qui absorbe mieux les vibrations, un argument qui n'est pas à sous-estimer quand on ambitionne de s'attaquer aux pistes africaines et c'est précisément la vocation de ce projet de fabrication massive de bicyclettes en bambou à destination du continent africain. Pour le promoteur du projet, plus de 600 000 foyers pourraient être intéressés par ce produit dont le prix de vente est estimé à 55 dollars, un coût encore élevé pour le marché local.", "q": "Quelles caractéristiques de ce vélo intéressent les Africains ?", "c": ["Sa longévité.", "Sa rigidité.", "Sa robustesse.", "Son prix d'achat."], "a": 2, "k": "sa résistance à la traction serait même sensiblement supérieure à celle de l'acier", "_sources": ["test12#37"]}, {"t": "Faire cohabiter vie citadine haletante et déconnexion en pleine nature sur le même emploi du temps : voilà ce que propose la micro-aventure. Popularisé par l'aventurier britannique Alastair Humphreys, ce terme caractérise une aventure courte et accessible, pour « les gens qui ont des vies normales ». Le concept est simple : plutôt que de tirer un trait sur sa soif de voyage, il est envisageable d'en réduire l'échelle pour bousculer son quotidien. Ouvrir la porte et partir à l'aventure, passer une nuit ou deux dehors, suffirait même si on habite en ville. Pour ceux qui persistent à croire que la véritable aventure se trouve à l'autre bout du monde, ce concept représente une douce piqûre de rappel.", "q": "Que démontre Alastair Humphreys avec le concept de micro-aventure ?", "c": ["Il est déconseillé de rester enfermé chez soi.", "Il est inutile de partir loin pour être dépaysé.", "Il faut organiser les voyages avec des proches.", "Il suffit d'apprendre à profiter du quotidien."], "a": 1, "k": "plutôt que de tirer un trait sur sa soif de voyage, il est envisageable d'en réduire l'échelle", "_sources": ["test20#38"]}, {"t": "De nombreuses destinations prisées des touristes s'inquiètent des foules sans cesse plus denses qui viennent les envahir. Dégradation et usure des sites, exclusion des populations locales : la manne financière apportée par ces hordes de visiteurs ne suffit plus à calmer les mécontents, et la sensibilité croissante au gâchis énergétique allonge l'acte d'accusation. Le tourisme de masse avait accompagné et symbolisé la démocratisation des loisirs et le rapprochement des peuples. Il se trouve désormais dans une impasse après avoir pris la forme de monstrueuses migrations dont le principe n'est plus de découvrir et de s'ouvrir, mais de se désennuyer.", "q": "Selon l'article, que recherchent ceux qui font du tourisme ?", "c": ["À diminuer leur empreinte écologique.", "À échapper à la banalité du quotidien.", "À participer à l'essor économique des pays visités.", "À s'enrichir au contact de nouvelles civilisations."], "a": 1, "k": "son principe n'est plus de découvrir et de s'ouvrir, mais de se désennuyer", "_sources": ["test23#39"]}, {"t": "Le tourisme en France a longtemps été perçu comme un filon, mais il pourrait à l'avenir se transformer en calamité : celle du « surtourisme ». Ce phénomène résulte d'une mauvaise gestion de foules sans cesse plus nombreuses qui pourraient bientôt toucher la France, où le nombre de sites mythiques sont inadaptés à une affluence en forte croissance, le Louvre et la tour Eiffel, à Paris, en tête. « L'objectif de 100 millions de touristes par an pourrait bien être atteint, précise un directeur d'agence organisant des séjours en France. Mais, en l'absence de tout aménagement et alors que 20 % du pays accueillent 80 % des touristes, cela pourrait devenir un danger. »", "q": "Qu'apprend-on au sujet du « surtourisme » ?", "c": ["Il est à l'origine d'une politique de diminution des flux.", "Il nécessite une réorganisation des lieux les plus visités.", "Il permet de répartir les voyageurs sur tout le territoire.", "Il suscite l'engouement des professionnels du secteur."], "a": 1, "k": "le nombre de sites mythiques sont inadaptés à une affluence en forte croissance", "_sources": ["test28#39"]}, {"t": "L'individualisme a souvent mauvaise presse dans les discours actuels. On a tendance à lui imputer tous les maux de nos sociétés : égoïsme, compétition, exclusion, communautarisme, voire déliquescence morale... Erreur, explique le sociologue François de Singly dans un petit essai percutant. « On assimile l'individualisme à ces réactions adolescentes du type j'ai bien le droit de faire ce que je veux », alors qu'il est tout le contraire. Fruit d'une pensée élaborée depuis la Renaissance, l'individualisme est un projet de société dans lequel chacun devrait trouver les meilleures conditions de son épanouissement.", "q": "Qu'explique François de Singly à propos de l'individualisme ?", "c": ["Il appartient à une réflexion philosophique.", "Il fait souvent la une des journaux.", "Il résulte des modes de vie contemporains.", "Il véhicule des valeurs obsolètes."], "a": 0, "k": "Fruit d'une pensée élaborée depuis la Renaissance", "_sources": ["test32#37"]}], "devoirs": []}, "Environnement": {"cours": [{"t": "Quel visage Paris pourrait-il prendre en 2100 ? c'est ce que le collectif d'architectes « Et alors … » a imaginé au travers de vingt cartes postales géantes, exposées à Paris. Ce qui donne un résultat surprenant. Parfois utopique, parfois réaliste.\nAinsi l'idée d'une centrale hydrothermique pour chauffer et refroidir tout un quartier, projet de la Compagnie Parisienne du Chauffage Urbain. Des potager « partagés » au pied des immeubles en plein centre-ville, cela ressemble plus à un clin d'œil malicieux …\nLe vélo a également la part belle : les architectes imaginent des voies rapides sur les toits de Paris, ai milieu de toitures végétalisées et jardins.", "q": "Quel projet est présenté comme réaliste ?", "c": ["L'extension d'un système de climatisation à tout un quartier", "L'installation de parcs sur les toits des bâtiments parisiens", "La construction de pistes cyclable
