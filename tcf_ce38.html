<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF Compréhension Écrite – Test 38</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 1rem;
  }
  #app { max-width: 860px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1px solid #e0ddd5;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  .header-logo img { height: 48px; display: block; }
  .header-right { text-align: right; }
  .header-title { font-size: 16px; font-weight: 700; color: #1a1a1a; }
  .header-sub { font-size: 12px; color: #888; margin-top: 2px; }

  .prog-wrap { margin-bottom: 1.1rem; }
  .prog-bar { height: 5px; background: #e0ddd5; border-radius: 3px; }
  .prog-fill { height: 100%; background: #1D9E75; border-radius: 3px; transition: width .35s; }
  .prog-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 11px;
    color: #888;
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: .85rem;
  }
  .btn {
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid #d0cdc5;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: #444;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #f0ede8; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-results {
    margin-left: auto;
    border-color: #0F6E56;
    color: #0F6E56;
    font-weight: 600;
  }
  .btn-results:hover { background: #e8f7f2; }

  .card {
    background: #fff;
    border: 1px solid #e0ddd5;
    border-radius: 12px;
    padding: 1.4rem 1.5rem;
  }

  .textbox {
    background: #f8f7f3;
    border-left: 3px solid #1D9E75;
    border-radius: 0 8px 8px 0;
    padding: 1rem 1.25rem;
    margin-bottom: 1.1rem;
    font-size: 15px;
    line-height: 1.85;
    color: #1a1a1a;
    width: 100%;
  }
  .textbox mark {
    background: #FAC775;
    color: #412402;
    border-radius: 3px;
    padding: 1px 3px;
    font-style: normal;
  }
  .key-label {
    font-size: 12px;
    color: #9A6200;
    background: #FEF3CD;
    border: 1px solid #FAC775;
    border-radius: 6px;
    padding: 4px 10px;
    display: inline-block;
    margin-bottom: .85rem;
  }
  .question { font-size: 16px; font-weight: 600; margin-bottom: .9rem; }
  .choices { display: flex; flex-direction: column; gap: 9px; margin-bottom: 1rem; }
  .choice {
    padding: 11px 15px;
    border: 1px solid #d0cdc5;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    width: 100%;
    text-align: left;
    transition: background .12s, border-color .12s;
  }
  .choice:hover:not(.correct):not(.wrong) { background: #f5f4f0; }
  .choice .badge { font-weight: 600; min-width: 22px; flex-shrink: 0; }
  .choice.correct { border-color: #0F6E56; background: #E1F5EE; color: #085041; }
  .choice.wrong   { border-color: #993C1D; background: #FAECE7; color: #4A1B0C; }
  .choice:disabled, .choice[data-done="1"] { cursor: default; }

  .feedback { border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: .5rem; }
  .feedback.ok { background: #E1F5EE; color: #085041; border: 1px solid #5DCAA5; }
  .feedback.ko { background: #FAECE7; color: #4A1B0C; border: 1px solid #F0997B; }

  /* Summary */
  .summary-card {
    background: #fff;
    border: 1px solid #e0ddd5;
    border-radius: 12px;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .summary-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 1.5rem; }
  .score-row { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .score-box { background: #f8f7f3; border: 1px solid #e0ddd5; border-radius: 10px; padding: 1rem 1.5rem; }
  .score-box .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .score-box .val { font-size: 28px; font-weight: 700; color: #1D9E75; }
  .score-box .val.amber { color: #BA7517; }
  .nclc-level {
    font-size: 36px;
    font-weight: 800;
    color: #BA7517;
    margin: .5rem 0;
  }
  .nclc-msg { font-size: 15px; color: #444; margin-bottom: 1.5rem; }

  .grid-wrap { margin: 1.2rem 0; }
  .grid-title { font-size: 13px; font-weight: 600; color: #666; margin-bottom: .5rem; }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .grid-cell {
    width: 36px; height: 36px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    border: none;
    transition: transform .1s;
  }
  .grid-cell:hover { transform: scale(1.1); }
  .grid-cell.g  { background: #E1F5EE; color: #085041; }
  .grid-cell.r  { background: #FAECE7; color: #4A1B0C; }
  .grid-cell.gy { background: #e8e6e0; color: #666; }

  .summary-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 1.2rem; }
  .btn-primary {
    padding: 9px 20px;
    border-radius: 8px;
    border: none;
    background: #1D9E75;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary:hover { background: #178a63; }
  .btn-outline {
    padding: 9px 20px;
    border-radius: 8px;
    border: 2px solid #1D9E75;
    background: #fff;
    color: #1D9E75;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-outline:hover { background: #e8f7f2; }
  .note { font-size: 11px; color: #aaa; margin-top: .8rem; }

  /* Report */
  .report-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
  }
  .report-header h2 { font-size: 20px; font-weight: 700; }
  .report-item {
    background: #fff;
    border: 1px solid #e0ddd5;
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
    margin-bottom: 1rem;
  }
  .report-qnum { font-size: 12px; color: #888; margin-bottom: .4rem; }
  .report-q { font-size: 15px; font-weight: 600; margin-bottom: .8rem; }
  .report-choice {
    padding: 8px 12px;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 5px;
    display: flex; align-items: center; gap: 8px;
  }
  .report-choice.c { background: #E1F5EE; color: #085041; border: 1px solid #5DCAA5; }
  .report-choice.w { background: #FAECE7; color: #4A1B0C; border: 1px solid #F0997B; }
  .report-choice.n { background: #f5f4f0; color: #555; border: 1px solid #e0ddd5; }
</style>

function render(i) {
  cur = i;
  saveState();
  var q = QQ[i], ua = ans[i], done = ua !== undefined;
  var textHtml = done ? hl(q.t, q.k) : esc(q.t).split("\n").join("<br>");
  var keyLabel = done ? "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>" : "";
  var pct = Math.round((i / QQ.length) * 100);
  var answered = countAnswered();

  var choicesHtml = "";
  var letters = ["A", "B", "C", "D"];
  for (var ci = 0; ci < q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    choicesHtml += "<button class=\"" + cls + "\" onclick=\"pick(" + i + "," + ci + ")\" data-done=\"" + (done ? 1 : 0) + "\">" +
      "<span class=\"badge\">" + letters[ci] + "</span>" +
      "<span>" + esc(q.c[ci]) + "</span>" +
      "</button>";
  }

  var feedbackHtml = "";
  if (done) {
    if (ua.ok) {
      feedbackHtml = "<div class=\"feedback ok\">✅ Bonne réponse !</div>";
    } else {
      feedbackHtml = "<div class=\"feedback ko\">❌ Incorrect. La bonne réponse est : <strong>" + letters[q.a] + ") " + esc(q.c[q.a]) + "</strong></div>";
    }
  }

  var html = "<div class=\"header\">" +
    "<div class=\"header-logo\">" + logoImg() + "</div>" +
    "<div class=\"header-right\"><div class=\"header-title\">TCF – Compréhension Écrite</div><div class=\"header-sub\">Test 38 &nbsp;·&nbsp; " + answered + " / " + QQ.length + " répondues</div></div>" +
    "</div>" +
    "<div class=\"prog-wrap\">" +
    "<div class=\"prog-bar\"><div class=\"prog-fill\" style=\"width:" + pct + "%\"></div></div>" +
    "<div class=\"prog-labels\"><span>Question " + (i + 1) + " / " + QQ.length + "</span><span>" + pct + "% complété</span></div>" +
    "</div>" +
    "<div class=\"nav\">" +
    "<button class=\"btn\" onclick=\"render(" + (i - 1) + ")\" " + (i === 0 ? "disabled" : "") + ">← Précédente</button>" +
    "<button class=\"btn\" onclick=\"render(" + (i + 1) + ")\" " + (i === QQ.length - 1 ? "disabled" : "") + ">Suivante →</button>" +
    "<button class=\"btn btn-results\" onclick=\"summary()\">Résultats</button>" +
    "</div>" +
    "<div class=\"card\">" +
    keyLabel +
    "<div class=\"textbox\">" + textHtml + "</div>" +
    "<div class=\"question\">Q" + (i + 1) + ". " + esc(q.q) + "</div>" +
    "<div class=\"choices\">" + choicesHtml + "</div>" +
    feedbackHtml +
    "</div>";

  document.getElementById("app").innerHTML = html;
}

function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  saveState();
  render(qi);
}

function summary() {
  var ok = 0, score = 0;
  for (var k in ans) { if (ans[k].ok) { ok++; score += getPoints(parseInt(k)); } }
  var nclc = getNclc(score);

  var gridHtml = "";
  for (var gi = 0; gi < QQ.length; gi++) {
    var gcls, glabel;
    if (ans[gi] === undefined) { gcls = "gy"; glabel = gi + 1; }
    else if (ans[gi].ok) { gcls = "g"; glabel = "✓"; }
    else { gcls = "r"; glabel = "✗"; }
    gridHtml += "<button class=\"grid-cell " + gcls + "\" onclick=\"render(" + gi + ")\" title=\"Q" + (gi + 1) + "\">" + glabel + "</button>";
  }

  var html = "<div class=\"header\">" +
    "<div class=\"header-logo\">" + logoImg() + "</div>" +
    "<div class=\"header-right\"><div class=\"header-title\">TCF – Compréhension Écrite</div><div class=\"header-sub\">Test 38 – Résultats</div></div>" +
    "</div>" +
    "<div class=\"summary-card\">" +
    "<h2>Vos résultats</h2>" +
    "<div class=\"score-row\">" +
    "<div class=\"score-box\"><div class=\"label\">Bonnes réponses</div><div class=\"val\">" + ok + " / " + QQ.length + "</div></div>" +
    "<div class=\"score-box\"><div class=\"label\">Score TCF estimatif</div><div class=\"val\">" + score + " / 699</div></div>" +
    "<div class=\"score-box\"><div class=\"label\">Niveau NCLC</div><div class=\"nclc-level\">" + nclc.level + "</div></div>" +
    "</div>" +
    "<div class=\"nclc-msg\">" + nclc.msg + "</div>" +
    "<div class=\"grid-wrap\">" +
    "<div class=\"grid-title\">Vue d'ensemble – cliquez pour revoir une question</div>" +
    "<div class=\"grid\">" + gridHtml + "</div>" +
    "</div>" +
    "<div class=\"summary-btns\">" +
    "<button class=\"btn-primary\" onclick=\"showReport()\">📋 Voir le rapport des erreurs</button>" +
    "<button class=\"btn-outline\" onclick=\"reset()\">↺ Recommencer</button>" +
    "</div>" +
    "<div class=\"note\">* Score estimatif à titre indicatif</div>" +
    "</div>";

  document.getElementById("app").innerHTML = html;
}

function showReport() {
  var letters = ["A", "B", "C", "D"];
  var items = "";
  var hasErrors = false;
  for (var i = 0; i < QQ.length; i++) {
    if (!ans[i] || ans[i].ok) continue;
    hasErrors = true;
    var q = QQ[i];
    var ua = ans[i];
    var textHtml = hl(q.t, q.k);
    var choicesHtml = "";
    for (var ci = 0; ci < q.c.length; ci++) {
      var cls = "n";
      if (ci === q.a) cls = "c";
      else if (ci === ua.choice) cls = "w";
      var icon = ci === q.a ? "✓" : (ci === ua.choice ? "✗" : "·");
      choicesHtml += "<div class=\"report-choice " + cls + "\"><span>" + icon + "</span><span>" + letters[ci] + ") " + esc(q.c[ci]) + "</span></div>";
    }
    items += "<div class=\"report-item\">" +
      "<div class=\"report-qnum\">Question " + (i + 1) + "</div>" +
      "<div class=\"textbox\">" + textHtml + "</div>" +
      "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>" +
      "<div class=\"report-q\">" + esc(q.q) + "</div>" +
      choicesHtml +
      "</div>";
  }
  if (!hasErrors) { items = "<p style=\"text-align:center;color:#1D9E75;font-weight:600;padding:2rem\">🎉 Aucune erreur !</p>"; }

  var html = "<div class=\"header\">" +
    "<div class=\"header-logo\">" + logoImg() + "</div>" +

}

  ans = {};

}
