<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF-CE Série 39 – Compréhension écrite</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f3ef; color: #1a1a1a; padding: 1rem; }
#app { max-width: 860px; margin: 0 auto; }
.header { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
.header img { height: 48px; }
.header-right { text-align: right; }
.header-title { font-size: 16px; font-weight: 700; color: #1a1a1a; }
.header-sub { font-size: 12px; color: #888; margin-top: 2px; }
.prog-wrap { margin-bottom: 1.1rem; }
.prog-bar { height: 5px; background: #e0ddd5; border-radius: 3px; }
.prog-fill { height: 100%; background: #1D9E75; border-radius: 3px; transition: width .35s; }
.prog-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: #888; }
.nav { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: .85rem; }
.btn { padding: 7px 14px; border-radius: 8px; border: 1px solid #d0cdc5; background: #fff; cursor: pointer; font-size: 13px; color: #333; font-weight: 500; transition: background .15s; }
.btn:hover { background: #f4f3ef; }
.btn-res { border-color: #0F6E56; color: #0F6E56; font-weight: 600; margin-left: auto; }
.btn-res:hover { background: #E1F5EE; }
.card { background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
.textbox { background: #f8f7f3; border-left: 3px solid #1D9E75; border-radius: 0 8px 8px 0; padding: 1rem 1.25rem; margin-bottom: 1.1rem; font-size: 15px; line-height: 1.85; color: #1a1a1a; width: 100%; }
.textbox mark { background: #FAC775; color: #412402; border-radius: 3px; padding: 1px 3px; font-style: normal; }
.key-label { display: inline-block; background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; border-radius: 6px; font-size: 12px; padding: 3px 10px; margin-bottom: .9rem; }
.question { font-size: 16px; font-weight: 600; margin-bottom: .9rem; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
.choice { padding: 11px 15px; border: 1px solid #d0cdc5; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; background: #fff; width: 100%; text-align: left; transition: background .15s, border-color .15s; }
.choice:hover:not(:disabled) { background: #f4f3ef; }
.choice .badge { font-weight: 600; min-width: 22px; }
.choice.correct { border-color: #0F6E56; background: #E1F5EE; color: #085041; }
.choice.wrong { border-color: #993C1D; background: #FAECE7; color: #4A1B0C; }
.choice:disabled { cursor: default; }
.feedback { border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-top: .5rem; }
.feedback.ok { background: #E1F5EE; color: #085041; border: 1px solid #5DCAA5; }
.feedback.ko { background: #FAECE7; color: #4A1B0C; border: 1px solid #F0997B; }
/* Summary */
.sum-box { background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 2rem; text-align: center; margin-bottom: 1.5rem; }
.sum-score-big { font-size: 48px; font-weight: 800; color: #1D9E75; }
.sum-label { font-size: 14px; color: #666; margin-bottom: .5rem; }
.sum-tcf { font-size: 32px; font-weight: 700; color: #1a1a1a; margin: .5rem 0; }
.sum-nclc { font-size: 26px; font-weight: 800; color: #BA7517; margin: .5rem 0; }
.sum-msg { font-size: 14px; color: #555; margin-bottom: 1rem; }
.grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 1.5rem 0 1rem; }
.gbox { width: 38px; height: 38px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: transform .1s; }
.gbox:hover { transform: scale(1.1); }
.gbox.ok { background: #1D9E75; color: #fff; }
.gbox.ko { background: #993C1D; color: #fff; }
.gbox.na { background: #d0cdc5; color: #555; }
.sum-note { font-size: 11px; color: #999; margin-top: .5rem; }
.sum-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
.btn-big { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
.btn-report { background: #1D9E75; color: #fff; }
.btn-report:hover { background: #178a65; }
.btn-reset { background: #fff; color: #333; border: 1px solid #d0cdc5; }
.btn-reset:hover { background: #f4f3ef; }
/* Report */
.report-item { background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
.report-qnum { font-size: 12px; color: #888; margin-bottom: .5rem; }
.report-q { font-size: 15px; font-weight: 600; margin-bottom: .9rem; }
.report-choice { padding: 8px 14px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.report-choice.correct { border: 1px solid #0F6E56; background: #E1F5EE; color: #085041; }
.report-choice.wrong { border: 1px solid #993C1D; background: #FAECE7; color: #4A1B0C; }
.report-choice.neutral { border: 1px solid #d0cdc5; background: #f8f7f3; color: #555; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid #0F6E56; color: #0F6E56; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 1.25rem; }
.back-btn:hover { background: #E1F5EE; }
</style>
</head>

<script type="application/json" id="qdata">[{"t":"Heures d'ouverture du service consulaire :\n\nLe service consulaire est ouvert au public les lundis, mercredis et jeudis de 8h30 à 14 et les mardis et vendredis de 14h30 à 18h","q":"Quand le service est-il fermé au public ?","c":["Le lundi matin.","Le mardi matin.","Le mercredi matin.","Le jeudi matin."],"a":1,"k":"les mardis et vendredis de 14h30 à 18h"},{"t":"Urgent ! cherche maison à louer pour vacances d'été dans le centre-ville.\n\nLaetitia : 07 08 09 80 90","q":"Qu'est-ce que Laetitia veut faire ?","c":["Habiter à la campagne.","Réserver un hôtel.","Trouver un logement.","Vendre un appartement."],"a":2,"k":"cherche maison à louer"},{"t":"De : Société BALY INFORMATIQUE\nA : Monsieur Lefort\nObjet : Printemps des conférences – Lyon\n\nMonsieur,\n\nUne voiture de notre société va vous attendre à votre arrivée à l'aéroport (porte-F) pour vous conduire au Palais des Congrès.\n\nCordialement,\n\nMme Deor","q":"Comment est-ce que M. Lefort va aller au Palais des Congrès ?","c":["Avec Mme Deor.","Avec un chauffeur.","En autobus.","En taxi."],"a":1,"k":"Une voiture de notre société va vous attendre"},{"t":"Prière de ne pas toucher à la photocopieuse\n\nLe réparateur arrive demain à la première heure. En attendant, donnez vos documents à ma secrétaire qui les photocopiera au bureau de la comptable.\n\nMerci,\n\nLe directeur.","q":"Qui va faire les photocopies pendant que la photocopieuse est en réparation ?","c":["La comptable.","La secrétaire.","Le directeur.","Le réparateur."],"a":1,"k":"donnez vos documents à ma secrétaire qui les photocopiera"},{"t":"FÊTE DE LA MUSIQUE A PARIS LE 21 JUIN\n\nBillet unique, 2,5 €, utilisable sans limite du 21 juin à 20 heures au 22 juin à 7 heures.","q":"Ce billet est utilisable…","c":["Une journée.","Une semaine.","Une nuit.","Un mois."],"a":2,"k":"utilisable sans limite du 21 juin à 20 heures au 22 juin à 7 heures"},{"t":"Fred,\n\nJe ne pourrai pas venir comme prévu, mais cela sera une prochaine fois... J'ai beaucoup de travail en ce moment. Peut-être dans quinze jours ? J'aurai du temps libre !\n\nÀ bientôt !\n\nPaul","q":"Qu'apprend-t-on sur Paul ?","c":["Il est très occupé.","Il part en vacances.","Il travaille avec Fred.","Il veut venir plus tôt."],"a":0,"k":"J'ai beaucoup de travail en ce moment."},{"t":"Chers tous,\n\nDemain, c'est la journée sans voiture, alors faites un geste pour la nature et venez donc au bureau à pied, à vélo, en rollers, en bus, en tram, à cheval... !\n\nPaul, Services généreux","q":"À qui s'adresse Paul ?","c":["À ses amis.","À ses collègues.","À ses enfants.","À ses voisins."],"a":1,"k":"venez donc au bureau"},{"t":"France 2 – soirée\n\n20.00 Journal télévisé\n20.40 Météo\n20.55 Mission estivale\n\nJeu. Première émission de l'été, avec un coureur automobile, un pilote moto, un animateur de télévision. L'équipe jouera au profit d'une association qui aide au développement des villages fleuris historiques.\n\n22.35 Plus d'humour\n\nCe magazine divertissant rend compte de la création humoristique actuelle, passée et future, dans tous les domaines (cinéma, télévision, publicité, édition, etc.).\n\n0.40 Journal de la nuit","q":"D'après ce programme de télévision, quand peut-on regarder les informations ?","c":["En cours de soirée.","En début et en fin de soirée.","Entre chaque émission.","Quatre fois dans la soirée."],"a":1,"k":"20.00 Journal télévisé"},{"t":"Rendez-vous samedi pour un repas de quartier devant notre immeuble. Apportez vos chaises (il y aura des tables sur place), à boire et un plat salé ou sucré. Mireille et Pierre (3émé étage à gauche) organisent l'événement et peuvent répondre à vos questions.","q":"Qu'est-ce qui est organisé ?","c":["Un atelier de cuisine.","Un déménagement.","Une fête entre voisins.","Une visite d'appartement."],"a":2,"k":"un repas de quartier devant notre immeuble"},{"t":"Information importante\n\nÀ cause de l'augmentation du nombre de vols de téléphones portables, vous ne pouvez plus les utiliser à l'intérieur du lycée.\n\nMerci de votre compréhension.\n\nLe directeur de l'établissement.","q":"Que dit ce texte sur l'utilisation des téléphones portables ?","c":["Elle est autorisée.","Elle est dangereuse.","Elle est interdite.","Elle est limitée."],"a":2,"k":"vous ne pouvez plus les utiliser à l'intérieur du lycée"},{"t":"Le Centre de Relations Client, c'est un numéro de téléphone pour parler avec des conseillers du lundi au vendredi de 8 h à 22 h, le samedi de 8 h à 18 h, et aussi pour accéder à un serveur vocal 7 jours sur 7 et 24 heures sur 24.","q":"Que faut-il faire pour joindre un conseiller ?","c":["Consulter le serveur vocal.","Prendre rendez-vous par téléphone.","Téléphoner aux horaires indiqués.","Demander le service de relation avec la clientèle."],"a":2,"k":"parler avec des conseillers du lundi au vendredi de 8 h à 22 h, le samedi de 8 h à 18 h"},{"t":"Chère Marie,\n\nJe t'écris rapidement ce mot pour te prévenir que je ne pourrai, hélas, pas être parmi vous pour l'anniversaire de Théo. Je suis vraiment déçu ! Je pars pour des raisons professionnelles au Japon, à des milliers de kilomètres de toi ! Je serai de retour dans trois semaines et j'espère sincèrement que l'on pourra se voir alors, avec Théo. Nous pourrions également inviter Fred. Tu me manques.\n\nJe t'embrasse,\n\nPierre","q":"Qu'est-ce que Pierre envoie à Marie ?","c":["Un message d'excuse.","Une déclaration d'amour.","Une invitation à une fête.","Une lettre de vacances."],"a":0,"k":"je ne pourrai, hélas, pas être parmi vous pour l'anniversaire de Théo"},{"t":"Objet : Entretien de vos locaux\nMonsieur le Directeur,\n\nConformément au devis (en pièce jointe) qui a reçu votre accord, notre équipe interviendra le 20 juin prochain pour effectuer les opérations nécessaires dans l'aile droite du bâtiment principal de votre société.\n\nLe chantier nécessite l'utilisation de produit à risque et d'un appareillage bruyant. Pour la sécurité et le confort de votre personnel, il serait préférable que les services du bâtiment concerné soient suspendus la journée du 20.\n\nMerci par avance de me faire part de votre avis sur ce point.\n\nCordialement.\n\nJacques Legendre\nChef du service d'entretien","q":"Que demande Jacques Legendre au directeur ?","c":["D'envoyer très rapidement le devis.","D'interdire l'emploi de produits toxiques.","De libérer les lieux pendant les travaux.","De préciser la nature de l'intervention."],"a":2,"k":"les services du bâtiment concerné soient suspendus la journée du 20"},{"t":"Le Festival Sourd Métrage est accessible à tous : traduction en langue des signes et films sous-titrés.\n\nCe festival de courts métrages présente des réalisateurs sourds. Tous les regards sont permis : fictions, documentaires, films d'animation... Tous les publics sont accueillis. Pendant trois jours, un espace « rencontre » est créé entre des écoles européennes accueillant de jeunes sourds, entre un public sourd et non-sourd ainsi qu'entre le regard du jeune sourd derrière la caméra et des professionnels de l'image.","q":"Quelle est la particularité de ce festival de cinéma ?","c":["Il montre des documentaires sur les conditions de vie des sourds.","Il organise des conférences sur la langue utilisée par les sourds.","Il présente des films réalisés par des personnes sourdes.","Il programme des spectacles destinés à un jeune public sourd."],"a":2,"k":"Ce festival de courts métrages présente des réalisateurs sourds."},{"t":"Cher Paul,\n\nJe suis désolée de t'avoir laissé sans nouvelles. Je pensais t'écrire de Fès, mais notre séjour ne s'est pas déroulé comme nous l'espérions. Nous avons passé trois nuits supplémentaires à Tanger à cause d'un problème technique sur une de nos lignes touristiques.\n\nNous avons aussi annulé le rendez-vous prévu aujourd'hui avec notre client de Casablanca, car nous avons dû nous rendre à Marrakech pour régler les frais occasionnés par cet incident. Nous rentrons demain à Paris.\n\nBises,\n\nMathilde","q":"Dans quelle ville se trouve Mathilde d'après cette lettre ?","c":["Casablanca.","Fès.","Marrakech.","Tanger."],"a":2,"k":"nous avons dû nous rendre à Marrakech"},{"t":"Chère Andréa,\n\nHier, j'ai déjeuné avec des célibataires de mon quartier. C'était à 12h30 au restaurant corse près de l'église. On était 7 : on a bien mangé et bien ri. C'est vraiment une bonne idée pour se faire des amis : tu t'inscris sur le site MIAMI et tu consultes les propositions de rendez-vous dans ton quartier.\n\nTu devrais essayer, c'est génial.\n\nLéa.","q":"Qu'est-ce que Léa souhaite faire découvrir à son amie ?","c":["Un centre de loisirs pour les habitants de son quartier.","Un restaurant qui sert des spécialités de sa région.","Un service municipal d'aide sociale aux jeunes célibataires.","Une manière originale de rencontrer des gens près de chez elle."],"a":3,"k":"tu t'inscris sur le site MIAMI et tu consultes les propositions de rendez-vous dans ton quartier"},{"t":"Draisienne du XXIe siècle\n\nÀ 88 ans, Jacques Blosseville est le participant le plus âgé de la 110e édition du concours Lépine, qui récompense les inventeurs. Il a choisi de transformer la draisienne, un vélo sans pédale pour enfant inventé au début du XIXe siècle. « Il y a trois ans, j'ai commencé à me déplacer avec peine. On m'a proposé une canne, puis fauteuil roulant, mais ça ne me convenait pas... La draisienne vous permet de ne pas avoir à supporter votre poids », explique le concurrent.","q":"Dans quel but Jacques Blosseville a-t-il modernisé la draisienne ?","c":["Pour éviter de conduire.","Pour faire rêver les enfants.","Pour marcher sans souffrir.","Pour porter des objets lourds."],"a":2,"k":"La draisienne vous permet de ne pas avoir à supporter votre poids"},{"t":"On demande rarement aux enfants ce qu'ils préfèrent manger.\n\n« Beaucoup d'aliments pour enfants sont testés par des adultes », explique le délégué régional du projet « DisMoiGoût ». Leur avis intéresse pourtant ceux qui cherchent à développer des gammes de produits dédiés aux petits. L'école agroalimentaire nantaise a ainsi entrepris de sonder les goûts des bambins et leur perception des aliments. Objectif : cerner plus subtilement leur profil alimentaire. Les résultats de cette étude devraient permettre, à terme, d'élaborer des produits bons pour leur santé, c'est-à-dire conformes aux recommandations du Programme national de nutrition, mais aussi bons pour leur goût.","q":"Quelle est la vocation du projet « DisMoiGoût » ?","c":["Corriger les mauvaises habitudes alimentaires des enfants.","Faire respecter la législation sur l'alimentation des enfants.","Mieux comprendre les préférences alimentaires des enfants.","Permettre aux enfants de découvrir de nouveaux aliments."],"a":2,"k":"Objectif : cerner plus subtilement leur profil alimentaire."},{"t":"L'action du film se situe en Nouvelle-Angleterre, à la fin du XVIIIe siècle. Un jeune inspecteur de police ne jure que par la science et la logique et ne rate jamais une occasion de le faire savoir. Pour le mettre à l'épreuve, ses supérieurs l'envoient dans un petit village de fermiers d'origine hollandaise, théâtre de plusieurs meurtres étranges.","q":"Quel est le sujet du film présenté ?","c":["L'arrivée d'une troupe de comédiens à la campagne.","L'enquête policière d'une personne très rationnelle.","La vie des paysans néerlandais au XVIIIe siècle.","Les expériences originales d'un scientifique anglais."],"a":1,"k":"Un jeune inspecteur de police ne jure que par la science et la logique"},{"t":"Le jour viendra où un fonds de pension ou un groupe alimentaire mondial investira dans l'entreprise d'un cuisinier reconnu pour orchestrer son développement international. Bien sûr, on ne peut qu'avoir de la nostalgie pour les temps héroïques où une bande de copains inventait les codes de la nouvelle cuisine. Aujourd'hui, n'importe quel jeune cuisinier est prêt à payer très cher pour le privilège d'un stage de six mois chez un « grand chef ». Il rentabilisera vite cet investissement en s'autoproclamant « élève de... », car les marques des grands chefs ne cessent de prendre de la valeur.","q":"Qu'apprend-on sur les grands chefs ?","c":["Leur conception de la cuisine est passée de mode.","Leur créativité leur assure une célébrité mondiale.","Leur nom s'est transformé en label de prestige.","Leurs établissements sont cotés en bourse."],"a":2,"k":"les marques des grands chefs ne cessent de prendre de la valeur"},{"t":"Paris, le 13 mars\n\nMadame, Monsieur,\n\nCe courrier fait suite à mon achat d'un téléphone le 5 mars dernier. Après réflexion, je souhaiterais le rendre, car j'ai finalement décidé d'acheter un appareil avec messagerie intégrée.\n\nAinsi, je vous prie de bien vouloir me restituer la somme de 80 euros, correspondant à la somme versée le 5 mars par chèque.\n\nDans l'attente de votre réponse, je vous transmets, Madame, Monsieur, mes meilleures salutations.\n\nAndré Cellier","q":"Quel est l'objet de la lettre de monsieur Cellier ?","c":["Le remboursement de son article.","L'échange de son téléphone.","L'envoi de son téléphone par la poste.","Une réclamation sur son achat."],"a":0,"k":"je vous prie de bien vouloir me restituer la somme de 80 euros"},{"t":"L'enfant fréquente le musée par obligation, avec ses parents ou son instituteur. L'adulte le vit par plaisir. Entre les deux, rien. Chez l'ado, la perspective de franchir ses portes, même gratuitement, provoque la nausée. Il préfère le spectacle d'une toile de cinéma ou le plongeon dans la toile du cyberspace. Les jeunes deviennent aujourd'hui pour les musées une cible prioritaire. Mais les inciter à venir n'est pas facile. La culture internet a bouleversé leur relation au savoir. Les musées ne peuvent plus s'accrocher aux réseaux traditionnels de la transmission des connaissances. Le temps est venu de réfléchir à de nouvelles approches adaptées à ce public.","q":"Que suggère l'auteur pour attirer le jeune public au musée ?","c":["D'analyser les moyens de séduire les jeunes.","De moderniser le contenu des expositions.","De s'inspirer des approches pédagogiques scolaires.","De systématiser l'accès gratuit pour les adolescents."],"a":0,"k":"Le temps est venu de réfléchir à de nouvelles approches adaptées à ce public."},{"t":"Réparer un véhicule endommagé avec des pièces d'occasion recyclées, c'est désormais possible. Depuis le printemps dernier, l'expert d'une compagnie d'assurances peut en effet proposer à un assuré des pièces de réemploi. Ces pièces, issues de véhicules hors d'usage, accidentés ou arrivés en fin de vie, sont démontées, contrôlées et revendues à des réparateurs par des recycleurs agréés. Cette disposition est une alternative au neuf et répond à de nouvelles attentes. La récupération de pièces valides permet ainsi de prolonger leur longévité ainsi que celle d'autres véhicules avec un bénéfice économique, environnemental et social.","q":"D'après cet article, quel avantage présente l'utilisation de pièces recyclées ?","c":["Elle donne l'assurance d'un dépannage rapide.","Elle donne lieu à une réduction sur l'assurance.","Elle offre la possibilité d'une garantie de qualité.","Elle permet de dépenser moins d'argent."],"a":3,"k":"un bénéfice économique, environnemental et social"},{"t":"La Maison de compagne :\n\nCe restaurant offre à sa clientèle un bel espace articulé en trois salles : cuisine, salle à manger et salon, décorées dans un joli style provençal. On choisit même sa bouteille de vin à la cave, comme à la maison !  Malheureusement, bien que les plats proposés soient élaborés à partir de produits frais sélectionnés au marché, la cuisine reste une cuisine vue et revue, tellement prévisible qu'il vaudra mieux choisir un restaurant en ville plutôt que se perdre dans cette campagne-là.","q":"Sur quel point porte la critique négative faite à ce restaurant ?","c":["L'originalité des plats.","La qualité des produits.","Le cadre du restaurant.","Le prix des menus."],"a":0,"k":"la cuisine reste une cuisine vue et revue, tellement prévisible"},{"t":"Monsieur,\n\nLe règlement de votre facture du mois dernier ne nous est pas encore parvenu. Peut-être avez-vous effectué ce paiement très récemment ? Dans ce cas, nous vous en remercions et nous vous prions de ne pas tenir compte de ce courrier. S'il s'agit d'une simple oublie, adressez-nous votre règlement à l'aide du coupon-réponse. Pour toute autre raison, contactez rapidement votre conseiller clientèle. Il vous renseignera sur votre facture ainsi que sur les moyens de paiement.\n\nNous vous prions d'agréer, Monsieur, nos sincères salutations.\n\nLe responsable clientèle","q":"Que contient ce courrier ?","c":["Un rappel d'un impayé en cours.","Une facture à payer rapidement.","Une proposition de paiement différé.","Une erreur de règlement."],"a":0,"k":"Le règlement de votre facture du mois dernier ne nous est pas encore parvenu."},{"t":"L'éthique, nouveau critère d'attractivité.\n\nDiversité, handicap, éthique, développement durable... Autant de grands enjeux sociétaux englobés sous le terme de « responsabilité sociale de l'entreprise » (RSE). Suivant sa définition, la « RSE » repose sur trois piliers : les problématiques sociales, environnementales et économiques. En amant du marché du travail, les écoles n'échappent pas à ces obligations.\n\nLa RSE couvre les actions en faveur des lycéens issus de zones défavorisées, grâce à un tutorat proposé en classe de première et de terminale. Elle couvre aussi le champ humanitaire. Ses enjeux sont finalement proches des questions chères à la jeunesse. On comprend pourquoi les écoles, bien conscientes de l'attractivité exercée par la RSE, multiplient les initiatives dans le domaine.","q":"Comment le texte justifie-t-il l'attractivité qu'exerce la RSE auprès des écoles ?","c":["Elle favorise l'orientation des élèves après l'obtention du baccalauréat.","Elle permet de renforcer les liens éducatifs entre adultes et élèves.","Elle répond de manière pertinente aux difficultés et aux aspirations des élèves.","Elle veille à la concrétisation des projets professionnels des élèves."],"a":2,"k":"Ses enjeux sont finalement proches des questions chères à la jeunesse."},{"t":"L'espoir des enfants\n\nMarguerite Barankiste est un exemple pour toutes les Burundaises. Pour sauver les enfants de la guerre, elle se bat chaque jour. Ses actions ont d'abord été financées par des organismes allemands. Puis, la renommée mondiale de la fondatrice est devenue le carburant de l'association. Aujourd'hui, elle voyage à travers le monde pour parler de son pays et de ses enfants, dans l'espoir d'obtenir des subventions. Désormais, l'aide extérieure soutient la plupart des projets. Elle a ainsi ouvert deux centres pour enfants et un hôpital. Le travail de cette humanitaire débordante d'énergie a été couronné par de nombreux prix.","q":"Quel est le but des déplacements à l'étranger de M. Barankitse ?","c":["Obtenir de l'argent pour développer des centres d'accueil.","Convaincre les entreprises étrangères d'investir au Burundi.","Soutenir les étudiants burundais expatriés pour leurs études.","Trouver des bénévoles pour s'occuper des enfants à l'hôpital."],"a":0,"k":"elle voyage à travers le monde pour parler de son pays et de ses enfants, dans l'espoir d'obtenir des subventions"},{"t":"Écologique par nature, les solutions que nous proposons représentent un atout certain pour lutter contre les émissions de gaz à effet de serre. Audioconférence, visioconférence et messagerie vous évitent des déplacements inutiles, tout en vous permettant de contribuer à la préservation de la planète. En effet, une étude environnementale a calculé qu'en remplaçant 20 % des voyages d'affaires par des visioconférences, on économiserait 22 millions de tonnes de CO2 par an. Ensemble, agissons pour un monde plus vert !","q":"Que propose cette entreprise ?","c":["Des outils de communication.","Des voyages organisés.","Une formation à l'écologie.","Un système d'information."],"a":0,"k":"Audioconférence, visioconférence et messagerie vous évitent des déplacements inutiles"},{"t":"Aux débuts d'Internet, je me souviens d'avoir lu, éberluée, dans un magazine féminin « Mon mari était absent, il passait tout son temps sur le chat », et j'en étais à tenter de visualiser ce triste état de fait lorsque je compris ma méprise : avoir confondu le chat, le félidé, avec le chat, la discussion sur Internet. Depuis ce jour, aucun progrès sur cette équivoque terrible de la langue, alors que l'usage informatique du mot souris démultiplie les sources de confusions. Le bon sens voudrait que la phonétique l'emporte et que l'on écrive « tchat ». Au lieu de cette solution évidente, le Petit Larousse a laissé entrer en 2004 dans le dictionnaire le monstrueux mot-valise « clavardage ».","q":"Qu'est-ce qui dérange l'auteur de ce texte ?","c":["L'abus d'anglicismes en langage informatique.","L'ambiguïté du néologisme « chat » à l'écrit.","Le laxisme orthographique dans les forums.","Le manque d'imagination des lexicologues."],"a":1,"k":"avoir confondu le chat, le félidé, avec le chat, la discussion sur Internet"},{"t":"Ils sont dix et ils sont \"dys\". Comme dyslexique, dysphasiques...âgés de 11 à 13 ans, ces enfants souffrants de troubles du langage sont accueillis depuis la rentrée au collègue Petite-Lande dans une classe intégrée, entourée d'une équipe de professionnels, « Les enfants ne suivent pas une formation classique, mais, durant quatre ans, ils vont donc acquérir les bases scolaires, de l'autonomie au quotidien, et choisir une orientation professionnelle grâce à des stages en entreprise ». Au sein du collègue, ils peuvent fréquenter des jeunes de leur âge, participer à certaines activités et projets en commun (cours de sport,sorties...)","q":"Que peuvent faire ces jeunes grâce à ce projet ?","c":["Guérir de leurs troubles du langage.","Intégrer une classe traditionnelle.","Préparer leur entrée au collège.","Profiter d'un encadrement spécifique."],"a":3,"k":"entourée d'une équipe de professionnels"},{"t":"« Il faut te le dire en quelle langue ? » Cette question, que des milliers de mères posent à leur enfant lorsqu'elles veulent se faire écouter, est en fait très sensée (comme tout ce que disent les mères). Des travaux scientifiques récents ont en effet démontré une réalité étonnante : nous réfléchissons et prenons des décisions différemment lorsque nous traitons l'information dans une autre langue que notre langue maternelle. Nous comprenons tout aussi bien l'idée ou le problème, mais, lorsque nous utilisons une autre langue, le résultat est plus réfléchi, moins dicté par les émotions, plus orienté vers l'utilité.","q":"Que permet l'utilisation d'une langue autre que la langue maternelle ?","c":["D'attirer l'attention de l'interlocuteur.","D'imaginer des solutions originales.","De solliciter davantage la raison.","De trouver des réponses rapides."],"a":2,"k":"le résultat est plus réfléchi, moins dicté par les émotions, plus orienté vers l'utilité"},{"t":"Les additifs et conservateurs, ces poudres de perlimpinpin, rendent appétissant un produit médiocre afin de mieux le vendre. C'est le cas des colorants si la préparation est terne, des exhausteurs de goût de type glutamate si elle est fade, des agents de texture si elle est sans consistance, ou des arômes si elle est insipide ou a carrément mauvais goût. On vous dit que les conservateurs ou antioxydants (sorbates, nitrites, sulfites...) servent à vous protéger de possibles intoxications bactériennes, mais ils servent surtout à prolonger les dates limites de consommation, afin de laisser plus de temps aux industriels et aux supermarchés pour commercialiser leur marchandise.","q":"Que critique cet article ?","c":["Le dosage des produits chimiques dans les aliments.","Le manque de lisibilité des étiquettes.","Les arguments hypocrites avancés par les fabricants.","Les conséquences sanitaires des ajouts."],"a":2,"k":"ils servent surtout à prolonger les dates limites de consommation"},{"t":"En France, entre 200 000 et 500 000 cas troubles psychiques sont liés au monde du travail. L'apparition de nouvelles méthodes de travail, plus intenses et contraignantes, serait à l'origine de l'augmentation professionnelle : c'est le mal du siècle et pourtant, il n'est pas encore reconnu. Les salariés, prisonniers de l'idéologie ambiante, s'imaginent trop souvent, quand ils craquent, qu'un collègue plus solide qu'eux saurait été capable de résister. Mais cela s'avère faux la plupart du temps. Une reconnaissance de la maladie obligerait les entreprises à réfléchir à leur fonctionnement et représenterait une réelle mesure d'utilité publique.\n\nD'après capital.fr","q":"Quel constat est dressé à propos de ce syndrome ?","c":["Il inquiète les patrons de sociétés.","Il touche les employés les plus faibles.","Son existence doit être officialisée.","Son traitement est peu efficace."],"a":2,"k":"c'est le mal du siècle et pourtant, il n'est pas encore reconnu"},{"t":"Des chercheurs mettent en doute l'idée répandue que la langue dont nous parlons influence notre façon de penser. Ils présentent une recherche sur l'ordre des mots dans la phrase : sujet, verbe, objet pour certaines langues sujet, objet et verbe pour d'autres. Leurs 40 sujets locuteurs d'anglais, d'espagnol, de mandarin, des trucs ont décrit des séquences vidéo dans leur langue d'abord, puis en utilisant des gestes. Si les descriptions verbales diffèrent dans l'ordre des mots selon la langue, les descriptions faites avec les mains reprenaient toutes le même ordre (sujet, objet, verbe), suivant celui des langues des signes inventés par des locuteurs sourds.","q":"Quel est le résultat de l'article présenté par ce texte ?","c":["Les gestes révéleraient systématiquement la langue maternelle des locuteurs.","Il existerait un ordre universel de la pensée, indépendant de l'ordre linguistique.","Il y aurait autant de façons de penser que de structures de langue différentes.","Les structures des langues seraient dépendantes de notre expérience du monde."],"a":1,"k":"les descriptions faites avec les mains reprenaient toutes le même ordre (sujet, objet, verbe)"},{"t":"Si la télévision est souvent critiquée pour sa distribution d'informations un peu floues, elle est aussi un remarquable éveilleur d'intérêt, quand, en plus d'un embryon de connaissances, elle donne le goût de le développer. Il en est ainsi par exemple de la lecture, dont elle est la plupart du temps un incomparable promoteur. Contrairement à trop d'idées reçues, la concurrence est très rare entre le petit écran et le livre, ne serait-ce que parce que leurs clientèles respectives sont différentes. Ceux qui aiment lire ne sacrifient pas ce vice impuni à l'uniformité des habituels spectacles télévisés. Au contraire, après chaque émission littéraire, les chiffres de la vente des livres évoqués, ou ayant inspiré le spectacle, comblent toujours d'aise les éditeurs.","q":"Que soutient l'auteur de ce texte concernant la télévision ?","c":["C'est un vecteur de diffusion des œuvres littéraires.","C'est une source de connaissances sûre et fiable.","L'audience des émissions culturelles est en hausse.","La concurrence qu'elle mène à la lecture est acharnée."],"a":0,"k":"elle est la plupart du temps un incomparable promoteur"},{"t":"Sexistes, les jeux vidéo ? Peut-être que oui, peut-être que non. En tout cas, à parcourir les allées de la Paris Games Week, l'œil avisé aura lui-même bien du mal à trouver un personnage principal féminin de jeu vidéo. Il y a bien la célébrissime Lara Croft du jeu vidéo Tomb Raider, aux attributs particulièrement imposants, conçus presque sur mesure pour plaire à un certain nombre de joueurs masculins. Pour le reste, circulez, il n'y a - presque - rien d'autre à voir, si l'on balaye d'un coup de manette de jeu, au mieux, les princesses à sauver, au pire les calls girls de mafioso. Pourtant, l'industrie du jeu vidéo a pris conscience ces dernières années du potentiel du marché des joueuses.","q":"Quel constat est dressé sur les jeux vidéo ?","c":["La quasi-absence d'héroïnes.","L'appel constant à la violence.","L'atténuation des clichés.","L'uniformité des scénarios."],"a":0,"k":"bien du mal à trouver un personnage principal féminin de jeu vidéo"},{"t":"Suite à un accident chimique sur un site minier, les pouvoirs publics ont décidé d'obliger les sociétés minières à financer des programmes de recherche et à replanter les surfaces exploitées. Et de fait, les compagnies minières jouent très bien le jeu. Comme il serait bien naïf de penser que leurs dirigeants soient tout à coup devenus philanthropes, il faut chercher la raison de cet intérêt ailleurs. Il se trouve qu'un scientifique, Anthony Van der Hent, a prouvé que des « super-plants » avaient la faculté d'extraire du sol des métaux économiquement exploitables. C'est donc la possibilité d'allier la régénération de sites industriels à des assurances de gains financiers supplémentaires qui motive tant les industriels.","q":"Sur quel point porte le scepticisme du journaliste ?","c":["La capacité des plantes à nettoyer les sols.","La rentabilité d'un nouveau système d'extraction.","Le résultat des recherches de M. Van der Hent.","Les préoccupations écologiques des industriels."],"a":3,"k":"Comme il serait bien naïf de penser que leurs dirigeants soient tout à coup devenus philanthropes"},{"t":"Travailler avec son mari ou son petit ami, sa sœur ou sa mère n'est pas une punition pour tout le monde ! Pour certains, c'est même la condition du bien-être professionnel.\n\nSi cette idée évoquait jadis une petite entreprise conservatrice, transmise « de père en fils », aujourd'hui, travailler en famille relève de réalités très différentes. Critères retenus : confiance, valeurs et goûts communs ; et surtout, besoin de réaliser ses projets plutôt que ceux des autres. Depuis toujours, la majorité des entreprises en France, toutes tailles confondues, sont familiales ; et de plus en plus de créations sont le fait de femmes.\n\nCe sont d'ailleurs des entreprises où l'on vit mieux et qui durent plus longtemps que les autres. Aujourd'hui, la création d'une entreprise est plus souvent motivée par le désir d'assurer un travail à ses enfants ou d'échapper à des structures jugées déshumanisantes.","q":"Que permet la structure d'entreprise présentée ?","c":["De concrétiser des objectifs personnels.","De fonctionner dans un cadre innovent.","De limiter la répartition des gains.","De renforcer les liens entre les générations."],"a":0,"k":"besoin de réaliser ses projets plutôt que ceux des autres"},{"t":"Panache et arrogance, élégance et futilité, galanterie et gauloiserie : s'il existe, et à condition que cette notion ait encore un sens à l'ère de la mondialisation, l'esprit français tire son essence particulière du fragile équilibre entre ces oppositions. Amateur de grands principes, du coup de sang et de bons mots, c'est l'esprit français. Quoi que nous en disions, il nous obsède. Que nous exaltions le génie national ou l'exception culturelle, les racines ou l'universel, le particularisme local ou l'intérêt général, il ne s'agit toujours, au fond, que de lui. La mondialisation va-t-elle le dissoudre, et nous renvoyer au triste rang de pays ordinaire ?","q":"Selon l'auteur, qu'est-ce que l'esprit français ?","c":["Des attitudes contradictoires forgeant une identité.","Un égocentrisme désuet au temps de la mondialisation.","Un ensemble de valeurs partagées par une élite.","Une aptitude à l'ouverture qui tend à disparaître."],"a":0,"k":"l'esprit français tire son essence particulière du fragile équilibre entre ces oppositions"}]</script>

  if (score >= 524) return { level: "NCLC 9",   msg: "Très bien ! Niveau NCLC 9." };
  if (score >= 499) return { level: "NCLC 8",   msg: "Très bien ! Niveau NCLC 8." };
  if (score >= 453) return { level: "NCLC 7",   msg: "Objectif immigration atteint ! Niveau NCLC 7." };
  if (score >= 406) return { level: "NCLC 6",   msg: "Encore un peu d'effort pour atteindre le NCLC 7 !" };
  if (score >= 375) return { level: "NCLC 5",   msg: "Continuez à pratiquer, niveau NCLC 5." };
  if (score >= 342) return { level: "NCLC 4",   msg: "Continuez à pratiquer, niveau NCLC 4." };
  return { level: "En dessous de NCLC 4", msg: "Continuez à pratiquer !" };
}

function esc(s) {
  var t = String(s);
  t = t.replace(/&/g, "&amp;");
  t = t.replace(/</g, "&lt;");
  t = t.replace(/>/g, "&gt;");
  return t;
}

function hl(text, key) {
  var h = esc(text).split("\n").join("<br>");
  try {
    var ek = esc(key);
    var idx = h.toLowerCase().indexOf(ek.toLowerCase());
    if (idx >= 0) {
      h = h.substring(0, idx) + "<mark>" + h.substring(idx, idx + ek.length) + "</mark>" + h.substring(idx + ek.length);
    }
  } catch(e) {}
  return h;
}

function saveState() {
  try { sessionStorage.setItem("tcf39_ans", JSON.stringify(ans)); sessionStorage.setItem("tcf39_cur", cur); } catch(e) {}
}

function loadState() {
  try {
    var a = sessionStorage.getItem("tcf39_ans");
    var c = sessionStorage.getItem("tcf39_cur");
    if (a) ans = JSON.parse(a);
    if (c) cur = parseInt(c);
  } catch(e) {}
}

function render(i) {
  cur = i;
  saveState();
  var q = QQ[i], ua = ans[i], done = (ua !== undefined);
  var textHtml = done ? hl(q.t, q.k) : esc(q.t).split("\n").join("<br>");
  var keyLabel = done ? "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>" : "";
  var pct = Math.round((i / QQ.length) * 100);
  var filled = Math.round(((i + 1) / QQ.length) * 100);

  var choicesHtml = "";
  var labels = ["A", "B", "C", "D"];
  for (var ci = 0; ci < q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      if (ci === q.a) cls += " correct";
      else if (ci === ua.choice) cls += " wrong";
    }
    var disAttr = done ? "disabled" : "";
    choicesHtml += "<button class=\"" + cls + "\" " + disAttr + " onclick=\"pick(" + i + "," + ci + ")\"><span class=\"badge\">" + labels[ci] + "</span>" + esc(q.c[ci]) + "</button>";
  }

  var feedbackHtml = "";
  if (done) {
    if (ua.ok) {
      feedbackHtml = "<div class=\"feedback ok\">✓ Bonne réponse !</div>";
    } else {
      feedbackHtml = "<div class=\"feedback ko\">✗ Mauvaise réponse. La bonne réponse est : <strong>" + labels[q.a] + ") " + esc(q.c[q.a]) + "</strong></div>";
    }
  }

  var answered = Object.keys(ans).length;
  document.getElementById("hdr-sub").textContent = "Série 39 · " + answered + " / " + QQ.length + " répondues";

  document.getElementById("view").innerHTML =
    "<div class=\"prog-wrap\">" +
      "<div class=\"prog-bar\"><div class=\"prog-fill\" style=\"width:" + filled + "%\"></div></div>" +
      "<div class=\"prog-labels\"><span>Question " + (i+1) + " / " + QQ.length + "</span><span>" + filled + "% complété</span></div>" +
    "</div>" +
    "<div class=\"nav\">" +
      (i > 0 ? "<button class=\"btn\" onclick=\"render(" + (i-1) + ")\">← Précédente</button>" : "<button class=\"btn\" disabled style=\"opacity:.4\">← Précédente</button>") +
      (i < QQ.length - 1 ? "<button class=\"btn\" onclick=\"render(" + (i+1) + ")\">Suivante →</button>" : "<button class=\"btn\" disabled style=\"opacity:.4\">Suivante →</button>") +
      "<button class=\"btn btn-res\" onclick=\"summary()\">Résultats</button>" +
    "</div>" +
    "<div class=\"card\">" +
      "<div class=\"textbox\">" + textHtml + "</div>" +
      keyLabel +
      "<div class=\"question\">" + esc(q.q) + "</div>" +
      "<div class=\"choices\">" + choicesHtml + "</div>" +
      feedbackHtml +
    "</div>";
}

function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  saveState();
  render(qi);
}

function summary() {
  var ok = 0, score = 0;
  for (var k in ans) { if (ans[k].ok) { ok++; score += getPoints(parseInt(k)); } }
  var nclc = getNclc(score);
  var answered = Object.keys(ans).length;

  var gridHtml = "";
  for (var i = 0; i < QQ.length; i++) {
    var cls = "gbox na";
    if (ans[i] !== undefined) cls = ans[i].ok ? "gbox ok" : "gbox ko";
    gridHtml += "<button class=\"" + cls + "\" onclick=\"render(" + i + ")\">" + (i+1) + "</button>";
  }

  document.getElementById("view").innerHTML =
    "<div class=\"sum-box\">" +
      "<div class=\"sum-label\">Questions correctes</div>" +
      "<div class=\"sum-score-big\">" + ok + " / " + QQ.length + "</div>" +
      "<div class=\"sum-label\" style=\"margin-top:1rem\">Score TCF estimatif</div>" +
      "<div class=\"sum-tcf\">" + score + " <span style=\"font-size:18px;color:#888\">/ 699</span></div>" +
      "<div class=\"sum-nclc\">" + nclc.level + "</div>" +
      "<div class=\"sum-msg\">" + nclc.msg + "</div>" +
      "<div class=\"grid\">" + gridHtml + "</div>" +
      "<div class=\"sum-note\">* Score estimatif à titre indicatif</div>" +
      "<div class=\"sum-btns\">" +
        "<button class=\"btn-big btn-report\" onclick=\"showReport()\">📋 Voir le rapport des erreurs</button>" +
        "<button class=\"btn-big btn-reset\" onclick=\"reset()\">↺ Recommencer</button>" +
      "</div>" +
    "</div>";
}

function showReport() {
  var labels = ["A", "B", "C", "D"];
  var html = "<button class=\"back-btn\" onclick=\"summary()\">← Retour aux résultats</button>";
  var hasErrors = false;
  for (var i = 0; i < QQ.length; i++) {
    if (ans[i] === undefined || ans[i].ok) continue;
    hasErrors = true;
    var q = QQ[i];
    var textHtml = hl(q.t, q.k);
    html += "<div class=\"report-item\">";
    html += "<div class=\"report-qnum\">Question " + (i+1) + "</div>";
    html += "<div class=\"textbox\">" + textHtml + "</div>";
    html += "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>";
    html += "<div class=\"report-q\">" + esc(q.q) + "</div>";
    for (var ci = 0; ci < q.c.length; ci++) {
      var cls = "report-choice neutral";
      var mark = "";
      if (ci === q.a) { cls = "report-choice correct"; mark = "✓ "; }
      else if (ci === ans[i].choice) { cls = "report-choice wrong"; mark = "✗ "; }
      html += "<div class=\"" + cls + "\"><strong>" + labels[ci] + ")</strong> " + mark + esc(q.c[ci]) + "</div>";
    }
    html += "</div>";
  }
  if (!hasErrors) {
    html += "<div class=\"card\" style=\"text-align:center;padding:2rem;\"><p style=\"font-size:18px;color:#1D9E75;font-weight:700\">🎉 Aucune erreur !</p><p style=\"margin-top:.5rem;color:#555\">Félicitations, vous avez tout réussi !</p></div>";
  }
  document.getElementById("view").innerHTML = html;
}

function reset() {
  ans = {};
  cur = 0;
  try { sessionStorage.removeItem("tcf39_ans"); sessionStorage.removeItem("tcf39_cur"); } catch(e) {}
  render(0);
}

window.onload = function() {
  loadState();
  render(cur);
};
</script>
</body>
</html>
